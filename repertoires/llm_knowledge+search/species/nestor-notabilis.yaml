  wein_etal_2020:
    citation: >
      Wein A, Schwing R, Kamareddine L, Huber L, Gajdon GK (2020). Kea Nestor notabilis
      mothers produce nest-specific calls with low amplitude and high entropy. Ibis 162(2):
      489–501.
    doi: 10.1111/ibi.12753
    url: https://onlinelibrary.wiley.com/doi/abs/10.1111/ibi.12753
  gajdon_etal_2020_nestling:
    citation: >
      Gajdon GK, Schwing R, Wein A, Huber L (2020). Vocal development in nestling kea
      parrots (Nestor notabilis). Animal Behaviour 159: 51–62.
    url: https://www.researchgate.net/publication/338610274_Vocal_development_in_nestling_kea_parrots_Nestor_notabilis
  rj_2017:
    citation: >
      Reber SA, Janisch J, Fujita K, Janisch B, Bugnyar T, Fitch WT (2017). Positive
      emotional contagion in a New Zealand parrot. Current Biology 27(6): R213–R214.
    doi: 10.1016/j.cub.2017.02.020

