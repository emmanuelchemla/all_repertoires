    doi: 10.1080/09524622.2019.1613265
  overstrom_1983:
    citation: "Overstrom, N.A. 1983. Association between burst-pulse sounds and aggressive behavior in captive Atlantic bottlenosed dolphins. Zoo Biology 2:93-103."
