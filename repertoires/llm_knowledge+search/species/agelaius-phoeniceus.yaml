    sexes:
    - unknown
    population_specific: false
    note: ''
  acoustic_keywords:
  - high_frequency
  - short
  - repetitive
  - tonal
  acoustic_description: A rapid series of short, thin, high-pitched tonal notes
    delivered in quick succession; rendered phonetically as "ti-ti-ti."
  semantic_keywords:
  - courtship
  - mating
  - affiliation
  semantic_description: Reported as a pre-mating call produced by both sexes in
    close-range courtship and solicitation contexts.
  confidence: low
- name: female song
  scope:
    life_stages:
    - adult
    sexes:
    - female
    population_specific: false
    note: ''
  acoustic_keywords:
  - multi_component
  - tonal
  - long
  - quiet
  acoustic_description: A multi-note song produced by females; less stereotyped and
