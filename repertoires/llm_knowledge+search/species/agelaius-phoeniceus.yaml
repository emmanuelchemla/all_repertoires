  semantic_keywords:
  - territorial
  - identity
  - courtship
  - display
  semantic_description: Produced by females during breeding season; female song has
    been studied in the context of mate preference assessment and individual identity
    signalling; females sing while crouching in display posture.
  confidence: medium
  references:
  - yasukawa_2018

- name: flight call
