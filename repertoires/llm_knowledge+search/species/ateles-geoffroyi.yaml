  ordonezgomez_etal_2018:
    citation: "Ordonez-Gomez, J.D., Dias, P.A.D., and Rangel-Negrin, A. 2018. Acoustic variation of spider monkeys' contact calls (whinnies) is related to distance between vocalizing individuals and immediate caller behavior."
    url: https://www.researchgate.net/publication/323951512_Acoustic_variation_of_spider_monkeys%27_contact_calls_whinnies_is_related_to_distance_between_vocalizing_individuals_and_immediate_caller_behavior
  eisenberg_1976:
    citation: "Eisenberg, J.F. 1976. Communication mechanisms and social integration in the black spider monkey, Ateles fusciceps robustus, and related species. Smithsonian Contributions to Zoology 213."
