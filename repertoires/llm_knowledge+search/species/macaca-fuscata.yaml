scientific_name: Macaca fuscata
common_name: Japanese Macaque
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Mammalia
  order: Primates
  family: Cercopithecidae
  genus: Macaca
  species: fuscata
calls:
  - name: coo call
    acoustic_keywords: [tonal, harmonic, long, quiet, frequency_modulated]
    acoustic_description: A smooth tonal call with harmonic structure and a relatively long, often gently modulated contour.
    semantic_keywords: [affiliation, contact, group_coordination]
    semantic_description: Used in low-arousal social contact, vocal exchanges, and friendly coordination between separated partners.
    confidence: high
    references: [sugiura_1998, katsu_2016]
  - name: grunt
    acoustic_keywords: [low_frequency, short, tonal, repetitive, graded]
    acoustic_description: A short lower-pitched call simpler and more abrupt than the coo.
    semantic_keywords: [contact, affiliation, attention]
    semantic_description: Used in routine social communication, especially during approaches and uncertainty-reducing interactions.
    confidence: high
    references: [katsu_2016]
  - name: girney
    acoustic_keywords: [high_frequency, tonal, short, repetitive, graded]
    acoustic_description: A soft high-pitched call, usually brief and often given in repeated affiliative series.
    semantic_keywords: [affiliation, caregiving, attention]
    semantic_description: Common in affiliative female interactions and infant-related contexts, especially where tension reduction or friendly intent matters.
    confidence: high
    references: [blount_1985, katsu_2016]
  - name: gecker
    acoustic_keywords: [high_frequency, noisy, abrupt, repetitive, graded]
    acoustic_description: A harsh high-pitched distress call, often given in rapidly repeated bursts and acoustically rougher than girneys.
    semantic_keywords: [distress, begging, caregiving, attention]
    semantic_description: Most typical of infants and juveniles in distress, protest, or solicitation contexts that recruit maternal or nearby social attention.
    confidence: medium
    references: [owren_1992]
  - name: scream
    acoustic_keywords: [high_frequency, loud, noisy, long, abrupt]
    acoustic_description: A loud high-arousal distress vocalization with strong noisy energy and variable contour.
    semantic_keywords: [distress, submission, aggression, attention]
    semantic_description: Common in severe conflict and victim responses.
    confidence: high
    references: [green_1981]
  - name: bark
    alternative_names: [threat bark, aggressive call]
    acoustic_keywords: [broadband, noisy, abrupt, short, loud]
    acoustic_description: A short harsh call with abrupt onset and broader spectral energy than coos, grunts, or girneys.
    semantic_keywords: [threat, aggression, attention, spacing]
    semantic_description: Used in aggressive displays and other high-arousal antagonistic interactions.
    confidence: medium
    references: [green_1981]
  - name: copulation call
    acoustic_keywords: [high_frequency, tonal, short, repetitive, graded]
    acoustic_description: A conspicuous repeated sexual call series distinct from routine social contact calls.
    semantic_keywords: [mating, attention]
    semantic_description: Given around copulation and other sexual interactions.
    confidence: medium
    references: [owren_1992]
  - name: pant threat
    alternative_names: [pant-threat call]
    acoustic_keywords: [noisy, short, repetitive, broadband]
    acoustic_description: A brief (~300 ms) harsh noisy call, often produced in rapid bursts, with a rough-sounding texture lacking clear tonal structure.
    semantic_keywords: [threat, aggression, display]
    semantic_description: Produced during aggressive threat displays directed at subordinates or rivals; frequently accompanies head-raised ear-forward threat posture signalling increased intention to attack.
    confidence: medium
    scope:
      life_stages: [adult]
      sexes: [unknown]
      population_specific: false
      note: ""
  - name: growl
    acoustic_keywords: [low_frequency, noisy, long, graded]
    acoustic_description: A low-pitched continuous rumbling call with rough noisy quality, longer in duration than pant threats.
    semantic_keywords: [threat, aggression, spacing]
    semantic_description: Produced in medium-arousal threat and spacing contexts; also documented during phonatory physiology recordings and spontaneous captive sessions.
    confidence: medium
    references: [green_1981]
  - name: chirp
    alternative_names: [food chirp]
    acoustic_keywords: [high_frequency, tonal, short, harmonic, frequency_modulated]
    acoustic_description: A brief high-pitched harmonically rich call with a rising or arched frequency contour (~500 ms), related to the warble/harmonic-arch family of food-associated calls.
    semantic_keywords: [food, recruitment, attention]
    semantic_description: Produced upon discovery of preferred or high-quality food items; may recruit group attention to food patches.
    confidence: medium
    references: [owren_1992]
  - name: warble
    alternative_names: [harmonic arch]
    acoustic_keywords: [tonal, harmonic, long, frequency_modulated, high_frequency]
    acoustic_description: A relatively long (~500 ms) harmonically structured call with a frequency contour that rises toward the middle or end; acoustically richer and more sustained than chirps.
    semantic_keywords: [food, recruitment, attention]
    semantic_description: Associated with discovery of rare or high-quality food; functionally overlaps with chirps and harmonic arches; documented in the context of food broadcasting across macaque species.
    confidence: low
    references: [owren_1992]
  - name: estrous call
    alternative_names: [female solicitation call, mating call]
    acoustic_keywords: [high_frequency, tonal, short, repetitive]
    acoustic_description: A distinctive high-pitched tonal call produced by females; acoustically separable from routine social contact calls; may show variation correlated with reproductive state.
    semantic_keywords: [mating, courtship, display, identity]
    semantic_description: Given by estrous females, particularly during mate-solicitation and around consort interactions; Green (1975) identified a distinct coo variant specific to estrous females.
    confidence: medium
    references: [green_1981]
    scope:
      life_stages: [adult]
      sexes: [female]
      population_specific: false
      note: ""
  - name: infant distress call
    alternative_names: [isolation peep, separation call, lost call, whistle]
    acoustic_keywords: [high_frequency, tonal, long, frequency_modulated]
    acoustic_description: A clear high-pitched tonal call produced by young infants, often with a rising contour; individually distinctive enough for mothers to recognise their own infant.
    semantic_keywords: [distress, caregiving, contact, attention]
    semantic_description: Emitted by infants during separation from mother or in distress; mothers respond selectively to their own infant's version; functions to re-establish physical contact.
    confidence: high
    references: [biben_1986, katsu_2016]
    scope:
      life_stages: [infant]
      sexes: [unknown]
      population_specific: false
      note: ""
  - name: squeal
    acoustic_keywords: [high_frequency, tonal, long, loud, frequency_modulated]
    acoustic_description: A high-pitched sustained tonal call louder than girneys and acoustically intermediate between coos and screams in arousal level; may show graded transition into full screams.
    semantic_keywords: [submission, distress, aggression]
    semantic_description: Produced during mid-arousal conflict interactions; associated with submission or protest by lower-ranking individuals receiving aggression.
    confidence: low
    references: [green_1981]
  - name: submissive call
    alternative_names: [fear grimace call, submission grunt]
    acoustic_keywords: [high_frequency, quiet, short, graded]
    acoustic_description: A brief quiet call associated with bared-teeth submission facial display; softer and less intense than squeals or screams.
    semantic_keywords: [submission, affiliation, attention]
    semantic_description: Produced by subordinate individuals during approach by or interaction with dominant animals; typically accompanies the silent bared-teeth (grimace) expression signalling non-aggression.
    confidence: low
references:
  sugiura_1998:
    citation: "Sugiura, H. 1998. Matching of acoustic features during the vocal exchange of coo calls by Japanese macaques. Animal Behaviour 55:673-687."
    doi: 10.1006/anbe.1997.0602
  katsu_2016:
    citation: "Katsu, N., Yamada, K., and Nakamichi, M. 2016. Function of grunts, girneys and coo calls of Japanese macaques (Macaca fuscata) in relation to call usage, age and dominance relationships. Behaviour 153:125-142."
    doi: 10.1163/1568539X-00003330
  blount_1985:
    citation: "Blount, B.G. 1985. Girney vocalizations among Japanese macaque females: context and function. Primates 26:424-435."
    doi: 10.1007/BF02382457
  owren_1992:
    citation: "Owren, M.J., Dieter, J.A., Seyfarth, R.M., and Cheney, D.L. 1992. Food calls produced by adult female rhesus and Japanese macaques, their normally raised offspring, and offspring cross-fostered between species. Behaviour 120:218-231."
    url: https://brill.com/view/journals/beh/120/3-4/article-p218_5.xml
  green_1981:
    citation: "Green, S.M. 1981. Sex differences and age gradations in vocalizations of Japanese and lion-tailed monkeys. Integrative and Comparative Biology 21:165-183."
    url: https://academic.oup.com/icb/article-pdf/21/1/165/311084/21-1-165.pdf
  green_1975:
    citation: "Green, S. 1975. Variation of vocal pattern with social situation in the Japanese monkey (Macaca fuscata): a field study. In: Primate Behavior 4, ed. L.A. Rosenblum, pp. 1-102. Academic Press, New York."
  biben_1986:
    citation: "Biben, M., Symmes, D., and Masataka, N. 1986. Temporal and structural analysis of affiliative vocal exchanges in squirrel monkeys (Saimiri sciureus). Behaviour 98:259-273."
  masataka_1985:
    citation: "Masataka, N. and Symmes, D. 1986. Effect of separation distance on isolation call structure in Japanese macaques (Macaca fuscata). Primates 27:159-166."
    doi: 10.1007/BF02382063
  katsu_2017:
    citation: "Katsu, N., Yamada, K., and Nakamichi, M. 2017. Vocalizations during post-conflict affiliations from victims toward aggressors based on uncertainty in Japanese macaques. PLOS ONE 12(5):e0178655."
    doi: 10.1371/journal.pone.0178655
