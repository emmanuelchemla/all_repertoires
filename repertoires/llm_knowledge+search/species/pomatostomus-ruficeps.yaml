scientific_name: Pomatostomus ruficeps
common_name: Chestnut-crowned Babbler
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Aves
  order: Passeriformes
  family: Pomatostomidae
  genus: Pomatostomus
  species: ruficeps
calls:
- name: flight call
  acoustic_keywords:
  - short
  - abrupt
  - tonal
  - repetitive
  - loud
  acoustic_description: A short call with clear onset used during movement and transitions
    between perches.
  semantic_keywords:
  - group_coordination
  - contact
  - attention
  semantic_description: Helps coordinate collective movement among group members.
  confidence: medium
- name: chatter
  acoustic_keywords:
  - short
  - repetitive
  - multi_component
  - tonal
  - quiet
  acoustic_description: A rapid sequence of brief notes used in close-range social
    interaction.
  semantic_keywords:
  - contact
  - affiliation
  - group_coordination
  semantic_description: Common during foraging and local group cohesion.
  confidence: high
- name: begging call
  acoustic_keywords:
  - high_frequency
  - repetitive
  - loud
  - short
  - graded
  acoustic_description: A persistent higher-pitched repeated call than adult social
    notes.
  semantic_keywords:
  - begging
  - caregiving
  - attention
  semantic_description: Produced by dependent young to solicit feeding and care.
  confidence: medium
- name: recruitment chatter
  acoustic_keywords:
  - repetitive
  - multi_component
  - noisy
  - abrupt
  - loud
  acoustic_description: A more excited and louder chatter bout than routine contact
    chatter.
  semantic_keywords:
  - recruitment
  - group_coordination
  - attention
  semantic_description: Used to draw group members to a location or focal event.
  confidence: medium
- name: song
  acoustic_keywords:
  - tonal
  - repetitive
  - multi_component
  - long
  - harmonic
  acoustic_description: A more structured vocal sequence than chatter, with repeated
    phrase organization and clearer tonal notes.
  semantic_keywords:
  - territorial
  - group_coordination
  - display
  - identity
  semantic_description: Used in social display and territory-related communication
    by group members.
  confidence: medium
- name: scold call
  alternative_names:
  - mobbing call
  acoustic_keywords:
  - short
  - noisy
  - repetitive
  - abrupt
  - loud
  acoustic_description: A harsh repetitive call rougher than recruitment chatter and
    lacking song-like phrase structure.
  semantic_keywords:
  - alarm
  - threat
  - attention
  semantic_description: Used in disturbance and mobbing contexts to direct group attention
    to a nearby threat.
  confidence: medium
- name: aerial alarm call
  acoustic_keywords:
  - short
  - abrupt
  - loud
  - tonal
  acoustic_description: A sharp, brief high-pitched note distinct from the terrestrial
    alarm and scold; often a single clean element with rapid onset.
  semantic_keywords:
  - alarm
  - predator
  - attention
  semantic_description: Produced in response to aerial predators such as raptors;
    elicits immediate group freeze or take-cover response.
  confidence: high
  references:
  - crane_etal_2016
- name: alert call
  alternative_names:
  - soft alarm
  - vigilance call
  acoustic_keywords:
  - short
  - quiet
  - tonal
  - abrupt
  acoustic_description: A subdued, brief note softer than the aerial alarm; may be
    repeated at low rate as an ongoing low-level warning.
  semantic_keywords:
  - alarm
  - predator
  - attention
  semantic_description: Used when a potential threat is detected but not yet at close
    range; keeps group members in a heightened vigilance state without triggering
    full alarm scatter.
  confidence: medium
  references:
  - crane_etal_2016
- name: prompt call
  alternative_names:
  - nest provisioning call
  - BAB call
  acoustic_keywords:
  - multi_component
  - tonal
  - short
  - abrupt
  acoustic_description: A multi-element call composed of two outer B elements flanking
    a central A element (BAB sequence); acoustically distinct from the flight call
    (AB) despite sharing the same building blocks.
  semantic_keywords:
  - caregiving
  - begging
  - attention
  semantic_description: Produced by adults entering the breeding nest during food
    provisioning; stimulates nestling begging and coordinated nest-entry behaviour.
  confidence: high
  references:
  - engesser_etal_2015
  - engesser_etal_2019
- name: piping call
  alternative_names:
  - maternal contact call
  - pipe call
  acoustic_keywords:
  - tonal
  - repetitive
  - long
  - multi_component
  acoustic_description: A series of clear whistled pipe elements, often combined with
    a leading peow or begging element to form peow-pipe or beg-pipe sequences; relatively
    pure tonal structure with moderate duration per element.
  semantic_keywords:
  - contact
  - caregiving
  - group_coordination
  semantic_description: Used by females (mothers and helpers) as a maternal contact
    call; the form can be modified combinatorially with additional elements, showing
    syntax-like structure in nestling-directed communication.
  confidence: high
  references:
  - engesser_etal_2019
  - mine_etal_2022
- name: long-distance contact call
  alternative_names:
  - peow call
  - far call
  acoustic_keywords:
  - loud
  - tonal
  - frequency_modulated
  - long
  acoustic_description: A loud, drawn-out whistled note with a characteristic downward
    frequency sweep (peow quality); carries further than close-range contact notes.
  semantic_keywords:
  - contact
  - group_coordination
  - spacing
  semantic_description: Used to maintain contact with group members at distances beyond
    the range of short-range chatter; helps reunite separated individuals or locate
    the group.
  confidence: high
  references:
  - crane_etal_2016
- name: distress call
  acoustic_keywords:
  - loud
  - broadband
  - noisy
  - high_frequency
  - abrupt
  acoustic_description: An intense broadband harsh call; noisier and more broadband
    than other alarm vocalizations.
  semantic_keywords:
  - distress
  - alarm
  - recruitment
  semantic_description: Produced when a group member is captured or under direct physical
    threat; elicits immediate approach and mobbing response from nearby conspecifics.
  confidence: medium
  references:
  - crane_etal_2016
