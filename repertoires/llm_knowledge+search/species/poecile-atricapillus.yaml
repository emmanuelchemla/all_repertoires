scientific_name: Poecile atricapillus
common_name: Black-capped Chickadee
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Aves
  order: Passeriformes
  family: Paridae
  genus: Poecile
  species: atricapillus
calls:
  - name: chick-a-dee call
    alternative_names:
      - chickadee call
      - A-B-C-D call
    acoustic_keywords:
      - repetitive
      - multi_component
      - tonal
      - noisy
      - graded
    acoustic_description: Variable call composed of multiple note classes, often ending in one or more dee notes and showing flexible note number and ordering.
    semantic_keywords:
      - contact
      - group_coordination
      - alarm
      - attention
      - combinatorial
    semantic_description: Core social call used in flock cohesion, information sharing, and predator-related signaling, with note structure varying by context.
    confidence: high
    references:
      - ficken_etal_1978
      - templeton_etal_2005
  - name: fee-bee song
    alternative_names:
      - whistled song
      - advertising song
    scope:
      life_stages:
        - adult
      sexes:
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - tonal
      - short
      - repetitive
      - loud
    acoustic_description: Short clear whistled song usually built from two notes in fixed order and repeated from exposed perches.
    semantic_keywords:
      - territorial
      - courtship
      - mating
      - identity
    semantic_description: Primary adult male song for territory advertisement and mate attraction, especially in the breeding season.
    confidence: high
    references:
      - foote_etal_2008
      - ficken_etal_1978
  - name: gargle
    alternative_names:
      - gargle call
      - agonistic gargle
    acoustic_keywords:
      - noisy
      - broadband
      - repetitive
      - abrupt
      - loud
    acoustic_description: Rapid harsh rattling series of notes with noisy broadband structure and marked acoustic complexity.
    semantic_keywords:
      - aggression
      - threat
      - spacing
      - attention
    semantic_description: Common in agonistic or dominance-related interaction and other assertive social exchanges.
    confidence: medium
    references:
      - ficken_etal_1978
  - name: high zee call
    alternative_names:
      - high see
      - see call
    acoustic_keywords:
      - high_frequency
      - tonal
      - short
      - quiet
    acoustic_description: Very high thin short notes that are simpler and less noisy than chick-a-dee calls.
    semantic_keywords:
      - alarm
      - predator
      - attention
    semantic_description: Associated with predator warning, especially rapid alerting to aerial or urgent threats.
    confidence: medium
    references:
      - ficken_etal_1978
      - blackcapped_cornell
  - name: nest hiss
    alternative_names:
      - hissing display
    scope:
      life_stages:
        - juvenile
      sexes:
        - unknown
      population_specific: false
      note: ""
    acoustic_keywords:
      - broadband
      - noisy
      - abrupt
      - loud
      - short
    acoustic_description: Explosive hiss-like burst lacking the tonal structure of chick-a-dee calls or fee-bee song.
    semantic_keywords:
      - threat
      - attention
    semantic_description: Produced by nestlings when an intruder peers into the cavity, functioning as a close-range defensive startle signal.
    confidence: high
    references:
      - blackcapped_cornell
  - name: begging call
    scope:
      life_stages:
        - juvenile
      sexes:
        - unknown
      population_specific: false
      note: ""
    acoustic_keywords:
      - high_frequency
      - repetitive
      - loud
      - short
      - graded
    acoustic_description: Persistent thin solicitation calls produced at higher pitch and rate than routine adult calls.
    semantic_keywords:
      - begging
      - caregiving
      - attention
    semantic_description: Produced by nestlings and fledglings to solicit feeding and care.
    confidence: medium
    references:
      - ficken_etal_1978
  - name: tseet call
    alternative_names:
      - contact note
      - contact call
    acoustic_keywords:
      - short
      - tonal
      - high_frequency
      - abrupt
    acoustic_description: Brief single-note call, typically a clean thin note with a descending frequency contour; structurally similar to the A note of the chick-a-dee call and highly individually variable in fine acoustic detail.
    semantic_keywords:
      - contact
      - group_coordination
      - identity
    semantic_description: The most frequently produced vocalization, used year-round by both sexes to maintain contact with flock or pair partners and to broadcast location; encodes individual and sex identity information.
    confidence: high
    references:
      - ficken_etal_1978
      - sturdy_etal_2000
  - name: flight note
    alternative_names:
      - restless note
      - tsleet call
    acoustic_keywords:
      - short
      - tonal
      - high_frequency
      - loud
      - repetitive
    acoustic_description: Similar in structure to the tseet contact call but louder and produced at a higher rate; a rapid series of short high notes delivered in quick succession.
    semantic_keywords:
      - contact
      - group_coordination
      - attention
    semantic_description: Produced by an individual or flock immediately before taking flight or relocating; functions as a pre-departure signal facilitating flock movement coordination.
    confidence: medium
    references:
      - ficken_etal_1978
  - name: faint fee-bee
    alternative_names:
      - soft fee-bee
      - whispered fee-bee
    scope:
      life_stages:
        - adult
      sexes:
        - unknown
      population_specific: false
      note: ""
    acoustic_keywords:
      - tonal
      - short
      - quiet
    acoustic_description: Structurally similar to the fee-bee song but at markedly reduced amplitude and with slightly shorter notes and intervals; both notes present but subdued.
    semantic_keywords:
      - contact
      - affiliation
      - courtship
    semantic_description: Produced by both sexes at close range, in contrast to the male-only full fee-bee; associated with affiliative or close-range pair interactions and is functionally distinct from territorial song.
    confidence: medium
    references:
      - ficken_etal_1978
  - name: broken dee
    scope:
      life_stages:
        - adult
      sexes:
        - female
      population_specific: false
      note: ""
    acoustic_keywords:
      - high_frequency
      - short
      - tonal
      - repetitive
    acoustic_description: A series of dee-like notes that are irregularly spaced or interrupted, softer and less structured than the dee notes of the full chick-a-dee call.
    semantic_keywords:
      - begging
      - courtship
      - affiliation
    semantic_description: Produced by females during the breeding season, primarily as a mate-solicitation or food-begging signal directed at the male partner; analogous in context to fledgling begging.
    confidence: medium
    references:
      - ficken_etal_1978
  - name: snarl
    acoustic_keywords:
      - noisy
      - broadband
      - abrupt
      - loud
      - short
    acoustic_description: Intense harsh broadband burst, more extreme in noisiness and brevity than the gargle; often accompanied by physical contact.
    semantic_keywords:
      - aggression
      - threat
    semantic_description: Rare, highly agonistic call produced almost exclusively during direct physical fights between individuals; the most intense agonistic vocalization in the repertoire.
    confidence: medium
    references:
      - ficken_etal_1978
  - name: twitter
    acoustic_keywords:
      - noisy
      - broadband
      - short
      - multi_component
      - abrupt
    acoustic_description: A brief series of chattering notes with noisy broadband quality, intermediate between gargle and contact calls in complexity.
    semantic_keywords:
      - submission
      - aggression
      - affiliation
      - caregiving
    semantic_description: Rare call produced in sudden unexpected close encounters with conspecifics; may inhibit attack; also given by males when approaching a brooding female to deliver food.
    confidence: medium
    references:
      - ficken_etal_1978
  - name: squawk
    acoustic_keywords:
      - broadband
      - noisy
      - loud
      - abrupt
      - short
    acoustic_description: Loud harsh broadband exclamatory note produced by adults, distinct from the finer-structured gargle or snarl.
    semantic_keywords:
      - caregiving
      - recruitment
      - attention
    semantic_description: Parental call produced at or near the nest during nestling provisioning; elicits gaping responses from nestlings and may coordinate nest visits.
    confidence: low
    references:
      - ficken_etal_1978
  - name: variable see
    acoustic_keywords:
      - high_frequency
      - tonal
      - short
      - graded
    acoustic_description: High thin see-like notes of variable length and pitch; acoustically related to the high zee alarm call but with more variable structure and lower urgency.
    semantic_keywords:
      - courtship
      - mating
      - display
    semantic_description: Produced in sexual and courtship contexts, often co-occurring with gargle calls during pre-copulatory interactions and dawn chorus displays; believed to be primarily or more commonly produced by females.
    confidence: low
    references:
      - ficken_etal_1978
  - name: subsong
    scope:
      life_stages:
        - juvenile
      sexes:
        - unknown
      population_specific: false
      note: ""
    acoustic_keywords:
      - tonal
      - long
      - quiet
      - repetitive
      - multi_component
      - graded
    acoustic_description: Low-amplitude rambling sequence of variable tonal elements, often containing recognizable fragments of fee-bee and other adult vocalizations interspersed with novel tonal notes; typically long and sometimes musical.
    semantic_keywords:
      - play
      - display
    semantic_description: Produced by newly fledged and recently independent juveniles; considered a vocal practice or rehearsal phase important in song development rather than serving a direct communicative function.
    confidence: medium
    references:
      - ficken_etal_1978
  - name: distress call
    scope:
      life_stages:
        - juvenile
      sexes:
        - unknown
      population_specific: false
      note: ""
    acoustic_keywords:
      - broadband
      - loud
      - noisy
      - repetitive
    acoustic_description: Loud broadband calls produced by young birds when seized or severely threatened; more intense and wide-band than ordinary alarm signals.
    semantic_keywords:
      - distress
      - alarm
      - predator
    semantic_description: Produced by fledglings or captured juveniles when seized by a predator or under extreme duress; may attract adults and alarm nearby conspecifics.
    confidence: low
    references:
      - ficken_etal_1978
