    population_specific: false
    note: ''
  acoustic_keywords:
  - quiet
  - repetitive
  - pulsed
  - short
  acoustic_description: A soft low-amplitude rhythmic scraping or grinding produced
    by the mandibles rubbing together; similar to a faint scratchy or pencil-sharpening
    sound, with a slightly pulsed repetitive texture and no clear tonality.
  semantic_keywords:
  - affiliation
  - contact
  semantic_description: Produced during drowsy relaxation, typically just before or
