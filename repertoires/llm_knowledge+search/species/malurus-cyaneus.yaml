  - repetitive
  - loud
  acoustic_description: A relatively long, structurally complex song-like trill emitted
    as a single bout; more elaborate and sustained than the typical chit alarm call,
    resembling normal song in spectral complexity but given in a distinct context.
  semantic_keywords:
