  - predator
  - display
  - identity
  semantic_description: Produced by both sexes in response to loud calls of potential
    predators (ravens, currawongs, hawks); function is debated — appears to serve
    as an intraspecific display directed at group members rather than as a classical
    anti-predator signal.
  confidence: high
