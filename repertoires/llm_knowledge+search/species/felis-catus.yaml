  martin_1978:
    citation: "Martin, P. 1978. Ontogeny of play and locomotor behaviour in kittens. Animal Behaviour 26:1–21."
  mccomb_2009:
    citation: "McComb, K., Taylor, A.M., Wilson, C., and Charlton, B.D. 2009. The cry embedded within the purr. Current Biology 19:R507–R508."
    doi: 10.1016/j.cub.2009.05.033
  schotz_2015:
    citation: "Schotz, S. 2015. Melodic intonation, phonation and phonetics of domestic cat vocalisations. Proceedings of Fonetik 2015, Lund, Sweden."
  bradshaw_2012:
    citation: "Bradshaw, J.W.S. 2012. Cat Sense: How the New Feline Science Can Make You a Better Friend to Your Pet. Basic Books, New York."
