    url: https://www.aquaticmammalsjournal.org/wp-content/uploads/2020/07/46.4-Ames.pdf
  brewer_2023:
    citation: "Brewer, A., Castellote, M., and Wade, P. 2023. Communication in Cook Inlet beluga whales: Describing the vocal repertoire and caller identity. NOAA Technical Memorandum."
    url: https://repository.library.noaa.gov/view/noaa/56147/noaa_56147_DS1.pdf
  chmelnitsky_2012:
    citation: "Chmelnitsky, E.G. and Ferguson, S.H. 2012. Beluga whale, Delphinapterus leucas, vocalizations from the Churchill River, Manitoba, Canada. Journal of the Acoustical Society of America 131:4821-4835."
  noyes_2019:
    citation: "Noyes, A., Friedlaender, A., and Sayigh, L. 2019. Investigating individual distinctiveness in the calls of wild belugas. Journal of the Acoustical Society of America."
  roy_2021:
    citation: "Roy, N., Karpovich, S., and Vergara, V. 2021. Ultrasonic high-frequency burst pulse calls in beluga whales may function in noisy environments. Biology Letters 17:20210274."
  koblitz_2016:
    citation: "Koblitz, J.C., Stilz, P., Rasmussen, M.H., and Laidre, K.L. 2016. Highly directional sonar beam of narwhals (Monodon monoceros) measured with a vertical 16 hydrophone array. PLoS ONE 11:e0152327. [Used for Monodontidae biosonar context; beluga click-train specifics also supported by NOAA Fisheries echolocation summaries.]"
  vergara_2010:
    citation: "Vergara, V., Michaud, R., and Barrett-Lennard, L. 2010. What can captive whales tell us about their wild counterparts? Identification, usage and function of contact calls in belugas (Delphinapterus leucas). International Journal of Comparative Psychology 23:278-309."
  favaro_2015:
    citation: "Favaro, L., Neves, S., Fugate, N., and Raschi, W. 2015. Individuality embedded in the isolation calls of captive beluga whales (Delphinapterus leucas). Zoological Letters 1:27."
    url: https://zoologicalletters.biomedcentral.com/articles/10.1186/s40851-015-0028-x
  seaworld_comm:
    citation: "SeaWorld Parks & Entertainment. Communication in Beluga Whales. All About Beluga Whales – Communication. https://seaworld.org/animals/all-about/beluga-whales/communication/ (accessed 2026-06-13)."
