scientific_name: Suricata suricatta
common_name: Meerkat
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Mammalia
  order: Carnivora
  family: Herpestidae
  genus: Suricata
  species: suricatta
calls:
- name: aerial alarm call
  acoustic_keywords:
  - abrupt
  - short
  - noisy
  - broadband
  - graded
  acoustic_description: A brief alarm call with abrupt onset and relatively harsh
    spectral structure, often emitted in rapid sequences under high threat.
  semantic_keywords:
  - alarm
  - predator
  - attention
  semantic_description: Given to flying or overhead predators and elicits rapid vigilance
    and refuge-seeking responses from group members.
  confidence: high
  references:
  - manser_2000
  - townsend_2017
- name: terrestrial alarm call
  acoustic_keywords:
  - short
  - tonal
  - harmonic
  - graded
  - repetitive
  acoustic_description: A short alarm call that is typically more harmonic and less
    harsh at lower urgency, but can become noisier and more abrupt as urgency increases.
  semantic_keywords:
  - alarm
  - predator
  - attention
  semantic_description: Produced when a ground-based predator or comparable terrestrial
    threat is detected, allowing listeners to adjust their escape and scanning behavior.
  confidence: high
  references:
  - manser_2000
  - manser_seyfarth_cheney_2001
- name: recruitment alarm call
  alternative_names:
  - mobbing recruitment call
  acoustic_keywords:
  - repetitive
  - abrupt
  - noisy
  - broadband
  - loud
  acoustic_description: A repeated, high-arousal alarm series with harsh elements
    that stands out strongly from low-risk calls.
  semantic_keywords:
  - alarm
  - predator
  - recruitment
  - group_coordination
  semantic_description: Used when group members are recruited to inspect, mob, or
    collectively respond to a threat such as a snake or other target requiring coordinated
    attention.
  confidence: high
  references:
  - townsend_2017
  - manser_2000
- name: close call
  acoustic_keywords:
  - quiet
  - short
  - tonal
  - harmonic
  - repetitive
  acoustic_description: A soft, low-amplitude call given frequently during foraging,
    with simple short tonal structure.
  semantic_keywords:
  - contact
  - group_coordination
  - affiliation
  semantic_description: Maintains contact and spacing among foraging group members
    and helps coordinate group cohesion under low perceived risk.
  confidence: high
  references:
  - townsend_2011
- name: sentinel call
  alternative_names:
  - watchman's song
  acoustic_keywords:
  - tonal
  - repetitive
  - quiet
  - short
  - graded
  acoustic_description: A repeated sequence of low-amplitude tonal calls that can
    vary subtly with changes in perceived safety and vigilance state.
  semantic_keywords:
  - group_coordination
  - attention
  - contact
  semantic_description: Produced by guarding individuals to signal ongoing vigilance
    and modulate the perceived safety of foraging group mates.
  confidence: high
  references:
  - bousquet_2015
  - manser_2000
- name: moving call
  acoustic_keywords:
  - tonal
  - short
  - repetitive
  - quiet
  acoustic_description: A short, repeated call type used in locomotor contexts, acoustically
    similar to other low-arousal social calls but typically given in movement bouts.
  semantic_keywords:
  - group_coordination
  - contact
  - attention
  semantic_description: Associated with coordinated group movement and helps keep
    individuals together while shifting position between patches or burrows.
  confidence: medium
  references:
  - townsend_close_2010
- name: begging call
  scope:
    life_stages:
    - juvenile
    sexes:
    - unknown
    population_specific: false
    note: ''
  acoustic_keywords:
  - high_frequency
  - tonal
  - repetitive
  - short
  - loud
  acoustic_description: A repeated, high-pitched call often delivered persistently
    by dependent young during provisioning interactions.
  semantic_keywords:
  - begging
  - caregiving
  - attention
  semantic_description: Elicits food transfer or attention from helpers and breeders
    during juvenile provisioning and post-emergence care.
  confidence: medium
  references:
  - townsend_close_2010
- name: panic alarm call
  acoustic_keywords:
  - abrupt
  - short
  - noisy
  - broadband
  - loud
  acoustic_description: A very urgent alarm call with harsh abrupt structure and higher
    amplitude than routine aerial or terrestrial alarms.
  semantic_keywords:
  - alarm
  - predator
  - attention
  semantic_description: Produced under immediate high-risk threat and associated with
    the fastest escape responses.
  confidence: medium
  references:
  - manser_2000
- name: sunning call
  alternative_names:
  - morning call
  acoustic_keywords:
  - quiet
  - short
  - tonal
  - repetitive
  acoustic_description: A soft, brief, tonal call produced mainly in morning sunning
    bouts; approximately 50-55 dB at half a metre. Individuals avoid overlapping one
    another, resulting in a turn-taking rhythm within the group.
  semantic_keywords:
  - affiliation
  - group_coordination
  - contact
  semantic_description: Produced by group members after emerging from sleeping burrows
    during communal sunning, with a likely social regulatory and bonding function.
    Call rate is influenced by social relationships and dominance status.
  confidence: medium
  references:
  - lara_2024
- name: submissive call
  alternative_names:
  - short note call
  acoustic_keywords:
  - high_frequency
  - short
  - tonal
  - repetitive
  - quiet
  acoustic_description: Rapid, high-pitched, brief tonal notes produced in bouts by
    subordinate individuals. Bout structure follows Menzerath's Law (longer sequences
    have shorter elements). Bouts may incorporate single-note, double-note, triple-note,
    and multiple-note variants.
  semantic_keywords:
  - submission
  - affiliation
  - group_coordination
  semantic_description: Produced by subordinates during social tension with same-sex
    dominants, typically combined with submissive body posture and often followed by
    grooming or following behaviour. Among the most frequently produced call types
    in the meerkat repertoire.
  confidence: high
  references:
  - bruche_2020
  - lara_menzerath_2024
- name: aggression call
  alternative_names:
  - growl
  - threat bark
  acoustic_keywords:
  - broadband
  - noisy
  - abrupt
  - loud
  - low_frequency
  acoustic_description: Harsh, low-pitched broadband vocalisations including growls
    and louder barks with abrupt onset. Acoustically distinct from the high-pitched
    tonal alarm and contact calls.
  semantic_keywords:
  - aggression
  - threat
  - territorial
  semantic_description: Produced during aggressive intragroup or intergroup encounters.
    Low growls and snarls are used in dominance interactions, while louder barks are
    directed at rival groups encroaching on territory boundaries.
  confidence: medium
- name: lost call
  alternative_names:
  - separation call
  acoustic_keywords:
  - loud
  - tonal
  - high_frequency
  - repetitive
  acoustic_description: A repeated, relatively loud tonal call with rising contour
    produced by isolated or separated individuals. Higher amplitude and more persistent
    than foraging contact calls.
  semantic_keywords:
  - contact
  - distress
  - group_coordination
  semantic_description: Produced by individuals that become separated from the group,
    facilitating reunion. Also reported in pups that lose contact with group members
    above ground.
  confidence: low
