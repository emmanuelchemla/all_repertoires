scientific_name: Phyllostomus discolor
common_name: Pale Spear-nosed Bat
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Mammalia
  order: Chiroptera
  family: Phyllostomidae
  genus: Phyllostomus
  species: discolor
calls:
- name: isolation call
  acoustic_keywords:
  - high_frequency
  - tonal
  - long
  - repetitive
  - loud
  acoustic_description: A higher-amplitude call with sustained structure, produced
    more persistently than ordinary social calls.
  semantic_keywords:
  - begging
  - caregiving
  - contact
  - attention
  semantic_description: Used by separated young or isolated individuals to elicit
    care or reunion.
  confidence: high
- name: social screech
  acoustic_keywords:
  - high_frequency
  - noisy
  - abrupt
  - short
  - repetitive
  acoustic_description: A harsh short social call with greater noisy energy than isolation
    calls.
  semantic_keywords:
  - aggression
  - attention
  - contact
  semantic_description: Used in close-range social negotiation and conflict.
  confidence: medium
- name: contact call
  acoustic_keywords:
  - short
  - tonal
  - quiet
  - repetitive
  - graded
  acoustic_description: A lower-amplitude social call with simpler structure than
    distress or aggressive calls.
  semantic_keywords:
  - contact
  - affiliation
  - group_coordination
  semantic_description: Used in routine within-roost social communication.
  confidence: medium
- name: maternal directive call
  acoustic_keywords:
  - tonal
  - frequency_modulated
  - short
  - repetitive
  - quiet
  acoustic_description: A patterned social call used in maternal interactions and
    infant guidance.
  semantic_keywords:
  - caregiving
  - attention
  - contact
  semantic_description: Included as a broad maternal communication category given
    the species' strong evidence for vocal learning and mother-pup exchange.
  confidence: medium
- name: courtship trill
  acoustic_keywords:
  - high_frequency
  - repetitive
  - tonal
  - short
  - multi_component
  acoustic_description: A repeated trill-like social call more patterned than isolation
    calls and less harsh than social screeches.
  semantic_keywords:
  - courtship
  - mating
  - attention
  semantic_description: Produced in reproductive or close affiliative interactions
    and likely contributes to mate-oriented signaling.
  confidence: low
- name: aggression screech
  acoustic_keywords:
  - high_frequency
  - noisy
  - abrupt
  - short
  - repetitive
  acoustic_description: A harsh short screech with stronger noisy components than
    mild contact calls.
  semantic_keywords:
  - aggression
  - threat
  - attention
  semantic_description: Given in conflict, displacement, or territorial social encounters
    within roosts.
  confidence: medium
- name: high-entropy call
  alternative_names:
  - HE syllable
  - noisy screech
  acoustic_keywords:
  - noisy
  - broadband
  - short
  - abrupt
  acoustic_description: Highly aperiodic, screechy vocalization with smeared spectrogram
    appearance; mean duration ~6 ms; high aperiodicity index (~0.42); can retain
    partial harmonicity.
  semantic_keywords:
  - aggression
  - threat
  semantic_description: Produced almost exclusively (~95%) during antagonistic encounters;
    the dominant agonistic signal in the repertoire.
  confidence: high
  references:
  - futz_etal_2019
- name: linear downward frequency-modulated call
  alternative_names:
  - lDFM syllable
  - linear FM sweep
  acoustic_keywords:
  - frequency_modulated
  - short
  - tonal
  acoustic_description: Short (~7 ms) syllable with a linear downward frequency sweep
    of the fundamental; mean fundamental ~17 kHz; steep average slope (~-1.7 kHz/ms).
  semantic_keywords:
  - contact
  - group_coordination
  - affiliation
  - aggression
  semantic_description: Emitted in both prosocial and antagonistic contexts; one of
    the most common syllable types in the roost repertoire.
  confidence: high
  references:
  - futz_etal_2019
- name: non-linear downward frequency-modulated call
  alternative_names:
  - nlDFM syllable
  - curved FM sweep
  acoustic_keywords:
  - frequency_modulated
  - long
  - tonal
  acoustic_description: Longer (~17 ms) downward FM sweep with curved or irregular
    contour; mean fundamental ~15 kHz; shallower average slope (~-0.74 kHz/ms) than
    linear DFM.
  semantic_keywords:
  - contact
  - affiliation
  - group_coordination
  semantic_description: Predominantly prosocial (75-85% of occurrences in non-aggressive
    contexts); likely used for within-roost affiliation and coordination.
  confidence: high
  references:
  - futz_etal_2019
- name: sinusoidal frequency-modulated call
  alternative_names:
  - SFM syllable
  - sinusoidal FM call
  acoustic_keywords:
  - frequency_modulated
  - short
  - tonal
  - repetitive
  acoustic_description: Short (~5-6 ms) syllable with a stable sinusoidal oscillation
    in fundamental frequency and small overall frequency variation; regular oscillation
    pattern with consistent periodicity.
  semantic_keywords:
  - contact
  - affiliation
  - attention
  semantic_description: Predominantly prosocial (75-85% prosocial); associated with
    attention-seeking and vocal contact within the roost group.
  confidence: high
  references:
  - futz_etal_2019
- name: quasi-constant frequency call
  alternative_names:
  - qCF syllable
  - tonal constant-frequency call
  acoustic_keywords:
  - tonal
  - long
  - low_frequency
  acoustic_description: Near-constant fundamental frequency sustained for the entire
    syllable duration (~10-21 ms); mean fundamental ~7 kHz; low-frequency relative
    to other syllable types; variants include steep-onset form (qCF_so) with preceding
    downward sweep.
  semantic_keywords:
  - contact
  - affiliation
  - group_coordination
  semantic_description: Predominantly prosocial (75-85% prosocial); one of the most
    common tonal call types in the roost social repertoire.
  confidence: high
  references:
  - futz_etal_2019
- name: echolocation call
  alternative_names:
  - biosonar pulse
  - sonar call
  acoustic_keywords:
  - high_frequency
  - frequency_modulated
  - short
  - multi_component
  acoustic_description: Frequency-modulated broadband pulse covering ~45-100 kHz,
    dominated by the 3rd-5th harmonics with suppressed fundamental; very short duration
    (0.3-2.5 ms); neurally controlled via a distinct brainstem pathway (paralemniscal
    area) separate from social vocalizations.
  semantic_keywords:
  - food
  - group_coordination
  semantic_description: Emitted for spatial orientation and prey detection during
    flight; acoustically distinct from social calls and under separate neural control
    in the brainstem.
  confidence: high
  references:
  - rubsamen_etal_2005
references:
  futz_etal_2019:
