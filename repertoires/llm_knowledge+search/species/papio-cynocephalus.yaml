  rendall_etal_1999:
    citation: "Rendall, D., Cheney, D.L., and Seyfarth, R.M. 1999. The meaning and function of grunt variants in baboons. Animal Behaviour 57:583-592."
    url: https://www.sas.upenn.edu/~seyfarth/Publications/Rendall%20et%20al.%201999.pdf
  cheney_etal_1995:
    citation: "Cheney, D.L., Seyfarth, R.M., Silk, J.B. 1995. The role of grunts in reconciling opponents and facilitating interactions among adult female baboons. Animal Behaviour 50:249-257."
    doi: 10.1006/anbe.1995.0237
