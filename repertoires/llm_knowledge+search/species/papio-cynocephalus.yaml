  fischer_2002:
    citation: "Fischer, J., Kitchen, D.M., Seyfarth, R.M., and Cheney, D.L. 2002. Baboon loud calls advertise male quality: acoustic features and relation to rank, age, and exhaustion. Behavioral Ecology and Sociobiology 53:140-148."
    url: https://link.springer.com/article/10.1007/s00265-002-0559-4
  semple_2002:
    citation: "Semple, S. 2002. Individuality and male discrimination of female copulation calls in yellow baboons. Animal Behaviour 64:907-914."
