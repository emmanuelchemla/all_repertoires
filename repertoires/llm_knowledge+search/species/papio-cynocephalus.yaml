    citation: "Boe, L.-J., Berthommier, F., Legou, T., Captier, G., Kemp, C., Sawallis, T.R., Becker, Y., Rey, A., Fagot, J., and Badin, P. 2017. Evidence of a vocalic proto-system in the baboon (Papio papio) suggests pre-hominin speech precursors. PLoS ONE 12:e0169321."
    doi: 10.1371/journal.pone.0169321
  guinea_baboon_repertoire_2013:
    citation: "Maciej, P., Ndao, I., Hammerschmidt, K., and Fischer, J. 2013. Vocal communication in a complex multi-level society: constrained acoustic structure and flexible call usage in Guinea baboons. Frontiers in Zoology 10:58."
