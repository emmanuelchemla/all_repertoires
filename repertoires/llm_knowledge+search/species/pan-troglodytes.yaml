scientific_name: Pan troglodytes
common_name: Chimpanzee
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Mammalia
  order: Primates
  family: Hominidae
  genus: Pan
  species: troglodytes
calls:
  - name: pant hoot
    acoustic_keywords: [long, loud, repetitive, multi_component, frequency_modulated]
    acoustic_description: A long-distance sequence that typically begins with soft breathy hoo-like elements, accelerates through panting phases, rises to a loud scream-rich climax, and then tapers off.
    semantic_keywords: [group_coordination, affiliation, display, identity, combinatorial]
    semantic_description: Used in greetings, travel coordination, party fusion, displays, and excited social situations; it can recruit attention at distance and carries individual distinctiveness.
    confidence: high
    references: [crockford_2019, fedurek_2016, girardbuttoz_2022]
  - name: pant grunt
    acoustic_keywords: [low_frequency, quiet, repetitive, pulsed, graded]
    acoustic_description: A soft series of low rhythmic grunts interspersed with audible inhaled panting, often given in repeated bouts at close range.
    semantic_keywords: [submission, affiliation, attention]
    semantic_description: A formal submissive greeting, usually directed by lower-ranking individuals toward higher-ranking group members.
    confidence: high
    references: [laporte_zuberbuhler_2010, girardbuttoz_2022]
  - name: rough grunt
    alternative_names: [food grunt]
    acoustic_keywords: [low_frequency, pulsed, graded, repetitive]
    acoustic_description: A rough-sounding series of low grunts that can vary from softer grunts to harsher louder food-associated variants.
    semantic_keywords: [food, recruitment, group_coordination]
    semantic_description: Produced mainly when discovering or feeding on food, often attracting or informing nearby group members and varying with feeding context.
    confidence: high
    references: [slocombe_zuberbuhler_2005, slocombe_zuberbuhler_2006, girardbuttoz_2022]
  - name: grunt
    alternative_names: [soft grunt]
    acoustic_keywords: [low_frequency, short, pulsed, graded, quiet]
    acoustic_description: A brief low grunt or short series of grunts, typically less harsh and less prolonged than classic rough-grunt bouts and lacking the inhaled rhythm of pant grunts.
    semantic_keywords: [affiliation, attention, food]
    semantic_description: A broad low-arousal grunt class used at close range in contexts including mild greeting, approach, and some feeding situations; boundaries with rough grunts are likely graded rather than sharp.
    confidence: low
    references: [girardbuttoz_iscience_2022, girardbuttoz_2022]
  - name: hoo
    alternative_names: [contact hoo]
    acoustic_keywords: [low_frequency, tonal, quiet, short, repetitive]
    acoustic_description: Soft low-pitched tonal notes, often given singly or in short repeated series, with relatively little broadband noise.
    semantic_keywords: [contact, group_coordination, attention]
    semantic_description: Used in close- to medium-range coordination, including maintaining contact, approaching others, and low-arousal social or travel contexts.
    confidence: medium
    references: [crockford_2019, girardbuttoz_2022]
  - name: panted hoo
    alternative_names: [pant hoo, panted hoot]
    acoustic_keywords: [low_frequency, tonal, quiet, repetitive, pulsed]
    acoustic_description: A repeated hoo series separated by audible inhalations, giving a rhythmic panting quality without the full multistage structure of a complete pant hoot.
    semantic_keywords: [contact, group_coordination, affiliation, identity]
    semantic_description: Used especially in inter-party calling, fusion, and greeting-related coordination, and can also appear as a component of longer greeting hoot sequences.
    confidence: medium
    references: [girardbuttoz_iscience_2022, girardbuttoz_2022]
  - name: alarm hoo
    acoustic_keywords: [low_frequency, tonal, quiet, repetitive, abrupt]
    acoustic_description: A subdued hoo variant given in short discrete notes, generally softer and less conspicuous than screams or barks.
    semantic_keywords: [alarm, predator, attention]
    semantic_description: Associated with detection of danger, especially snake-related alarm situations, and appears to function to warn or direct the attention of others.
    confidence: medium
    references: [schel_etal_2013]
  - name: bark
    acoustic_keywords: [broadband, abrupt, loud, short]
    acoustic_description: A sharp explosive bark-like call with abrupt onset and broad spectral energy.
    semantic_keywords: [threat, aggression, attention]
    semantic_description: Given in aroused confrontations, charging displays, or other high-tension situations to threaten others or sharply capture attention.
    confidence: medium
    references: [crockford_2019, girardbuttoz_2022]
  - name: pant bark
    acoustic_keywords: [broadband, loud, repetitive, pulsed, multi_component]
    acoustic_description: A forceful sequence combining bark-like notes with panting rhythm, harsher and more rapidly repeated than single barks.
    semantic_keywords: [threat, display, aggression, attention]
    semantic_description: Common in intense displays and highly aroused social encounters where callers sustain aggressive or dominance-related signalling.
    confidence: medium
    references: [girardbuttoz_2022, goodall_1986]
  - name: pant
    acoustic_keywords: [quiet, short, repetitive, pulsed, graded]
    acoustic_description: A sequence of short audible inhaled and exhaled panting elements with little tonal structure, often heard as breathy rhythmic pants.
    semantic_keywords: [group_coordination, affiliation, attention]
    semantic_description: A rare standalone unit in the wild repertoire, often associated with extended multicomponent calling and likely overlapping with excited social coordination or display-related contexts.
    confidence: low
    references: [girardbuttoz_2022]
  - name: waa bark
    alternative_names: [wraaa call]
    acoustic_keywords: [loud, broadband, long, frequency_modulated, noisy]
    acoustic_description: A louder more prolonged bark-like call with a drawn-out harsh vowel-like quality and strong noisy energy.
    semantic_keywords: [alarm, threat, attention]
    semantic_description: Produced in strongly aroused reactions to unusual or dangerous events and may escalate alarm or disturbance situations.
    confidence: medium
    references: [girardbuttoz_2022]
  - name: scream
    acoustic_keywords: [high_frequency, loud, noisy, long, graded]
    acoustic_description: A high-pitched piercing often noisy vocalization that may rise, break, or vary continuously with arousal.
    semantic_keywords: [distress, aggression, submission, attention]
    semantic_description: Common in fights, chases, severe social tension, and victim responses, where it broadcasts distress or intense arousal to nearby listeners.
    confidence: high
    references: [crockford_2019, girardbuttoz_2022]
  - name: pant scream
    alternative_names: [panted scream]
    acoustic_keywords: [high_frequency, loud, noisy, repetitive, pulsed]
    acoustic_description: A scream series interspersed with voiced inhalations, producing a broken panting rhythm layered onto a loud high-pitched harsh call.
    semantic_keywords: [distress, aggression, display, attention]
    semantic_description: Occurs in highly aroused sequences and display-like bouts, including as a recognized unit in full-repertoire sequence analyses and as part of some pant-hoot-like climactic signalling.
    confidence: medium
    references: [girardbuttoz_2022]
  - name: pant roar
    alternative_names: [panted roar]
    acoustic_keywords: [low_frequency, noisy, long, pulsed, loud]
    acoustic_description: A low harsh roar-like call produced with interspersed panting, typically sounding rougher and more breath-driven than a simple bark or grunt.
    semantic_keywords: [display, attention, group_coordination]
    semantic_description: A rare vocal unit recognized in full-repertoire analyses, often associated with the let-down portion of complex long-call sequences rather than common standalone everyday calling.
    confidence: low
    references: [girardbuttoz_2022]
  - name: whimper
    acoustic_keywords: [high_frequency, tonal, quiet, short, repetitive]
    acoustic_description: Soft high-pitched plaintive notes, often repeated and less intense than full screams.
    semantic_keywords: [distress, begging, caregiving, affiliation]
    semantic_description: Often associated with mild distress, appeasement, infant or juvenile need, or solicitation of tolerance and care from others.
    confidence: medium
    references: [crockford_2019, girardbuttoz_2022]
  - name: laugh
    alternative_names: [play laugh]
    acoustic_keywords: [broadband, noisy, pulsed, repetitive, short]
    acoustic_description: A breathy pulsed staccato series of exhaled and inhaled noisy elements, often rhythmically repeated during active interaction.
    semantic_keywords: [play, affiliation]
    semantic_description: Produced during rough-and-tumble play, tickling, and other positively valenced playful interactions.
    confidence: medium
    references: [crockford_2019]
