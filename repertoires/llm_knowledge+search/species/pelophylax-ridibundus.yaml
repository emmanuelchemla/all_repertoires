scientific_name: Pelophylax ridibundus
common_name: Marsh Frog
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Amphibia
  order: Anura
  family: Ranidae
  genus: Pelophylax
  species: ridibundus
calls:
  - name: laughing call
    alternative_names: [advertisement call, mating call, laugh-like call]
    acoustic_keywords: [tonal, repetitive, loud, short, harmonic]
    acoustic_description: A repeated laugh-like series of very short resonant call units delivered in groups, produced with the side vocal sacs and forming the main breeding advertisement.
    semantic_keywords: [courtship, mating, attention]
    semantic_description: Used by males to attract females during breeding choruses; the 2024 marsh frog repertoire study treats this call type as analogous to earlier mating-call descriptions.
    confidence: high
    references: [li_hending_2024, lukanov_etal_2011, ridibundus_call_study]
  - name: chirping call
    alternative_names: [warning call]
    acoustic_keywords: [high_frequency, short, abrupt, noisy]
    acoustic_description: A high-pitched chirping vocalization, acoustically distinct from the lower resonant breeding calls and reported as the highest-frequency call type in the recent repertoire study.
    semantic_keywords: [alarm, threat, attention]
    semantic_description: Associated with warning-like contexts and often followed by rapid displacement of the caller.
    confidence: medium
    references: [li_hending_2024, lukanov_etal_2011]
  - name: normal high-frequency descending woah call
    alternative_names: [territorial call]
    acoustic_keywords: [frequency_modulated, long, repetitive, loud, tonal]
    acoustic_description: A high-frequency descending woah-like call with longer intervals between repeated units than in the laugh-like advertisement call.
    semantic_keywords: [territorial, spacing, attention]
    semantic_description: Used in territorial interactions and commonly appears in call sequences between release-like and lower-frequency aggressive call types.
    confidence: high
    references: [li_hending_2024, lukanov_etal_2011]
  - name: medium-frequency ascending woah call
    alternative_names: [release call]
    acoustic_keywords: [frequency_modulated, short, abrupt, noisy, repetitive]
    acoustic_description: An ascending woah-like call at intermediate frequency, produced with central vocal-sac inflation and acoustically separated from the lower advertisement repertoire.
    semantic_keywords: [submission, attention, mating]
    semantic_description: Treated in the recent repertoire study as corresponding most closely to earlier release-call descriptions, though the authors note that function may vary geographically.
    confidence: medium
    references: [li_hending_2024, fedorova_shabanov_2023, lukanov_etal_2011]
  - name: fine low-frequency ascending woah call
    alternative_names: [aggressive call]
    acoustic_keywords: [low_frequency, frequency_modulated, long, tonal, graded]
    acoustic_description: A lower-frequency ascending woah call with finer structure than the rough variant, usually occurring toward the end of multi-call sequences.
    semantic_keywords: [aggression, territorial, spacing]
    semantic_description: Interpreted as the closest match to the aggressive call of earlier repertoire descriptions.
    confidence: medium
    references: [li_hending_2024, lukanov_etal_2011]
  - name: rough low-frequency ascending woah call
    acoustic_keywords: [low_frequency, frequency_modulated, short, noisy, repetitive]
    acoustic_description: A rougher low-frequency ascending woah call composed of multiple short units and reported as the lowest-frequency call type in the 2024 study.
    semantic_keywords: [aggression, territorial, attention]
    semantic_description: Included as a distinct call class because the recent marsh frog repertoire study separated it quantitatively from the fine low-frequency ascending woah call, although its exact functional boundary remains uncertain.
    confidence: medium
    references: [li_hending_2024]
  - name: breck call
    acoustic_keywords: [short, abrupt, broadband, noisy]
    acoustic_description: A brief breck-like call that can mix or transition with medium-frequency ascending woah calls in observed call sequences.
    semantic_keywords: [attention, aggression]
    semantic_description: Reported as a distinct call type in the recent Hungarian repertoire study, but its specific social function remains unresolved.
    confidence: low
    references: [li_hending_2024]
  - name: disrupted high-frequency descending woah call
    acoustic_keywords: [frequency_modulated, long, noisy, repetitive, graded]
    acoustic_description: A prolonged disrupted variant of the high-frequency descending woah call, quantitatively identified as the longest-duration marsh frog call type in the 2024 study.
    semantic_keywords: [territorial, aggression, attention]
    semantic_description: Included as a distinct call class because the recent repertoire study recovered it separately from the normal descending woah call; it appears in escalated or mixed social sequences.
    confidence: medium
    references: [li_hending_2024]
  - name: distress call
    acoustic_keywords: [high_frequency, short, abrupt, loud, noisy]
    acoustic_description: A sudden short high call acoustically distinct from the low resonant breeding repertoire.
    semantic_keywords: [distress, alarm, attention]
    semantic_description: Reported in the earlier Bulgarian marsh frog repertoire, but not recovered in the 2024 Hungarian recordings; retained here as a plausible but geographically or contextually sparse class.
    confidence: low
    references: [lukanov_etal_2011]
