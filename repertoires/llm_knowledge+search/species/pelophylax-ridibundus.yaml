  phylum: Chordata
  class: Amphibia
  order: Anura
  family: Ranidae
  genus: Pelophylax
  species: ridibundus
calls:
  - name: advertisement call
    alternative_names: [mating call, laugh-like call]
    acoustic_keywords: [tonal, repetitive, loud, long, harmonic]
    acoustic_description: A repeated croaking breeding call with stable rhythmic structure and strong resonance.
    semantic_keywords: [courtship, mating, attention]
    semantic_description: Used by males to attract females at breeding aggregations.
    confidence: high
    references: [li_hending_2024, ridibundus_call_study]
  - name: territorial call
    acoustic_keywords: [abrupt, repetitive, noisy, loud, graded]
    acoustic_description: A harsher and more abrupt call than the advertisement call, often produced in short repeated bursts.
    semantic_keywords: [territorial, aggression, attention]
    semantic_description: Used in male-male competition and spacing around calling sites.
    confidence: high
    references: [li_hending_2024]
  - name: encounter call
    acoustic_keywords: [abrupt, repetitive, noisy, loud, graded]
    acoustic_description: A shorter locally directed aggressive call than the main breeding advertisement, often produced during close social interactions.
    semantic_keywords: [territorial, aggression, attention]
    semantic_description: Used in close male-male encounters at calling sites.
    confidence: medium
    references: [li_hending_2024]
  - name: chuckle call
    alternative_names: [laughter call]
    acoustic_keywords: [repetitive, noisy, short, graded, broadband]
    acoustic_description: A shorter rough repeated call than the main advertisement croak, associated with locally elevated arousal.
    semantic_keywords: [territorial, aggression, attention]
    semantic_description: Used in local interactions among nearby calling males and in heightened chorus activity.
    confidence: medium
    references: [li_hending_2024]
  - name: release call
    acoustic_keywords: [short, abrupt, high_frequency, repetitive, noisy]
    acoustic_description: A brief high-intensity call emitted during unwanted clasping.
    semantic_keywords: [submission, attention, mating]
    semantic_description: Signals the need to terminate inappropriate amplexus or close contact.
    confidence: high
    references: [fedorova_shabanov_2023]
  - name: distress call
    acoustic_keywords: [high_frequency, short, abrupt, loud, noisy]
    acoustic_description: A sudden short high call acoustically distinct from the low resonant breeding repertoire.
    semantic_keywords: [distress, alarm, attention]
    semantic_description: Used in acute disturbance or handling situations.
    confidence: low
    references: [li_hending_2024]
