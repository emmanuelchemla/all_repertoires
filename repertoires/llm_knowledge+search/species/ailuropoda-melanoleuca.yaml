- name: copulation call
  alternative_names:
  - mating call
  scope:
    life_stages:
    - adult
    sexes:
    - male
    population_specific: false
    note: ''
  acoustic_keywords:
  - harmonic
  - repetitive
  - multi_component
  - loud
  acoustic_description: A stereotyped multi-note call with harmonic structure produced
    by males during intromission; acoustically distinct from bleats and moans produced
    before copulation.
  semantic_keywords:
  - mating
  - courtship
  - display
  semantic_description: Produced by males specifically during copulation; differentiates
    successful breeding encounters acoustically and may provide females with information
    about male identity or motivation.
  confidence: high
  references:
  - swaisgood_etal_2018
- name: roar
  acoustic_keywords:
  - low_frequency
  - loud
  - broadband
  - noisy
  - long
  acoustic_description: A prolonged, forceful low-frequency call with broad spectral
    energy; louder and more sustained than a bark or growl.
  semantic_keywords:
  - threat
  - aggression
  - alarm
  semantic_description: Produced in high-intensity agonistic contexts and during
    escalated confrontations; less common than barks or growls but reported in both
    captive and wild individuals.
  confidence: medium
  references:
  - swaisgood_etal_2018
- name: squawk
  alternative_names:
  - squall
  - croak
  scope:
    life_stages:
    - infant
    sexes:
    - unknown
    population_specific: false
    note: ''
  acoustic_keywords:
  - broadband
  - noisy
  - high_frequency
  - short
  - repetitive
  acoustic_description: A harsh broadband call produced by neonates; the squawk is
    rough-sounding, the squall is higher-pitched and more tonal, and the croak is
    pulsed — merged here as a graded infant-distress complex.
  semantic_keywords:
  - distress
  - begging
  - caregiving
  semantic_description: Emitted by neonatal and very young cubs; encompasses harsh
    squawks, high-pitched squalls, and pulsed croaks described in systematic studies
    of the infant repertoire.
  confidence: high
  references:
  - baotic_etal_2014
