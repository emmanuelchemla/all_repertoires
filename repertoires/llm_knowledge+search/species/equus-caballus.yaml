scientific_name: Equus caballus
common_name: Domestic Horse
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Mammalia
  order: Perissodactyla
  family: Equidae
  genus: Equus
  species: caballus
calls:
- name: whinny
  alternative_names:
  - neigh
  acoustic_keywords:
  - long
  - loud
  - multi_component
  - harmonic
  - frequency_modulated
  acoustic_description: A prolonged call combining low-frequency voiced energy with
    a higher whistle-like component, usually strongly modulated across the call.
  semantic_keywords:
  - contact
  - group_coordination
  - identity
  - attention
  semantic_description: Used to locate, regain, or maintain contact with conspecifics
    at distance and carries individually informative cues.
  confidence: high
  references:
  - lemasson_2009
  - briefer_2012
- name: nicker
  acoustic_keywords:
  - low_frequency
  - quiet
  - tonal
  - short
  - harmonic
  acoustic_description: A soft, low-pitched, brief call with relatively smooth harmonic
    structure and much lower amplitude than a whinny.
  semantic_keywords:
  - affiliation
  - contact
  - caregiving
  semantic_description: Common in friendly close-range interactions, including maternal,
    greeting, and anticipatory social contexts.
  confidence: high
  references:
  - briefer_2012
- name: squeal
  acoustic_keywords:
  - high_frequency
  - loud
  - noisy
  - abrupt
  - short
  acoustic_description: A sharp, high-pitched, intense call with abrupt onset and
    a harsher spectral quality than affiliative calls.
  semantic_keywords:
  - threat
  - aggression
  - submission
  - attention
  semantic_description: Produced in agonistic interactions, defensive reactions, or
    social tension, especially during close-range disputes.
  confidence: high
  references:
  - briefer_2012
- name: snort
  acoustic_keywords:
  - broadband
  - abrupt
  - short
  - pulsed
  acoustic_description: A short explosive exhalation with broad spectral energy and
    little tonal structure.
  semantic_keywords:
  - attention
  - alarm
  - group_coordination
  semantic_description: Often associated with elevated attention or arousal and may
    alert nearby horses to novelty or changed conditions.
  confidence: medium
  references:
  - briefer_2012
- name: blow
  acoustic_keywords:
  - broadband
  - quiet
  - short
  - pulsed
  acoustic_description: A shorter and softer expiratory sound than a snort, with broad
    spectral energy and limited harmonic structure.
  semantic_keywords:
  - attention
  - contact
  semantic_description: Used in attentive inspection and low-to-moderate arousal situations,
    often during investigation of nearby stimuli.
  confidence: medium
  references:
  - briefer_2012
- name: groan
  acoustic_keywords:
  - low_frequency
  - long
  - graded
  - tonal
  - quiet
  acoustic_description: A low sustained vocalization softer and less modulated than
    a whinny, often with strained or breathy quality.
  semantic_keywords:
  - distress
  - attention
  - submission
  semantic_description: Produced in discomfort, frustration, or close-range negative
    social interactions.
  confidence: medium
  references:
  - lemasson_2009
- name: roar
  acoustic_keywords:
  - low_frequency
  - loud
  - noisy
  - broadband
  - short
  acoustic_description: A low-pitched, loud, rough exhalatory vocalization with broadband
    spectral energy and little harmonic structure; acoustically distinct from the more
    tonal whinny.
  scope:
    life_stages:
    - adult
    sexes:
    - male
    population_specific: false
    note: ""
  semantic_keywords:
  - threat
  - aggression
  - territorial
  - mating
  semantic_description: Produced primarily by stallions in high-intensity agonistic
    contexts, such as rival encounters or when asserting dominance; also reported
    during courtship with mares.
  confidence: low
  references:
  - briefer_2012
- name: snore
  acoustic_keywords:
  - broadband
  - quiet
  - long
  - pulsed
  acoustic_description: A soft, sustained nasal sound produced during slow exhalation
    through the nostrils; lower amplitude and more continuous than a snort, with
    irregular low-frequency energy.
  semantic_keywords:
  - contact
  - affiliation
  semantic_description: Associated with relaxed or resting states; sometimes produced
    during dozing or sleep, and also observed in calm, positive-affect situations
    such as grooming or quiet grazing.
  confidence: low
  references:
  - briefer_2012
