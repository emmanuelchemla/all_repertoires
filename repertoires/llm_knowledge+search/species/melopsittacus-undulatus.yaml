calls:
- name: warble song
  acoustic_keywords:
  - multi_component
  - tonal
  - harmonic
  - repetitive
  - long
  acoustic_description: A variable song-like sequence of whistles and modulated syllables
    delivered in prolonged bouts.
  semantic_keywords:
  - courtship
  - mating
  - display
  - affiliation
  semantic_description: Used mainly in courtship and positive social display.
  confidence: high
- name: contact call
  acoustic_keywords:
  - short
  - tonal
  - harmonic
  - repetitive
  - loud
  acoustic_description: A brief, clear call with stable tonal structure used repeatedly
    during flock interactions.
  semantic_keywords:
  - contact
  - group_coordination
  - identity
  semantic_description: Maintains flock or pair contact and supports ongoing group
    cohesion.
  confidence: high
- name: chatter
  acoustic_keywords:
  - short
  - repetitive
  - multi_component
  - tonal
  - quiet
  acoustic_description: A rapid sequence of local social notes with less formal structure
    than warble song.
  semantic_keywords:
  - affiliation
  - contact
  - group_coordination
  semantic_description: Used in close-range routine flock interaction.
  confidence: medium
- name: screech
  acoustic_keywords:
  - high_frequency
  - loud
  - noisy
  - abrupt
  - short
  acoustic_description: A high-intensity harsh call with strong high-frequency energy
