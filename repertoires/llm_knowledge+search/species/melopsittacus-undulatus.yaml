  semantic_keywords:
  - play
  - identity
  - attention
  semantic_description: Produced during vocal development as practice that precedes
    stable adult-like learned vocal patterns.
  confidence: high
  references:
  - tu_etal_2011
- name: distress call
  acoustic_keywords:
  - high_frequency
  - loud
  - abrupt
  - short
  - noisy
  acoustic_description: A short, loud, abrupt call harsher than ordinary contact calls
    and associated with strong arousal.
  semantic_keywords:
  - alarm
  - distress
  - attention
  semantic_description: Produced during disturbance, handling, or acute threat.
  confidence: medium
  references:
  - budgerigar_vocal
- name: flight call
  acoustic_keywords:
  - high_frequency
  - short
  - repetitive
  - tonal
  - loud
  acoustic_description: A short repeated call given during flock flight, simpler than
    warble song and less harsh than screeching distress.
  semantic_keywords:
  - contact
  - group_coordination
  - attention
  semantic_description: Used to coordinate movement and maintain flock cohesion while
    airborne.
  confidence: medium
- name: alarm call
  alternative_names:
  - alarm note
  - warning call
  acoustic_keywords:
  - short
  - abrupt
  - high_frequency
  - tonal
  - loud
  acoustic_description: A short, sharp, relatively tonal call with abrupt onset, acoustically
    distinct from the broader-band screech; resembles a compressed contact call at
    higher intensity.
  semantic_keywords:
  - alarm
  - predator
  - attention
  semantic_description: Given in response to aerial or ground predators and other sudden
    disturbances; triggers rapid flock scanning or flight. Documented as a distinct
    element class in warble song analysis.
  confidence: medium
  references:
  - brockway_1964
  - sossinka_bohner_1980
- name: soft call
  alternative_names:
  - low-amplitude call
  - whisper call
  acoustic_keywords:
  - quiet
  - short
  - tonal
  - graded
  acoustic_description: A very low-amplitude, brief tonal note; one of the seven recognized
    warble-song element classes, acoustically similar to contact or harmonic calls
    but produced at greatly reduced intensity.
  semantic_keywords:
  - affiliation
  - contact
  - courtship
  semantic_description: Produced at close range during affiliative or courtship interactions;
    may function as an intimate contact or pair-bonding signal.
  confidence: medium
  references:
  - sossinka_bohner_1980
- name: click
  alternative_names:
  - broadband click
  - percussive note
  acoustic_keywords:
  - broadband
  - short
  - abrupt
  - noisy
  acoustic_description: A very brief (<10 ms), broadband percussive sound with noise-like
    spectral energy; one of the recognized element types in warble song spectral analysis.
  semantic_keywords:
  - courtship
  - display
  semantic_description: Occurs embedded within warble song bouts; exact communicative
    role is unclear but may contribute to song individuality or male display quality.
  confidence: low
  references:
  - sossinka_bohner_1980
- name: trill
  alternative_names:
  - excitement trill
  - rapid alternation call
  acoustic_keywords:
  - repetitive
  - tonal
  - short
  - frequency_modulated
  - loud
  acoustic_description: A rapid repetition of a brief tonal note or rapid alternation
    between two close frequencies, producing a buzzing or quivering acoustic texture;
    faster pulse rate than chatter.
  semantic_keywords:
  - affiliation
  - attention
  - play
  semantic_description: Produced during heightened social excitement, play interactions,
    or anticipatory arousal; often observed when birds are highly stimulated by companions
    or novel objects.
  confidence: medium
- name: purr
  alternative_names:
  - contentment murmur
  - soft murmur
  acoustic_keywords:
  - quiet
  - low_frequency
  - tonal
  - graded
  - repetitive
  acoustic_description: A low-pitched, rhythmically pulsed, soft sound with tonal
    quality; quieter and lower in frequency than typical contact calls; somewhat resembles
    a gentle continuous murmur.
  semantic_keywords:
  - affiliation
  - contact
  - caregiving
  semantic_description: Produced during close physical contact with a trusted companion
    or cage mate, particularly during mutual preening or resting; indicates high contentment
    and social bonding.
  confidence: low
- name: threat call
  alternative_names:
  - agonistic call
  - aggression call
  acoustic_keywords:
  - short
  - noisy
  - abrupt
  - high_frequency
  - loud
  acoustic_description: A short, harsh, noisy call with broadband energy; less sustained
    than a full screech but more abrupt and aperiodic than a contact call.
  semantic_keywords:
  - threat
  - aggression
  - territorial
  semantic_description: Produced during close-range agonistic encounters such as resource
    disputes over perch sites or food; females are more frequently observed producing
    this call than males in captive flocks.
  confidence: medium
  references:
  - brockway_1964
