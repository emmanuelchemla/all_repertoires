  semantic_keywords:
  - alarm
  - threat
  - attention
  semantic_description: Produced in disturbance or distress contexts requiring rapid
    attention from conspecifics.
  confidence: medium
- name: begging call
  acoustic_keywords:
  - high_frequency
  - repetitive
  - tonal
  - long
  - loud
  acoustic_description: Repeated higher-pitched tonal calls produced by young birds
    in persistent bouts.
  semantic_keywords:
  - begging
  - caregiving
  - food
  semantic_description: Used by nestlings or juveniles to solicit feeding and parental
    care.
  confidence: medium
  references:
  - budgerigar_vocal
- name: juvenile babbling
  alternative_names:
  - subsong-like babbling
  - juvenile vocal practice
  scope:
    life_stages:
    - juvenile
    sexes:
    - unknown
    population_specific: false
    note: ''
  acoustic_keywords:
  - quiet
  - multi_component
  - repetitive
  - graded
