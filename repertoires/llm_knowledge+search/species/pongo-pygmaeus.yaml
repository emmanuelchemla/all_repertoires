        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - high_frequency
      - short
      - abrupt
      - noisy
      - graded
    acoustic_description: A sharp, kiss-like intake sound made with pursed lips, sometimes modified by the hand, wrist, leaves, branches, or a tree surface.
    semantic_keywords:
      - alarm
      - predator
      - threat
      - attention
      - display
    semantic_description: Commonly produced toward predators, dangerous animals, observers, or other orangutans during annoyance, disturbance, and intimidation.
    confidence: high
    references:
      - hardus_etal_2008
      - deboer_etal_2015
      - lameira_etal_2022
      - smithsonian_orangutan

  - name: grumph
    scope: &adult_both
      life_stages:
        - adult
      sexes:
        - female
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - low_frequency
      - noisy
      - short
      - abrupt
      - graded
    acoustic_description: A short, low, belch-like inhalatory call that can occur singly or lead into broader guttural sequences.
    semantic_keywords:
      - threat
      - alarm
      - predator
      - aggression
      - display
    semantic_description: Produced by adolescent and adult orangutans during disturbance, annoyance, intimidation, and some fighting or copulation contexts.
    confidence: high
    references:
      - hardus_etal_2008
      - uzh_call_repertoire

  - name: gorkum
    alternative_names:
      - grumph-rolling sequence
    scope: *adult_both
    acoustic_keywords:
      - low_frequency
      - noisy
      - repetitive
      - pulsed
      - multi_component
      - graded
    acoustic_description: A bout of low guttural grumph-like elements alternating with rolling-call elements, often with throat-pouch involvement.
    semantic_keywords:
      - threat
      - alarm
      - predator
      - aggression
      - display
    semantic_description: Used in disturbance and intimidation toward predators, dangerous animals, observers, and other orangutans; boundaries with related calls are graded.
    confidence: medium
    references:
      - hardus_etal_2008
      - uzh_call_repertoire

  - name: rolling call
    scope: *adult_both
    acoustic_keywords:
      - low_frequency
      - noisy
      - repetitive
      - pulsed
      - graded
    acoustic_description: A series of low rolling guttural units resembling grumble elements, sometimes embedded in longer display sequences.
    semantic_keywords:
      - threat
      - aggression
      - display
      - alarm
    semantic_description: Given by males and females during intimidation displays, fights, or as a component following or accompanying kiss squeaks and gorkums.
    confidence: medium
    references:
      - hardus_etal_2008
      - uzh_call_repertoire

  - name: complex call
    scope: *adult_both
    acoustic_keywords:
      - low_frequency
      - noisy
      - repetitive
      - multi_component
      - long
      - graded
    acoustic_description: A long string of guttural elements in which bark, ahoor, grumph, gorkum, and rolling-call components may merge or alternate.
    semantic_keywords:
      - threat
      - aggression
      - display
      - alarm
    semantic_description: Produced in vigorous intimidation or high-arousal agonistic contexts; call boundaries are uncertain because components transform into one another.
    confidence: medium
    references:
      - hardus_etal_2008
      - uzh_call_repertoire

  - name: bark
    scope: *adult_both
    acoustic_keywords:
      - broadband
      - noisy
      - short
      - abrupt
      - loud
    acoustic_description: A single sharp, cough-like exhalation, usually brief and loud.
    semantic_keywords:
      - threat
      - alarm
      - aggression
      - attention
    semantic_description: Heard during sudden disturbance or fighting situations and may precede kiss squeaks, grumphs, gorkums, or other display calls.
    confidence: medium
    references:
      - hardus_etal_2008
      - uzh_call_repertoire

