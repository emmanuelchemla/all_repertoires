      - loud
      - multi_component
    acoustic_description: A short inhaled gasp followed by an explosive exhalatory grunt, sometimes occurring in bouts or between other display elements.
    semantic_keywords:
      - threat
      - aggression
      - submission
      - display
    semantic_description: A threatening or fight-associated sound described especially from males, including subordinate individuals during conflict.
    confidence: medium
    references:
      - hardus_etal_2008
      - uzh_call_repertoire

  - name: grumble
    scope: *adult_both
