        - adult
      sexes:
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - low_frequency
      - long
      - loud
      - repetitive
      - pulsed
      - multi_component
      - graded
    acoustic_description: A far-carrying sequence with low grumbling introduction, louder pulse-like climax elements, and a bubbling or sighing tail-off.
    semantic_keywords:
      - spacing
      - territorial
      - courtship
      - mating
      - identity
    semantic_description: Used mainly by flanged males to advertise presence, space with other males, and attract or coordinate with sexually receptive females.
    confidence: high
    references:
      - hardus_etal_2008
      - adw_pongo_pygmaeus
      - smithsonian_orangutan

  - name: fast long call
    scope: *adult_male
    acoustic_keywords:
      - low_frequency
      - loud
      - repetitive
      - pulsed
      - multi_component
      - graded
    acoustic_description: A shorter, faster sequence of ahoor-like pulse units that may include bubbling elements and resembles an accelerated long call.
    semantic_keywords:
      - threat
      - aggression
      - display
      - attention
    semantic_description: Given by disturbed flanged males, especially toward observers or in close-range disturbance contexts.
    confidence: medium
    references:
      - hardus_etal_2008
      - uzh_call_repertoire

  - name: kiss squeak
    alternative_names:
      - classic kiss squeak
      - hand-assisted kiss squeak
      - leaf-assisted kiss squeak
    scope: &all_ages_both
      life_stages:
        - infant
        - juvenile
        - adult
      sexes:
