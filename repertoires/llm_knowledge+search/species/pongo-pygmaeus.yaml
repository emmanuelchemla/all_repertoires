    semantic_keywords:
      - display
      - threat
      - aggression
      - courtship
      - mating
    semantic_description: Most common as the introductory part of male long calls but also occurs during disturbance, male confrontations, and some copulation contexts.
    confidence: high
    references:
      - hardus_etal_2008
      - uzh_call_repertoire

