    doi: 10.1371/journal.pone.0025010

  flower_2011:
    citation: >
      Flower, T. P. (2011). Fork-tailed drongos use deceptive mimicked alarm
      calls to steal food. Proceedings of the Royal Society B: Biological
      Sciences, 278(1711), 1548-1555.
    doi: 10.1098/rspb.2010.1932

