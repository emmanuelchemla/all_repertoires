    doi: 10.1016/j.cub.2006.07.053

  radford_ridley_2007:
    citation: >
      Radford, A. N., & Ridley, A. R. (2007). Individuals in foraging groups
      may use vocal cues when assessing their need for personal vigilance.
      Biology Letters, 3(3), 249-252.

  radford_ridley_2008:
    citation: >
      Radford, A. N., & Ridley, A. R. (2008). Close calling regulates spacing
