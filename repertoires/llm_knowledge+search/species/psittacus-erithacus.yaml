scientific_name: Psittacus erithacus
common_name: Grey Parrot
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Aves
  order: Psittaciformes
  family: Psittacidae
  genus: Psittacus
  species: erithacus
calls:
- name: contact whistle
  acoustic_keywords:
  - tonal
  - harmonic
  - frequency_modulated
  - long
  - loud
  acoustic_description: A clear tonal whistle with strong modulation and individually
    distinctive structure.
  semantic_keywords:
  - contact
  - group_coordination
  - identity
  semantic_description: Used to maintain contact and social cohesion within mobile
    flocks and carries strong individual signature information.
  confidence: high
  references:
  - boucherie_2023
  - may_2004
- name: chatter
  acoustic_keywords:
  - short
  - repetitive
  - multi_component
  - tonal
  - noisy
  acoustic_description: A rapid series of short notes forming social chatter, often
    more locally directed and variable than long whistles.
  semantic_keywords:
  - affiliation
  - contact
  - group_coordination
  semantic_description: Used in routine social interaction and local flock coordination.
  confidence: medium
  references:
  - may_2004
- name: alarm screech
  acoustic_keywords:
  - loud
  - high_frequency
  - noisy
  - abrupt
  - repetitive
  acoustic_description: A loud harsh call with strong high-frequency energy and abrupt
    delivery.
  semantic_keywords:
  - alarm
  - threat
  - attention
  semantic_description: Produced in disturbance or danger contexts to rapidly alert
    nearby conspecifics.
  confidence: medium
  references:
  - may_2004
- name: distress scream
  acoustic_keywords:
  - loud
  - high_frequency
  - noisy
  - abrupt
  - short
  acoustic_description: A very loud harsh scream with abrupt onset and little tonal
    stability, acoustically more extreme than routine alarm or contact whistles.
  semantic_keywords:
  - distress
  - alarm
  - attention
  semantic_description: Produced in acute danger, capture, or extreme arousal contexts
    where birds signal immediate need and may recruit social attention.
  confidence: medium
  references:
  - giret_etal_2011
- name: protest call
  alternative_names:
  - protestation call
  - agonistic protest vocalization
  acoustic_keywords:
  - noisy
  - abrupt
  - repetitive
  - low_frequency
  acoustic_description: A rougher, lower-pitched protest note or short series with
    abrupt delivery and less clear harmonic structure than contact whistles.
  semantic_keywords:
  - aggression
  - threat
  - spacing
  - attention
  semantic_description: Used in agonistic or refusal contexts, including social conflict,
    displacement, or resisting unwanted approach.
  confidence: low
  references:
  - giret_etal_2011
- name: mimicry sequence
  acoustic_keywords:
  - multi_component
  - tonal
  - frequency_modulated
  - repetitive
  - long
  acoustic_description: A learned sequence incorporating imitated heterospecific or
    environmental sounds into the bird's vocal output.
  semantic_keywords:
  - identity
  - display
  - attention
  semantic_description: Included as a socially relevant learned vocal category because
    wild grey parrots can imitate heterospecific sounds and such learned signals may
    contribute to social display or identity.
  confidence: medium
  references:
  - bradbury_2004
- name: flight call
  acoustic_keywords:
  - high_frequency
  - short
  - loud
  - repetitive
  - noisy
  acoustic_description: A loud repeated call given during flight, less varied than
    mimicry sequences and more carrying than local chatter.
  semantic_keywords:
  - contact
  - group_coordination
  - attention
  semantic_description: Used to maintain contact and coordinate flock or pair movement
    while airborne.
  confidence: medium
  references:
  - pepperberg_1999
- name: begging call
  scope:
    life_stages:
    - juvenile
    sexes:
    - unknown
    population_specific: false
    note: ''
  acoustic_keywords:
  - high_frequency
  - short
  - repetitive
  - loud
  - graded
  acoustic_description: A repeated solicitation call produced by dependent young.
  semantic_keywords:
  - begging
  - caregiving
  - attention
  semantic_description: Used by juveniles to solicit feeding and care from adults.
  confidence: medium
  references:
  - pepperberg_1999
- name: preflight call
  alternative_names:
  - pre-flight call
  - departure call
  acoustic_keywords:
  - short
  - loud
  - repetitive
  - tonal
  acoustic_description: A short loud call given immediately before or during the initiation
    of flight, often repeated in quick succession by departing birds.
  semantic_keywords:
  - group_coordination
  - contact
  - attention
  semantic_description: Signals imminent departure and synchronises flock take-off,
    allowing other individuals to prepare for or join a flight movement.
  confidence: medium
  references:
  - giret_etal_2011
- name: pair duet
  alternative_names:
  - duet call
  - antiphonal duet
  acoustic_keywords:
  - tonal
  - frequency_modulated
  - multi_component
  - repetitive
  acoustic_description: Coordinated antiphonal vocalisations exchanged between paired
    birds, with each partner producing complementary phrases that interlock into a
    composite sequence.
  semantic_keywords:
  - affiliation
  - mating
  - identity
  - group_coordination
  semantic_description: Produced during pair-bonding interactions to reinforce the
    pair bond, coordinate activities between mates, and signal pair status.
  confidence: medium
  references:
  - giret_etal_2011
- name: rambling vocalization
  alternative_names:
  - rambling call
  - soliloquy vocalization
  acoustic_keywords:
  - long
  - multi_component
  - tonal
  - frequency_modulated
  - quiet
  acoustic_description: A long loosely structured sequence of varied notes and phrases
    produced at low amplitude, lacking the stereotypy of contact whistles; often includes
    transitions between note types and sub-song-like passages.
  semantic_keywords:
  - play
  - display
  - affiliation
  semantic_description: Produced in relaxed, undisturbed conditions, often when the
    bird is resting or mildly exploring; possibly functions in vocal practice, social
    bonding, or low-level contact maintenance.
  confidence: low
  references:
  - giret_etal_2011
- name: asking call
  alternative_names:
  - solicitation call
  - request vocalization
  acoustic_keywords:
  - short
  - repetitive
  - tonal
  - graded
  acoustic_description: A relatively soft, repeated call with graded structure used
    when an individual directs attention toward a social partner or resource, acoustically
    distinct from the louder alarm or distress screams.
  semantic_keywords:
  - begging
  - food
  - attention
  - affiliation
  semantic_description: Emitted when a bird seeks something from a social partner,
    such as food, attention, or access; documented in captive contexts but plausibly
    homologous to solicitation calls observed in wild flocks.
  confidence: low
  references:
  - giret_etal_2011
