- name: subsong
  alternative_names:
  - plastic song
  - juvenile song
  scope:
    life_stages:
    - juvenile
    sexes:
    - male
    population_specific: false
    note: ''
  acoustic_keywords:
  - quiet
  - frequency_modulated
  - long
  - multi_component
  - graded
  acoustic_description: Soft, poorly structured, variable vocalization with loosely
    organised syllables and frequent hesitations; louder and more stereotyped plastic-song
    phase follows before crystallisation into adult song.
  semantic_keywords:
  - display
  semantic_description: Produced by juvenile males during sensorimotor vocal learning;
    represents practice vocalisation prior to crystallisation of adult song.
  confidence: high
  references:
  - brainard_doupe_2002
- name: aggressive call
  alternative_names:
  - threat call
  - territorial call
  acoustic_keywords:
  - short
  - abrupt
  - broadband
  - loud
  acoustic_description: Short, harsh or raspy notes that are acoustically distinct
    from the tonal contact twitter; more broadband and abrupt in structure.
  semantic_keywords:
  - aggression
  - threat
  - territorial
  semantic_description: Given during close-range aggressive encounters such as competition
    for perch sites, food resources, or territory boundaries; overlapping song by
    a rival male can also function as an aggressive signal.
  confidence: low
  references:
  - biorxiv_singing_2025
- name: distress call
  acoustic_keywords:
  - loud
  - high_frequency
  - repetitive
  - abrupt
  acoustic_description: Loud, urgent, high-pitched notes repeated at rapid rate;
    distinct from the quieter routine contact twitter.
  semantic_keywords:
  - distress
  - alarm
  - attention
  semantic_description: Produced when a bird is handled, restrained, or under acute
    stress; may alert conspecifics to immediate danger or physical distress.
  confidence: low
