scientific_name: Crocuta crocuta
common_name: Spotted Hyena
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Mammalia
  order: Carnivora
  family: Hyaenidae
  genus: Crocuta
  species: crocuta
calls:
- name: whoop
  acoustic_keywords:
  - loud
  - long
  - harmonic
  - frequency_modulated
  - repetitive
  acoustic_description: A far-carrying call with strong tonal structure and repeated
    rising or wavering elements.
  semantic_keywords:
  - contact
  - group_coordination
  - territorial
  - identity
  semantic_description: Used for long-distance contact, spacing, and social coordination
    among clan members.
  confidence: high
- name: giggle
  acoustic_keywords:
  - high_frequency
  - repetitive
  - noisy
  - short
  - graded
  acoustic_description: A rapid sequence of high-pitched notes with excited or submissive
    quality.
  semantic_keywords:
  - submission
  - distress
  - attention
  semantic_description: Produced in social excitement, feeding competition, and submissive
    situations.
  confidence: high
- name: growl
  acoustic_keywords:
  - low_frequency
  - noisy
  - broadband
  - long
  - graded
  acoustic_description: A rough low call with strong noisy energy and threat-like
    quality.
  semantic_keywords:
  - threat
  - aggression
  - attention
  semantic_description: Used in close-range warning and competitive interactions.
  confidence: medium
- name: grunt
  acoustic_keywords:
  - low_frequency
  - short
  - tonal
  - repetitive
  - graded
  acoustic_description: A shorter lower-intensity call than whoops or growls.
  semantic_keywords:
  - contact
  - affiliation
  - attention
  semantic_description: Used in ordinary close social communication.
  confidence: medium
- name: lowing call
  acoustic_keywords:
  - low_frequency
  - long
  - tonal
  - graded
  - harmonic
  acoustic_description: A lower, more sustained social call than a whoop, with smoother
    tonal structure.
  semantic_keywords:
  - contact
  - affiliation
  - attention
  semantic_description: Used in closer social communication and low-arousal group
    interaction.
  confidence: low
- name: greeting grunt
  acoustic_keywords:
  - low_frequency
  - short
  - quiet
  - repetitive
  - graded
  acoustic_description: A low repeated grunt softer than a whoop and less noisy than
    a giggle.
  semantic_keywords:
  - affiliation
  - contact
  - attention
  semantic_description: Used in close-range greeting and affiliation, especially during
    reunion or tolerant approach.
  confidence: medium
- name: scream
  acoustic_keywords:
  - high_frequency
  - loud
  - noisy
  - long
  - graded
  acoustic_description: A high intense harsh call, more piercing and distress-like
    than the laughter-like giggle.
  semantic_keywords:
  - distress
  - submission
  - attention
  semantic_description: Produced in severe attack, panic, or high-conflict situations
    as an acute distress signal.
  confidence: medium
- name: fast whoop
  alternative_names:
  - rapid whoop
  acoustic_keywords:
  - loud
  - harmonic
  - frequency_modulated
  - repetitive
  - high_frequency
  acoustic_description: Similar in structure to the whoop but produced at higher pitch
    and with shorter inter-note intervals; a more compressed, rapid bout of tonal
    frequency-modulated notes.
  semantic_keywords:
  - group_coordination
  - aggression
  - recruitment
  semantic_description: Produced just before a coordinated attack on lions or rival
    hyenas over a kill; used within the clan to rally clan members into immediate
    collective action.
  confidence: medium
- name: groan
  alternative_names:
  - greeting groan
  - den groan
  acoustic_keywords:
  - low_frequency
  - tonal
  - short
  - quiet
  - harmonic
  acoustic_description: A low, smooth tonal call with a rounded "ooo" quality, softer
    and more harmonic than a growl and shorter than a whoop.
  semantic_keywords:
  - affiliation
  - contact
  - caregiving
  semantic_description: Used in friendly close-range greetings among clan members
    and by adults greeting cubs at the den; distinct from the agonistic growl.
  confidence: medium
- name: yell
  alternative_names:
  - defensive yell
  semantic_keywords:
  - submission
  - distress
  - alarm
  acoustic_keywords:
  - high_frequency
  - loud
  - noisy
  - abrupt
  - broadband
  acoustic_description: A sharp, loud, harsh broadband call of brief to moderate duration,
    higher in pitch than a growl and more abrupt than a scream.
  semantic_description: Produced when a hyena submits to a dominant individual or
    flees from danger; a defensive distress signal in high-threat encounters.
  confidence: medium
- name: squitter
  alternative_names:
  - cub squeal
  - nursing squeal
  acoustic_keywords:
  - high_frequency
  - noisy
  - repetitive
  - short
  - loud
  acoustic_description: A harsh grating squeal repeated in rapid succession; high
    pitched with strong noisy components, similar to a squeak but more strident.
  semantic_keywords:
  - begging
  - caregiving
  - distress
  semantic_description: Produced primarily by cubs demanding to nurse from the mother;
    also used by juveniles and occasionally adults after reuniting with a clan member.
  confidence: medium
- name: alarm rumble
  alternative_names:
  - alarm call
  acoustic_keywords:
  - low_frequency
  - tonal
  - short
  - graded
  acoustic_description: A low rumbling call of moderate intensity, lower and less
    strident than a growl; graded toward grunts at low arousal and toward louder
    calls at higher arousal.
  semantic_keywords:
  - alarm
  - predator
  - group_coordination
  semantic_description: Used to signal approaching danger such as rival clans or
    predators; alerts nearby group members to a potential threat.
  confidence: low
