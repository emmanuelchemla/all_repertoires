scientific_name: Poecile carolinensis
common_name: Carolina Chickadee
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Aves
  order: Passeriformes
  family: Paridae
  genus: Poecile
  species: carolinensis
calls:
  - name: chick-a-dee call
    alternative_names:
      - chickadee call
      - A-B-C-D call
    acoustic_keywords:
      - repetitive
      - multi_component
      - tonal
      - noisy
      - graded
    acoustic_description: Structurally complex call assembled from several note types, commonly including introductory higher notes and lower harsher terminal dee notes in variable sequences.
    semantic_keywords:
      - contact
      - group_coordination
      - alarm
      - attention
      - combinatorial
    semantic_description: Flexible everyday social call used in flock cohesion, coordination, monitoring of flockmates, and threat-related signaling.
    confidence: high
    references:
      - freeberg_2008
      - hatti_1985
  - name: fee-bee song
    alternative_names:
      - four-note whistle
      - advertising song
    scope:
      life_stages:
        - adult
      sexes:
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - tonal
      - repetitive
      - loud
      - short
    acoustic_description: Clear whistled phrases, often rendered as fee-bee or fee-bee-fee-bay patterns, with simple tonal notes repeated in stereotyped order.
    semantic_keywords:
      - territorial
      - courtship
      - mating
      - identity
    semantic_description: Adult male advertisement signal used in territory defense and mate attraction, especially in the breeding season.
    confidence: high
    references:
      - allaboutbirds_carolina
      - soha_2010
  - name: high see call
    alternative_names:
      - seee
      - high zee
    acoustic_keywords:
      - high_frequency
      - tonal
      - short
      - quiet
    acoustic_description: Very high-pitched thin narrow-band notes, typically brief and less harsh than chick-a-dee calls.
    semantic_keywords:
      - alarm
      - predator
      - attention
    semantic_description: Associated especially with aerial predator warning and rapid alerting of nearby flockmates.
    confidence: high
    references:
      - allaboutbirds_carolina
      - hatti_1985
  - name: gargle call
    alternative_names:
      - gargle
      - agonistic gargle
    acoustic_keywords:
      - noisy
      - broadband
      - repetitive
      - abrupt
      - loud
    acoustic_description: Rapid rough gurgling or raspy note strings with a noisy quality distinct from the clearer whistled song.
    semantic_keywords:
      - aggression
      - threat
      - spacing
      - attention
    semantic_description: Commonly linked to close social tension, agonistic encounters, and assertive spacing among individuals.
    confidence: medium
    references:
      - allaboutbirds_carolina
      - hatti_1985
  - name: nest hiss
    alternative_names:
      - hissing display
    scope:
      life_stages:
        - adult
      sexes:
        - female
      population_specific: false
      note: ""
    acoustic_keywords:
      - broadband
      - noisy
      - abrupt
      - loud
      - short
    acoustic_description: Explosive hiss-like sound lacking the clear tonal structure of song or the discrete note patterning of chick-a-dee calls.
    semantic_keywords:
      - threat
      - attention
    semantic_description: Produced by an incubating female at the nest when an intruder approaches the cavity, as part of a close-range defensive display.
    confidence: high
    references:
      - allaboutbirds_carolina
  - name: begging call
    scope:
      life_stages:
        - juvenile
      sexes:
        - unknown
      population_specific: false
      note: ""
    acoustic_keywords:
      - high_frequency
      - repetitive
      - loud
      - short
      - graded
    acoustic_description: Persistent thin solicitation calls from young birds, typically more insistent than adult social notes.
    semantic_keywords:
      - begging
      - caregiving
      - attention
    semantic_description: Produced by dependent young to solicit provisioning and care.
    confidence: medium
    references:
      - allaboutbirds_carolina
  - name: lisping tee
    alternative_names:
      - tee call
      - flight tee
    acoustic_keywords:
      - high_frequency
      - tonal
      - short
      - frequency_modulated
    acoustic_description: A brief note with a strong descending frequency sweep (chevron contour), producing a lisping or high thin quality; typically given as a single note.
    semantic_keywords:
      - contact
      - group_coordination
    semantic_description: Given mostly in flight, likely functioning as an in-flight contact or cohesion signal among flock members.
    confidence: medium
    references:
      - smith_1972
      - birdsoftheworld_carchi
  - name: tseet call
    alternative_names:
      - see call
      - high see variant
    acoustic_keywords:
      - high_frequency
      - tonal
      - short
      - abrupt
    acoustic_description: Very short pure-tone notes (typically < 50 ms) at high frequency (5–9 kHz), often chevron-shaped but variable; given singly and well spaced from other vocalizations.
    semantic_keywords:
      - contact
      - attention
    semantic_description: Produced by individuals in a variety of low-urgency contexts; exact function not fully resolved but likely serves general contact or attention signaling.
    confidence: medium
    references:
      - smith_1972
  - name: chip call
    alternative_names:
      - chip note
      - sharp chip
    acoustic_keywords:
      - broadband
      - abrupt
      - short
      - loud
    acoustic_description: A short, sharp broadband note given in series of 3–6 at high amplitude; acoustically distinct from the drawn-out notes of the chick-a-dee complex.
    semantic_keywords:
      - alarm
      - attention
      - contact
    semantic_description: Associated with mild alertness and general arousal; may be used to draw attention or signal disturbance without a full chick-a-dee alarm sequence.
    confidence: medium
    references:
      - smith_1972
      - birdsoftheworld_carchi
  - name: soft dee
    alternative_names:
      - quiet dee
    scope:
      life_stages:
        - adult
      sexes:
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - tonal
      - quiet
      - short
      - repetitive
    acoustic_description: Soft, low-amplitude dee-type notes produced quietly near the nest, lacking the full intensity of the typical chick-a-dee call complex.
    semantic_keywords:
      - contact
      - affiliation
      - caregiving
    semantic_description: Given by males near the nest cavity; thought to function in pair coordination and low-disturbance communication at close range during the nesting period.
    confidence: medium
    references:
      - birdsoftheworld_carchi
  - name: broken dee
    scope:
      life_stages:
        - infant
      sexes:
        - unknown
      population_specific: false
      note: ""
    acoustic_keywords:
      - noisy
      - short
      - repetitive
      - graded
    acoustic_description: Irregular, broken dee-like notes produced by nestlings; acoustically less structured than the adult dee notes of the chick-a-dee call.
    semantic_keywords:
      - begging
      - caregiving
      - contact
    semantic_description: Produced by nestlings in the nest cavity; likely functions to signal presence and elicit parental provisioning.
    confidence: low
    references:
      - birdsoftheworld_carchi
  - name: variable see or gargle pre-copulation call
    alternative_names:
      - copulation gargle
      - pre-copulatory see
    scope:
      life_stages:
        - adult
      sexes:
        - unknown
      population_specific: false
      note: ""
    acoustic_keywords:
      - frequency_modulated
      - noisy
      - short
      - graded
    acoustic_description: A variable mix of see-type and gargle elements, acoustically intermediate between the clean high see alarm and the full agonistic gargle; produced in close proximity between pair members.
    semantic_keywords:
      - courtship
      - mating
      - affiliation
    semantic_description: Produced near the nest cavity in the context preceding copulation; likely functions as a close-range pair bonding or solicitation signal.
    confidence: low
    references:
      - birdsoftheworld_carchi
      - smith_1972
