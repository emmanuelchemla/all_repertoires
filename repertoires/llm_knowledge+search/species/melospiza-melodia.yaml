scientific_name: Melospiza melodia
common_name: Song Sparrow
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Aves
  order: Passeriformes
  family: Passerellidae
  genus: Melospiza
  species: melodia
calls:
- name: song
  acoustic_keywords:
  - tonal
  - harmonic
  - multi_component
  - repetitive
  - long
  acoustic_description: A structured learned song composed of repeated syllable sequences
    and distinctive phrase patterns.
  semantic_keywords:
  - territorial
  - courtship
  - mating
  - identity
  - display
  semantic_description: Used in territory advertisement, mate attraction, and male
    display.
  confidence: high
- name: chip call
  acoustic_keywords:
  - short
  - abrupt
  - tonal
  - repetitive
  acoustic_description: A brief, sharply delivered call with simple structure and
    clear onset.
  semantic_keywords:
  - contact
  - attention
  - alarm
  semantic_description: Used as a common everyday call and in heightened attention
    or mild disturbance contexts.
  confidence: medium
- name: tseet call
  acoustic_keywords:
  - high_frequency
  - tonal
  - short
  - loud
  acoustic_description: A thinner, higher-pitched call than the chip, with a narrowband
    tonal quality.
  semantic_keywords:
  - alarm
  - attention
  - predator
  semantic_description: Used in more urgent alarm or high-alert situations.
  confidence: medium
- name: flight call
  acoustic_keywords:
  - short
  - tonal
  - frequency_modulated
  - repetitive
  acoustic_description: A brief call given in movement contexts, generally simple
    and suited to short-range contact.
  semantic_keywords:
  - contact
  - group_coordination
  - attention
  semantic_description: Helps coordinate movement or maintain awareness during short-range
    displacement.
  confidence: low
- name: whinny call
  acoustic_keywords:
  - tonal
  - frequency_modulated
  - long
  - harmonic
  - graded
  acoustic_description: A more drawn-out and smoothly modulated call than the simple
    chip or tseet notes.
  semantic_keywords:
  - contact
  - affiliation
  - attention
  semantic_description: Used in low-intensity social interaction and routine communication.
  confidence: medium
- name: begging call
  scope:
    life_stages:
    - juvenile
    sexes:
    - unknown
    population_specific: false
    note: ''
  acoustic_keywords:
  - high_frequency
  - short
  - repetitive
  - loud
  - graded
  acoustic_description: A repeated thin solicitation call given by dependent young.
  semantic_keywords:
  - begging
  - caregiving
  - attention
  semantic_description: Used by nestlings or fledglings to obtain food and parental
    attention.
  confidence: medium
- name: distress call
  acoustic_keywords:
  - high_frequency
  - loud
  - noisy
  - long
  - graded
  acoustic_description: A strained high call harsher than routine chip or flight calls.
  semantic_keywords:
  - distress
  - attention
  semantic_description: Produced during handling, attack, or acute agitation.
  confidence: medium
- name: soft song
  alternative_names:
  - quiet song
  - low-amplitude song
  scope:
    life_stages:
    - adult
    sexes:
    - male
    population_specific: false
    note: ''
  acoustic_keywords:
  - quiet
  - tonal
  - multi_component
  - long
  acoustic_description: A full-structure song delivered at very low amplitude, acoustically
    similar to broadcast song but barely audible beyond a few metres; shares syllable
    types with the male's normal song repertoire.
  semantic_keywords:
  - aggression
  - threat
  - territorial
  semantic_description: A reliable close-range signal of aggressive intent; males
    produce soft song just before or during an attack on a rival and it predicts subsequent
    physical attack better than broadcast song.
  confidence: high
  references:
  - anderson_2009
  - peake_etal_2012
- name: chatter call
  alternative_names:
  - caterwaul
  - female chatter
  scope:
    life_stages:
    - adult
    sexes:
    - female
    population_specific: false
    note: ''
  acoustic_keywords:
  - noisy
  - repetitive
  - short
  - multi_component
  acoustic_description: A rapid burst of harsh, nasal notes lasting up to about 6
    seconds, delivered in a chattering or scolding quality.
  semantic_keywords:
  - aggression
  - threat
  - territorial
  - identity
  semantic_description: Produced primarily by females in response to male intrusions
    during nest-building, to rival females, or as an identity announcement; also given
    following a male pounce.
  confidence: medium
- name: tchunk call
  alternative_names:
  - chunk call
  - low chip
  scope:
    life_stages:
    - adult
    sexes:
    - unknown
    population_specific: false
    note: ''
  acoustic_keywords:
  - low_frequency
  - short
  - abrupt
  - broadband
  acoustic_description: A low-pitched, emphatic single note with a chunky or clunking
    quality, lower and fuller than the high chip or tseet calls.
  semantic_keywords:
  - alarm
  - predator
  - attention
  semantic_description: Given in response to ground predators, humans approaching
    the nest, or fledglings; represents a lower-urgency alarm class than the high
    tseet.
  confidence: medium
- name: subsong
  alternative_names:
  - plastic song
  - juvenile warble
  scope:
    life_stages:
    - juvenile
    sexes:
    - male
    population_specific: false
    note: ''
  acoustic_keywords:
  - quiet
  - tonal
  - long
  - graded
  - multi_component
  acoustic_description: Soft, rambling, largely unstructured warble delivered at low
    amplitude; syllable types are variable and partly unrecognizable compared with
    adult song, progressing through plastic stages toward crystallized adult form.
  semantic_keywords:
  - display
  - identity
  semantic_description: Developmental vocalization produced by juvenile males during
    song learning; sung quietly from concealed perches while motor patterns consolidate
    prior to song crystallization.
  confidence: high
  references:
  - marler_etal_1962
- name: location call
  alternative_names:
  - nestling contact call
  scope:
    life_stages:
    - infant
    - juvenile
    sexes:
    - unknown
    population_specific: false
    note: ''
  acoustic_keywords:
  - short
  - tonal
  - high_frequency
  - repetitive
  acoustic_description: A thin, high-pitched single note repeated at regular intervals;
    simpler and less strained than begging calls, and softer than distress screams.
  semantic_keywords:
  - contact
  - group_coordination
  - attention
  semantic_description: Produced by nestlings from about day 9 and by fledglings to
    maintain acoustic contact with parents and siblings; distinct from food-begging
    calls which escalate in amplitude with hunger.
  confidence: medium
