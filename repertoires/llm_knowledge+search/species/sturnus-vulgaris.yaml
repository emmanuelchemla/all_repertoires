    - unknown
    population_specific: false
    note: ''
  acoustic_keywords:
  - high_frequency
  - repetitive
  - noisy
  - loud
  - frequency_modulated
  acoustic_description: Persistent, high-pitched, broad-bandwidth calls with noisy
