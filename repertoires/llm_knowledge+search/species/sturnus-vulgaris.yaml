  - danger call
  - warning call
  acoustic_keywords:
  - short
  - abrupt
  - noisy
  - repetitive
  - loud
  acoustic_description: A harsher abrupt call distinct from song and rattle sequences,
    typically broadband with steep onset.
  semantic_keywords:
  - alarm
  - attention
  - predator
  semantic_description: Produced in response to predators or sudden disturbance; causes
    conspecifics to take flight or freeze.
  confidence: medium
  references:
  - feare_1984
