- name: subsong
  alternative_names:
  - juvenile practice song
  - plastic song
  scope:
    life_stages:
    - juvenile
    sexes:
    - male
    population_specific: false
    note: ''
  acoustic_keywords:
  - quiet
  - multi_component
  - long
  - noisy
  - tonal
  - frequency_modulated
  acoustic_description: A low-amplitude, highly variable and disorganized vocalization
    resembling a murmured version of adult warbling song; basic note groupings into
    motifs are present from the start but structure is initially very variable, crystallizing
    gradually over several months.
  semantic_keywords:
  - play
  - identity
  - display
  semantic_description: A motor-rehearsal phase of vocal learning in young males starting
    around 3 months of age; not directed at specific receivers; precedes crystallization
    of the adult warbling song and whistled song.
  confidence: high
  references:
  - hausberger_etal_1988
- name: roost assembly call
  alternative_names:
  - pre-roost call
  - flock gathering call
  scope:
    life_stages:
    - adult
    sexes:
    - unknown
    population_specific: false
    note: ''
  acoustic_keywords:
  - repetitive
  - loud
  - multi_component
  - short
  acoustic_description: A mix of chatter and short calls produced by individuals in
    pre-roost aggregations; collectively creates a persistent roar or hum from the
    flock. Individual-level calls are similar to flock contact and chatter notes.
  semantic_keywords:
  - group_coordination
  - contact
  - recruitment
  semantic_description: Produced by starlings assembling at staging areas before roosting;
    thought to facilitate coordination of when and where to enter the roost.
  confidence: low
  references:
  - feare_1984
