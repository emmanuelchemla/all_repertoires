- name: warble
  alternative_names:
  - warble vocalization
  - heterotypic multi-element call
  acoustic_keywords:
  - multi_component
  - long
  - frequency_modulated
  - tonal
  - quiet
  - graded
  acoustic_description: A complex sequence of diverse heterotypic elements (different
    note types concatenated), producing a varied melodic run. Contrasts with the homotypic
    'peach' call which repeats a single element type. Duration is longer than most
    discrete calls and spectral content varies across elements within the sequence.
  semantic_keywords:
  - courtship
  - affiliation
  - display
  - identity
  semantic_description: Produced in close-range social and pair-bonding contexts;
    used in aggressive interactions between pairs and in social decisions. Warble repertoire
    size and length may signal individual quality and are used by conspecifics when
    making social choices.
  confidence: medium
  references:
  - bradbury_etal_2001
  - dahlin_etal_2006
  - dahlin_etal_2017
