  semantic_keywords:
  - contact
  - affiliation
  - caregiving
  semantic_description: Used especially in hind-calf or close social communication.
  confidence: medium
- name: groan
  acoustic_keywords:
  - low_frequency
  - long
  - noisy
  - graded
  - harmonic
  acoustic_description: A lower-intensity but sustained call related to social or
