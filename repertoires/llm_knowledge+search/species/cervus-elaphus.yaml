  semantic_keywords:
  - begging
  - caregiving
  - contact
  - attention
  semantic_description: Used by calves to maintain contact with and solicit attention
    from their mothers.
  confidence: medium
- name: distress squeal
  acoustic_keywords:
  - high_frequency
  - loud
  - noisy
  - long
  - graded
  acoustic_description: A high, strained vocalization with rising harsh energy, acoustically
    distinct from rutting roars and brief alarm barks.
  semantic_keywords:
  - distress
  - attention
  - caregiving
  semantic_description: Produced in acute distress, restraint, or separation situations,
    especially by younger individuals.
  confidence: medium
- name: contact grunt
  acoustic_keywords:
  - low_frequency
  - short
  - quiet
  - repetitive
  acoustic_description: A brief low call with limited modulation and lower amplitude
    than a bark or roar.
  semantic_keywords:
  - contact
  - group_coordination
  - attention
  semantic_description: Used at close range in low-arousal social interactions and
    local coordination.
  confidence: low
- name: nasal contact call
