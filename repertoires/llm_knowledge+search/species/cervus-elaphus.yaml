  - nasal mew
  acoustic_keywords:
  - low_frequency
  - tonal
  - quiet
  - short
  - frequency_modulated
  acoustic_description: A soft, closed-mouth vocalization produced through the nose
    with the mouth closed; lower in frequency and quieter than open-mouth oral calls,
    with simpler spectral structure and shorter duration than roars or barks.
  scope:
    life_stages:
