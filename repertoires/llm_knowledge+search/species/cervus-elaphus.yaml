  semantic_keywords:
  - mating
  - display
  - attention
  semantic_description: Included as a lower-intensity rut-associated call class.
  confidence: low
- name: calf call
  acoustic_keywords:
  - high_frequency
  - tonal
  - short
  - repetitive
  - loud
  acoustic_description: A higher-pitched and more repetitive call than adult roars,
