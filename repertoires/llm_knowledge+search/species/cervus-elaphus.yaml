  semantic_keywords:
  - alarm
  - attention
  - threat
  semantic_description: Used in disturbance or immediate vigilance contexts.
  confidence: medium
- name: mew
  acoustic_keywords:
  - tonal
  - harmonic
  - short
  - quiet
  - frequency_modulated
  acoustic_description: A softer shorter call than the main male roar, with clearer
