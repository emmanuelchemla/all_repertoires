scientific_name: Elephas maximus
common_name: Asian Elephant
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Mammalia
  order: Proboscidea
  family: Elephantidae
  genus: Elephas
  species: maximus
calls:
- name: rumble
  acoustic_keywords:
  - low_frequency
  - long
  - harmonic
  - tonal
  - loud
  acoustic_description: A low-frequency, often infrasonic call with sustained harmonic
    structure and long duration.
  semantic_keywords:
  - contact
  - group_coordination
  - affiliation
  - identity
  semantic_description: Used for long-range social contact, cohesion, and coordination
    among family members.
  confidence: high
- name: trumpet
  acoustic_keywords:
  - loud
  - high_frequency
  - harmonic
  - abrupt
  - long
  acoustic_description: A loud resonant call with strong upper harmonics and conspicuous
    onset.
  semantic_keywords:
  - attention
  - display
  - distress
  - threat
  semantic_description: Produced in intense arousal including excitement, alarm, aggression,
    or distress.
  confidence: high
- name: roar
  acoustic_keywords:
  - loud
  - noisy
  - long
  - broadband
  - graded
  acoustic_description: A harsh high-amplitude call with more broadband energy than
    a rumble.
  semantic_keywords:
  - threat
  - aggression
  - attention
  semantic_description: Associated with aggressive display or severe disturbance.
  confidence: medium
- name: squeak
  acoustic_keywords:
  - high_frequency
  - short
  - tonal
  - loud
  - repetitive
  acoustic_description: A shorter higher-pitched call than trumpet or rumble, with
    a clearer tonal quality.
  semantic_keywords:
  - caregiving
  - begging
  - attention
  - distress
  semantic_description: Common in calf and close social interactions requiring immediate
    attention.
  confidence: medium
- name: snort
  acoustic_keywords:
  - abrupt
  - broadband
  - short
  - pulsed
  - loud
  acoustic_description: A short expulsive sound with broad spectral energy and abrupt
    onset.
  semantic_keywords:
  - attention
  - threat
  - alarm
  semantic_description: Used in immediate vigilance and short-range alerting.
  confidence: medium
- name: calf scream
  scope:
    life_stages:
    - juvenile
    sexes:
    - unknown
    population_specific: false
    note: ''
  acoustic_keywords:
  - high_frequency
  - loud
  - long
  - noisy
  - graded
  acoustic_description: A high-intensity shrill call with strong noisy energy and
    high amplitude, unlike the lower-frequency adult rumble.
  semantic_keywords:
  - distress
  - caregiving
  - attention
  semantic_description: Produced by calves in acute distress, separation, or handling
    contexts to recruit aid from nearby adults.
  confidence: medium
- name: greeting rumble
  acoustic_keywords:
  - low_frequency
  - long
  - harmonic
  - frequency_modulated
  - quiet
  acoustic_description: A lower-amplitude rumble with smoother contour than a trumpet
    and richer harmonic structure than a snort.
  semantic_keywords:
  - affiliation
  - contact
  - group_coordination
  semantic_description: Used in reunion and affiliative greeting contexts to maintain
    social bonds and coordinate group interactions.
  confidence: medium
- name: bark
  acoustic_keywords:
  - broadband
  - noisy
  - abrupt
  - loud
  - short
  acoustic_description: A short harsh call with a strong abrupt onset and broader spectral spread than a rumble, lacking the ringing harmonic quality of a trumpet.
  semantic_keywords:
  - alarm
  - attention
  - threat
  semantic_description: Included as a broad alarmed or forceful social call because Asian elephant repertoire work explicitly lists bark-like calls alongside rumbles, roars, squeals, and trumpets.
  confidence: medium
  references:
  - glaeser_2009
  - stoeger_2021
- name: chirp
  alternative_names:
  - chirp-rumble (when combined with low-frequency component)
  scope:
    life_stages:
    - adult
    sexes:
    - unknown
    population_specific: false
    note: ''
  acoustic_keywords:
  - high_frequency
  - short
  - tonal
  - repetitive
  - multi_component
  acoustic_description: A brief tonal call in the ~200–500 Hz range, typically produced as a series of short notes. Distinguished from the trumpet by smaller amplitude and shorter duration, and from rumbles by higher fundamental frequency. Sometimes preceding or combined with a low-frequency rumble component to form a chirp-rumble.
  semantic_keywords:
  - alarm
  - attention
  - contact
  semantic_description: Produced in contexts of mild alarm, confusion, social tension, or short-range contact. McKay (1973) identified it as one of three basic Asian elephant sounds; Glaeser (2009) included chirp as one of four fundamental call categories.
  confidence: high
  references:
  - mckay_1973
  - glaeser_2009
- name: growl
  acoustic_keywords:
  - low_frequency
  - quiet
  - tonal
  - short
  - graded
  acoustic_description: A soft, low-frequency vocalization with relatively quiet amplitude and limited carrying distance (<100 m). Resonates in the trunk and grades into rumbles at higher intensity. Less harmonically rich than a full rumble.
  semantic_keywords:
  - contact
  - affiliation
  - group_coordination
  semantic_description: Used in close-range social interactions for gentle contact and coordination. McKay (1973) identified growl as a basic sound type distinct from the higher-intensity rumble, noting it as appropriate for short-range communication within a group.
  confidence: medium
  references:
  - mckay_1973
- name: musth rumble
  alternative_names:
  - musth chirp-rumble
  - musth cry-rumble
  scope:
    life_stages:
    - adult
    sexes:
    - male
    population_specific: false
    note: ''
  acoustic_keywords:
  - low_frequency
  - multi_component
  - harmonic
  - long
  - frequency_modulated
  acoustic_description: A compound call with a brief higher-frequency segment (~250 Hz, ~0.25 s) followed by a longer low-frequency component (~60 Hz, ~0.75 s). Combines chirp-like onset with a deep rumble tail, producing a distinctive two-part temporal structure.
  semantic_keywords:
  - mating
  - courtship
  - display
  - identity
  semantic_description: Produced by males in musth, a period of elevated testosterone and heightened reproductive activity. Signals musth status to females and rival males; rare and context-specific.
  confidence: medium
  references:
  - stoeger_2021
- name: let's-go rumble
  alternative_names:
  - departure rumble
  - movement initiation rumble
  scope:
    life_stages:
    - adult
    sexes:
    - unknown
    population_specific: false
    note: ''
  acoustic_keywords:
  - low_frequency
  - long
  - harmonic
  - tonal
  acoustic_description: A long drawn-out low-frequency rumble distinguishable from generic contact rumbles by its extended, sustained quality and the characteristic body posture of the caller. Shares the harmonic structure of other rumbles but is unusually prolonged.
  semantic_keywords:
  - group_coordination
  - contact
  - recruitment
  semantic_description: Produced before group movement to signal a departure proposal. Documented in both African and Asian elephants; the caller adopts a distinctive posture indicating directionality. Functionally a proposal call that solicits group consensus to move.
  confidence: medium
  references:
  - stoeger_etal_2014
- name: squeal
  acoustic_keywords:
  - high_frequency
  - loud
  - short
  - tonal
  - abrupt
  acoustic_description: A brief high-pitched tonal call of higher amplitude than a chirp, shorter than a full trumpet, with a rapid onset. May grade into trumpets at maximum intensity. Spectrally overlaps with trumpet but lacks the long sustained resonance.
  semantic_keywords:
  - play
  - distress
  - attention
  - submission
  semantic_description: Produced in play contexts, excitement, or mild distress. Distinct from the sustained calf scream in being shorter and less noisy. Glaeser (2009) and related studies list squeal as a named call category alongside trumpets and roars.
  confidence: medium
  references:
  - glaeser_2009
- name: post-copulatory rumble
  scope:
    life_stages:
    - adult
    sexes:
    - female
    population_specific: false
    note: ''
  acoustic_keywords:
  - low_frequency
  - harmonic
  - repetitive
  - long
  acoustic_description: A series of grunts or rumble pulses with strong harmonic overtones, repeated in sequences. Functionally distinct from generic contact rumbles by its post-mating timing and the repetitive multi-pulse sequence structure.
  semantic_keywords:
  - mating
  - courtship
  - group_coordination
  - affiliation
  semantic_description: Emitted by females after copulation as a post-copulatory sequence; can persist for up to ~30 minutes. May recruit group members or signal mate quality. Documented in both Asian and African elephants as a distinctive post-mating vocalization.
  confidence: low
  references:
  - stoeger_etal_2014
references:
  glaeser_2009:
    citation: "Glaeser, S.S. 2009. Analysis and Classification of Sounds Produced by Asian Elephants (Elephas maximus). PhD dissertation, Portland State University."
    doi: 10.15760/etd.5951
  stoeger_2021:
    citation: "Stoeger, A.S., et al. 2021. A novel theory of Asian elephant high-frequency squeak production. BMC Biology 19:103."
    url: https://link.springer.com/article/10.1186/s12915-021-01026-z
  mckay_1973:
    citation: "McKay, G.M. 1973. Behavior and ecology of the Asiatic elephant in southeastern Ceylon. Smithsonian Contributions to Zoology 125:1-113."
  stoeger_etal_2014:
    citation: "Stoeger, A.S. & Baotic, A. 2014. Information content and acoustic structure of male African elephant social rumbles. Scientific Reports 4:6136."
    url: https://www.nature.com/articles/srep06136
