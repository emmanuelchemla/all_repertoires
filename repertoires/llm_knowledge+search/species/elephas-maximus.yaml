  confidence: high
- name: trumpet
  acoustic_keywords:
  - loud
  - high_frequency
  - harmonic
  - abrupt
  - long
  acoustic_description: A loud resonant call with strong upper harmonics and conspicuous
    onset.
  semantic_keywords:
  - attention
  - display
  - distress
  - threat
  semantic_description: Produced in intense arousal including excitement, alarm, aggression,
    or distress.
  confidence: high
- name: roar
  acoustic_keywords:
  - loud
  - noisy
  - long
  - broadband
  - graded
  acoustic_description: A harsh high-amplitude call with more broadband energy than
    a rumble.
  semantic_keywords:
  - threat
  - aggression
  - attention
  semantic_description: Associated with aggressive display or severe disturbance.
  confidence: medium
- name: squeak
  acoustic_keywords:
  - high_frequency
  - short
  - tonal
  - loud
  - repetitive
  acoustic_description: A shorter higher-pitched call than trumpet or rumble, with
    a clearer tonal quality.
  semantic_keywords:
  - caregiving
  - begging
  - attention
  - distress
  semantic_description: Common in calf and close social interactions requiring immediate
    attention.
  confidence: medium
- name: snort
  acoustic_keywords:
  - abrupt
  - broadband
  - short
  - pulsed
  - loud
  acoustic_description: A short expulsive sound with broad spectral energy and abrupt
    onset.
  semantic_keywords:
  - attention
  - threat
  - alarm
  semantic_description: Used in immediate vigilance and short-range alerting.
  confidence: medium
- name: calf scream
  scope:
    life_stages:
    - juvenile
    sexes:
    - unknown
    population_specific: false
    note: ''
  acoustic_keywords:
  - high_frequency
  - loud
  - long
  - noisy
  - graded
  acoustic_description: A high-intensity shrill call with strong noisy energy and
    high amplitude, unlike the lower-frequency adult rumble.
  semantic_keywords:
  - distress
  - caregiving
  - attention
  semantic_description: Produced by calves in acute distress, separation, or handling
    contexts to recruit aid from nearby adults.
  confidence: medium
- name: greeting rumble
  acoustic_keywords:
  - low_frequency
  - long
  - harmonic
  - frequency_modulated
  - quiet
  acoustic_description: A lower-amplitude rumble with smoother contour than a trumpet
    and richer harmonic structure than a snort.
  semantic_keywords:
  - affiliation
  - contact
  - group_coordination
  semantic_description: Used in reunion and affiliative greeting contexts to maintain
    social bonds and coordinate group interactions.
  confidence: medium
- name: bark
  acoustic_keywords:
  - broadband
  - noisy
  - abrupt
  - loud
  - short
  acoustic_description: A short harsh call with a strong abrupt onset and broader spectral spread than a rumble, lacking the ringing harmonic quality of a trumpet.
  semantic_keywords:
  - alarm
  - attention
  - threat
  semantic_description: Included as a broad alarmed or forceful social call because Asian elephant repertoire work explicitly lists bark-like calls alongside rumbles, roars, squeals, and trumpets.
  confidence: medium
