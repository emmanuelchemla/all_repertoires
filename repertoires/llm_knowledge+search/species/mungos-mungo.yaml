scientific_name: Mungos mungo
common_name: Banded Mongoose
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Mammalia
  order: Carnivora
  family: Herpestidae
  genus: Mungos
  species: mungo
calls:
- name: close-forage call
  alternative_names:
  - close call
  acoustic_keywords:
  - short
  - quiet
  - graded
  - tonal
  - repetitive
  acoustic_description: A frequently emitted short call with fine acoustic gradation
    and relatively low amplitude during routine foraging.
  semantic_keywords:
  - contact
  - group_coordination
  - affiliation
  semantic_description: Maintains cohesion among group members during dispersed foraging
    and can encode both identity and contextual information.
  confidence: high
  references:
  - jansen_2012
  - rasso_1986
- name: moving call
  acoustic_keywords:
  - short
  - tonal
  - repetitive
  - quiet
  acoustic_description: A brief repeated call used during locomotion, distinct from
    the more context-rich close-forage call.
  semantic_keywords:
  - group_coordination
  - contact
  - attention
  semantic_description: Helps coordinate collective movement and keep the group together
    while travelling.
  confidence: medium
  references:
  - acoustic_adaptation_2022
- name: alarm call
  acoustic_keywords:
  - abrupt
  - short
  - noisy
  - broadband
  - repetitive
  acoustic_description: A sharp, abrupt call with harsher spectral structure than
    routine social calls.
  semantic_keywords:
  - alarm
  - predator
  - attention
  semantic_description: Produced in response to threats and rapidly shifts group vigilance
    or escape behaviour.
  confidence: medium
  references:
  - acoustic_adaptation_2022
  - rasso_1986
- name: recruitment call
  alternative_names:
  - mobbing call
  acoustic_keywords:
  - repetitive
  - abrupt
  - noisy
  - loud
  acoustic_description: A repeated arousal-related call series that is more conspicuous
    than close-forage calls and suited to mobilizing nearby individuals.
  semantic_keywords:
  - recruitment
  - alarm
  - group_coordination
  - predator
  semantic_description: Used to recruit group members to investigate or collectively
    respond to threats or salient events.
  confidence: high
  references:
  - fenn_2009
  - acoustic_adaptation_2022
- name: begging call
  scope:
    life_stages:
    - juvenile
    sexes:
    - unknown
    population_specific: false
    note: ''
  acoustic_keywords:
  - high_frequency
  - short
  - repetitive
  - loud
  - graded
  acoustic_description: A persistent high call given by pups, thinner and more urgent
    than ordinary close-forage calls.
  semantic_keywords:
  - begging
  - caregiving
  - attention
  semantic_description: Produced by dependent young to solicit food and care from
    adults.
  confidence: medium
  references:
  - banded_mongoose_calls
- name: distress call
  acoustic_keywords:
  - high_frequency
  - noisy
  - short
  - repetitive
  - loud
  acoustic_description: A louder, more urgent repeated call than routine close-forage
    calls, with a harsher and more aroused sound quality.
  semantic_keywords:
  - distress
  - attention
  - caregiving
  semantic_description: Produced when an individual is threatened, restrained, injured,
    or otherwise in acute need of assistance, drawing attention from nearby group
    members.
  confidence: medium
  references:
  - rasso_1986
- name: threat call
  acoustic_keywords:
  - low_frequency
  - noisy
  - abrupt
  - short
  - graded
  acoustic_description: A rough, lower-pitched threatening vocalization, harsher
    and less tonal than routine cohesion calls.
  semantic_keywords:
  - threat
  - aggression
  - spacing
  semantic_description: Used in close-range antagonistic encounters to warn or displace
    conspecifics.
  confidence: medium
  references:
  - rasso_1986
- name: grooming call
  acoustic_keywords:
  - short
  - quiet
  - tonal
  - graded
  acoustic_description: A soft, low-amplitude social call with less abrupt structure
    than alarm or recruitment calls.
  semantic_keywords:
  - affiliation
  - contact
  semantic_description: Associated with relaxed affiliative interactions, especially
    close social contact such as grooming.
  confidence: low
  references:
  - rasso_1986
- name: aggression call
  alternative_names:
  - aggressive call
  acoustic_keywords:
  - noisy
  - broadband
  - abrupt
  - loud
  - short
  acoustic_description: A harsh, broadband burst distinguishable from the lower-intensity
    threat call; more explosive in onset and higher in amplitude, consistent with
    escalated agonistic arousal.
  semantic_keywords:
  - aggression
  - threat
  - spacing
  semantic_description: Produced during overt aggressive encounters such as biting
    or chasing, rather than the warning context of the threat call.
  confidence: medium
  references:
  - rasso_1986
- name: rally call
  alternative_names:
  - rally call A
  - rally call B
  acoustic_keywords:
  - loud
  - repetitive
  - tonal
  - frequency_modulated
  - multi_component
  acoustic_description: A loud, repeated call series; two acoustic variants (A and
    B) have been described, differing in pitch contour and repetition rate but both
    carrying a tonal-to-noisy quality and higher amplitude than routine forage calls.
  semantic_keywords:
  - group_coordination
  - recruitment
  - territorial
  - alarm
  semantic_description: Produced during inter-group encounters and territorial disputes
    to rally group members; may also function during predator mobbing requiring
    sustained coordinated response.
  confidence: medium
  references:
  - rasso_1986
- name: young call
  alternative_names:
  - pup call
  - infant call
  scope:
    life_stages:
    - infant
    - juvenile
    sexes:
    - unknown
    population_specific: false
    note: ''
  acoustic_keywords:
  - high_frequency
  - short
  - tonal
  - repetitive
  - quiet
  acoustic_description: A thin, relatively high-pitched short call produced by young
    individuals; structurally simpler and higher in fundamental frequency than adult
    close-forage calls, with limited acoustic gradation.
  semantic_keywords:
  - contact
  - begging
  - caregiving
  - attention
  semantic_description: Produced by pups and juveniles in the natal context; maintains
    proximity with escorts and solicits caregiving or food provisioning.
  confidence: medium
  references:
  - rasso_1986
- name: water call
  acoustic_keywords:
  - short
  - tonal
  - quiet
  - repetitive
  acoustic_description: A short, relatively soft call reported in the context of
    water-finding or drinking; acoustically distinct enough from forage and movement
    calls to be categorised separately in captive repertoire studies.
  semantic_keywords:
  - food
  - group_coordination
  - attention
  semantic_description: Associated with proximity to water or drinking behaviour;
    may alert group members to a resource location, though evidence is primarily
    from captive observation.
  confidence: low
  references:
  - rasso_1986
