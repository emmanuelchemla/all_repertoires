    doi: 10.1038/s41598-024-53474-z
  dog_bark_emotion:
    citation: "Farago, T., Pongracz, P., Miklosi, A., Huber, L., and Viranyi, Z. 2014. Dogs' expectation about signalers' body size by virtue of their growls. PLoS ONE 9:e86546."
