  howling_domestication:
    citation: "Lazzaroni, M., Marshall-Pescini, S., Cafazzo, S., and Range, F. 2023. Genetic distance from wolves affects family dogs' reactions towards howls. Communications Biology 6:147."
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9902479/
  separation_whining:
    citation: "Tiira, K., Sulkama, S., and Lohi, H. 2021. Separation-related behavior problems in dogs are associated with vocalization patterns. Scientific Reports 11:18482."
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8479053/
