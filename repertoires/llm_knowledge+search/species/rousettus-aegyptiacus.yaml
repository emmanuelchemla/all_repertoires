scientific_name: Rousettus aegyptiacus
common_name: Egyptian Fruit Bat
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Mammalia
  order: Chiroptera
  family: Pteropodidae
  genus: Rousettus
  species: aegyptiacus
calls:
- name: social squabble call
  acoustic_keywords:
  - broadband
  - noisy
  - abrupt
  - short
  - repetitive
  acoustic_description: A harsh short call with abrupt onset and broad spectral energy,
    often in repeated series.
  semantic_keywords:
  - aggression
  - threat
  - attention
  semantic_description: Used during social disputes over perch space, food, or body
    contact.
  confidence: high
- name: isolation call
  acoustic_keywords:
  - high_frequency
  - tonal
  - repetitive
  - loud
  - long
  acoustic_description: A more sustained higher-pitched call than routine squabble
    notes.
  semantic_keywords:
  - contact
  - caregiving
  - begging
  - attention
  semantic_description: Produced by isolated young or separated individuals to elicit
    contact or care.
  confidence: medium
- name: seclusion-distress call
  alternative_names:
  - seclusion call
  - distress call
  acoustic_keywords:
  - high_frequency
  - long
  - noisy
  - frequency_modulated
  - loud
  acoustic_description: A longer, higher-arousal call than routine social notes,
    often with a strained tonal-to-noisy quality and strong amplitude.
  semantic_keywords:
  - distress
  - contact
  - attention
  semantic_description: Produced mainly by distressed adults when isolated from
    nearby conspecifics or socially separated in the roost.
  confidence: medium
  references:
  - prat_etal_2017
- name: mating call
  alternative_names:
  - courtship trill
  acoustic_keywords:
  - tonal
  - repetitive
  - frequency_modulated
  - long
  - harmonic
  acoustic_description: A more patterned and modulated call than aggressive signals,
    with repeated syllabic structure.
  semantic_keywords:
  - courtship
  - mating
  - display
  semantic_description: Produced by males during mating and courtship interactions
    as a reproductive social signal distinct from aggressive squabbles.
  confidence: medium
  references:
  - prat_etal_2017
- name: aggression screech
  acoustic_keywords:
  - high_frequency
  - noisy
  - short
  - abrupt
  - repetitive
  acoustic_description: A harsh repeated screech with stronger noisy energy than social
    squabble calls.
  semantic_keywords:
  - aggression
  - threat
  - attention
  semantic_description: Produced during escalated social conflict and close-range
    antagonistic encounters.
  confidence: medium
  references:
  - prat_etal_2016
- name: maternal directive call
  acoustic_keywords:
  - short
  - tonal
  - quiet
  - repetitive
  acoustic_description: A repeated call in mother-young contexts, simpler and softer
    than adult conflict calls.
  semantic_keywords:
  - caregiving
  - contact
  - attention
  semantic_description: Used to coordinate mother-offspring interactions and maintain
    local contact in crowded roosts.
  confidence: low
  references:
  - prat_etal_2017
- name: mating-protest call
  alternative_names:
  - copulation protest call
  - mating refusal call
  scope:
    life_stages:
    - adult
    sexes:
    - female
    population_specific: false
    note: ''
  acoustic_keywords:
  - noisy
  - high_frequency
  - short
  - abrupt
  - repetitive
  acoustic_description: A rapid series of short harsh notes, acoustically distinguishable
    from food-contest squabbles by a higher-pitched noisy quality; emitted in tight
    bursts during unwanted contact.
  semantic_keywords:
  - mating
  - aggression
  - submission
  semantic_description: Produced mainly by females in response to unwanted or premature
    mating attempts; one of the four behaviorally annotated vocal contexts identified
    in the Prat et al. 2016 dataset.
  confidence: medium
  references:
  - prat_etal_2016
- name: roost-position jostling call
  alternative_names:
  - sleeping-cluster call
  - positional squabble call
  scope:
    life_stages:
    - adult
    sexes:
    - unknown
    population_specific: false
    note: ''
  acoustic_keywords:
  - broadband
  - noisy
  - short
  - abrupt
  - graded
  acoustic_description: A graded series of short noisy pulses with variable intensity,
    acoustically similar to food-contest squabbles but produced in contexts of close
    roosting contact rather than resource competition.
  semantic_keywords:
  - spacing
  - territorial
  - group_coordination
  semantic_description: Emitted when bats jostle for position within their sleeping
    cluster; identified as a distinct behavioral context in the Prat et al. 2016
    annotated corpus of Egyptian fruit bat vocalizations.
  confidence: medium
  references:
  - prat_etal_2016
