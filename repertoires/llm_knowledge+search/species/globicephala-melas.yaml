scientific_name: Globicephala melas
common_name: Long-finned Pilot Whale
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Mammalia
  order: Artiodactyla
  family: Delphinidae
  genus: Globicephala
  species: melas
calls:
  - name: whistle
    acoustic_keywords: [tonal, harmonic, frequency_modulated, long, loud]
    acoustic_description: A narrowband modulated tonal call with sustained contour, ranging from simple smooth shapes to more complex multi-segment whistles.
    semantic_keywords: [contact, group_coordination, identity]
    semantic_description: Used in social contact and coordination within groups and likely contributes to group or individual distinctiveness.
    confidence: high
    references: [vester_2017, delemas_2005]
  - name: pulsed call
    acoustic_keywords: [pulsed, repetitive, broadband, multi_component, loud]
    acoustic_description: A structured pulsed social call with repeated temporal patterning and strong broadband energy, often more complex than simple click trains.
    semantic_keywords: [contact, group_coordination, attention]
    semantic_description: Used in social interaction and active group coordination.
    confidence: high
    references: [vester_2017, rsos_2024]
  - name: pulsed chirp
    acoustic_keywords: [high_frequency, pulsed, repetitive, broadband, short]
    acoustic_description: A short rapidly pulsed call with a more chirped or trilled impression than longer pulsed calls.
    semantic_keywords: [contact, attention, affiliation]
    semantic_description: Used in nearby social interaction and flexible short-range communication.
    confidence: medium
    references: [delemas_2005]
  - name: burst-pulsed call
    acoustic_keywords: [noisy, pulsed, broadband, abrupt, repetitive]
    acoustic_description: A harsher pulsed call with compact temporal structure and less smooth contour than whistles.
    semantic_keywords: [attention, threat, group_coordination]
    semantic_description: Used in aroused social situations requiring immediate response.
    confidence: medium
    references: [vester_2017, rsos_2024]
  - name: click train
    acoustic_keywords: [pulsed, repetitive, broadband, short, abrupt]
    acoustic_description: A train of brief broadband clicks lacking sustained tonality.
    semantic_keywords: [food, attention, group_coordination]
    semantic_description: Primarily biosonar-related but socially informative during foraging and coordinated movement.
    confidence: high
    references: [vester_2017, nemiroff_2009]
  - name: buzz
    acoustic_keywords: [pulsed, repetitive, broadband, abrupt, short]
    acoustic_description: A very fast click sequence with much shorter intervals than ordinary click trains, creating a buzzing sound.
    semantic_keywords: [food, attention]
    semantic_description: Associated mainly with prey pursuit and very close-range foraging.
    confidence: medium
    references: [vester_2017]
  - name: biphonic call
    acoustic_keywords: [tonal, harmonic, multi_component, frequency_modulated, loud]
    acoustic_description: A call with two simultaneously expressed frequency components or a clearly layered tonal structure, giving a two-voiced impression relative to ordinary whistles.
    semantic_keywords: [contact, identity, group_coordination]
    semantic_description: Included because long-finned pilot whale repertoires repeatedly mention biphonic or multi-component social calls in addition to simpler whistles and pulsed sounds.
    confidence: medium
    references: [rsos_2024]
