scientific_name: Loxodonta africana
common_name: African Savanna Elephant
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Mammalia
  order: Proboscidea
  family: Elephantidae
  genus: Loxodonta
  species: africana
calls:
- name: rumble
  acoustic_keywords:
  - low_frequency
  - long
  - harmonic
  - tonal
  - loud
  acoustic_description: A low-frequency, often infrasonic call with sustained harmonic
    structure and prolonged duration.
  semantic_keywords:
  - contact
  - group_coordination
  - affiliation
  - identity
  semantic_description: Used in long-range social contact and coordination among family
    members and allies.
  confidence: high
- name: trumpet
  acoustic_keywords:
  - loud
  - high_frequency
  - harmonic
  - abrupt
  - long
  acoustic_description: A loud resonant arousal call with strong upper harmonics and
    conspicuous onset.
  semantic_keywords:
  - attention
  - display
  - distress
  - threat
  semantic_description: Produced in excitement, alarm, aggression, or distress.
  confidence: high
- name: roar
  acoustic_keywords:
  - loud
  - noisy
  - long
  - broadband
  - graded
  acoustic_description: A harsh broadband call with more noisy energy than a rumble.
  semantic_keywords:
  - aggression
  - threat
  - attention
  semantic_description: Associated with aggressive display and intense disturbance.
  confidence: medium
- name: snort
  acoustic_keywords:
  - abrupt
  - broadband
  - short
  - pulsed
  - loud
  acoustic_description: A short expulsive sound with broad spectral energy and abrupt
    onset.
  semantic_keywords:
  - attention
  - threat
  - alarm
  semantic_description: Used in immediate vigilance and short-range alerting.
  confidence: medium
- name: squeak
  acoustic_keywords:
  - high_frequency
  - short
  - tonal
  - repetitive
  - graded
  acoustic_description: A short higher-pitched call contrasting with the lower-frequency
    rumble and more forceful trumpet.
  semantic_keywords:
  - contact
  - attention
  - caregiving
  semantic_description: Used especially in close-range interactions involving calves
    or tightly associated individuals.
  confidence: medium
- name: greeting rumble
  acoustic_keywords:
  - low_frequency
  - long
  - harmonic
  - frequency_modulated
  - quiet
  acoustic_description: A low rumble with smooth contour and lower amplitude than
    a trumpet, often rich in harmonic energy.
  semantic_keywords:
  - affiliation
  - contact
  - group_coordination
  semantic_description: Used in reunions and close affiliative greeting contexts to
    maintain social bonds.
  confidence: medium
- name: bark
  acoustic_keywords:
  - broadband
  - noisy
  - abrupt
  - loud
  - short
  acoustic_description: A short explosive harsh call with a sharper onset than a roar and much less sustained tonal structure than a rumble or trumpet.
  semantic_keywords:
  - alarm
  - attention
  - threat
  semantic_description: Included because African elephant ethograms explicitly list bark-like calls among the common higher-frequency vocal categories used in disturbance and forceful social contexts.
  confidence: medium
  references:
  - elephantvoices
- name: cry
  acoustic_keywords:
  - high_frequency
  - noisy
  - long
  - graded
  - loud
  acoustic_description: A plaintive, high-arousal call with a strained noisy quality and longer duration than a bark.
  semantic_keywords:
  - distress
  - caregiving
  - attention
  semantic_description: Included as a broad distress-oriented class because African elephant vocal summaries often distinguish cries from barks, roars, snorts, and trumpets.
  confidence: medium
  references:
  - elephantvoices
- name: grunt
  alternative_names:
  - low grunt
  acoustic_keywords:
  - low_frequency
  - short
  - noisy
  - abrupt
  - quiet
  acoustic_description: A brief low-frequency call with noisy spectral energy, shorter
    and softer than a roar and less harmonic than a rumble; often occurs singly or
    in short bouts.
  semantic_keywords:
  - contact
  - affiliation
  - group_coordination
  semantic_description: Produced in calm social contexts and during low-intensity
    interactions; listed in systematic repertoire surveys as a distinct call type
    separate from rumble, roar, and bark.
  confidence: medium
  references:
  - soltis_2009
- name: musth rumble
  alternative_names:
  - musth rumble call
  scope:
    life_stages:
    - adult
    sexes:
    - male
    population_specific: false
    note: ''
  acoustic_keywords:
  - low_frequency
  - long
  - harmonic
  - tonal
  - repetitive
  acoustic_description: A stereotyped low-frequency, highly harmonic rumble produced
    continuously or at short intervals; has a distinctive low fundamental frequency
    and strong tonal quality that differentiates it from general contact rumbles.
  semantic_keywords:
  - courtship
  - mating
  - identity
  - display
  semantic_description: Constantly produced by males in musth; thought to acoustically
    advertise hormonal and reproductive state to other elephants, including sexually
    receptive females and rival males.
  confidence: high
  references:
  - poole_1988
