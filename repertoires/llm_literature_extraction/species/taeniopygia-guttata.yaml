        url: https://doi.org/10.1007/s10071-015-0933-6
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Zann 1996 describes Long Tonal calls as juvenile contact calls, and Elie and Theunissen 2015 and 2016 include them as one of the juvenile semantic/acoustic categories.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Zann 1996 and Elie and Theunissen 2016 agree that Long Tonal calls are harmonic and distance-call-like, with detailed quantified support from the latter.
    semantic_description_agreement: strong
    semantic_description_explanation: Zann 1996, Elie and Theunissen 2015, and Elie and Theunissen 2016 all describe Long Tonal calls as juvenile separation/contact calls and as precursors of adult distance calls.

  - name: copulation whine
    in_primary_inventory: true
    alternative_names:
      - copulation call
      - copulation whine call
      - mating whine
    scope: *adult_both_scope
    acoustic_keywords:
      - quiet
      - harmonic
      - tonal
      - frequency_modulated
      - long
    acoustic_description: A whine-like, soft, harmonic call associated with copulation. Published acoustic treatment is sparse; later repertoire work recorded too few copulation examples for quantitative analysis and treated the available example as a copulation whine.
    semantic_keywords:
      - mating
      - courtship
      - affiliation
    semantic_description: Produced in the immediate copulation context. It appears to be related to the broader whine class used by paired birds in reproductive contexts, but the distinctiveness of copulation whines as a separate call type remains poorly tested.
    acoustic_references:
      - id: zann_1996
        url: https://doi.org/10.1093/oso/9780198540793.001.0001
      - id: elie_theunissen_2016
        url: https://doi.org/10.1007/s10071-015-0933-6
    semantic_references:
