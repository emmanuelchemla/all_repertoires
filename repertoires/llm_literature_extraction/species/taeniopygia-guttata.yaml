    call_type_existence_agreement: strong
    call_type_existence_explanation: Zann 1996 includes begging in the zebra finch repertoire, Elie and Theunissen 2016 quantifies begging calls, Perez et al. 2016 records and manipulates wild begging structure, and Brandl et al. 2019 uses wild begging-call playback.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Zann 1996, Perez et al. 2016, Brandl et al. 2019, and Elie and Theunissen 2016 all support a noisy, repetitive, high-frequency begging-call category with measurable developmental and physiological variation.
    semantic_description_agreement: strong
    semantic_description_explanation: Zann 1996, Perez et al. 2016, and Brandl et al. 2019 agree that begging calls solicit parental care and food; Brandl et al. 2019 further shows social-information effects for prospecting conspecifics in the wild.

  - name: long tonal call
    in_primary_inventory: true
    alternative_names:
      - juvenile long tonal call
      - fledgling long tonal call
      - precursor distance call
    scope:
      life_stages:
        - juvenile
      sexes:
        - female
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - high_frequency
      - loud
      - harmonic
      - tonal
      - long
    acoustic_description: A loud, long, highly harmonic juvenile contact call produced around fledging. It resembles the adult distance call in fundamental-frequency range, formant structure, and duration, but is slightly shifted toward higher frequencies and is softer than adult distance calls.
    semantic_keywords:
      - contact
      - caregiving
      - group_coordination
    semantic_description: Produced by chicks from about the late nestling or fledging period when visually separated from siblings or parents, and in response to parental distance calls or sibling long-tonal calls. It is the developmental precursor of the adult distance call.
    acoustic_references:
      - id: zann_1996
        url: https://doi.org/10.1093/oso/9780198540793.001.0001
