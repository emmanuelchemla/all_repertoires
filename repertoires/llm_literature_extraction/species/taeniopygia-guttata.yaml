scientific_name: Taeniopygia guttata
common_name: Zebra finch
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Aves
  order: Passeriformes
  family: Estrildidae
  genus: Taeniopygia
  species: guttata
primary_inventory:
  id: zann_1996
  rationale: "Zann 1996 is used as the primary_inventory spine because it is the field-grounded synthesis of the wild zebra finch repertoire and is explicitly used as the nomenclatural baseline by later peer-reviewed repertoire studies. This file marks Zann's song, adult distance, tet, stack, ark, kackle, whine, wsst, distress, thuk, copulation-whine, juvenile begging, and juvenile long-tonal categories as in_primary_inventory. Elie and Theunissen 2016 is treated as a major secondary acoustic inventory, not the spine, because it studied domesticated birds, grouped Zann's ark and kackle calls into Nest calls, did not quantify Zann's wild take-off Stack call, and added the Tuck alarm category without clear wild evidence. The heat/incubation/v-call is retained as an outside-inventory vocalization because wild and later biophysical work support a distinct heat-associated sound, but its communicative status is weak and contested."
calls:
  - name: song
    in_primary_inventory: true
    alternative_names:
      - male song
      - directed song
      - undirected song
    scope:
      life_stages:
        - adult
      sexes:
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - tonal
      - harmonic
      - frequency_modulated
      - repetitive
      - multi_component
      - long
      - quiet
    acoustic_description: A learned male vocal display built from repeated motifs containing multiple song syllables. Wild Australian songs are structured as individual phrase sequences, while domesticated repertoire work shows that song syllables overlap acoustically with some calls but remain complex, multi-element, and more temporally patterned than single calls. Calibrated wild recordings show song is relatively low-amplitude and short-range.
    semantic_keywords:
      - courtship
      - mating
      - affiliation
      - display
    semantic_description: Produced by adult males in courtship, pair bonding, and mating contexts, and also as undirected song in social flocks. In wild birds it functions mainly in close social contexts rather than as a far-carrying territorial advertisement.
    acoustic_references:
      - id: zann_1993
        url: https://doi.org/10.2307/4088626
      - id: elie_theunissen_2016
        url: https://doi.org/10.1007/s10071-015-0933-6
      - id: loning_etal_2022
        url: https://doi.org/10.1093/beheco/arab107
    semantic_references:
      - id: zann_1996
        url: https://doi.org/10.1093/oso/9780198540793.001.0001
      - id: dunn_zann_1996
        url: https://doi.org/10.1111/j.1439-0310.1996.tb01145.x
      - id: loning_etal_2022
        url: https://doi.org/10.1093/beheco/arab107
    playback_references:
      - id: damelio_etal_2017
        url: https://doi.org/10.1038/s41598-017-05982-x
    call_type_existence_agreement: strong
    call_type_existence_explanation: Zann 1993, Zann 1996, Dunn and Zann 1996, Elie and Theunissen 2016, and Loning et al. 2022 all treat male song as a core zebra finch vocal type. There is no substantive disagreement about the existence of this category.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Zann 1993 gives detailed wild song-element structure, Elie and Theunissen 2016 places song in a broad repertoire acoustic analysis, and Loning et al. 2022 confirms the short-range amplitude profile in the wild. Agreement is strong despite individual song variation.
    semantic_description_agreement: strong
    semantic_description_explanation: Zann 1996, Dunn and Zann 1996, Elie and Theunissen 2016, and Loning et al. 2022 agree that song is a male display tied to courtship, mating, pair contexts, and close-range social use rather than ordinary contact calling.

  - name: distance call
    in_primary_inventory: true
    alternative_names:
      - long-distance contact call
      - long call
      - long tonal adult call
    scope: &adult_both_scope
      life_stages:
        - adult
      sexes:
        - female
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - loud
      - harmonic
      - tonal
      - frequency_modulated
      - long
    acoustic_description: A relatively loud, long, harmonic contact call. Females typically produce a steadier, lower-pitched harmonic stack, whereas males often produce a shorter, higher-pitched call with a tonal portion followed by a frequency-modulated noisy downsweep.
    semantic_keywords:
      - contact
      - identity
      - group_coordination
    semantic_description: Used when birds are out of immediate visual contact with the colony, mate, parents, or fledglings. Playback and recognition studies show that distance calls can support sex, individual, mate, parent, and kin recognition and can promote orientation, callbacks, and reunions.
    acoustic_references:
      - id: zann_1990
        url: https://doi.org/10.1016/S0003-3472(05)80982-0
      - id: mouterde_etal_2014
        url: https://doi.org/10.1371/journal.pone.0102842
      - id: elie_theunissen_2016
        url: https://doi.org/10.1007/s10071-015-0933-6
    semantic_references:
      - id: zann_1996
        url: https://doi.org/10.1093/oso/9780198540793.001.0001
      - id: vignal_etal_2008
        url: https://doi.org/10.1016/j.beproc.2007.09.003
      - id: mouterde_etal_2014
        url: https://doi.org/10.1371/journal.pone.0102842
    playback_references:
      - id: vignal_etal_2004
        url: https://doi.org/10.1038/nature02645
      - id: vignal_etal_2008
        url: https://doi.org/10.1016/j.beproc.2007.09.003
      - id: damelio_etal_2017
        url: https://doi.org/10.1038/s41598-017-05982-x
    call_type_existence_agreement: strong
    call_type_existence_explanation: Zann 1990 recorded distance-call learning in wild birds, Zann 1996 treats distance calls as a standard repertoire class, and Elie and Theunissen 2016 and Mouterde et al. 2014 provide detailed acoustic analyses. The type is uncontroversial.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Zann 1990, Mouterde et al. 2014, and Elie and Theunissen 2016 agree on a loud, harmonic, sexually dimorphic contact call, with consistent male-female differences in pitch stability and modulation.
    semantic_description_agreement: strong
    semantic_description_explanation: Zann 1996, Vignal et al. 2004, Vignal et al. 2008, Mouterde et al. 2014, and D'Amelio et al. 2017 all support a contact and recognition function for distance calls, with playback evidence for mate or individual recognition.

  - name: tet call
    in_primary_inventory: true
    alternative_names:
      - short contact call
      - soft contact call
      - tet
    scope:
      life_stages:
        - juvenile
        - adult
      sexes:
        - female
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - short
      - quiet
      - tonal
      - harmonic
      - frequency_modulated
      - repetitive
    acoustic_description: A very short, soft, harmonic contact call with stronger frequency modulation than stack-like calls. It is lower in spectral mean and much shorter and softer than the distance call, and can be produced in dense series during routine movement.
    semantic_keywords:
      - contact
      - affiliation
      - group_coordination
    semantic_description: Used for close-range contact among nearby birds, often during hopping, moving on perches or the ground, and nest-associated interactions. It can form part of quiet mate exchanges at the nest but is also a frequent background contact call in groups.
    acoustic_references:
      - id: zann_1996
        url: https://doi.org/10.1093/oso/9780198540793.001.0001
      - id: ter_maat_etal_2014
        url: https://doi.org/10.1371/journal.pone.0109334
      - id: elie_theunissen_2016
        url: https://doi.org/10.1007/s10071-015-0933-6
    semantic_references:
      - id: zann_1996
        url: https://doi.org/10.1093/oso/9780198540793.001.0001
      - id: elie_etal_2010
        url: https://doi.org/10.1016/j.anbehav.2010.06.003
      - id: gill_etal_2015
        url: https://doi.org/10.7554/eLife.07770
    playback_references:
      - id: elie_etal_2010
        url: https://doi.org/10.1016/j.anbehav.2010.06.003
      - id: damelio_etal_2017
        url: https://doi.org/10.1038/s41598-017-05982-x
    call_type_existence_agreement: strong
    call_type_existence_explanation: Zann 1996, Ter Maat et al. 2014, Gill et al. 2015, and Elie and Theunissen 2016 all recognize tet or tet-like soft contact calls. Some authors split stack-like variants from tets, but the tet category itself is stable.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Ter Maat et al. 2014 and Elie and Theunissen 2016 agree that tets are short, soft, harmonic calls, but they differ on how much to split constant-stack variants from frequency-modulated tets. Agreement is therefore medium rather than strong.
    semantic_description_agreement: medium
    semantic_description_explanation: Zann 1996, Elie et al. 2010, Gill et al. 2015, and Elie and Theunissen 2016 all place tet calls in close contact and nest exchange contexts, but direct wild playback tests for the tet category alone remain limited.

  - name: stack call
    in_primary_inventory: true
    alternative_names:
      - stacks
      - take-off stack
      - stack-like soft contact call
    scope: *adult_both_scope
    acoustic_keywords:
      - short
      - quiet
      - tonal
      - harmonic
      - repetitive
    acoustic_description: A soft harmonic call intermediate between the tet and the distance call in the Zann field account, louder, longer, and higher pitched than tets but softer, shorter, and lower pitched than distance calls. Captive telemetry studies use stack for flatter, less frequency-modulated soft calls that are longer than tets.
    semantic_keywords:
      - contact
      - affiliation
      - group_coordination
      - identity
    semantic_description: In the field inventory, stacks are associated with the moment of take-off and likely help coordinate local movement. In captive pair and group studies, stack calls are exchanged antiphonally, especially within bonded pairs, and can define pair-specific calling relationships.
    acoustic_references:
      - id: zann_1996
        url: https://doi.org/10.1093/oso/9780198540793.001.0001
      - id: ter_maat_etal_2014
        url: https://doi.org/10.1371/journal.pone.0109334
      - id: gill_etal_2015
        url: https://doi.org/10.7554/eLife.07770
    semantic_references:
      - id: zann_1996
        url: https://doi.org/10.1093/oso/9780198540793.001.0001
      - id: ter_maat_etal_2014
        url: https://doi.org/10.1371/journal.pone.0109334
      - id: gill_etal_2015
        url: https://doi.org/10.7554/eLife.07770
    playback_references:
      - id: damelio_etal_2017
        url: https://doi.org/10.1038/s41598-017-05982-x
    call_type_existence_agreement: medium
    call_type_existence_explanation: Zann 1996 describes a wild take-off stack, while Ter Maat et al. 2014 and Gill et al. 2015 study stack-like soft calls in captive groups. Elie and Theunissen 2016 did not recover Zann's take-off stack as a separate category and instead grouped many stack-like calls with tets, so existence as a clean discrete type is medium.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Sources agree that stack calls are soft harmonic calls near the tet/distance acoustic space, but Zann's wild take-off stack and the captive constant-stack contact calls are not necessarily identical. Acoustic boundaries with tet calls are therefore only moderately agreed.
    semantic_description_agreement: medium
    semantic_description_explanation: Zann 1996 links stacks to take-off, whereas Ter Maat et al. 2014 and Gill et al. 2015 emphasize pair contact and breeding-cycle communication. These uses are compatible as close-range coordination but not identical.

  - name: ark call
    in_primary_inventory: true
    alternative_names:
      - ark
      - ark-ark call
      - nest call
    scope: *adult_both_scope
    acoustic_keywords:
      - quiet
      - long
      - noisy
      - repetitive
    acoustic_description: A soft, relatively long, harsh nest-associated sound, often produced as paired ark-ark units. Later acoustic classifications place ark-like sounds within a broader nest-call continuum rather than separating them cleanly from kackles.
    semantic_keywords:
      - affiliation
      - caregiving
      - group_coordination
    semantic_description: Produced around potential nest sites and active nests during nest searching, nest building, and mate relief at the nest. It can occur in quiet sequences by one partner or as part of coordinated nest duets between mates.
    acoustic_references:
      - id: zann_1996
        url: https://doi.org/10.1093/oso/9780198540793.001.0001
      - id: elie_theunissen_2016
        url: https://doi.org/10.1007/s10071-015-0933-6
      - id: elie_theunissen_2015
        url: https://doi.org/10.1111/ejn.12812
    semantic_references:
      - id: zann_1996
        url: https://doi.org/10.1093/oso/9780198540793.001.0001
      - id: elie_etal_2010
        url: https://doi.org/10.1016/j.anbehav.2010.06.003
      - id: elie_theunissen_2016
        url: https://doi.org/10.1007/s10071-015-0933-6
    playback_references:
      - id: elie_etal_2010
        url: https://doi.org/10.1016/j.anbehav.2010.06.003
    call_type_existence_agreement: medium
    call_type_existence_explanation: Zann 1996 distinguishes ark calls in the wild repertoire, but Elie and Theunissen 2015 and 2016 group Ark and Kackle into a single nest-call continuum because their captive recordings were hard to separate. The primary category is retained, with medium agreement.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Zann 1996 provides the ark-specific acoustic description, while Elie and Theunissen 2015 and 2016 support a nest-call acoustic space but not a clean Ark/Kackle split. Agreement is moderate because the split is partly graded.
    semantic_description_agreement: medium
    semantic_description_explanation: Zann 1996, Elie et al. 2010, and Elie and Theunissen 2016 agree that ark-like nest calls occur during nest and mate interactions, but later studies often merge them with kackles for semantic analysis.

  - name: kackle call
    in_primary_inventory: true
    alternative_names:
      - kackle
      - cackle
      - cackle call
      - nest call
    scope: *adult_both_scope
    acoustic_keywords:
      - short
      - loud
      - noisy
      - broadband
      - repetitive
    acoustic_description: A relatively short, raspy, loud nest-associated call. In Zann's terminology it is separated from softer ark calls, while later work often treats kackle/cackle-like sounds as the noisier end of a broader nest-call continuum.
    semantic_keywords:
      - affiliation
      - caregiving
      - group_coordination
    semantic_description: Produced around potential nest sites and during reproductive activity. Captive breeding-cycle telemetry found cackles among the frequent, distinct call types and showed that cackle production increased around early nesting.
    acoustic_references:
      - id: zann_1996
        url: https://doi.org/10.1093/oso/9780198540793.001.0001
      - id: gill_etal_2015
        url: https://doi.org/10.7554/eLife.07770
      - id: elie_theunissen_2016
        url: https://doi.org/10.1007/s10071-015-0933-6
    semantic_references:
      - id: zann_1996
        url: https://doi.org/10.1093/oso/9780198540793.001.0001
      - id: gill_etal_2015
        url: https://doi.org/10.7554/eLife.07770
      - id: elie_etal_2010
        url: https://doi.org/10.1016/j.anbehav.2010.06.003
    playback_references:
      - id: elie_etal_2010
        url: https://doi.org/10.1016/j.anbehav.2010.06.003
      - id: damelio_etal_2017
        url: https://doi.org/10.1038/s41598-017-05982-x
    call_type_existence_agreement: medium
    call_type_existence_explanation: Zann 1996 distinguishes kackle calls, and Gill et al. 2015 treats cackles as one of five frequent distinct call types. Elie and Theunissen 2016 groups kackles with arks as Nest calls, so the existence of a kackle-like nest call is strong but the discrete split is medium.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Zann 1996 and Gill et al. 2015 support a raspy cackle/kackle category, while Elie and Theunissen 2016 finds a continuum from tonal ark-like to noisier kackle-like nest calls. The acoustic description is field-grounded but boundaries are graded.
    semantic_description_agreement: strong
    semantic_description_explanation: Zann 1996, Elie et al. 2010, Gill et al. 2015, and Elie and Theunissen 2016 agree that kackle/cackle-like calls are tied to nesting, pair communication, and reproductive-state changes.

  - name: whine call
    in_primary_inventory: true
    alternative_names:
      - whine
      - nesting whine
      - copulation whine
    scope: *adult_both_scope
    acoustic_keywords:
      - quiet
      - harmonic
      - tonal
      - frequency_modulated
      - long
    acoustic_description: A soft, relatively long, harmonic call with slowly modulated pitch, low spectral mean, low formants, and frequent double-voice structure. It is among the softest adult calls and has a distinctive whining quality.
    semantic_keywords:
      - affiliation
      - caregiving
      - mating
    semantic_description: Produced by paired birds around nest searching, nest building, nest relief, and sometimes copulation. It is commonly part of quiet pair communication at the nest and increases around reproductive activity.
    acoustic_references:
      - id: zann_1996
        url: https://doi.org/10.1093/oso/9780198540793.001.0001
      - id: elie_theunissen_2016
        url: https://doi.org/10.1007/s10071-015-0933-6
      - id: gill_etal_2015
        url: https://doi.org/10.7554/eLife.07770
    semantic_references:
      - id: zann_1996
        url: https://doi.org/10.1093/oso/9780198540793.001.0001
      - id: elie_etal_2010
        url: https://doi.org/10.1016/j.anbehav.2010.06.003
      - id: gill_etal_2015
        url: https://doi.org/10.7554/eLife.07770
    playback_references:
      - id: elie_etal_2010
        url: https://doi.org/10.1016/j.anbehav.2010.06.003
      - id: damelio_etal_2017
        url: https://doi.org/10.1038/s41598-017-05982-x
    call_type_existence_agreement: strong
    call_type_existence_explanation: Zann 1996, Elie et al. 2010, Gill et al. 2015, and Elie and Theunissen 2016 all recognize whine calls or whine-like nest vocalizations, and Gill et al. 2015 analyzes whines as one of the frequent call types.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Elie and Theunissen 2016 gives detailed acoustic measures for whines, Gill et al. 2015 provides spectrographic examples, and Zann 1996 supplies the field nomenclature. These sources agree on a soft, long, modulated call.
    semantic_description_agreement: strong
    semantic_description_explanation: Zann 1996, Elie et al. 2010, Gill et al. 2015, and Elie and Theunissen 2016 consistently tie whines to nest, pair-bond, and reproductive contexts.

  - name: wsst call
    in_primary_inventory: true
    alternative_names:
      - aggressive call
      - hiss call
      - wsst
    scope: *adult_both_scope
    acoustic_keywords:
      - low_frequency
      - noisy
      - broadband
      - long
      - multi_component
    acoustic_description: A noisy broadband aggressive call that may be mono- or polysyllabic. It has very low pitch saliency, broad bandwidth, low first and second formants, and a long high-frequency power tail, giving it a short hiss-like quality.
    semantic_keywords:
      - aggression
      - threat
    semantic_description: Produced by an aggressor shortly before or during attacks or supplanting, especially near nests during building or brooding. It advertises aggressive intent in close-range conflicts with conspecifics.
    acoustic_references:
      - id: zann_1996
        url: https://doi.org/10.1093/oso/9780198540793.001.0001
      - id: elie_theunissen_2015
        url: https://doi.org/10.1111/ejn.12812
      - id: elie_theunissen_2016
        url: https://doi.org/10.1007/s10071-015-0933-6
    semantic_references:
      - id: zann_1996
        url: https://doi.org/10.1093/oso/9780198540793.001.0001
      - id: elie_theunissen_2015
        url: https://doi.org/10.1111/ejn.12812
      - id: elie_theunissen_2016
        url: https://doi.org/10.1007/s10071-015-0933-6
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Zann 1996 lists Wsst as an aggressive repertoire call, and Elie and Theunissen 2015 and 2016 classify and quantify Wsst calls in extensive repertoire datasets.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Elie and Theunissen 2015 and 2016 agree on a noisy, broadband, low-saliency acoustic form, consistent with Zann's field description of a hiss-like aggressive call.
    semantic_description_agreement: strong
    semantic_description_explanation: Zann 1996, Elie and Theunissen 2015, and Elie and Theunissen 2016 agree that Wsst calls are produced by the aggressive bird in conspecific conflict contexts.

  - name: distress call
    in_primary_inventory: true
    alternative_names:
      - distress
      - victim call
      - escape call
    scope:
      life_stages:
        - juvenile
        - adult
      sexes:
        - female
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - high_frequency
      - noisy
      - broadband
      - loud
      - long
      - multi_component
    acoustic_description: A noisy, often loud, mono- or polysyllabic call with broad bandwidth and low formants, acoustically similar to Wsst calls but somewhat more tonal and with a more peaked temporal envelope. It may include a third formant resembling the structure seen in chick begging calls.
    semantic_keywords:
      - distress
      - submission
      - aggression
    semantic_description: Produced by the victim during or immediately after an attack, while escaping or being physically dominated by a conspecific. Juvenile examples have also been reported, but most quantified descriptions are adult conflict calls.
    acoustic_references:
      - id: zann_1996
        url: https://doi.org/10.1093/oso/9780198540793.001.0001
      - id: elie_theunissen_2015
        url: https://doi.org/10.1111/ejn.12812
      - id: elie_theunissen_2016
        url: https://doi.org/10.1007/s10071-015-0933-6
    semantic_references:
      - id: zann_1996
        url: https://doi.org/10.1093/oso/9780198540793.001.0001
      - id: elie_theunissen_2015
        url: https://doi.org/10.1111/ejn.12812
      - id: elie_theunissen_2016
        url: https://doi.org/10.1007/s10071-015-0933-6
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Zann 1996 and Elie and Theunissen 2015 and 2016 recognize distress calls, but Elie and Theunissen 2016 reports substantial acoustic overlap and classifier confusion with Wsst calls. The call is retained, but the boundary is graded.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Sources agree on a noisy conflict call, but Elie and Theunissen 2016 shows Distress and Wsst calls overlap heavily in acoustic space and may partly reflect role or intensity within aggressive interactions.
    semantic_description_agreement: strong
    semantic_description_explanation: Zann 1996, Elie and Theunissen 2015, and Elie and Theunissen 2016 consistently distinguish the distress context as the attacked or escaping bird, even though the acoustic boundary with Wsst is imperfect.

  - name: thuk call
    in_primary_inventory: true
    alternative_names:
      - thuck call
      - thuk alarm call
      - parental alarm call
    scope: *adult_both_scope
    acoustic_keywords:
      - short
      - abrupt
      - quiet
      - noisy
      - repetitive
    acoustic_description: A very short, soft, abrupt alarm-related call. In later acoustic analyses it is one of the shortest zebra finch vocalizations and is partly separable from the captive Tuck alarm category.
    semantic_keywords:
      - alarm
      - predator
      - caregiving
      - attention
    semantic_description: Produced by adults, especially parenting birds, when danger or disturbance is detected but birds are reluctant to flee. Captive observations report production toward chicks and mates, with chicks stopping begging in response.
    acoustic_references:
      - id: zann_1996
        url: https://doi.org/10.1093/oso/9780198540793.001.0001
      - id: elie_theunissen_2015
        url: https://doi.org/10.1111/ejn.12812
      - id: elie_theunissen_2016
        url: https://doi.org/10.1007/s10071-015-0933-6
    semantic_references:
      - id: zann_1996
        url: https://doi.org/10.1093/oso/9780198540793.001.0001
      - id: elie_theunissen_2015
        url: https://doi.org/10.1111/ejn.12812
      - id: elie_theunissen_2016
        url: https://doi.org/10.1007/s10071-015-0933-6
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Zann 1996 lists Thuk as an alarm call and Elie and Theunissen 2015 and 2016 retain it, but some later work did not record thucks and Elie and Theunissen's additional Tuck category is captivity-based. Agreement is medium for the exact alarm-call taxonomy.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Zann 1996 and Elie and Theunissen 2016 support a short alarm call, but the Thuk/Tuck split is not field-established and acoustic overlap remains. The Thuk description is adequate but not as robust as distance calls or song.
    semantic_description_agreement: medium
    semantic_description_explanation: Zann 1996 and Elie and Theunissen 2016 agree on alarm and parental-warning contexts, but direct wild playback or predator-response evidence for Thuk alone is limited.

  - name: begging call
    in_primary_inventory: true
    alternative_names:
      - nestling begging call
      - food begging call
      - begging call bout
    scope:
      life_stages:
        - infant
        - juvenile
      sexes:
        - female
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - high_frequency
      - noisy
      - broadband
      - repetitive
      - loud
      - graded
    acoustic_description: A repeated, high-pitched begging vocalization that begins as soft cheeping in very young chicks and develops into loud, noisy broadband bouts in older nestlings and fledglings. Acoustic structure varies with development, physiological state, and brood context.
    semantic_keywords:
      - begging
      - caregiving
      - food
      - attention
    semantic_description: Produced by dependent young while gaping and soliciting food from parents. In wild birds, begging calls also provide social information to prospecting conspecifics at nest sites, and experimental corticosterone elevation shifts call spectra and affects parental behavior.
    acoustic_references:
      - id: zann_1996
        url: https://doi.org/10.1093/oso/9780198540793.001.0001
      - id: perez_etal_2016
        url: https://doi.org/10.1093/beheco/arw069
