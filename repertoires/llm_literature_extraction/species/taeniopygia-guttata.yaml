        url: https://doi.org/10.1007/s10071-015-0933-6
    playback_references: []
    call_type_existence_agreement: weak
    call_type_existence_explanation: Zann 1996 describes copulation calls, and Elie and Theunissen 2016 recorded examples but could not include them in analysis because quality and quantity were insufficient. The category is retained to honor the primary inventory, but evidence for a discrete type is weak.
    acoustic_description_agreement: weak
    acoustic_description_explanation: The available acoustic basis is mainly Zann 1996 plus Elie and Theunissen's note of a copulation whine example. No robust quantitative description separates this call from ordinary whines.
    semantic_description_agreement: medium
    semantic_description_explanation: Zann 1996 and Elie and Theunissen 2016 agree on copulation as the context, but whether this is a separate call type or a whine used during copulation is unresolved.

  - name: incubation call
    in_primary_inventory: false
    alternative_names:
      - heat call
      - v-call
      - heat-associated vocalization
      - heat whistle
    scope: *adult_both_scope
    acoustic_keywords:
      - high_frequency
      - quiet
      - frequency_modulated
      - tonal
      - short
      - repetitive
    acoustic_description: An extremely soft, high-frequency, frequency-modulated heat-associated sound. Earlier incubation-call work described 6-10 kHz, highly rhythmic calls produced in fast regular series, while later biophysical work measured chevron-shaped dominant frequencies near 6.8 kHz and very low source levels around 14 dB SPL at 1 m.
    semantic_keywords:
      - caregiving
    semantic_description: Originally interpreted as a parental acoustic cue produced during hot late-incubation conditions and capable, in experimental playback, of altering offspring development. Later wild nest-box, captive heat-exposure, and biophysical studies show that the sound depends strongly on heat and panting, can be produced outside reproduction, and may be too soft to function as an adaptive acoustic signal or cue.
    acoustic_references:
      - id: mariette_buchanan_2016
        url: https://doi.org/10.1126/science.aaf7049
      - id: mcdiarmid_etal_2018
        url: https://doi.org/10.1093/beheco/ary123
      - id: anttonen_etal_2025
        url: https://doi.org/10.1016/j.cub.2025.08.054
    semantic_references:
      - id: mariette_buchanan_2016
        url: https://doi.org/10.1126/science.aaf7049
      - id: mcdiarmid_etal_2018
        url: https://doi.org/10.1093/beheco/ary123
      - id: anttonen_etal_2025
        url: https://doi.org/10.1016/j.cub.2025.08.054
    playback_references:
      - id: mariette_buchanan_2016
        url: https://doi.org/10.1126/science.aaf7049
      - id: katsis_etal_2018
        url: https://doi.org/10.1038/s41598-018-33301-5
    call_type_existence_agreement: medium
    call_type_existence_explanation: Mariette and Buchanan 2016, McDiarmid et al. 2018, and Anttonen et al. 2025 all support a distinct heat-associated sound, but they disagree strongly on whether it should be understood as a communicative call. It is outside the Zann inventory.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Mariette and Buchanan 2016, McDiarmid et al. 2018, and Anttonen et al. 2025 agree that the sound is high-frequency, heat-associated, and rhythmically produced; Anttonen et al. 2025 adds calibrated source-level and production-mechanism evidence.
    semantic_description_agreement: weak
    semantic_description_explanation: Mariette and Buchanan 2016 and Katsis et al. 2018 use incubation-call playbacks as developmental acoustic treatments, but McDiarmid et al. 2018 shows production depends on heat rather than reproductive stage, and Anttonen et al. 2025 argues heat whistles are inaudible nonadaptive by-products of panting. Semantic agreement is therefore weak.

