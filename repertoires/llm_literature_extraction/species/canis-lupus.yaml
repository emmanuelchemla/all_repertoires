      - id: sadhukhan_etal_2019
        url: https://doi.org/10.1371/journal.pone.0216186
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: "Bark is a Schassburger 1993 major class and one of the broad wolf vocalization classes summarized by Harrington and Mech 1978 and Harrington and Asa 2003. Coscia et al. 1991, Passilongo et al. 2017, and Sadhukhan et al. 2019 add independent support for bark or bark-combination forms."
    acoustic_description_agreement: medium
    acoustic_description_explanation: "The cited sources agree on a short abrupt low broadband form, but bark grades into woof, bark-growl, and bark-howl combinations. Agreement is medium because quantitative work on standalone wild barks is less extensive than for howls."
    semantic_description_agreement: strong
    semantic_description_explanation: "Schassburger 1993, Harrington and Mech 1978, Harrington and Asa 2003, Passilongo et al. 2017, and Sadhukhan et al. 2019 consistently connect barks with alarm, defense, or aggressive motivation. The broad semantic interpretation is strongly supported despite graded acoustic boundaries."

  - name: moan
    in_primary_inventory: true
    alternative_names:
      - low moan
      - pup moan
      - social moan
    scope: *all_life_both_scope
    acoustic_keywords:
      - low_frequency
      - frequency_modulated
      - tonal
      - harmonic
      - long
      - quiet
      - graded
    acoustic_description: "A relatively low, soft, sustained vocalization with more tonal structure than a growl and a lower frequency range than most whines. In Schassburger's scheme it is a central member of the moan complex and grades toward whine-moan and growl-moan forms."
    semantic_keywords:
      - submission
      - affiliation
      - distress
      - caregiving
    semantic_description: "Described mainly in close-range social situations with mixed appeasement, discomfort, or care-related motivation. Infant accounts report moan-like sounds in early development, while adult accounts treat moans as low-intensity social signals rather than long-distance calls."
    acoustic_references:
      - id: schassburger_1993
        url: https://library.wur.nl/WebQuery/titel/578119
      - id: harrington_asa_2003
        url: https://doi.org/10.7208/9780226516981-007
      - id: coscia_etal_1991
        url: https://doi.org/10.1080/09524622.1991.9753190
    semantic_references:
      - id: schassburger_1993
        url: https://library.wur.nl/WebQuery/titel/578119
      - id: harrington_asa_2003
        url: https://doi.org/10.7208/9780226516981-007
      - id: coscia_etal_1991
