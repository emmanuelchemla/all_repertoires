scientific_name: Canis lupus
common_name: Gray wolf
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Mammalia
  order: Carnivora
  family: Canidae
  genus: Canis
  species: lupus
primary_inventory:
  id: schassburger_1993
  rationale: "Schassburger 1993 is used as the primary_inventory spine because it is the dedicated monograph on timber-wolf vocal communication and enumerates 11 major call classes: howl, whine, whimper, yelp, growl, snarl, woof, bark, moan, whine-moan, and growl-moan. Harrington and Asa 2003 review those classes as a graded repertoire with some weakly replicated boundaries, so every Schassburger major class is included here and the moan complex is marked with weak agreement where appropriate. Squeak is added as an outside-inventory call because later peer-reviewed work treats it as acoustically and contextually distinct rather than only a whistle-whimper variant."
calls:
  - name: howl
    in_primary_inventory: true
    alternative_names:
      - chorus howl
      - solo howl
      - flat howl
      - breaking howl
      - bark-howl
      - howl-bark
    scope: &all_life_both_scope
      life_stages:
        - infant
        - juvenile
        - adult
      sexes:
        - female
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - low_frequency
      - frequency_modulated
      - tonal
      - harmonic
      - long
      - loud
      - repetitive
      - multi_component
      - graded
    acoustic_description: "A long, loud, mostly tonal harmonic vocalization with a low to mid fundamental frequency and slow frequency modulation. Solo howls range from flat to breaking contours, while chorus howls contain overlapping individual howls and may incorporate short bark-howl or howl-bark components."
    semantic_keywords:
      - contact
      - group_coordination
      - territorial
      - spacing
      - identity
      - affiliation
    semantic_description: "Used for long-distance contact, pack assembly, spacing among packs, territorial advertisement, and social bonding. Field playback and elicitation studies show that response probability varies with pack location, pups, food resources, relationship quality, and other social or ecological factors, and acoustic analyses support individual and pack identity cues."
    acoustic_references:
      - id: schassburger_1993
        url: https://library.wur.nl/WebQuery/titel/578119
      - id: harrington_asa_2003
        url: https://doi.org/10.7208/9780226516981-007
      - id: theberge_falls_1967
        url: https://doi.org/10.1093/icb/7.2.331
      - id: harrington_1989
        url: https://doi.org/10.1080/09524622.1989.9753122
      - id: zaccaroni_etal_2012
        url: https://doi.org/10.1080/03949370.2012.664569
      - id: sadhukhan_etal_2019
        url: https://doi.org/10.1371/journal.pone.0216186
    semantic_references:
