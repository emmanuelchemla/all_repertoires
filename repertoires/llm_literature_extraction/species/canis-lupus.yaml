      - id: harrington_mech_1979
        url: https://doi.org/10.1163/156853979X00322
      - id: harrington_mech_1982
        url: https://doi.org/10.2307/3808560
      - id: harrington_mech_1983
        url: https://doi.org/10.1007/BF00343208
      - id: ausband_etal_2020
        url: https://doi.org/10.1111/eth.13041
    call_type_existence_agreement: strong
    call_type_existence_explanation: "Howl is a major Schassburger 1993 class and is independently treated as a core wolf call by Harrington and Asa 2003, Theberge and Falls 1967, Harrington and Mech 1979, Zaccaroni et al. 2012, and Sadhukhan et al. 2019. Authors split or name howl variants differently, but the call type itself is uncontested."
    acoustic_description_agreement: strong
    acoustic_description_explanation: "Schassburger 1993, Harrington and Asa 2003, Theberge and Falls 1967, Zaccaroni et al. 2012, and Sadhukhan et al. 2019 agree on a prolonged tonal harmonic structure with frequency modulation and graded variants. Chorus work adds complexity but does not contradict the basic acoustic description."
    semantic_description_agreement: strong
    semantic_description_explanation: "Harrington and Mech 1979, 1982, and 1983 show spacing and territorial roles through playback or simulated howling; Mazzini et al. 2013 and Ausband et al. 2020 add social and ecological predictors; Zaccaroni et al. 2012 supports pack identity. The major contexts are therefore strongly supported."

  - name: whine
    in_primary_inventory: true
    alternative_names:
      - long whine
      - social whine
      - submissive whine
    scope: *all_life_both_scope
    acoustic_keywords:
      - high_frequency
      - frequency_modulated
      - tonal
      - harmonic
      - short
      - quiet
      - graded
    acoustic_description: "A high-pitched harmonic call with a relatively pure tonal structure, usually soft and frequency modulated. It is longer and less abrupt than a yelp or squeak, but it grades into whimper and moan-like variants in some descriptions."
    semantic_keywords:
      - submission
      - affiliation
      - contact
      - begging
      - distress
    semantic_description: "Given at close range during appeasement, greeting, care solicitation, social contact, and frustrated or distressed motivation. Pup and adult accounts associate whines with social dependence or reduced aggression rather than threat displays."
    acoustic_references:
      - id: schassburger_1993
        url: https://library.wur.nl/WebQuery/titel/578119
      - id: harrington_asa_2003
        url: https://doi.org/10.7208/9780226516981-007
      - id: coscia_etal_1991
        url: https://doi.org/10.1080/09524622.1991.9753190
      - id: passilongo_etal_2017
        url: https://doi.org/10.4404/hystrix-28.2-12019
      - id: sadhukhan_etal_2019
        url: https://doi.org/10.1371/journal.pone.0216186
    semantic_references:
      - id: schassburger_1993
        url: https://library.wur.nl/WebQuery/titel/578119
      - id: harrington_asa_2003
        url: https://doi.org/10.7208/9780226516981-007
      - id: coscia_etal_1991
        url: https://doi.org/10.1080/09524622.1991.9753190
      - id: sadhukhan_etal_2019
        url: https://doi.org/10.1371/journal.pone.0216186
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: "Whine is a Schassburger 1993 major class and is retained by Harrington and Asa 2003, Coscia et al. 1991, Passilongo et al. 2017, and Sadhukhan et al. 2019. Agreement is medium because whines, whimpers, squeaks, and whine-moans form a graded high-frequency family that some studies merge and others split."
    acoustic_description_agreement: medium
    acoustic_description_explanation: "Schassburger 1993, Harrington and Asa 2003, Coscia et al. 1991, Passilongo et al. 2017, and Sadhukhan et al. 2019 agree that whines are high-frequency harmonic close-range sounds, but the exact duration and boundary with whimpers and squeaks differs among inventories."
    semantic_description_agreement: medium
    semantic_description_explanation: "Schassburger 1993, Harrington and Asa 2003, and Coscia et al. 1991 tie whines to submissive, affiliative, and care-soliciting situations, while Sadhukhan et al. 2019 treats Indian-wolf whines as part of a friendly/submissive harmonic set. The broad context is consistent, but subtype meanings are not sharply resolved."

  - name: whimper
    in_primary_inventory: true
    alternative_names:
      - short whine
      - whistle whimper
      - friendly whimper
    scope: *all_life_both_scope
    acoustic_keywords:
      - high_frequency
      - frequency_modulated
      - tonal
      - harmonic
      - short
      - quiet
      - graded
    acoustic_description: "A short, soft, high-pitched harmonic call with a clear tonal trace and frequency modulation. It is typically shorter than a whine and less abrupt than a yelp, and Schassburger's whistle-whimper subtype overlaps with later squeak terminology."
    semantic_keywords:
      - affiliation
      - submission
      - contact
      - begging
      - caregiving
    semantic_description: "Used at close range in friendly greeting, appeasement, contact with familiar pack members, and pup-adult interactions. It generally accompanies social approach or nonaggressive motivation."
    acoustic_references:
      - id: schassburger_1993
        url: https://library.wur.nl/WebQuery/titel/578119
      - id: harrington_asa_2003
        url: https://doi.org/10.7208/9780226516981-007
      - id: passilongo_etal_2017
        url: https://doi.org/10.4404/hystrix-28.2-12019
      - id: sadhukhan_etal_2019
        url: https://doi.org/10.1371/journal.pone.0216186
      - id: weir_etal_2022
        url: https://doi.org/10.1163/1568539X-bja10140
    semantic_references:
      - id: schassburger_1993
        url: https://library.wur.nl/WebQuery/titel/578119
      - id: harrington_asa_2003
        url: https://doi.org/10.7208/9780226516981-007
      - id: passilongo_etal_2017
        url: https://doi.org/10.4404/hystrix-28.2-12019
      - id: sadhukhan_etal_2019
        url: https://doi.org/10.1371/journal.pone.0216186
      - id: weir_etal_2022
        url: https://doi.org/10.1163/1568539X-bja10140
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: "Whimper is a Schassburger 1993 major class and appears in Harrington and Asa 2003, Passilongo et al. 2017, Sadhukhan et al. 2019, and Weir et al. 2022. Agreement is medium because later authors sometimes reserve whimper for one subtype and sometimes use squeak or social squeak for neighboring acoustic forms."
    acoustic_description_agreement: medium
    acoustic_description_explanation: "The cited sources agree on a short high-frequency harmonic structure, but Passilongo et al. 2017 and Sadhukhan et al. 2019 separate whimpers from squeaks while Schassburger 1993 included whistle-whimper variants. This supports the description but keeps the boundary agreement medium."
    semantic_description_agreement: medium
    semantic_description_explanation: "Schassburger 1993, Harrington and Asa 2003, Passilongo et al. 2017, Sadhukhan et al. 2019, and Weir et al. 2022 all place whimper-like calls in affiliative, submissive, or contact contexts. Agreement is medium because the precise division of friendly whimper versus squeak contexts varies."

  - name: yelp
    in_primary_inventory: true
    alternative_names:
      - sharp yelp
      - infant yelp
    scope: *all_life_both_scope
    acoustic_keywords:
      - high_frequency
      - frequency_modulated
      - tonal
      - harmonic
      - short
      - abrupt
      - loud
      - graded
    acoustic_description: "A short, abrupt, high-pitched harmonic call, often more intense and steeper in contour than a whimper or whine. It may occur singly or in short series and grades toward squeak-like calls at lower intensity."
    semantic_keywords:
      - distress
      - submission
      - attention
      - play
      - caregiving
    semantic_description: "Produced during sudden close-range distress, pain, fear, rough contact, or intense social interaction. In pups it can solicit adult attention, while adult accounts associate it with submissive or conflict-related situations."
    acoustic_references:
      - id: schassburger_1993
        url: https://library.wur.nl/WebQuery/titel/578119
      - id: harrington_asa_2003
        url: https://doi.org/10.7208/9780226516981-007
      - id: coscia_etal_1991
        url: https://doi.org/10.1080/09524622.1991.9753190
      - id: passilongo_etal_2017
        url: https://doi.org/10.4404/hystrix-28.2-12019
    semantic_references:
      - id: schassburger_1993
        url: https://library.wur.nl/WebQuery/titel/578119
      - id: harrington_asa_2003
        url: https://doi.org/10.7208/9780226516981-007
      - id: coscia_etal_1991
        url: https://doi.org/10.1080/09524622.1991.9753190
      - id: passilongo_etal_2017
        url: https://doi.org/10.4404/hystrix-28.2-12019
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: "Yelp is a Schassburger 1993 major class and is also listed by Harrington and Asa 2003, Coscia et al. 1991, and Passilongo et al. 2017. Agreement is medium because yelps sit near whimpers and squeaks in the high-frequency graded continuum and are less often analyzed quantitatively than howls, barks, or growls."
    acoustic_description_agreement: medium
    acoustic_description_explanation: "Schassburger 1993, Harrington and Asa 2003, Coscia et al. 1991, and Passilongo et al. 2017 support the short high-frequency abrupt structure. Fine acoustic boundaries are only moderately supported because sample sizes and subtype definitions vary."
    semantic_description_agreement: medium
    semantic_description_explanation: "Schassburger 1993 and Harrington and Asa 2003 associate yelps with intense close-range distress or submission, while Coscia et al. 1991 and Passilongo et al. 2017 add pup and chorus-context examples. Context agreement is moderate but not experimentally tested."

  - name: growl
    in_primary_inventory: true
    alternative_names:
      - low growl
      - bark-growl
      - growl-bark
    scope: *all_life_both_scope
    acoustic_keywords:
      - low_frequency
      - broadband
      - noisy
      - long
      - loud
      - graded
    acoustic_description: "A low, rough, broadband vocalization with noisy energy and variable duration. It can be sustained or pulsed, and it grades into bark-growl, growl-bark, snarl, and growl-moan forms as intensity and mouth posture change."
    semantic_keywords:
      - threat
      - aggression
      - display
      - territorial
      - submission
    semantic_description: "Used in close-range agonistic encounters, dominance displays, food defense, warnings, and tense interactions with pack members or outsiders. It signals aggressive or defensive motivation and often increases social distance."
    acoustic_references:
      - id: schassburger_1993
        url: https://library.wur.nl/WebQuery/titel/578119
      - id: harrington_asa_2003
        url: https://doi.org/10.7208/9780226516981-007
      - id: harrington_mech_1978
        url: https://doi.org/10.1016/B978-0-12-319250-9.50014-1
      - id: coscia_etal_1991
        url: https://doi.org/10.1080/09524622.1991.9753190
      - id: passilongo_etal_2017
        url: https://doi.org/10.4404/hystrix-28.2-12019
    semantic_references:
      - id: schassburger_1993
        url: https://library.wur.nl/WebQuery/titel/578119
      - id: harrington_asa_2003
        url: https://doi.org/10.7208/9780226516981-007
      - id: harrington_mech_1978
        url: https://doi.org/10.1016/B978-0-12-319250-9.50014-1
      - id: sadhukhan_etal_2019
        url: https://doi.org/10.1371/journal.pone.0216186
      - id: passilongo_etal_2017
        url: https://doi.org/10.4404/hystrix-28.2-12019
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: "Growl is a Schassburger 1993 major class and one of the broad classes retained by Harrington and Mech 1978 and Harrington and Asa 2003. Coscia et al. 1991, Passilongo et al. 2017, and Sadhukhan et al. 2019 also treat growls or growl-like calls as part of the wolf repertoire."
    acoustic_description_agreement: medium
    acoustic_description_explanation: "Schassburger 1993, Harrington and Mech 1978, Harrington and Asa 2003, Coscia et al. 1991, and Passilongo et al. 2017 agree that growls are low, rough, and noisy, but growls grade into snarls and bark-growl combinations and have less modern quantitative treatment than howls."
    semantic_description_agreement: strong
    semantic_description_explanation: "Schassburger 1993, Harrington and Mech 1978, Harrington and Asa 2003, Passilongo et al. 2017, and Sadhukhan et al. 2019 consistently associate growls with aggressive, dominance, or defensive contexts. This is one of the most stable short-range semantic assignments."

  - name: snarl
    in_primary_inventory: true
    alternative_names:
      - snarling growl
      - growl-snarl
    scope: &juvenile_adult_both_scope
      life_stages:
        - juvenile
        - adult
      sexes:
        - female
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - low_frequency
      - broadband
      - noisy
      - long
      - loud
      - graded
    acoustic_description: "A rough, low-frequency, broadband aggressive sound closely allied to growling, typically more intense and often associated with exposed teeth or open-mouth threat displays. Acoustic boundaries with growl are graded rather than sharply discrete."
    semantic_keywords:
      - threat
      - aggression
      - display
      - submission
    semantic_description: "Used in close-range threats, dominance contests, food defense, and escalated social conflict. It functions as a high-intensity warning or aggressive display and may precede attack or withdrawal."
    acoustic_references:
      - id: schassburger_1993
        url: https://library.wur.nl/WebQuery/titel/578119
      - id: harrington_asa_2003
        url: https://doi.org/10.7208/9780226516981-007
      - id: passilongo_etal_2017
        url: https://doi.org/10.4404/hystrix-28.2-12019
    semantic_references:
      - id: schassburger_1993
        url: https://library.wur.nl/WebQuery/titel/578119
      - id: harrington_asa_2003
        url: https://doi.org/10.7208/9780226516981-007
      - id: passilongo_etal_2017
        url: https://doi.org/10.4404/hystrix-28.2-12019
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: "Snarl is a Schassburger 1993 major class and is reviewed by Harrington and Asa 2003; Passilongo et al. 2017 also lists snarls among aggressive wolf vocalizations. Agreement is medium because many accounts treat snarling as a growl-associated display rather than a fully independent acoustic class."
    acoustic_description_agreement: weak
    acoustic_description_explanation: "The sources agree that snarls are rough, low, and growl-like, but there are few quantitative acoustic measurements of snarls separate from growls. The weak label reflects limited acoustic replication and a strongly graded boundary."
    semantic_description_agreement: medium
    semantic_description_explanation: "Schassburger 1993, Harrington and Asa 2003, and Passilongo et al. 2017 consistently place snarls in aggressive or threat contexts. The semantic label is medium because the context is stable, but the call is often conflated with growl display complexes."

  - name: woof
    in_primary_inventory: true
    alternative_names:
      - wuff
      - low bark
      - warning woof
    scope: *all_life_both_scope
    acoustic_keywords:
      - low_frequency
      - broadband
      - noisy
      - short
      - abrupt
      - quiet
      - graded
    acoustic_description: "A short, low, abrupt broadband sound that is softer and less explosive than a full bark. It has little sustained tonal structure and grades toward bark as amplitude and intensity increase."
    semantic_keywords:
      - alarm
      - threat
      - attention
      - caregiving
    semantic_description: "Produced as a short-range warning or alert call, especially when an adult detects disturbance near pups or a den, and in other close-range defensive contexts. It can draw the attention of nearby pack members without the intensity of full barking."
    acoustic_references:
      - id: schassburger_1993
        url: https://library.wur.nl/WebQuery/titel/578119
      - id: harrington_asa_2003
        url: https://doi.org/10.7208/9780226516981-007
      - id: coscia_etal_1991
        url: https://doi.org/10.1080/09524622.1991.9753190
      - id: passilongo_etal_2017
        url: https://doi.org/10.4404/hystrix-28.2-12019
    semantic_references:
      - id: schassburger_1993
        url: https://library.wur.nl/WebQuery/titel/578119
      - id: harrington_asa_2003
        url: https://doi.org/10.7208/9780226516981-007
      - id: coscia_etal_1991
        url: https://doi.org/10.1080/09524622.1991.9753190
      - id: passilongo_etal_2017
        url: https://doi.org/10.4404/hystrix-28.2-12019
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: "Woof is a Schassburger 1993 major class and is retained by Harrington and Asa 2003, Coscia et al. 1991, and Passilongo et al. 2017. Agreement is medium because woofs are frequently described as low-intensity barks and the boundary between woof and bark is graded."
    acoustic_description_agreement: medium
    acoustic_description_explanation: "Schassburger 1993, Harrington and Asa 2003, Coscia et al. 1991, and Passilongo et al. 2017 agree on a short low noisy form, but quantitative separation from bark is limited. The acoustic label is therefore medium rather than strong."
    semantic_description_agreement: medium
    semantic_description_explanation: "Schassburger 1993, Harrington and Asa 2003, and Coscia et al. 1991 associate woofs with alerting, disturbance, or care-related contexts near pups; Passilongo et al. 2017 places woof among aggressive vocalizations. The warning role is consistent, but context evidence is mostly descriptive."

  - name: bark
    in_primary_inventory: true
    alternative_names:
      - warning bark
      - alarm bark
      - bark-growl
      - growl-bark
    scope: *all_life_both_scope
    acoustic_keywords:
      - low_frequency
      - broadband
      - noisy
      - short
      - abrupt
      - loud
      - repetitive
      - graded
    acoustic_description: "A short, explosive, low-pitched broadband call with abrupt onset and relatively high amplitude. Barks may occur singly or in repeated bouts and grade into woofs, bark-growls, and bark-howls when combined with neighboring call forms."
    semantic_keywords:
      - alarm
      - threat
      - aggression
      - attention
      - caregiving
    semantic_description: "Used in immediate defensive or alarm situations, including disturbance at den or rendezvous sites, pup defense, food defense, and close-range confrontation with humans, other wolves, or other threats. It can recruit attention and warn nearby pack members."
    acoustic_references:
      - id: schassburger_1993
        url: https://library.wur.nl/WebQuery/titel/578119
      - id: harrington_mech_1978
        url: https://doi.org/10.1016/B978-0-12-319250-9.50014-1
      - id: harrington_asa_2003
        url: https://doi.org/10.7208/9780226516981-007
      - id: coscia_etal_1991
        url: https://doi.org/10.1080/09524622.1991.9753190
      - id: passilongo_etal_2017
        url: https://doi.org/10.4404/hystrix-28.2-12019
      - id: sadhukhan_etal_2019
        url: https://doi.org/10.1371/journal.pone.0216186
    semantic_references:
      - id: schassburger_1993
        url: https://library.wur.nl/WebQuery/titel/578119
      - id: harrington_mech_1978
        url: https://doi.org/10.1016/B978-0-12-319250-9.50014-1
