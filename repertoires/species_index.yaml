# Core species candidates for the repertoire database.
# Grouped by family. A species is "done" iff species/<kebab-name>.yaml exists.

# Species were selected to prioritize taxa for which vocal repertoires are likely to support comparative analysis of call-type structure. We favored species with discrete, named, and literature-supported vocal or acoustic signal classes, especially where both acoustic form and behavioral context have been described from wild populations. To reduce redundancy, closely related species with similar expected repertoires were pruned unless they added clear comparative value, while taxa with strongly graded, weakly contextualized, or primarily individual-level acoustic variation were retained only when they represented especially important systems such as cetacean vocal culture. The resulting core set comprises 129 species across 58 families.

# Study-fit tags support broad cross-species call-type analyses:
# - semantic_knowledge: likely availability of context/function descriptions for multiple call types (high | medium | low).
# - acoustic_knowledge: likely availability of acoustic descriptions or measurements for call types (high | medium | low).
# - repertoire_scope: likely number and discreteness of documented call types (high | medium | low).
# - call_type_study_fit: include by default (include), include only after targeted literature check (caution), or exclude from broad call-type analyses (exclude).
# - study_group_species: optional list of taxa that may be pooled with the anchor species for repertoire extraction rather than entered as separate target species.
# - study_group_note: optional short label explaining why the anchor and listed taxa may need to be treated as one study group.

