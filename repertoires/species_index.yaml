# Core species candidates for the repertoire database.
# Grouped by family. A species is "done" iff species/<kebab-name>.yaml exists.

# Species were selected to prioritize taxa for which vocal repertoires are likely to support comparative analysis of call-type structure. We favored species with discrete, named, and literature-supported vocal or acoustic signal classes, especially where both acoustic form and behavioral context have been described from wild populations. To reduce redundancy, closely related species with similar expected repertoires were pruned unless they added clear comparative value, while taxa with strongly graded, weakly contextualized, or primarily individual-level acoustic variation were retained only when they represented especially important systems such as cetacean vocal culture. The resulting core set comprised 100 species across 47 families, including 28 primates, 28 birds, 12 rodents and bats, 10 terrestrial carnivores, 9 marine mammals, 9 frogs, and 4 elephants or ungulates.

