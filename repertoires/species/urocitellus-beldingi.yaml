primary_inventory:
  id: leger_etal_1984
  rationale: Leger et al. 1984 is used as the primary_inventory spine because it is a peer-reviewed field study explicitly titled around the vocalizations of wild Belding's ground squirrels, uses sonagrams and acoustic measurements, and distinguishes the main trill, chirp/whistle, and distress-like vocal classes across predator, post-copulatory, and agonistic contexts. Later alarm-call studies refine the best-studied predator contexts, but Leger et al. 1984 is broad enough to pass the full-inventory subset threshold.
