scientific_name: Tursiops truncatus
common_name: Common Bottlenose Dolphin
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Mammalia
  order: Cetacea
  family: Delphinidae
  genus: Tursiops
  species: truncatus
primary_inventory:
  id: jones_etal_2020
  rationale: Jones et al. 2020 is used as the primary inventory because it reviews and standardizes the defining characteristics and acoustic criteria of sounds produced by bottlenose dolphins. Regional repertoire studies and focused signature-whistle work are used to ground context and function.
calls:
  - name: signature whistle
    alternative_names:
      - stereotyped whistle
    in_primary_inventory: true
    scope: &all_scope
      life_stages: [juvenile, adult]
      sexes: [female, male]
      population_specific: false
      note: ""
    acoustic_keywords: [tonal, frequency_modulated, long, high_frequency]
    acoustic_description: Narrow-band frequency-modulated whistle contour, often individually distinctive and repeated in stereotyped bouts.
    semantic_keywords: [contact, identity, group_coordination]
    semantic_description: Used for individual identity and contact, especially during separation, reunion, and coordination among associates.
    acoustic_references:
      - id: jones_etal_2020
        url: https://doi.org/10.1080/09524622.2019.1613265
      - id: sayigh_etal_1999
        url: https://doi.org/10.1073/pnas.96.25.14216
    semantic_references:
      - id: sayigh_etal_1999
        url: https://doi.org/10.1073/pnas.96.25.14216
      - id: janik_sayigh_2013
        url: https://doi.org/10.1016/j.cub.2013.03.034
    playback_references:
      - id: sayigh_etal_1999
        url: https://doi.org/10.1073/pnas.96.25.14216
    call_type_existence_agreement: strong
    call_type_existence_explanation: Signature whistles are central to bottlenose dolphin communication and are covered by Jones et al. 2020, Sayigh et al. 1999, and Janik and Sayigh 2013.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Sources agree on individually distinctive frequency-modulated whistle contours, though details vary among individuals.
    semantic_description_agreement: strong
    semantic_description_explanation: Playback and long-term field studies strongly support identity and contact functions.

  - name: variant whistle
    alternative_names:
      - non-signature whistle
    in_primary_inventory: true
    scope: *all_scope
    acoustic_keywords: [tonal, frequency_modulated, high_frequency, graded]
    acoustic_description: Frequency-modulated tonal whistle that is less stereotyped than signature whistles and varies across contexts and populations.
    semantic_keywords: [contact, affiliation, group_coordination]
    semantic_description: Produced in social interactions, group travel, and affiliative contexts where individual signature use is not the sole function.
    acoustic_references:
      - id: jones_etal_2020
        url: https://doi.org/10.1080/09524622.2019.1613265
      - id: gridley_etal_2015
        url: https://doi.org/10.1080/09524622.2015.1014851
    semantic_references:
      - id: jones_etal_2020
        url: https://doi.org/10.1080/09524622.2019.1613265
      - id: papale_etal_2021
        url: https://doi.org/10.1038/s41598-021-90710-9
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Non-signature or variant whistles are recognized in the review and regional repertoire studies.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Tonal whistle structure is consistent, but category boundaries and names vary among studies.
    semantic_description_agreement: medium
    semantic_description_explanation: Social use is broadly supported, while specific functions remain less resolved than signature whistles.

  - name: burst-pulse sound
    alternative_names:
      - burst pulse
      - squawk
      - squeal
    in_primary_inventory: true
    scope: *all_scope
    acoustic_keywords: [broadband, pulsed, short, noisy, repetitive]
    acoustic_description: Rapid burst of click-like pulses with short inter-pulse intervals, often perceived as a squawk or squeal.
    semantic_keywords: [aggression, affiliation, group_coordination, attention]
    semantic_description: Common in social interactions, especially high-arousal or agonistic events, but also appears in coordinated group activity.
    acoustic_references:
      - id: jones_etal_2020
        url: https://doi.org/10.1080/09524622.2019.1613265
      - id: branstetter_etal_2012
        url: https://doi.org/10.1121/1.3676694
    semantic_references:
      - id: mercera_etal_2023
        url: https://doi.org/10.1007/s00114-023-01884-3
      - id: jones_etal_2020
        url: https://doi.org/10.1080/09524622.2019.1613265
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Burst-pulse sounds are one of the standard bottlenose dolphin sound categories in Jones et al. 2020 and directional measurements by Branstetter et al. 2012.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Rapid pulsed broadband structure is stable across studies.
    semantic_description_agreement: medium
    semantic_description_explanation: Social and high-arousal use is supported, but recent work shows context-dependent use is more flexible than simple agonistic labels.

  - name: bray
    alternative_names:
      - bray call
    in_primary_inventory: true
    scope: *all_scope
    acoustic_keywords: [pulsed, repetitive, noisy, multi_component]
    acoustic_description: Repeated pulsed sound sequence, often composed of stereotyped bray elements in some populations.
    semantic_keywords: [food, group_coordination, recruitment]
    semantic_description: Associated with foraging and feeding in some populations, though occurrence and stereotypy vary geographically.
    acoustic_references:
      - id: jones_etal_2020
        url: https://doi.org/10.1080/09524622.2019.1613265
      - id: gridley_etal_2015
        url: https://doi.org/10.1080/09524622.2015.1014851
    semantic_references:
      - id: jones_etal_2020
        url: https://doi.org/10.1080/09524622.2019.1613265
      - id: papale_etal_2021
        url: https://doi.org/10.1038/s41598-021-90710-9
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Brays are described as a recognizable bottlenose dolphin sound type, but their presence and stereotypy vary by population.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Repeated pulsed structure is supported, but regional studies differ in how often brays occur and how stereotyped they are.
    semantic_description_agreement: medium
    semantic_description_explanation: Feeding associations are common but not universal, so the function is population dependent.
references:
  jones_etal_2020:
    citation: "Jones, B. L., Zapetis, M., Samuelson, M. M., & Ridgway, S. H. (2020). Sounds produced by bottlenose dolphins (Tursiops): a review of the defining characteristics and acoustic criteria of the dolphin vocal repertoire. Bioacoustics, 29(4), 399-440."
    url: https://doi.org/10.1080/09524622.2019.1613265
    doi: 10.1080/09524622.2019.1613265
  sayigh_etal_1999:
    citation: "Sayigh, L. S., Tyack, P. L., Wells, R. S., Solow, A. R., Scott, M. D., & Irvine, A. B. (1999). Individual recognition in wild bottlenose dolphins: a field test using playback experiments. Proceedings of the National Academy of Sciences, 96, 14216-14221."
    url: https://doi.org/10.1073/pnas.96.25.14216
    doi: 10.1073/pnas.96.25.14216
  janik_sayigh_2013:
    citation: "Janik, V. M., & Sayigh, L. S. (2013). Communication in bottlenose dolphins: 50 years of signature whistle research. Journal of Comparative Physiology A, 199, 479-489."
    url: https://doi.org/10.1007/s00359-013-0817-7
    doi: 10.1007/s00359-013-0817-7
  gridley_etal_2015:
    citation: "Gridley, T., Elwen, S. H., Rashley, G., Badenas Krakauer, A., Heiler, J., & Roux, J. P. (2015). The acoustic repertoire of wild common bottlenose dolphins (Tursiops truncatus) in Walvis Bay, Namibia. Bioacoustics, 24, 153-174."
    url: https://doi.org/10.1080/09524622.2015.1014851
    doi: 10.1080/09524622.2015.1014851
  branstetter_etal_2012:
    citation: "Branstetter, B. K., Moore, P. W., Finneran, J. J., Tormey, M. N., & Aihara, H. (2012). Directional properties of bottlenose dolphin clicks, burst-pulse, and whistle sounds. Journal of the Acoustical Society of America, 131, 1613-1621."
    url: https://doi.org/10.1121/1.3676694
    doi: 10.1121/1.3676694
  papale_etal_2021:
    citation: "Papale, E., et al. (2021). Vocal universals and geographic variations in the acoustic repertoire of the common bottlenose dolphin. Scientific Reports, 11, 11847."
    url: https://doi.org/10.1038/s41598-021-90710-9
    doi: 10.1038/s41598-021-90710-9
  mercera_etal_2023:
    citation: "Mercera, B., et al. (2023). Study of repertoire use reveals unexpected context-dependent vocalizations in bottlenose dolphins (Tursiops truncatus). The Science of Nature, 110, 45."
    url: https://doi.org/10.1007/s00114-023-01884-3
    doi: 10.1007/s00114-023-01884-3
