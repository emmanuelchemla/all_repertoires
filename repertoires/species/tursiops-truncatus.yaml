scientific_name: Tursiops truncatus
common_name: Common bottlenose dolphin
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Mammalia
  order: Cetacea
  family: Delphinidae
  genus: Tursiops
  species: truncatus
primary_inventory:
  id: luis_etal_2021
  rationale: Luis et al. 2021 is used as the primary_inventory spine because it compares wild recordings from nine Atlantic and Mediterranean common bottlenose dolphin populations and identifies a shared acoustic repertoire organized into whistles, burst-pulsed sounds, bray-series elements, and bangs, with 24 signal subtypes. This file conservatively represents the broad wild-supported classes and the best-supported named call types rather than every regional subtype. Signature whistle and echolocation click train are retained as outside-spine entries because they are central, independently supported Tursiops truncatus sound types, while several regional or weakly contextualized labels such as chirps and low-frequency narrow-band sounds are left out.
calls:
  - name: signature whistle
    in_primary_inventory: false
    alternative_names:
      - individualized whistle
      - individually distinctive whistle
      - learned identity whistle
      - vocal label
    scope: &all_life_both_scope
      life_stages:
        - infant
        - juvenile
        - adult
      sexes:
        - female
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - high_frequency
      - frequency_modulated
      - tonal
      - harmonic
      - long
      - repetitive
      - graded
    acoustic_description: A narrow-band tonal whistle type whose individually distinctive information is carried mainly by the frequency-modulation contour rather than by voice quality. It is often produced in repeated loops or bouts, with start, end, minimum, and maximum frequencies varying among individuals and populations.
    semantic_keywords:
      - contact
      - identity
      - affiliation
      - attention
    semantic_description: Used by individuals to broadcast their own identity and in matching or copying exchanges that address a particular social partner. It is especially associated with maintaining or re-establishing social contact among familiar individuals in a fission-fusion society.
    acoustic_references:
      - id: janik_sayigh_2013
        url: https://doi.org/10.1007/s00359-013-0817-7
      - id: kriesell_etal_2014
        url: https://doi.org/10.1371/journal.pone.0106317
      - id: jones_etal_2020
        url: https://doi.org/10.1080/09524622.2019.1613265
    semantic_references:
      - id: janik_whistle_2000
        url: https://doi.org/10.1126/science.289.5483.1355
      - id: janik_sayigh_2013
        url: https://doi.org/10.1007/s00359-013-0817-7
      - id: king_janik_2013
        url: https://doi.org/10.1073/pnas.1304459110
    playback_references:
      - id: king_janik_2013
        url: https://doi.org/10.1073/pnas.1304459110
    call_type_existence_agreement: strong
    call_type_existence_explanation: Janik and Sayigh 2013 review five decades of signature-whistle research, Kriesell et al. 2014 identifies signature whistles in a wild Namibian population, Janik 2000 reports matching by wild Scottish dolphins, and King and Janik 2013 uses playback with wild dolphins. The named call type is strongly supported even though Luis et al. 2021 grouped whistles by contour rather than by signature status.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Janik and Sayigh 2013, Kriesell et al. 2014, and Jones et al. 2020 agree that signature whistles are narrow-band, frequency-modulated whistle contours with individual distinctiveness in the contour pattern. Agreement is strong for the broad acoustic form, while individual contours vary by animal and population.
    semantic_description_agreement: strong
    semantic_description_explanation: Janik 2000, Janik and Sayigh 2013, and King and Janik 2013 support identity, contact, and address-like use through wild matching observations, review evidence, and playback. The social-label interpretation is unusually strong for a nonhuman mammal signal.

  - name: whistle
    in_primary_inventory: true
    alternative_names:
      - frequency-modulated whistle
      - tonal whistle
      - non-signature whistle
      - narrow-band whistle
    scope: *all_life_both_scope
    acoustic_keywords:
      - high_frequency
      - frequency_modulated
      - tonal
      - harmonic
      - long
      - graded
    acoustic_description: A narrow-band tonal signal with a continuous frequency-modulated contour. Wild populations show multiple contour shapes, including sinusoidal, convex, concave, upsweep, downsweep, and constant-frequency forms; measured frequency ranges commonly span several kilohertz into the ultrasonic edge of common recording bandwidths.
    semantic_keywords:
      - contact
      - group_coordination
      - affiliation
      - identity
    semantic_description: Produced during social interaction, group cohesion, coordination, and changes in group composition or behavior. Some whistles carry individual identity, while the wider whistle class includes shared or non-signature contours whose specific meanings remain less resolved.
    acoustic_references:
      - id: luis_etal_2021
        url: https://doi.org/10.1038/s41598-021-90710-9
      - id: gridley_etal_2015
        url: https://doi.org/10.1080/09524622.2015.1014851
      - id: jones_etal_2020
        url: https://doi.org/10.1080/09524622.2019.1613265
    semantic_references:
      - id: quick_janik_2008
        url: https://doi.org/10.1037/0735-7036.122.3.305
      - id: janik_whistle_2000
        url: https://doi.org/10.1126/science.289.5483.1355
      - id: janik_sayigh_2013
        url: https://doi.org/10.1007/s00359-013-0817-7
      - id: luis_etal_2021
        url: https://doi.org/10.1038/s41598-021-90710-9
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Whistles are a primary Luis et al. 2021 category recorded across all nine wild populations and are also described in the Walvis Bay inventory by Gridley et al. 2015 and in the Jones et al. 2020 review. The broad whistle class is uncontested, even though sources split contours and signature status differently.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Luis et al. 2021, Gridley et al. 2015, and Jones et al. 2020 converge on narrow-band tonal frequency-modulated contours, with population-level variation in contour classes and frequency parameters. Agreement is strong for the broad acoustic description.
    semantic_description_agreement: medium
    semantic_description_explanation: Quick and Janik 2008, Janik 2000, Janik and Sayigh 2013, and Luis et al. 2021 all support social, contact, cohesion, and identity-related contexts for whistles. Agreement is medium because many non-signature whistle contours are still described acoustically rather than tied to tested receiver responses.

  - name: burst-pulsed sound
    in_primary_inventory: true
    alternative_names:
      - burst pulse
      - burst-pulse call
      - pulsed signal
      - high-rate pulsed sound
    scope: *all_life_both_scope
    acoustic_keywords:
      - broadband
      - noisy
      - pulsed
      - repetitive
      - short
      - multi_component
      - graded
    acoustic_description: A broadband pulsed signal made of rapidly repeated pulses with short inter-pulse intervals, commonly high enough that the pulses are perceived as a fused sound rather than separate clicks. Wild recordings show graded variation in pulse rate, duration, and spectral concentration, with several named subtypes separated by time-frequency structure.
    semantic_keywords:
      - aggression
      - threat
      - display
      - food
      - group_coordination
    semantic_description: Produced in a range of high-arousal social and foraging contexts, including agonistic encounters, displays, coordinated activity, and feeding-related events. The class is contextually broad, and several named subtypes have more specific regional or behavioral associations.
    acoustic_references:
      - id: luis_etal_2016
        url: https://doi.org/10.1371/journal.pone.0157781
      - id: luis_etal_2021
        url: https://doi.org/10.1038/s41598-021-90710-9
      - id: gridley_etal_2015
        url: https://doi.org/10.1080/09524622.2015.1014851
      - id: jones_etal_2020
        url: https://doi.org/10.1080/09524622.2019.1613265
    semantic_references:
      - id: luis_etal_2016
        url: https://doi.org/10.1371/journal.pone.0157781
      - id: luis_etal_2021
        url: https://doi.org/10.1038/s41598-021-90710-9
      - id: jones_etal_2020
        url: https://doi.org/10.1080/09524622.2019.1613265
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Burst-pulsed sounds are a primary Luis et al. 2021 repertoire category, are quantitatively analyzed in wild Sado estuary dolphins by Luis et al. 2016, are included in the Walvis Bay inventory by Gridley et al. 2015, and are synthesized by Jones et al. 2020. The broad class is strongly supported.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Luis et al. 2016, Luis et al. 2021, Gridley et al. 2015, and Jones et al. 2020 agree on broadband rapid-pulse structure with graded subtypes. Agreement is strong for the class, although subtype boundaries differ among studies.
    semantic_description_agreement: medium
    semantic_description_explanation: Luis et al. 2016 and Luis et al. 2021 associate several pulsed subtypes with feeding events, while Jones et al. 2020 reviews social and agonistic uses. The semantic label is medium because the broad class spans multiple contexts and receiver responses are rarely isolated by subtype.

  - name: bray call
    in_primary_inventory: true
    alternative_names:
      - bray
      - bray series
      - bray-call sequence
      - low-frequency bray call
    scope: *all_life_both_scope
    acoustic_keywords:
      - low_frequency
      - broadband
      - pulsed
      - repetitive
      - multi_component
      - graded
    acoustic_description: A multi-unit rhythmic sequence with repeated bray elements, often lower in frequency than whistles and organized into bouts. Studies separate multiple element or sequence variants, and transition probabilities among elements can be nonrandom.
    semantic_keywords:
      - food
      - recruitment
      - group_coordination
      - aggression
    semantic_description: Associated with feeding in several wild populations, including salmonid feeding in the Moray Firth and foraging-related bray-series contexts in later repertoire studies. Some populations or studies also link bray-series use to social or aggressive contexts, so the context is not restricted to one prey type.
    acoustic_references:
      - id: janik_food_2000
        url: https://doi.org/10.1098/rspb.2000.1091
      - id: luis_etal_2019
        url: https://doi.org/10.1080/09524622.2018.1443285
      - id: pace_etal_2022
        url: https://doi.org/10.3390/biology11030367
      - id: luis_etal_2021
        url: https://doi.org/10.1038/s41598-021-90710-9
    semantic_references:
      - id: janik_food_2000
        url: https://doi.org/10.1098/rspb.2000.1091
      - id: luis_etal_2021
        url: https://doi.org/10.1038/s41598-021-90710-9
      - id: pace_etal_2022
        url: https://doi.org/10.3390/biology11030367
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Janik 2000 documented food-related bray calls in wild Scottish dolphins, Luis et al. 2021 includes bray-series elements across the multi-population inventory, and Luis et al. 2019 plus Pace et al. 2022 analyze bray sequence structure in Portugal and the Mediterranean. The call type is strongly supported, although local variants differ.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Janik 2000, Luis et al. 2019, Pace et al. 2022, and Luis et al. 2021 all treat brays as structured repeated sequence elements, but the exact element sets and variants differ geographically. Agreement is medium for the broad acoustic description.
    semantic_description_agreement: medium
    semantic_description_explanation: Janik 2000 strongly links Moray Firth brays to salmonid feeding and subsequent approaches by conspecifics; Luis et al. 2021 reviews feeding, social, and aggressive associations, while Pace et al. 2022 emphasizes that some Mediterranean functions remain unresolved. The broad feeding association is supported, but semantic agreement is medium because context varies by population.

  - name: squawk
    in_primary_inventory: true
    alternative_names:
      - squawk burst-pulse
      - squawk pulsed call
    scope: *all_life_both_scope
    acoustic_keywords:
      - broadband
      - noisy
      - pulsed
      - repetitive
      - short
      - graded
    acoustic_description: A short broadband pulsed subtype with rapid pulse repetition and noisy spectral structure. It is separated from other pulsed signals by quantitative time-frequency features in wild recordings, but grades toward neighboring burst-pulse subtypes.
    semantic_keywords:
      - food
      - group_coordination
      - attention
    semantic_description: Most often reported within feeding-associated pulsed sequences in wild multi-population analyses. It can occur in temporal proximity to other foraging-related pulsed elements, so its independent contextual role remains only partly resolved.
    acoustic_references:
      - id: luis_etal_2016
        url: https://doi.org/10.1371/journal.pone.0157781
      - id: luis_etal_2021
        url: https://doi.org/10.1038/s41598-021-90710-9
      - id: jones_etal_2020
        url: https://doi.org/10.1080/09524622.2019.1613265
    semantic_references:
      - id: luis_etal_2016
        url: https://doi.org/10.1371/journal.pone.0157781
      - id: luis_etal_2021
        url: https://doi.org/10.1038/s41598-021-90710-9
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Squawk appears as a named pulsed subtype in Luis et al. 2016 and as one of the signal subtypes shared across all nine populations in Luis et al. 2021, with Jones et al. 2020 reviewing the naming problem for pulsed dolphin sounds. Agreement is medium because squawks are well supported as a subtype but boundaries with other burst-pulsed sounds are graded.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Luis et al. 2016 and Luis et al. 2021 support a short broadband pulsed acoustic profile, while Jones et al. 2020 cautions that historical names for similar sounds have not always been used consistently. The acoustic agreement is medium.
    semantic_description_agreement: weak
    semantic_description_explanation: Luis et al. 2016 and Luis et al. 2021 link squawks with feeding-associated pulsed sequences, but call-specific receiver responses and contexts outside feeding are not well tested. Semantic agreement is weak for the named subtype.

  - name: creak
    in_primary_inventory: true
    alternative_names:
      - creak burst-pulse
      - creaking pulsed signal
    scope: *all_life_both_scope
    acoustic_keywords:
      - broadband
      - noisy
      - pulsed
      - repetitive
      - short
      - graded
    acoustic_description: A rapidly repeated broadband pulsed subtype with short inter-pulse intervals and a creaking temporal texture. Quantitative studies separate it from squawks, bangs, and variable-rate click trains, while retaining it inside the broader pulsed-sound continuum.
    semantic_keywords:
      - food
      - group_coordination
    semantic_description: Reported in wild feeding-associated pulsed sequences and recorded across sampled populations. Its use is best understood as part of foraging-related acoustic sequences rather than as a stand-alone context with tested receiver meaning.
    acoustic_references:
      - id: luis_etal_2016
        url: https://doi.org/10.1371/journal.pone.0157781
      - id: luis_etal_2021
        url: https://doi.org/10.1038/s41598-021-90710-9
      - id: jones_etal_2020
        url: https://doi.org/10.1080/09524622.2019.1613265
    semantic_references:
      - id: luis_etal_2016
        url: https://doi.org/10.1371/journal.pone.0157781
      - id: luis_etal_2021
        url: https://doi.org/10.1038/s41598-021-90710-9
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Creaks are named in Luis et al. 2016 and are one of the pulsed subtypes shared across all nine populations in Luis et al. 2021. Agreement is medium because the label is supported in modern wild-repertoire work but remains one of several closely related pulsed categories.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Luis et al. 2016 and Luis et al. 2021 provide the main quantitative support for creaks as rapid broadband pulsed elements, while Jones et al. 2020 highlights broader terminological overlap among Tursiops pulsed sounds. Agreement is medium.
    semantic_description_agreement: weak
    semantic_description_explanation: Luis et al. 2016 and Luis et al. 2021 place creaks among feeding-related pulsed signals, but the specific contextual meaning of creaks alone has not been experimentally separated. Semantic agreement is weak.

  - name: bang
    in_primary_inventory: true
    alternative_names:
      - high-energy pulse
      - isolated pulse
      - bang pulse
    scope: *all_life_both_scope
    acoustic_keywords:
      - broadband
      - noisy
      - pulsed
      - short
      - abrupt
      - loud
    acoustic_description: A high-energy, isolated broadband pulse with abrupt onset and short duration. It is treated separately from pulse trains and bray-series elements because its energy is concentrated in single, conspicuous pulse events rather than repeated units.
    semantic_keywords:
      - food
      - attention
      - display
    semantic_description: Associated with prey detection or prey-startling during foraging in wild repertoire studies. Its possible role as an attention-getting or display sound remains less directly tested than its foraging association.
    acoustic_references:
      - id: luis_etal_2021
        url: https://doi.org/10.1038/s41598-021-90710-9
      - id: luis_etal_2016
        url: https://doi.org/10.1371/journal.pone.0157781
      - id: jones_etal_2020
        url: https://doi.org/10.1080/09524622.2019.1613265
    semantic_references:
      - id: luis_etal_2021
        url: https://doi.org/10.1038/s41598-021-90710-9
      - id: luis_etal_2016
        url: https://doi.org/10.1371/journal.pone.0157781
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Bangs are a primary Luis et al. 2021 category recorded at all nine sites, with high-energy isolated pulses also treated in Luis et al. 2016 and reviewed by Jones et al. 2020. Agreement is medium because the label is modern and useful, but historical pulsed-sound nomenclature overlaps with related names.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Luis et al. 2021 and Luis et al. 2016 support the isolated high-energy broadband-pulse description, and Jones et al. 2020 reviews related acoustic criteria. Agreement is medium because bang/pop naming and subtype boundaries are not uniform across the literature.
    semantic_description_agreement: medium
    semantic_description_explanation: Luis et al. 2021 links bangs to prey detection or startling, and Luis et al. 2016 treats related high-energy pulsed sounds in wild feeding contexts. Agreement is medium because direct playback tests of bang-specific responses are lacking.

  - name: echolocation click train
    in_primary_inventory: false
    alternative_names:
      - click train
      - biosonar click train
      - echolocation clicks
      - terminal buzz
      - variable-rate click train
    scope: *all_life_both_scope
    acoustic_keywords:
      - high_frequency
      - broadband
      - pulsed
      - repetitive
      - short
      - loud
    acoustic_description: A train of very short, high-frequency broadband clicks with variable inter-click intervals. Source-parameter measurements from free-ranging bottlenose dolphins report microsecond-scale click durations, high source levels, centroid frequencies from tens to over one hundred kilohertz, and strong directionality.
    semantic_keywords:
      - food
      - spacing
      - attention
    semantic_description: Used during object inspection, navigation, prey search, prey approach, and prey capture. During foraging, click timing changes as animals close on targets, and rapid buzz phases are associated with close-range prey-capture attempts.
    acoustic_references:
      - id: wahlberg_etal_2011
        url: https://doi.org/10.1121/1.3624822
      - id: nowacek_2005
        url: https://doi.org/10.1111/j.1748-7692.2005.tb01253.x
      - id: jones_etal_2020
        url: https://doi.org/10.1080/09524622.2019.1613265
    semantic_references:
      - id: nowacek_2005
        url: https://doi.org/10.1111/j.1748-7692.2005.tb01253.x
      - id: wahlberg_etal_2011
        url: https://doi.org/10.1121/1.3624822
      - id: jones_etal_2020
        url: https://doi.org/10.1080/09524622.2019.1613265
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Echolocation click trains are central to bottlenose dolphin bioacoustics, are described from wild foraging contexts by Nowacek 2005, quantified from free-ranging bottlenose dolphins by Wahlberg et al. 2011, and reviewed as a core Tursiops sound type by Jones et al. 2020. It is outside the Luis et al. 2021 spine because that inventory focused on selected vocal elements and treated only variable-rate click trains among its subtype set.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Wahlberg et al. 2011 provides wild source parameters for Tursiops clicks, while Nowacek 2005 and Jones et al. 2020 agree on trains of short broadband clicks with behavior-linked rate variation. Agreement is strong for the broad acoustic form.
    semantic_description_agreement: strong
    semantic_description_explanation: Nowacek 2005 links echolocation to specific wild foraging behaviors and habitat use, Wahlberg et al. 2011 frames the measured sounds as biosonar clicks from free-ranging animals, and Jones et al. 2020 reviews echolocation use in object detection and prey capture. Agreement is strong for inspection and foraging contexts.
