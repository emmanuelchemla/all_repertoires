scientific_name: Saccopteryx bilineata
common_name: Greater sac-winged bat
has_full_inventory: false
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Mammalia
  order: Chiroptera
  family: Emballonuridae
  genus: Saccopteryx
  species: bilineata
primary_inventory:
  id: behr_helversen_2004
  rationale: Behr and von Helversen 2004 is used as the primary_inventory spine because it is the peer-reviewed inventory that classified daytime vocalizations of 16 wild male S. bilineata from Costa Rica by acoustic properties and social context, explicitly listing seven vocalization types--echolocation pulses, barks, chatter, whistles, screeches, territorial songs, and courtship songs. Because this spine is adult-male and day-roost focused, later peer-reviewed pup, female, and distress-call studies are retained as outside-inventory calls when they provide separate acoustic and behavioral evidence.
calls:
  - name: territorial song
    in_primary_inventory: true
    alternative_names:
      - male territorial song
      - countersong
      - song
    scope: &adult_male_scope
      life_stages:
        - adult
      sexes:
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - low_frequency
      - frequency_modulated
      - tonal
      - noisy
      - harmonic
      - repetitive
      - multi_component
      - loud
    acoustic_description: A short, stereotyped, multi-element male song composed of repeated syllable types such as short tonal elements, buzzes, trills, noise bursts, and echolocation-like calls. Long buzz syllables are harsh, loud, and low in fundamental frequency, and song elements can be rhythmically organized.
    semantic_keywords:
      - territorial
      - threat
      - display
      - courtship
      - mating
    semantic_description: Produced mainly by territorial males at day roosts, especially around reoccupation and departure periods, to repel rivals, advertise territory-holder quality, and attract females. Playback work shows territorial males respond more strongly to lower-frequency songs, and field experiments show male song can attract dispersing females.
    acoustic_references:
      - id: behr_helversen_2004
        url: https://doi.org/10.1007/s00265-004-0768-7
      - id: behr_etal_2006
        url: https://doi.org/10.1093/beheco/arl013
      - id: burchardt_etal_2019
        url: https://doi.org/10.1098/rsos.181076
    semantic_references:
      - id: behr_helversen_2004
        url: https://doi.org/10.1007/s00265-004-0768-7
      - id: behr_etal_2006
        url: https://doi.org/10.1093/beheco/arl013
      - id: behr_etal_2009
        url: https://doi.org/10.1007/s00265-008-0677-2
      - id: knornschild_etal_2017
        url: https://doi.org/10.1038/s41598-017-14434-5
    playback_references:
      - id: behr_etal_2009
        url: https://doi.org/10.1007/s00265-008-0677-2
      - id: knornschild_etal_2017
        url: https://doi.org/10.1038/s41598-017-14434-5
    call_type_existence_agreement: strong
    call_type_existence_explanation: Behr and von Helversen 2004 separate territorial song from courtship song in wild Costa Rican males, Behr et al. 2006 analyzes territorial-song syllables and male quality, and Burchardt et al. 2019 uses territorial songs as one of three focal vocalization types. The call type is strongly established.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Behr and von Helversen 2004, Behr et al. 2006, and Burchardt et al. 2019 all describe territorial songs as multi-element male songs with tonal, buzz, trill, noisy, and echolocation-like components. Agreement is strong despite variation in element nomenclature across studies.
    semantic_description_agreement: strong
    semantic_description_explanation: Behr and von Helversen 2004 and Behr et al. 2006 support a territorial-quality display function, Behr et al. 2009 provides playback evidence for male responses to territorial-song frequency, and Knornschild et al. 2017 supports attraction of dispersing females by male songs.

  - name: courtship song
    in_primary_inventory: true
    alternative_names:
      - serenade
      - male courtship song
    scope: *adult_male_scope
    acoustic_keywords:
      - frequency_modulated
      - tonal
      - noisy
      - harmonic
      - long
      - repetitive
      - multi_component
      - graded
    acoustic_description: A long, complex male song produced in display bouts and built from variable elements, especially trills, noise bursts, short tonal calls, and quasi-constant-frequency calls. Trill parameters differ among males and can contribute to individual repertoires.
    semantic_keywords:
      - courtship
      - mating
      - display
      - identity
    semantic_description: Produced by adult males when displaying toward females, often as part of multimodal courtship that also includes wing-sac scent displays and hovering. It is associated with mate attraction, individual male display, and potential female choice.
    acoustic_references:
      - id: behr_helversen_2004
        url: https://doi.org/10.1007/s00265-004-0768-7
      - id: davidson_wilkinson_2004
        url: https://doi.org/10.1016/j.anbehav.2003.06.016
    semantic_references:
      - id: behr_helversen_2004
        url: https://doi.org/10.1007/s00265-004-0768-7
      - id: voigt_etal_2008
        url: https://doi.org/10.1644/08-MAMM-S-060.1
      - id: davidson_wilkinson_2004
        url: https://doi.org/10.1016/j.anbehav.2003.06.016
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Behr and von Helversen 2004 explicitly distinguishes courtship songs from territorial songs in wild male Saccopteryx bilineata, while Davidson and Wilkinson 2004 and Voigt et al. 2008 support the broader role of male acoustic display in this mating system.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Behr and von Helversen 2004 provides the clearest element-level description of trills, noise bursts, short tonal calls, and quasi-constant-frequency calls, and Davidson and Wilkinson 2004 independently reports tonal and noisy male call components in a wild Trinidad population.
    semantic_description_agreement: strong
    semantic_description_explanation: Behr and von Helversen 2004 reports courtship songs exclusively during male displays toward females, Davidson and Wilkinson 2004 links male song features to females in territories, and Voigt et al. 2008 places acoustic song within the multimodal sexual display system.

  - name: bark
    in_primary_inventory: true
    alternative_names:
      - bark call
      - male bark
    scope: *adult_male_scope
    acoustic_keywords:
      - high_frequency
      - frequency_modulated
      - tonal
      - short
      - abrupt
    acoustic_description: A short male call resembling an echolocation pulse in frequency range and modulation, but typically longer and with the spectral maximum emphasized in the fundamental frequency. The inventory reports barks around 10 ms in duration, longer than the shorter echolocation pulses recorded in the same roost context.
    semantic_keywords:
      - attention
      - threat
      - aggression
    semantic_description: Produced mainly by adult males at day roosts when no obvious interaction was underway, and sometimes during agonistic conflicts. The context suggests a low-intensity alert or mildly aggressive social signal rather than a song display.
    acoustic_references:
      - id: behr_helversen_2004
        url: https://doi.org/10.1007/s00265-004-0768-7
    semantic_references:
      - id: behr_helversen_2004
        url: https://doi.org/10.1007/s00265-004-0768-7
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Behr and von Helversen 2004 explicitly lists barks as one of seven daytime male vocalization types and separates them from echolocation pulses by duration and spectral emphasis. The label is medium because later work rarely treats bark as a focal call type.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Behr and von Helversen 2004 provides direct spectrographic criteria for bark structure, but independent acoustic replication is sparse. Agreement is medium because the primary inventory is detailed but mostly stands alone.
    semantic_description_agreement: medium
    semantic_description_explanation: Behr and von Helversen 2004 gives the observed noninteractive and agonistic contexts for barks. The label is medium because receiver effects and finer motivational distinctions have not been tested with playback.

  - name: chatter
    in_primary_inventory: true
    alternative_names:
      - chatter sequence
      - chatter train
    scope: *adult_male_scope
    acoustic_keywords:
      - high_frequency
      - frequency_modulated
      - tonal
      - short
      - repetitive
      - multi_component
    acoustic_description: A train of many brief calls, with sequences reaching up to several seconds and individual elements lasting only a few milliseconds. Single chatter elements resemble echolocation pulses but are usually more strongly modulated, and pauses within a train are regular enough to form a rhythmic sequence.
    semantic_keywords:
      - contact
      - affiliation
      - display
    semantic_description: Frequently emitted by roosting adult males throughout the day without an obvious immediate interaction. Chatter can also be embedded with other vocalization types and can transition into trill-like sequences within courtship songs, linking it to low-arousal roost communication and male display structure.
    acoustic_references:
      - id: behr_helversen_2004
        url: https://doi.org/10.1007/s00265-004-0768-7
    semantic_references:
      - id: behr_helversen_2004
        url: https://doi.org/10.1007/s00265-004-0768-7
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Behr and von Helversen 2004 includes chatter in the seven-type primary inventory and describes it as a sequence distinct from isolated barks, echolocation pulses, and songs. Agreement is medium because subsequent studies mention it mainly as part of the broader repertoire rather than analyzing it independently.
    acoustic_description_agreement: medium
    acoustic_description_explanation: The primary inventory gives clear acoustic criteria for chatter trains, including short repeated elements and regular pauses. The label is medium because detailed acoustic evidence is concentrated in that source.
    semantic_description_agreement: medium
    semantic_description_explanation: Behr and von Helversen 2004 reports frequent day-roost production without obvious dyadic interaction and notes transitions into courtship-song trills. The context is clear enough for medium support, but semantic interpretation remains partly inferential.

  - name: whistle
    in_primary_inventory: true
    alternative_names:
      - hover-flight whistle
      - inverted-V call
      - screech-inverted-V call
    scope: *adult_male_scope
    acoustic_keywords:
      - high_frequency
      - frequency_modulated
      - tonal
      - long
      - loud
    acoustic_description: A loud, stereotyped tonal male call with an upward frequency-modulated stroke that often ends in a downward modulation. The first harmonic is typically the loudest, placing the main energy near the ultrasonic range characteristic of echolocation pulses, while part of the call remains audible to humans.
    semantic_keywords:
      - courtship
      - mating
      - display
      - attention
    semantic_description: Produced by adult males during hover displays in front of females, synchronized with specialized wing strokes and scent-fanning behavior. Females often answer the hover display with screeches, and related Trinidad work links comparable screech-inverted-V male calls to female numbers in male territories.
    acoustic_references:
      - id: behr_helversen_2004
        url: https://doi.org/10.1007/s00265-004-0768-7
      - id: davidson_wilkinson_2004
        url: https://doi.org/10.1016/j.anbehav.2003.06.016
    semantic_references:
      - id: behr_helversen_2004
        url: https://doi.org/10.1007/s00265-004-0768-7
      - id: davidson_wilkinson_2004
        url: https://doi.org/10.1016/j.anbehav.2003.06.016
      - id: voigt_etal_2008
        url: https://doi.org/10.1644/08-MAMM-S-060.1
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Behr and von Helversen 2004 lists whistles as a distinct inventory type, and Davidson and Wilkinson 2004 analyzes comparable male screech-inverted-V vocalizations in the same mating system. Agreement is medium because terminology and syllable grouping differ between studies.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Behr and von Helversen 2004 provides the clearest whistle description, while Davidson and Wilkinson 2004 supports the existence of comparable tonal inverted-V components in male display calls. The label is medium because the exact mapping between terminology is not perfect.
    semantic_description_agreement: strong
    semantic_description_explanation: Behr and von Helversen 2004 ties whistles directly to male hover displays toward females, Davidson and Wilkinson 2004 links comparable display-call features to female territory membership, and Voigt et al. 2008 places these acoustic displays in the multimodal sexual signaling system.

  - name: screech
    in_primary_inventory: true
    alternative_names:
      - screech call
      - noisy screech
    scope:
      life_stages:
        - adult
      sexes:
        - female
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - broadband
      - noisy
      - harmonic
      - short
      - loud
      - graded
    acoustic_description: A broad-spectrum, noisy adult call with variable noisiness and sometimes discernible multiharmonic components. Screeches are typically longer than barks and echolocation pulses, and individual calls can include both noisy and multiharmonic sections.
    semantic_keywords:
      - aggression
      - threat
      - territorial
      - courtship
    semantic_description: Produced by both sexes during agonistic encounters, especially territorial conflicts. Female screeches are also common responses to male hover displays and often occur immediately before or alongside male whistles.
    acoustic_references:
      - id: behr_helversen_2004
        url: https://doi.org/10.1007/s00265-004-0768-7
      - id: davidson_wilkinson_2004
        url: https://doi.org/10.1016/j.anbehav.2003.06.016
    semantic_references:
      - id: behr_helversen_2004
        url: https://doi.org/10.1007/s00265-004-0768-7
      - id: davidson_wilkinson_2004
        url: https://doi.org/10.1016/j.anbehav.2003.06.016
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Behr and von Helversen 2004 identifies screeches as one of the seven inventory types and notes production by both sexes, while Davidson and Wilkinson 2004 reports screech-related responses in male call interactions. The label is medium because later studies use partly different composite-call terminology.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Behr and von Helversen 2004 provides direct broad-band and noisy acoustic descriptions, with Davidson and Wilkinson 2004 supporting comparable screech components in Trinidad male vocalizations. Agreement is medium because detailed measurements are limited and screeches can grade in noisiness.
    semantic_description_agreement: strong
    semantic_description_explanation: Behr and von Helversen 2004 reports screeches in agonistic and female response-to-hover contexts, and Davidson and Wilkinson 2004 independently associates screech calls with responses to other bats' calls and nearby social interactions. The social context is consistent across sources.

  - name: isolation call
    in_primary_inventory: false
    alternative_names:
      - pup isolation call
      - IC
    scope:
      life_stages:
        - infant
        - juvenile
        - adult
      sexes:
        - female
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - high_frequency
      - frequency_modulated
      - tonal
      - noisy
      - repetitive
      - multi_component
      - graded
    acoustic_description: A complex multisyllabic call containing introductory or simple variable elements followed by composite and stereotyped elements. Pup calls commonly contain several element types in a repeated sequence and encode individual, group, and age-related information in different syllable portions.
    semantic_keywords:
      - contact
      - caregiving
      - begging
      - identity
      - submission
      - affiliation
    semantic_description: Produced by pups to elicit maternal care and support mother-pup reunions. Related isolation-call forms also occur later in life, including use by young or subordinate males in affiliative or appeasement contexts, so the adult semantic scope is broader than pup care alone.
    acoustic_references:
      - id: knornschild_helversen_2008
        url: https://doi.org/10.1016/j.anbehav.2008.05.018
      - id: knornschild_etal_2012
        url: https://doi.org/10.1016/j.anbehav.2012.06.029
      - id: fernandez_knornschild_2017
        url: https://doi.org/10.12966/abc.04.05.2017
      - id: burchardt_etal_2019
        url: https://doi.org/10.1098/rsos.181076
    semantic_references:
      - id: knornschild_helversen_2008
        url: https://doi.org/10.1016/j.anbehav.2008.05.018
      - id: knornschild_etal_2012
        url: https://doi.org/10.1016/j.anbehav.2012.06.029
      - id: fernandez_knornschild_2017
        url: https://doi.org/10.12966/abc.04.05.2017
      - id: fernandez_knornschild_2020
        url: https://doi.org/10.3389/fevo.2020.00265
    playback_references:
      - id: knornschild_helversen_2008
        url: https://doi.org/10.1016/j.anbehav.2008.05.018
    call_type_existence_agreement: strong
    call_type_existence_explanation: Isolation calls are central in Knornschild and von Helversen 2008, Knornschild et al. 2012, Fernandez and Knornschild 2017, and Burchardt et al. 2019. These independent analyses of recognition, group signatures, ontogeny, and rhythm strongly agree that this is a discrete call type.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Knornschild and von Helversen 2008 describes complex multisyllabic pup calls, Knornschild et al. 2012 and Fernandez and Knornschild 2017 identify individual, group, and age signatures in syllable components, and Burchardt et al. 2019 quantifies element sequences and rhythm.
    semantic_description_agreement: strong
    semantic_description_explanation: Knornschild and von Helversen 2008 provides playback evidence that mothers discriminate own-pup isolation calls, Knornschild et al. 2012 links calls to group cohesion and social modification, and Fernandez and Knornschild 2020 documents adult male isolation-call production during pup-directed interactions.

  - name: maternal directive call
    in_primary_inventory: false
    alternative_names:
      - directive call
      - MD call
      - pup-directed female call
    scope:
      life_stages:
        - adult
      sexes:
        - female
      population_specific: false
      note: ""
    acoustic_keywords:
      - frequency_modulated
      - tonal
      - short
      - repetitive
      - multi_component
      - graded
    acoustic_description: A pup-directed female call produced as a monosyllabic series, usually several short syllables in succession. Compared with adult-directed female calls, maternal directive calls differ in timbre and have lower peak frequency.
    semantic_keywords:
      - caregiving
      - contact
      - attention
    semantic_description: Produced by mothers toward their own pups, especially in mother-pup communication during the pup's ontogeny and early flight or care-related interactions. It is a female pup-directed vocal feedback signal.
    acoustic_references:
      - id: fernandez_knornschild_2020
        url: https://doi.org/10.3389/fevo.2020.00265
      - id: knornschild_helversen_2008
        url: https://doi.org/10.1016/j.anbehav.2008.05.018
    semantic_references:
      - id: fernandez_knornschild_2020
        url: https://doi.org/10.3389/fevo.2020.00265
      - id: knornschild_helversen_2008
        url: https://doi.org/10.1016/j.anbehav.2008.05.018
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Fernandez and Knornschild 2020 directly analyzes maternal directive calls from wild colonies, and Knornschild and von Helversen 2008 provides the earlier mother-pup recognition framework. The label is medium because the named call type is well supported but detailed treatment is concentrated in one focused study.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Fernandez and Knornschild 2020 gives acoustic comparisons between pup-directed and adult-directed female vocalizations, including timbre and peak-frequency differences. Agreement is medium because fewer independent studies focus on the detailed acoustic form of maternal directive calls.
    semantic_description_agreement: medium
    semantic_description_explanation: Fernandez and Knornschild 2020 identifies maternal directive calls as female pup-directed vocalizations, and Knornschild and von Helversen 2008 supports the broader mother-pup communication context. The label is medium because the caregiving interpretation is direct but has not been tested independently with call-specific playback.

  - name: distress call
    in_primary_inventory: false
    alternative_names:
      - conspecific distress call
      - buzz syllable distress call
    scope:
      life_stages:
        - juvenile
        - adult
      sexes:
        - unknown
      population_specific: false
      note: ""
    acoustic_keywords:
      - broadband
      - noisy
      - pulsed
      - repetitive
      - multi_component
      - loud
      - graded
    acoustic_description: A loud, noisy, multi-syllable distress vocalization with several described categories; the most common playback stimulus category consists of buzz syllables with a tonal part. Spectrograms show broad-band energy and pulsed buzz structure.
    semantic_keywords:
      - distress
      - alarm
      - predator
      - attention
    semantic_description: Produced under extreme physical distress, such as capture-like predator contexts. Playback experiments show that conspecifics are attracted to distress calls within or near day roosts, consistent with threat assessment or mobbing.
    acoustic_references:
      - id: eckenweber_knornschild_2016
        url: https://doi.org/10.1098/rsos.160151
    semantic_references:
      - id: eckenweber_knornschild_2016
        url: https://doi.org/10.1098/rsos.160151
    playback_references:
      - id: eckenweber_knornschild_2016
        url: https://doi.org/10.1098/rsos.160151
    call_type_existence_agreement: medium
    call_type_existence_explanation: Eckenweber and Knornschild 2016 analyzes distress calls, separates distress-call categories, and uses them in conspecific playback experiments with wild Saccopteryx bilineata. The call type is directly supported, but the label is medium because detailed S. bilineata evidence is concentrated in one focused primary study.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Eckenweber and Knornschild 2016 provides the focused acoustic evidence and spectrographic categories, but the description is mostly from one study. Agreement is medium because independent acoustic replication is limited.
    semantic_description_agreement: medium
    semantic_description_explanation: Eckenweber and Knornschild 2016 explicitly frames these calls as signals of extreme physical distress and demonstrates location-dependent conspecific responses in playback experiments. The label is medium because the behavioral evidence is experimental but comes from one focal study.

  - name: echolocation call
    in_primary_inventory: true
    alternative_names:
      - echolocation pulse
      - search call
      - frequency-alternating call
    scope:
      life_stages:
        - juvenile
        - adult
      sexes:
        - female
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - high_frequency
      - frequency_modulated
      - tonal
      - short
      - repetitive
      - multi_component
    acoustic_description: A high-frequency ultrasonic pulse emitted in sequences. Search sequences can be monotonous around a stable frequency or frequency-alternating with low-note and high-note calls, and release recordings show rhythmic trains of many short elements.
    semantic_keywords:
      - food
      - group_coordination
      - identity
      - spacing
    semantic_description: Used for orientation, navigation, and insect prey capture during flight, with frequency-alternating sequences associated with active foraging. Echolocation sequences can also contain sex-specific or individual information, so they may contribute to social communication beyond sonar.
    acoustic_references:
      - id: ratcliffe_etal_2011
        url: https://doi.org/10.1007/s00359-011-0630-0
      - id: burchardt_etal_2019
        url: https://doi.org/10.1098/rsos.181076
    semantic_references:
      - id: ratcliffe_etal_2011
        url: https://doi.org/10.1007/s00359-011-0630-0
      - id: burchardt_etal_2019
        url: https://doi.org/10.1098/rsos.181076
      - id: knornschild_helversen_2008
        url: https://doi.org/10.1016/j.anbehav.2008.05.018
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Ratcliffe et al. 2011 directly records echolocation calls in Panama, Burchardt et al. 2019 analyzes echolocation call sequences from wild Costa Rican bats, and Behr and von Helversen 2004 includes echolocation pulses in the broader repertoire. The call type is uncontroversial.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Ratcliffe et al. 2011 describes monotonous and frequency-alternating sequences with low-note and high-note calls, while Burchardt et al. 2019 quantifies rhythmic echolocation call trains. These studies agree on repeated high-frequency pulse sequences.
    semantic_description_agreement: medium
    semantic_description_explanation: Ratcliffe et al. 2011 supports a foraging/orientation role, Burchardt et al. 2019 treats echolocation sequences alongside social vocalizations, and Knornschild and von Helversen 2008 finds mother echolocation pulse trains carry weaker individual distinctiveness. Agreement is medium because sonar and social-information roles are partly separate.

