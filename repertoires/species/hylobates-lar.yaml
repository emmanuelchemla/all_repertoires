primary_inventory:
  id: clarke_etal_2015
  rationale: No single recent paper enumerates the complete lar gibbon repertoire as an inventory in the same way as some primate repertoire papers. Clarke et al. 2015 is used as the spine because it analyzes the most common close-range call, the hoo, across natural contexts, while classic and recent song studies cover the conspicuous duet and great-call components.
