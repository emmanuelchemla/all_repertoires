    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Growls are a standard domestic cat call type in Moelk 1944 and later cat communication reviews.
    acoustic_description_agreement: medium
    acoustic_description_explanation: The harsh low-frequency structure is stable, but detailed acoustic measurement is less extensive than for meows and purrs.
    semantic_description_agreement: strong
    semantic_description_explanation: Threat and aggression contexts are consistent across sources.

  - name: hiss
    alternative_names:
      - spit
    in_primary_inventory: true
    scope:
      life_stages: [juvenile, adult]
      sexes: [female, male]
      population_specific: false
      note: ""
    acoustic_keywords: [broadband, noisy, long, loud]
    acoustic_description: Sustained broadband aperiodic noise generated by forced airflow, sometimes accompanied by a short explosive spit.
    semantic_keywords: [threat, aggression, alarm]
    semantic_description: Produced during defensive threat displays when a cat is frightened, cornered, or repelling approach.
    acoustic_references:
      - id: moelk_1944
        url: https://doi.org/10.2307/1416947
      - id: schotz_etal_2016
