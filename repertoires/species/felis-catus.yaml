    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Meows are a core Moelk 1944 call type and receive focused acoustic and perception analysis in later studies.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Sources agree on a variable tonal, contour-rich call, although subtypes grade continuously.
    semantic_description_agreement: strong
    semantic_description_explanation: Human-directed attention and solicitation functions are consistently reported.

  - name: purr
    alternative_names:
      - purring
    in_primary_inventory: true
    scope:
      life_stages: [infant, juvenile, adult]
      sexes: [female, male]
      population_specific: false
      note: ""
    acoustic_keywords: [low_frequency, tonal, repetitive, pulsed, long, quiet]
    acoustic_description: Low-frequency continuous pulsed vocalization with alternating egressive and ingressive phases.
    semantic_keywords: [affiliation, caregiving, begging, contact]
    semantic_description: Produced in affiliative contexts such as nursing, resting, and human interaction, and in solicitation contexts when food or attention is sought.
    acoustic_references:
      - id: moelk_1944
        url: https://doi.org/10.2307/1416947
      - id: mccomb_etal_2009
        url: https://doi.org/10.1016/j.cub.2009.05.033
    semantic_references:
