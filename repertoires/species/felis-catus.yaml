primary_inventory:
  id: moelk_1944
  rationale: Moelk 1944 is used as the primary inventory because it is the classic systematic description of domestic cat vocal sounds and remains the basis for many later reviews and acoustic studies. Later work on meows, purrs, and human-directed communication is used for context and acoustic refinement.
calls:
  - name: meow
    alternative_names:
      - miaow
      - mew
    in_primary_inventory: true
    scope:
      life_stages: [infant, juvenile, adult]
      sexes: [female, male]
      population_specific: false
      note: ""
    acoustic_keywords: [tonal, frequency_modulated, short, graded]
    acoustic_description: Tonal or mixed-voice call with variable pitch contour and duration, grading across mew, meow, and related vowel-like forms.
    semantic_keywords: [attention, contact, caregiving, food]
    semantic_description: Common in cat-human and mother-young interactions, often used to solicit attention, food, or care.
    acoustic_references:
      - id: moelk_1944
        url: https://doi.org/10.2307/1416947
      - id: nicastro_owren_2003
