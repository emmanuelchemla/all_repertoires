      sexes: [female, male]
      population_specific: false
      note: ""
    acoustic_keywords: [low_frequency, noisy, long, broadband, graded]
    acoustic_description: Low harsh sustained vocalization with broadband noise and variable amplitude.
    semantic_keywords: [threat, aggression]
    semantic_description: Produced in agonistic contexts to warn or threaten conspecifics, humans, or other animals.
    acoustic_references:
      - id: moelk_1944
        url: https://doi.org/10.2307/1416947
      - id: schotz_etal_2016
