        url: https://doi.org/10.1016/j.cub.2009.05.033
      - id: schotz_etal_2016
        url: https://doi.org/10.21437/SpeechProsody.2016-37
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Purring is a classic Moelk 1944 category and has modern acoustic work on solicitation purrs.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Low-frequency pulsed structure is consistent across sources.
    semantic_description_agreement: strong
    semantic_description_explanation: Affiliation and solicitation contexts are strongly supported, especially by McComb et al. 2009.

  - name: growl
    alternative_names:
      - snarl
    in_primary_inventory: true
    scope:
