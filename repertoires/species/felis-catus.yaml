    acoustic_keywords: [tonal, short, frequency_modulated, repetitive]
    acoustic_description: Short voiced rolling or chirruping call with rapid modulation and tonal structure.
    semantic_keywords: [affiliation, contact, attention]
    semantic_description: Used during friendly approach, greeting, and attention-getting interactions with familiar humans or cats.
    acoustic_references:
