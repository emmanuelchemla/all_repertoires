      - id: bradshaw_cameronbeaumont_2000
        url: https://doi.org/10.1017/CBO9780511628856.005
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Hisses and spits are classic defensive sounds in Moelk 1944 and later cat communication reviews.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Broadband noisy airflow structure is unambiguous and consistently described.
    semantic_description_agreement: strong
    semantic_description_explanation: Defensive threat contexts are consistent across sources.

  - name: trill
    alternative_names:
