scientific_name: Poecile carolinensis
common_name: Carolina chickadee
has_full_inventory: true
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Aves
  order: Passeriformes
  family: Paridae
  genus: Poecile
  species: carolinensis
primary_inventory:
  id: smith_1972
  rationale: Smith 1972 is the primary inventory spine because it is a species-specific field-and-sonagram monograph whose vocal-display chapter explicitly recognizes 20 Carolina chickadee vocal displays. This repertoire includes those 20 displays as in-primary-inventory calls. Later peer-reviewed papers are used to update acoustic and semantic evidence for the chick-a-dee complex, song, tseet, and gargle-aligned calls, but no outside-inventory calls are added.
calls:
  - name: T-slink
    alternative_names:
      - T slink
      - Slink call
      - gargle-like call
    in_primary_inventory: true
    scope: &adult_both_scope
      life_stages:
        - adult
      sexes:
        - female
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - multi_component
      - tonal
      - high_frequency
      - frequency_modulated
      - repetitive
      - short
    acoustic_description: A rapid series of short high notes followed by a longer clear slink element; the clear elements are flattened or chevron-shaped and may be repeated two to eight times. Smith described variable pitch and occasional faint very high terminal notes, with intergrades toward rasp-bearing forms.
    semantic_keywords:
      - threat
      - aggression
      - territorial
      - spacing
      - mating
      - alarm
    semantic_description: Used in mild threat, patrolling, territorial disputes, close pair or flock encounters, predator-directed mobbing, precopulatory approaches, and adult responses to persistent fledgling begging. Smith interpreted the display as attack readiness inhibited by competing tendencies, often functioning as alerting or mild threat.
    acoustic_references:
      - id: smith_1972
      - id: hailman_1989
    semantic_references:
      - id: smith_1972
      - id: hailman_1989
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Smith treats T-slink as one of the 20 primary vocal displays, and Hailman later recognized Smith's T-slink/gargle-aligned material in the parid comparative framework. The label is not widely retained in recent experimental work, so agreement is medium rather than strong.
    acoustic_description_agreement: medium
    acoustic_description_explanation: The acoustic form is documented with Smith's sonagrams and linked by Hailman to the broader parid gargle complex, but most detail comes from the primary inventory.
    semantic_description_agreement: weak
    semantic_description_explanation: Contextual associations are rich in Smith's field observations, but the inferred motivational message has little independent experimental confirmation.

  - name: Click-rasp
    alternative_names:
      - Tee-rasp
      - Slink-rasp
      - Rasp-slink
      - gargle
      - gargle-like call
    in_primary_inventory: true
    scope: *adult_both_scope
    acoustic_keywords:
      - multi_component
      - noisy
      - broadband
      - pulsed
      - frequency_modulated
      - abrupt
    acoustic_description: A stuttering introductory series of short notes followed by a noisy rasp with rapidly oscillating frequency. Smith described tee-rasp and slink-rasp variants as intergrading forms; Hailman treated these Smith calls as the Carolina chickadee material most comparable to the parid gargle.
    semantic_keywords:
      - threat
      - aggression
      - territorial
      - spacing
      - display
    semantic_description: Given mainly in patrol, disputes, and close confrontations with other chickadees. Smith interpreted it as more strongly attack-biased than T-slink, while Hailman's comparative treatment places it with agonistic parid gargle displays.
    acoustic_references:
      - id: smith_1972
      - id: hailman_1989
      - id: henry_lucas_2010
    semantic_references:
      - id: smith_1972
      - id: hailman_1989
      - id: henry_lucas_2010
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Smith listed Click-rasp as a primary display, Hailman independently aligned the same Smith material with the parid gargle complex, and later Carolina chickadee summaries retain gargle as a major call category.
    acoustic_description_agreement: medium
    acoustic_description_explanation: The rasp-bearing form is consistently distinguished from tonal calls, but detailed Carolina-specific structure is still anchored mainly in Smith's sonagrams.
    semantic_description_agreement: medium
    semantic_description_explanation: Multiple sources agree on an agonistic role for gargle-like calls, though fine-grained motivational interpretations remain based mostly on Smith's observational analysis.

  - name: Chip
    alternative_names:
      - Chip call
    in_primary_inventory: true
    scope: *adult_both_scope
    acoustic_keywords:
      - tonal
      - harmonic
      - loud
      - abrupt
      - short
      - repetitive
    acoustic_description: A loud robin-like chip with a harmonic chevron form, often produced in short series of about three to six notes. Smith noted frequent association with High See and occasional association with Loud Tee during movement into tense situations.
    semantic_keywords:
      - aggression
      - threat
      - territorial
      - alarm
      - predator
    semantic_description: Heard in interflock disputes, patrolling toward dispute sites, dominant male patrols, male or pair disputes, and predator mobbing. Smith interpreted Chip as a strong threat signal reflecting conflict between attack and escape tendencies.
    acoustic_references:
      - id: smith_1972
    semantic_references:
      - id: smith_1972
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Smith clearly lists and illustrates Chip as a primary display, but later Carolina chickadee papers usually subsume related material into broader chick-a-dee or alarm categories.
    acoustic_description_agreement: weak
    acoustic_description_explanation: The call is described in detail by Smith, yet independent acoustic treatments using the same Chip label are sparse.
    semantic_description_agreement: weak
    semantic_description_explanation: Threat and mobbing contexts are consistent within Smith's observations, but there is little direct playback or independent semantic testing of this call as a separate type.

  - name: Song
    alternative_names:
      - fee-bee-fee-bay song
      - fee-bee song
      - whistled song
    in_primary_inventory: true
    scope: &adult_male_scope
      life_stages:
        - adult
      sexes:
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - tonal
      - high_frequency
      - frequency_modulated
      - long
      - repetitive
    acoustic_description: A clear whistled song built from alternating higher and lower pitched tonal notes, typically starting high and commonly rendered as fee-bee-fee-bay. Smith described high notes and lower notes in regular alternation; later work treats this as one of the major Carolina chickadee vocal categories.
    semantic_keywords:
      - territorial
      - spacing
      - courtship
      - display
      - identity
    semantic_description: Produced chiefly by males during spring patrolling, dawn singing, countersinging, and nesting contexts. Smith interpreted song as readiness for agonistic and pair-bond-limited behavior, and later sources emphasize its territorial and breeding-season display role.
    acoustic_references:
      - id: smith_1972
      - id: lucas_etal_1999
      - id: henry_lucas_2010
    semantic_references:
      - id: smith_1972
      - id: lucas_etal_1999
      - id: henry_lucas_2010
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Song is a primary Smith display and is repeatedly retained as a major Carolina chickadee vocal category in later acoustic and behavioral papers.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Sources agree that the song is a clear, tonal, alternating high-low whistle, despite natural variation in note number and phrase pattern.
    semantic_description_agreement: medium
    semantic_description_explanation: Territorial and breeding associations are well supported, while Smith's finer motivational interpretation is less directly tested.

  - name: Song Variant
    alternative_names:
      - Variant song
      - Aberrant fee-bee song
    in_primary_inventory: true
    scope: *adult_male_scope
    acoustic_keywords:
      - tonal
      - high_frequency
      - frequency_modulated
      - graded
      - long
    acoustic_description: A song-like display in which the normal high-low alternation is imperfect, rearranged, or absent; Smith described patterns such as repeated high notes, repeated low notes, or high notes that slide upward rather than remaining flat.
    semantic_keywords:
      - territorial
      - spacing
      - courtship
      - display
    semantic_description: Used in the same broad patrolling and countersinging settings as Song, but Smith interpreted Song Variant as song motivation partly thwarted by lack of normal opportunity or social conditions.
    acoustic_references:
      - id: smith_1972
    semantic_references:
      - id: smith_1972
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Song Variant is explicitly one of Smith's 20 displays, but later sources generally discuss song variation without preserving this separate inventory category.
    acoustic_description_agreement: weak
    acoustic_description_explanation: The form is described by Smith, but independent acoustic studies do not consistently separate these variants as a distinct call type.
    semantic_description_agreement: weak
    semantic_description_explanation: The semantic interpretation depends almost entirely on Smith's contextual and motivational analysis.

  - name: Faint Song
    alternative_names:
      - Quiet song
      - Faint fee-bee song
    in_primary_inventory: true
    scope: &adult_all_scope
      life_stages:
        - adult
      sexes:
        - female
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - quiet
      - tonal
      - high_frequency
      - frequency_modulated
      - short
    acoustic_description: A quieter, usually shorter song-like display with clear tonal notes and sometimes a slight quaver. Smith often found it near Lisping Tee sequences and distinguished it from loud territorial Song by amplitude and social context.
    semantic_keywords:
      - affiliation
      - contact
      - caregiving
      - courtship
    semantic_description: Given mainly by birds moving near mates, nests, or young, including male approaches to females and family-group situations. Smith interpreted it as readiness for association and other pair-bond-limited behavior.
    acoustic_references:
      - id: smith_1972
    semantic_references:
      - id: smith_1972
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Faint Song is a primary Smith display, but later work usually groups quiet song-like sounds with song variation rather than maintaining this label.
    acoustic_description_agreement: weak
    acoustic_description_explanation: Smith supplies the diagnostic amplitude and structure distinctions, with little independent treatment of this display as a separate acoustic type.
    semantic_description_agreement: weak
    semantic_description_explanation: The association and pair-bond interpretation is plausible from Smith's contexts but not independently tested.

  - name: Faint Song Variant
    alternative_names:
      - Quiet variant song
      - Faint variant song
    in_primary_inventory: true
    scope: *adult_all_scope
    acoustic_keywords:
      - quiet
      - tonal
      - high_frequency
      - graded
      - short
    acoustic_description: A quiet song-like variant with the reduced amplitude of Faint Song but irregular or incomplete high-low organization. Smith treated it as the quiet counterpart of Song Variant.
    semantic_keywords:
      - affiliation
      - contact
      - caregiving
      - courtship
    semantic_description: Occurs in association-oriented breeding and family situations. Smith interpreted it as Faint Song motivation modified or thwarted by immediate social conditions.
    acoustic_references:
      - id: smith_1972
    semantic_references:
      - id: smith_1972
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: It is included in Smith's primary inventory, but there is little independent literature retaining Faint Song Variant as a named category.
    acoustic_description_agreement: weak
    acoustic_description_explanation: Acoustic separation from Faint Song rests on Smith's descriptions of irregular phrase organization.
    semantic_description_agreement: weak
    semantic_description_explanation: The proposed function is inferred from Smith's limited contextual observations and has not been experimentally tested.

  - name: Variable See
    alternative_names:
      - Variable see call
      - Variable high see
    in_primary_inventory: true
    scope: *adult_both_scope
    acoustic_keywords:
      - high_frequency
      - tonal
      - frequency_modulated
      - repetitive
      - graded
    acoustic_description: A rapidly repeated series of high chevron-shaped see notes, often with peaks above 8 kHz and waves of rising and falling frequency or amplitude. Smith reported that it almost always terminates in T-slink and can grade toward other high see-like calls.
    semantic_keywords:
      - aggression
      - affiliation
      - courtship
      - mating
      - caregiving
    semantic_description: Occurs in breeding-related interactions, including males near nesting females, dawn calling, copulation approaches, aggressive encounters, and patrol. Smith interpreted it as conflict among agonistic, escape, and pair-bond-limited tendencies.
    acoustic_references:
      - id: smith_1972
    semantic_references:
      - id: smith_1972
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Variable See is a Smith primary display, but later work rarely preserves it as a separate named call rather than discussing high see-like notes more broadly.
    acoustic_description_agreement: weak
    acoustic_description_explanation: Smith gives detailed sonagraphic description, but independent acoustic confirmation of this exact category is limited.
    semantic_description_agreement: weak
    semantic_description_explanation: The semantic account depends on Smith's contextual interpretation, without playback tests of Variable See as a distinct signal.

  - name: Broken Dee
    alternative_names:
      - Broken dee call
      - Begging dee
    in_primary_inventory: true
    scope:
      life_stages:
        - juvenile
        - adult
      sexes:
        - female
        - unknown
      population_specific: false
      note: ""
    acoustic_keywords:
      - tonal
      - harmonic
      - frequency_modulated
      - graded
      - repetitive
      - multi_component
    acoustic_description: Similar to Dee in frequency, harmonic structure, and overall quality, but with irregular frequency fluctuations and notes that may subdivide into short chevrons. Smith described louder, longer, or higher forms during feeding approaches by adults to begging young.
    semantic_keywords:
      - begging
      - caregiving
      - affiliation
      - courtship
      - mating
    semantic_description: Produced by nestlings, fledglings, and adult females begging from mates; also heard during adult feeding approaches to young. Smith interpreted it as readiness for bond-limited behavior, especially feeding, guarding, or copulation-related interactions.
    acoustic_references:
      - id: smith_1972
    semantic_references:
      - id: smith_1972
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Broken Dee is one of Smith's primary displays, and begging/dee-like calls are behaviorally plausible in parids, but later Carolina chickadee work rarely treats this exact label independently.
    acoustic_description_agreement: weak
    acoustic_description_explanation: Acoustic differentiation from Dee is well described by Smith but not independently quantified in the later note-type literature.
    semantic_description_agreement: medium
    semantic_description_explanation: Begging and provisioning contexts are direct and repeated in Smith's observations, though no playback tests establish receiver interpretation.

  - name: Lisping Tee
    alternative_names:
      - Lisping tee call
      - Association tee
    in_primary_inventory: true
    scope: *adult_both_scope
    acoustic_keywords:
      - tonal
      - high_frequency
      - frequency_modulated
      - repetitive
      - short
    acoustic_description: A series of chevron-shaped notes with emphasized, relatively long descending arms, typically in pairs, triplets, or short runs around the upper vocal range. Smith described a distinctive lisping quality and frequent occurrence before Faint Song.
    semantic_keywords:
      - contact
      - group_coordination
      - affiliation
      - caregiving
    semantic_description: Used when birds associate closely, fly between mates or flock members, approach nests, and coordinate family movements. Smith interpreted it as balancing association with locomotory activity.
    acoustic_references:
      - id: smith_1972
    semantic_references:
      - id: smith_1972
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Lisping Tee is clearly included in Smith's primary inventory, but later literature does not commonly use the same named category.
    acoustic_description_agreement: weak
    acoustic_description_explanation: Acoustic detail comes almost entirely from Smith's sonagrams and field descriptions.
    semantic_description_agreement: weak
    semantic_description_explanation: Association and movement-coordination functions are inferred from Smith's contexts and lack independent experimental tests.

  - name: Soft Dee
    alternative_names:
      - Quiet dee
      - Soft dee call
    in_primary_inventory: true
    scope: *adult_both_scope
    acoustic_keywords:
      - quiet
      - tonal
      - harmonic
      - frequency_modulated
      - repetitive
    acoustic_description: A quiet series of narrow rounded dee-like chevrons with resonance harmonics, usually well spaced and often following Lisping Tee. Smith noted that it can intergrade with louder Dee forms.
    semantic_keywords:
      - contact
      - affiliation
      - group_coordination
    semantic_description: Heard infrequently during close association, feeding-station encounters, and spring interactions near nests or females. Smith suggested an association-oriented function but treated the interpretation as tentative.
    acoustic_references:
      - id: smith_1972
    semantic_references:
      - id: smith_1972
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Soft Dee is a primary Smith display, but sparse later use of the label limits independent support.
    acoustic_description_agreement: weak
    acoustic_description_explanation: The quiet dee-like form is described in Smith, with no later Carolina chickadee quantification as a distinct note class.
    semantic_description_agreement: weak
    semantic_description_explanation: Smith explicitly treated the function as tentative, and subsequent experimental evidence is lacking.

  - name: High See
    alternative_names:
      - high see call
      - high zee
      - A-note-like high see
    in_primary_inventory: true
    scope: *adult_both_scope
    acoustic_keywords:
      - high_frequency
      - tonal
      - frequency_modulated
      - long
      - repetitive
      - graded
    acoustic_description: A high, clear see note, usually a broad or flattened chevron in the upper frequency range, longer than High Tee and often given in series. Smith described intergradation with High Tee and longer squeal-like calls; later chick-a-dee work identifies high-frequency A-type notes as important in predator-related call variation.
    semantic_keywords:
      - alarm
      - predator
      - attention
      - threat
    semantic_description: Associated with perched vigilance, observer or predator presence, hawks overhead, mobbing, feeding-station alertness, and disputes. Smith interpreted High See as an escape-biased alarm or attention signal, while later predator-context studies show high-frequency introductory note changes in chick-a-dee calls.
    acoustic_references:
      - id: smith_1972
      - id: bloomfield_etal_2005
      - id: freeberg_2008
      - id: soard_ritchison_2009
    semantic_references:
      - id: smith_1972
      - id: freeberg_2008
      - id: soard_ritchison_2009
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Smith lists High See as a primary display, and later chick-a-dee note-type studies independently support a high-frequency introductory note category with predator-related variation.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Sources agree on a high-frequency tonal introductory form, though the exact boundary between Smith's High See and modern A-note classes is not perfectly one-to-one.
    semantic_description_agreement: medium
    semantic_description_explanation: Alarm and predator associations recur across observational and experimental-context studies, but receiver tests usually address whole chick-a-dee calls rather than isolated High See notes.

  - name: High Tee
    alternative_names:
      - high tee call
      - A note
      - introductory tee
    in_primary_inventory: true
    scope: *adult_both_scope
    acoustic_keywords:
      - high_frequency
      - tonal
      - frequency_modulated
      - short
      - repetitive
    acoustic_description: A short, clear high chevron note that can occur alone or as an introductory element in chick-a-dee sequences. Smith described intergradation with High See and Loud Tee; later note-type studies place comparable introductory notes in the combinatorial A/B/C/D chick-a-dee system.
    semantic_keywords:
      - alarm
      - predator
      - attention
      - group_coordination
      - combinatorial
    semantic_description: Given during flight, alighting, perch changes, feeding-station activity, and tense social or predator-related situations. In modern chick-a-dee research, introductory high notes help modulate call meaning in predator and social contexts.
    acoustic_references:
      - id: smith_1972
      - id: bloomfield_etal_2005
      - id: freeberg_2008
      - id: soard_ritchison_2009
    semantic_references:
      - id: smith_1972
      - id: freeberg_2008
      - id: soard_ritchison_2009
    playback_references:
      - id: freeberg_lucas_2002
      - id: soard_ritchison_2009
    call_type_existence_agreement: strong
    call_type_existence_explanation: Smith includes High Tee in the primary inventory, and later studies independently identify high introductory note types within Carolina chickadee chick-a-dee calls.
    acoustic_description_agreement: medium
    acoustic_description_explanation: The high, short, introductory form is consistent, but mapping Smith's High Tee to modern note labels is approximate because later studies classify note positions rather than Smith display names.
    semantic_description_agreement: medium
    semantic_description_explanation: Alarm and attention roles are supported by context and playback studies of whole chick-a-dee calls, while isolated High Tee meaning remains less directly tested.

  - name: Chick
    alternative_names:
      - chick note
      - B/C note
      - chick-a element
    in_primary_inventory: true
    scope: *adult_both_scope
    acoustic_keywords:
      - tonal
      - harmonic
      - frequency_modulated
      - short
      - multi_component
      - graded
    acoustic_description: A narrow chevron-shaped note with a pointed peak and multiple resonance harmonics, commonly occurring after High Tee-like notes and before Dee notes in chick-a-dee sequences. Smith described a mushy quality and intergradation with neighboring chick-a-dee elements.
    semantic_keywords:
      - alarm
      - predator
      - attention
      - group_coordination
      - combinatorial
    semantic_description: Used in chick-a-dee combinations during movement, feeding, disputes, and tense or retreating situations. Smith interpreted it as intermediate between High Tee and Dee; later work shows that chick-a-dee note composition carries information about social and predator contexts.
    acoustic_references:
      - id: smith_1972
      - id: bloomfield_etal_2005
      - id: freeberg_2008
      - id: soard_ritchison_2009
    semantic_references:
      - id: smith_1972
      - id: freeberg_2008
      - id: soard_ritchison_2009
    playback_references:
      - id: freeberg_lucas_2002
      - id: soard_ritchison_2009
    call_type_existence_agreement: strong
    call_type_existence_explanation: Smith includes Chick as a primary display, and later work independently confirms chick-like note classes in the Carolina chickadee chick-a-dee call.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Smith's chick element and later A/B/C/D note classifications consistently identify a distinct middle element in chick-a-dee sequences, even though exact label boundaries differ.
    semantic_description_agreement: medium
    semantic_description_explanation: Semantic evidence is strong for chick-a-dee sequences as a whole, but weaker for the isolated Chick element by itself.

  - name: Dee
    alternative_names:
      - dee note
      - D note
      - chick-a-dee call
      - chickadee call
    in_primary_inventory: true
    scope: *adult_both_scope
    acoustic_keywords:
      - harmonic
      - tonal
      - repetitive
      - multi_component
      - graded
    acoustic_description: A series of broad, relatively flat chevron notes with stacked harmonics, commonly forming the terminal dee portion of chick-a-dee calls. Smith described series of several Dee notes and many prefixes by High See, High Tee, Chick, or combinations; later studies quantify the A/B/C/D syntax of these calls.
    semantic_keywords:
      - contact
      - group_coordination
      - recruitment
      - food
      - alarm
      - predator
      - combinatorial
    semantic_description: Used in feeding, flock coordination, disputes, predator contexts, and other tense associations. Playback and context studies show that chick-a-dee note composition affects receiver behavior, predator-threat coding, and food recruitment, making the Dee-bearing call complex a major combinatorial signal.
    acoustic_references:
      - id: smith_1972
      - id: bloomfield_etal_2005
      - id: freeberg_2008
      - id: lucas_etal_1999
      - id: henry_lucas_2010
    semantic_references:
      - id: smith_1972
      - id: freeberg_lucas_2002
      - id: freeberg_2008
      - id: mahurin_freeberg_2009
      - id: soard_ritchison_2009
    playback_references:
      - id: freeberg_lucas_2002
      - id: mahurin_freeberg_2009
      - id: soard_ritchison_2009
    call_type_existence_agreement: strong
    call_type_existence_explanation: Smith lists Dee as a primary display, and later Carolina chickadee research repeatedly treats the chick-a-dee call and its D-note/dee component as a central, experimentally supported call complex.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Multiple acoustic studies agree that chick-a-dee calls contain ordered note types with a repeated dee/D-note terminal component, despite graded variation.
    semantic_description_agreement: strong
    semantic_description_explanation: Receiver playback, predator-context, food-recruitment, and observational studies all support contact, recruitment, and alarm-related functions for Dee-bearing chick-a-dee calls.

  - name: Loud Tee
    alternative_names:
      - loud tee call
      - emphatic tee
    in_primary_inventory: true
    scope: *adult_both_scope
    acoustic_keywords:
      - loud
      - tonal
      - harmonic
      - high_frequency
      - abrupt
      - repetitive
    acoustic_description: A loud, emphatic, skewed chevron note with a strong ascending arm and two or more resonance harmonics, usually produced in well-spaced short series. Smith described occurrence with High See, High Tee, and chick-a-dee combinations.
    semantic_keywords:
      - alarm
      - attention
      - predator
      - threat
    semantic_description: Used across foraging, feeder visits, patrolling, nest guarding, hawk encounters, and disputes, but less often in direct face-to-face standoffs. Smith interpreted it as a sudden or high-level escape-biased warning signal.
    acoustic_references:
      - id: smith_1972
    semantic_references:
      - id: smith_1972
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Loud Tee is included in Smith's primary inventory, but later Carolina chickadee papers do not commonly retain this exact display label.
    acoustic_description_agreement: weak
    acoustic_description_explanation: Smith provides the main acoustic evidence; later work on high introductory notes does not clearly isolate Loud Tee.
    semantic_description_agreement: weak
    semantic_description_explanation: Warning and alarm functions are inferred from Smith's contexts and lack direct playback tests for this isolated call.

  - name: Tseet
    alternative_names:
      - tseet call
      - seeet
      - contact tseet
    in_primary_inventory: true
    scope: *adult_both_scope
    acoustic_keywords:
      - high_frequency
      - tonal
      - short
      - quiet
      - frequency_modulated
