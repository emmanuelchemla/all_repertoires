        url: https://doi.org/10.1111/j.1439-0310.1982.tb01359.x
    call_type_existence_agreement: medium
    call_type_existence_explanation: Cleveland and Snowdon 1982 distinguish the quiet long call as a separate subtype of long call. Subsequent acoustic work focuses on the normal long call, so independent corroboration of the quiet variant is more limited.
    acoustic_description_agreement: medium
    acoustic_description_explanation: The amplitude-and-context-based distinction from the normal long call is detailed in Cleveland and Snowdon 1982, but few later studies separately measure the quiet variant.
    semantic_description_agreement: medium
    semantic_description_explanation: Cleveland and Snowdon 1982 link the quiet long call to within-group close-range contact, but its functional separation from the normal long call has not been independently tested by playback.

