  class: Mammalia
  order: Primates
  family: Callitrichidae
  genus: Saguinus
  species: oedipus
primary_inventory:
  id: cleveland_snowdon_1982
  rationale: Cleveland and Snowdon 1982 ("The complex vocal repertoire of the adult cotton-top tamarin") is the canonical and most comprehensive enumeration of the species' vocal repertoire, describing the major adult call categories (long calls, chirps, whistles, trills, twitters, squeaks, chatters and combinations) with quantitative acoustic measurements and contextual observations. It is universally cited as the spine reference for Saguinus oedipus vocal behaviour and remains the benchmark inventory used by all subsequent acoustic and functional work on this species.
calls:
  - name: normal long call
    alternative_names:
      - long call
      - NLC
    in_primary_inventory: true
    scope: &adult_both_scope
      life_stages:
        - adult
      sexes:
        - female
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - high_frequency
      - tonal
      - frequency_modulated
      - long
      - loud
      - multi_component
      - repetitive
    acoustic_description: A loud, long-duration call composed of a series of frequency-modulated whistle-like notes (typically several "J-shaped" or rising-falling components) with concentrated energy in the upper kilohertz range. Notes are separated by brief inter-note intervals and produced in stereotyped multi-note sequences.
    semantic_keywords:
      - contact
      - spacing
      - group_coordination
      - identity
      - territorial
    semantic_description: Produced when groups or individuals are visually separated and used in long-distance contact, intergroup spacing, and reunion contexts. The call carries individually distinctive features that support caller recognition and is exchanged antiphonally between separated animals.
    acoustic_references:
      - id: cleveland_snowdon_1982
        url: https://doi.org/10.1111/j.1439-0310.1982.tb01359.x
      - id: weiss_etal_2001
        url: https://doi.org/10.1037/0735-7036.115.3.258
      - id: miller_etal_2005
        url: https://doi.org/10.1163/1568539054352860
    semantic_references:
      - id: cleveland_snowdon_1982
        url: https://doi.org/10.1111/j.1439-0310.1982.tb01359.x
      - id: weiss_etal_2001
        url: https://doi.org/10.1037/0735-7036.115.3.258
      - id: ghazanfar_etal_2002
        url: https://doi.org/10.1006/anbe.2002.3074
    playback_references:
      - id: weiss_etal_2001
        url: https://doi.org/10.1037/0735-7036.115.3.258
      - id: ghazanfar_etal_2002
        url: https://doi.org/10.1006/anbe.2002.3074
    call_type_existence_agreement: strong
    call_type_existence_explanation: The normal long call is the central long-distance call documented by Cleveland and Snowdon 1982 and is treated as the canonical long call in all subsequent acoustic and playback work (e.g. Weiss et al. 2001, Miller et al. 2005, Ghazanfar et al. 2002).
    acoustic_description_agreement: strong
    acoustic_description_explanation: Multiple independent quantitative studies (Cleveland and Snowdon 1982; Weiss et al. 2001; Miller et al. 2005) agree on the multi-note frequency-modulated whistle structure and its individual distinctiveness.
    semantic_description_agreement: strong
    semantic_description_explanation: Contact, spacing and identity functions are supported by Cleveland and Snowdon 1982 and confirmed experimentally with playback by Weiss et al. 2001 and Ghazanfar et al. 2002.

  - name: quiet long call
    alternative_names:
