      - tonal
      - frequency_modulated
      - long
      - quiet
      - multi_component
    acoustic_description: A reduced-amplitude version of the normal long call, retaining the multi-note frequency-modulated whistle structure but produced at noticeably lower intensity and often with fewer notes.
    semantic_keywords:
      - contact
      - affiliation
      - group_coordination
    semantic_description: Produced during close-range or within-group contact contexts, including affiliative interactions and short-distance coordination when group members are nearby but not in continuous visual contact.
    acoustic_references:
      - id: cleveland_snowdon_1982
        url: https://doi.org/10.1111/j.1439-0310.1982.tb01359.x
    semantic_references:
