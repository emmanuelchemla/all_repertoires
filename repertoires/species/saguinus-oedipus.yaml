    call_type_existence_explanation: Cleveland and Snowdon 1982 describe the combination long call as a distinct subtype produced in arousal-related contexts, but later quantitative studies have largely concentrated on the normal long call.
    acoustic_description_agreement: medium
    acoustic_description_explanation: The compound multi-note structure is described in Cleveland and Snowdon 1982 but has not been re-quantified by independent acoustic studies.
    semantic_description_agreement: medium
    semantic_description_explanation: The arousal- and disturbance-related context is supported by Cleveland and Snowdon 1982, but no playback work has independently tested this functional category.

