scientific_name: Loxodonta africana
common_name: African savanna elephant
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Mammalia
  order: Proboscidea
  family: Elephantidae
  genus: Loxodonta
  species: africana
primary_inventory:
  id: soltis_2010
  rationale: Soltis 2010 is used as the spine because it is the widely cited peer-reviewed review of African elephant vocal communication and explicitly summarizes the repertoire as perhaps nine acoustically distinct call types. Those inventory classes are represented here as rumble, roar, trumpet, snort, bark, grunt, rev, croak, and chuff. Contextual rumble forms such as contact, estrous, musth, bee-alarm, and human-alarm rumbles are treated as supported variants within rumble rather than separate call entries. Rare captive-derived classes are retained because they are part of the primary inventory, but their uncertainty and limited wild evidence are marked in the agreement labels.
calls:
  - name: rumble
    in_primary_inventory: true
    alternative_names:
      - low-frequency call
      - infrasonic rumble
      - contact rumble
      - contact call
      - estrous rumble
      - estrous call
      - musth rumble
      - bee alarm rumble
      - Samburu alarm rumble
    scope: &all_life_both_scope
      life_stages:
        - infant
        - juvenile
        - adult
      sexes:
        - female
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - low_frequency
      - frequency_modulated
      - tonal
      - harmonic
      - long
      - loud
      - graded
    acoustic_description: A low-frequency, usually harmonic call with infrasonic fundamentals and context-dependent modulation, amplitude, duration, and formant structure. Rumbles can be nasal or oral, can occur singly or in exchanges, and grade into louder or noisier forms and combinations with higher-frequency calls.
    semantic_keywords:
      - contact
      - group_coordination
      - affiliation
      - identity
      - courtship
      - mating
      - alarm
      - begging
      - caregiving
    semantic_description: Used across the major documented low-frequency contexts, including long-distance contact and reunion, within-group coordination, close affiliative interaction, reproductive advertisement by estrous females and musth males, threat-specific alarm contexts, and infant care or begging situations. Receivers use rumble variation for social identity, reproductive assessment, danger assessment, and movement decisions.
    acoustic_references:
      - id: soltis_2010
        url: https://doi.org/10.1002/zoo.20251
      - id: poole_etal_1988
        url: https://doi.org/10.1007/BF00294975
      - id: wood_etal_2005
        url: https://doi.org/10.1080/09524622.2005.9753544
      - id: stoeger_etal_2012
        url: https://doi.org/10.1371/journal.pone.0048907
      - id: stoeger_baotic_2016
        url: https://doi.org/10.1038/srep27585
    semantic_references:
      - id: poole_etal_1988
        url: https://doi.org/10.1007/BF00294975
      - id: wood_etal_2005
        url: https://doi.org/10.1080/09524622.2005.9753544
      - id: mccomb_etal_2000
        url: https://doi.org/10.1006/anbe.2000.1406
      - id: poole_1999
        url: https://doi.org/10.1006/anbe.1999.1117
      - id: stoeger_baotic_2016
        url: https://doi.org/10.1038/srep27585
      - id: king_etal_2010
        url: https://doi.org/10.1371/journal.pone.0010346
      - id: soltis_etal_2014
        url: https://doi.org/10.1371/journal.pone.0089403
      - id: pardo_etal_2024
        url: https://doi.org/10.1038/s41559-024-02420-w
    playback_references:
      - id: langbauer_etal_1991
        url: https://doi.org/10.1242/jeb.157.1.35
      - id: mccomb_etal_2000
        url: https://doi.org/10.1006/anbe.2000.1406
      - id: mccomb_etal_2003
        url: https://doi.org/10.1006/anbe.2003.2047
      - id: poole_1999
        url: https://doi.org/10.1006/anbe.1999.1117
      - id: king_etal_2010
        url: https://doi.org/10.1371/journal.pone.0010346
      - id: soltis_etal_2014
        url: https://doi.org/10.1371/journal.pone.0089403
      - id: pardo_etal_2024
        url: https://doi.org/10.1038/s41559-024-02420-w
    call_type_existence_agreement: strong
    call_type_existence_explanation: Soltis 2010 lists rumbles as the most common and variable African elephant call class, while Poole et al. 1988, Wood et al. 2005, Stoeger et al. 2012, McComb et al. 2000, King et al. 2010, Soltis et al. 2014, and Pardo et al. 2024 all analyze rumbles in independent behavioral or acoustic datasets. Agreement is strong for the broad rumble class, even though sources split contextual variants differently.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Soltis 2010, Poole et al. 1988, Wood et al. 2005, Stoeger et al. 2012, and Stoeger and Baotic 2016 converge on a low-frequency, harmonic, modulated, highly graded call, with additional variation from nasal versus oral production, sex, and context-linked formant shifts. Agreement is strong for the broad acoustic form.
    semantic_description_agreement: strong
    semantic_description_explanation: Poole et al. 1988, McComb et al. 2000 and 2003, Poole 1999, Stoeger and Baotic 2016, King et al. 2010, Soltis et al. 2014, and Pardo et al. 2024 support contact, identity, reproductive, alarm, and directed-social functions through field observation, acoustic analysis, and playback. The semantic agreement is strong for multifunctional rumble use, while individual named variants remain context-specific splits within this entry.

  - name: roar
    in_primary_inventory: true
    alternative_names:
      - roar-rumble
      - noisy roar
      - tonal roar
      - mixed roar
      - bellow
      - cry
      - scream
      - squeal
    scope: *all_life_both_scope
    acoustic_keywords:
      - high_frequency
      - frequency_modulated
      - broadband
      - noisy
      - tonal
      - loud
      - graded
    acoustic_description: A loud, higher-frequency laryngeal call that can be noisy, tonal, or mixed, with extensive age- and arousal-related grading. Roars may occur alone or combined with rumbles, and infant roars have been separated into noisy, tonal, and mixed forms.
    semantic_keywords:
      - distress
      - alarm
      - aggression
      - caregiving
      - begging
      - display
    semantic_description: Produced in high-arousal contexts such as distress, protest, suckling conflict, predator or social confrontation, intense excitement, and aggressive or defensive events. Calls by dependent young can recruit mothers or other family members, while adult roars are common in serious social or defensive episodes.
    acoustic_references:
      - id: soltis_2010
        url: https://doi.org/10.1002/zoo.20251
      - id: stoegerhorwath_etal_2007
        url: https://doi.org/10.1121/1.2722216
      - id: poole_2011
        url: https://doi.org/10.7208/9780226542263-011
    semantic_references:
      - id: soltis_2010
        url: https://doi.org/10.1002/zoo.20251
      - id: stoegerhorwath_etal_2007
        url: https://doi.org/10.1121/1.2722216
      - id: poole_2011
        url: https://doi.org/10.7208/9780226542263-011
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Roar is included in the Soltis 2010 inventory, Stoeger-Horwath et al. 2007 structurally separates infant roars and their subtypes, and Poole 2011 documents roar and roar-rumble forms in free-ranging Amboseli elephants. The broad call type is strongly supported.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Soltis 2010, Stoeger-Horwath et al. 2007, and Poole 2011 agree that roars are loud, higher-frequency, and graded, but the category spans noisy, tonal, mixed, infant, juvenile, adult, and combination forms. Acoustic agreement is medium because the boundaries are broad.
    semantic_description_agreement: medium
    semantic_description_explanation: Stoeger-Horwath et al. 2007 and Poole 2011 link roars to distress, protest, begging, and defensive or aggressive contexts, with Soltis 2010 reviewing the broader call class. The semantic range is consistent but wide, so agreement is medium.

  - name: trumpet
    in_primary_inventory: true
    alternative_names:
      - trumpet-blast
      - pulsated trumpet
      - nasal trumpet
      - social trumpet
      - play trumpet
    scope: *all_life_both_scope
    acoustic_keywords:
      - high_frequency
      - frequency_modulated
      - broadband
      - harmonic
      - short
      - loud
      - abrupt
      - graded
    acoustic_description: A loud trunk-produced call with high-frequency energy, coarse harmonic or broadband structure, and strong modulation. Trumpets range from brief explosive blasts to more pulsated or nasal variants, and can grade in intensity with arousal.
    semantic_keywords:
      - alarm
      - threat
      - aggression
      - play
      - display
      - distress
    semantic_description: Produced during intense excitement, threat display, predator or human confrontation, charging, defensive bunching, social conflict, and play. Young elephants also produce trumpets in play or distress once they have enough motor control of the trunk.
    acoustic_references:
      - id: soltis_2010
        url: https://doi.org/10.1002/zoo.20251
      - id: leong_etal_2003
        url: https://doi.org/10.1080/09524622.2003.9753499
      - id: stoegerhorwath_etal_2007
        url: https://doi.org/10.1121/1.2722216
      - id: poole_2011
        url: https://doi.org/10.7208/9780226542263-011
    semantic_references:
      - id: soltis_2010
        url: https://doi.org/10.1002/zoo.20251
      - id: stoegerhorwath_etal_2007
        url: https://doi.org/10.1121/1.2722216
      - id: poole_2011
        url: https://doi.org/10.7208/9780226542263-011
      - id: soltis_etal_2014
        url: https://doi.org/10.1371/journal.pone.0089403
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Trumpet is one of the Soltis 2010 inventory classes and is independently recognized by Leong et al. 2003, Stoeger-Horwath et al. 2007, and Poole 2011. The broad trumpet class is strongly supported across captive, infant, and wild-context sources.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Leong et al. 2003, Stoeger-Horwath et al. 2007, Soltis 2010, and Poole 2011 agree on a loud high-frequency trunk call, but trumpet-blast, pulsated, nasal, social, and play forms differ in fine structure. Agreement is medium for the grouped call.
    semantic_description_agreement: medium
    semantic_description_explanation: Poole 2011 and Soltis 2010 place trumpets in threat, alarm, excitement, and play contexts, and Soltis et al. 2014 reports trumpets among vocal responses to human-threat playbacks. The contextual range is broad and not usually tested with isolated trumpet playback, so agreement is medium.

  - name: snort
    in_primary_inventory: true
    alternative_names:
      - trunk snort
      - whoosh
    scope: *all_life_both_scope
    acoustic_keywords:
      - broadband
      - noisy
      - short
      - loud
      - abrupt
    acoustic_description: A short, sharp, broadband trunk exhalation produced by forcefully moving air through the trunk. It is acoustically more abrupt and signal-like than routine nasal clearing sounds, but may grade toward non-vocal blows.
    semantic_keywords:
      - alarm
      - attention
      - threat
      - display
    semantic_description: Produced when elephants are alert, surprised, annoyed, socially excited, or confronting a possible threat. It can draw attention to a new situation and occur with vigilance or low-level threat display.
    acoustic_references:
      - id: soltis_2010
        url: https://doi.org/10.1002/zoo.20251
      - id: leong_etal_2003
        url: https://doi.org/10.1080/09524622.2003.9753499
      - id: poole_2011
        url: https://doi.org/10.7208/9780226542263-011
    semantic_references:
      - id: soltis_2010
        url: https://doi.org/10.1002/zoo.20251
      - id: poole_2011
        url: https://doi.org/10.7208/9780226542263-011
      - id: stoeger_desilva_2014
        url: https://doi.org/10.1007/978-94-007-7414-8_3
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Snort is included in Soltis 2010 and Leong et al. 2003, and Poole 2011 and Stoeger and de Silva 2014 distinguish snorts from routine blows or sneezes. Existence agreement is strong for the broad trunk-call category.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Soltis 2010, Leong et al. 2003, Poole 2011, and Stoeger and de Silva 2014 agree on a short broadband trunk exhalation, but the border with blows, coughs, and nasal clearing sounds is not always sharply quantified. Agreement is medium.
    semantic_description_agreement: medium
    semantic_description_explanation: Poole 2011 and Stoeger and de Silva 2014 associate snorts with excitement, alerting, and threat displays, with Soltis 2010 reviewing the class. The general semantic domain is stable, but call-specific experimental evidence is limited.

  - name: bark
    in_primary_inventory: true
    alternative_names:
      - bark-rumble
      - protest bark
    scope: *all_life_both_scope
    acoustic_keywords:
      - high_frequency
      - broadband
      - noisy
      - short
      - loud
      - abrupt
      - graded
    acoustic_description: A short, abrupt, higher-frequency call with noisy broadband energy that may occur alone or with a rumble component. Infant barks separate acoustically from rumbles, grunts, and roars in structural analyses, while wild-context descriptions treat bark-rumble forms as graded combinations.
    semantic_keywords:
      - distress
      - aggression
      - threat
      - alarm
      - begging
    semantic_description: Associated with protest, distress, high arousal, and agonistic or defensive situations, including young elephants' suckling or separation conflicts and broader wild contexts where bark-like calls combine with rumbles.
    acoustic_references:
      - id: soltis_2010
        url: https://doi.org/10.1002/zoo.20251
      - id: stoegerhorwath_etal_2007
        url: https://doi.org/10.1121/1.2722216
      - id: poole_2011
        url: https://doi.org/10.7208/9780226542263-011
    semantic_references:
      - id: soltis_2010
        url: https://doi.org/10.1002/zoo.20251
      - id: stoegerhorwath_etal_2007
        url: https://doi.org/10.1121/1.2722216
      - id: poole_2011
        url: https://doi.org/10.7208/9780226542263-011
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Soltis 2010 includes bark in the repertoire, Stoeger-Horwath et al. 2007 separates infant barks structurally, and Poole 2011 recognizes bark and bark-rumble forms in wild elephants. Agreement is medium because much of the quantitative evidence comes from infants and because bark-rumble combinations blur boundaries.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Stoeger-Horwath et al. 2007 provides the strongest quantitative acoustic separation, while Soltis 2010 and Poole 2011 support the class at repertoire level. Agreement is medium due to limited adult-specific measurement and graded combination forms.
    semantic_description_agreement: medium
    semantic_description_explanation: Stoeger-Horwath et al. 2007 and Poole 2011 connect barks with infant distress, protest, and broader high-arousal contexts. The contextual interpretation is plausible and consistent but less experimentally developed than rumbles.

  - name: grunt
    in_primary_inventory: true
    alternative_names:
      - calf grunt
      - infant grunt
    scope:
      life_stages:
        - infant
      sexes:
        - female
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - low_frequency
      - noisy
      - short
      - quiet
    acoustic_description: A short, low, quiet laryngeal call that is structurally separated from infant rumbles, barks, and roars. Published descriptions emphasize very young calves and indicate a softer, less extended form than roars or rumbles.
    semantic_keywords:
      - begging
      - caregiving
      - affiliation
      - contact
    semantic_description: Best supported for very young calves in close mother-infant contexts, including social interaction, nursing-related behavior, and low-arousal contact with caretaking adults. Adult use is not well established in the quantitative literature.
    acoustic_references:
      - id: soltis_2010
        url: https://doi.org/10.1002/zoo.20251
      - id: stoegerhorwath_etal_2007
        url: https://doi.org/10.1121/1.2722216
      - id: poole_2011
        url: https://doi.org/10.7208/9780226542263-011
    semantic_references:
      - id: stoegerhorwath_etal_2007
        url: https://doi.org/10.1121/1.2722216
      - id: poole_2011
        url: https://doi.org/10.7208/9780226542263-011
      - id: soltis_2010
        url: https://doi.org/10.1002/zoo.20251
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Soltis 2010 includes grunt in the inventory and Stoeger-Horwath et al. 2007 separates infant grunts in a quantitative infant repertoire. Poole 2011 also lists grunt among wild elephant acoustic signals. The label is medium because support is strongest for infants and much weaker for adult repertoire use.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Stoeger-Horwath et al. 2007 gives the clearest structural separation, while Soltis 2010 and Poole 2011 support repertoire-level recognition. Agreement is medium because detailed acoustic descriptions are sparse outside infant studies.
    semantic_description_agreement: weak
    semantic_description_explanation: Stoeger-Horwath et al. 2007 and Poole 2011 place grunts in young-calf and caregiving contexts, but the call has little independent semantic work and no clear playback evidence. The label is weak for specific function.

  - name: rev
    in_primary_inventory: true
    alternative_names:
      - revving call
    scope: &unknown_scope
      life_stages:
        - unknown
      sexes:
        - unknown
      population_specific: false
      note: ""
    acoustic_keywords:
      - low_frequency
      - tonal
      - harmonic
      - short
      - abrupt
    acoustic_description: A brief tonal harmonic call with a fundamental frequency higher than typical rumbles and a buzz-like or revving quality. It is often described as less than a second and may occur immediately before a rumble.
    semantic_keywords:
      - attention
      - contact
    semantic_description: Reported rarely, mostly in captive classification work and in a small number of wild recordings without well-established behavioral context. Its function is therefore best treated as unresolved, possibly associated with close-range social attention or a learned/context-bound production.
    acoustic_references:
      - id: soltis_2010
        url: https://doi.org/10.1002/zoo.20251
      - id: leong_etal_2003
        url: https://doi.org/10.1080/09524622.2003.9753499
      - id: poole_2011
        url: https://doi.org/10.7208/9780226542263-011
    semantic_references:
      - id: leong_etal_2003
        url: https://doi.org/10.1080/09524622.2003.9753499
      - id: poole_2011
        url: https://doi.org/10.7208/9780226542263-011
      - id: stoeger_desilva_2014
        url: https://doi.org/10.1007/978-94-007-7414-8_3
    playback_references: []
    call_type_existence_agreement: weak
    call_type_existence_explanation: Rev is retained because Soltis 2010 includes it and Leong et al. 2003 defined it acoustically, while Poole 2011 found only rare wild examples and no firm context. Stoeger and de Silva 2014 also treat rev as rare and difficult to compare across taxa. Agreement is weak.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Leong et al. 2003 and Poole 2011 give compatible descriptions of a short tonal harmonic call above rumble frequencies, and Soltis 2010 retains it in the review inventory. Acoustic agreement is medium despite the small sample.
    semantic_description_agreement: weak
    semantic_description_explanation: Poole 2011 reports no known context for wild revs, and Stoeger and de Silva 2014 emphasize the rarity and interpretive difficulty of this call. The semantic label is weak because function remains largely unknown.

  - name: croak
    in_primary_inventory: true
    alternative_names:
      - croaking
    scope: *unknown_scope
    acoustic_keywords:
      - low_frequency
      - noisy
      - long
      - repetitive
      - pulsed
      - graded
    acoustic_description: A rare pulsatile call described as a croaking sound, often lasting longer than a rev and made of repeated low, rough pulses. Published accounts treat it as acoustically outside the common rumble, trumpet, snort, roar, bark, and grunt classes.
    semantic_keywords:
      - attention
      - contact
      - affiliation
    semantic_description: Known mainly from captive observations and rare wild or semi-wild discussions, with reported association to close-range activity rather than a well-established communicative function. It may be idiosyncratic or learned in some individuals.
    acoustic_references:
      - id: soltis_2010
        url: https://doi.org/10.1002/zoo.20251
      - id: leong_etal_2003
        url: https://doi.org/10.1080/09524622.2003.9753499
      - id: poole_2011
        url: https://doi.org/10.7208/9780226542263-011
    semantic_references:
      - id: leong_etal_2003
        url: https://doi.org/10.1080/09524622.2003.9753499
      - id: poole_2011
        url: https://doi.org/10.7208/9780226542263-011
      - id: stoeger_desilva_2014
        url: https://doi.org/10.1007/978-94-007-7414-8_3
    playback_references: []
    call_type_existence_agreement: weak
    call_type_existence_explanation: Croak appears in the Soltis 2010 inventory and was described by Leong et al. 2003, but Poole 2011 and Stoeger and de Silva 2014 treat it as rare and possibly idiosyncratic or learned. Existence as a normal repertoire call is therefore weakly supported.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Leong et al. 2003 and Poole 2011 provide compatible descriptions of a pulsatile croaking sound, and Soltis 2010 retains the category. Acoustic agreement is medium for the few examples available.
    semantic_description_agreement: weak
    semantic_description_explanation: Leong et al. 2003 gives captive behavioral setting, but Poole 2011 and Stoeger and de Silva 2014 emphasize rarity and uncertainty. The semantic label is weak because no clear wild function or playback evidence is available.

  - name: chuff
    in_primary_inventory: true
    alternative_names:
      - chuffing
      - wheeze
      - sneeze-like chuff
    scope: *unknown_scope
    acoustic_keywords:
      - broadband
      - noisy
      - short
      - abrupt
      - quiet
    acoustic_description: A short, noisy exhalatory sound reported in captive acoustic classification. Later wild-context review describes similar sounds as possibly wheeze-like or sneeze-like rather than a clearly vocal call.
    semantic_keywords:
      - attention
    semantic_description: Included here only because the primary inventory retains it. Captive observations provide limited behavioral setting, while later wild-context work questions whether it is communicative or instead a respiratory byproduct.
    acoustic_references:
      - id: soltis_2010
        url: https://doi.org/10.1002/zoo.20251
      - id: leong_etal_2003
        url: https://doi.org/10.1080/09524622.2003.9753499
      - id: poole_2011
        url: https://doi.org/10.7208/9780226542263-011
    semantic_references:
      - id: leong_etal_2003
        url: https://doi.org/10.1080/09524622.2003.9753499
      - id: poole_2011
        url: https://doi.org/10.7208/9780226542263-011
      - id: stoeger_desilva_2014
        url: https://doi.org/10.1007/978-94-007-7414-8_3
    playback_references: []
    call_type_existence_agreement: weak
    call_type_existence_explanation: Chuff is listed in the Soltis 2010 primary inventory via the Leong et al. 2003 captive classification, but Poole 2011 explicitly questions whether Leong's chuff is a cough, sneeze, or wheeze rather than a communicative call. Stoeger and de Silva 2014 also group chuff among rare, hard-to-compare signals. Existence agreement is weak.
    acoustic_description_agreement: weak
    acoustic_description_explanation: Leong et al. 2003 provides the main acoustic basis, while Poole 2011 disputes the interpretation of similar sounds. The acoustic label is weak because the boundary between chuff and non-signal respiratory sounds is contested.
    semantic_description_agreement: weak
    semantic_description_explanation: The only clear behavioral evidence is captive and limited, and Poole 2011 does not confirm a communicative wild context. The semantic label is weak despite inventory inclusion.

