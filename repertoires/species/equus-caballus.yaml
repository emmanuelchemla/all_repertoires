primary_inventory:
  id: waring_2003
  rationale: Waring 2003 is used as the repertoire spine because it summarizes the main domestic horse vocal and audible signal classes in social context. Focused acoustic studies of whinnies and snorts provide stronger support for the best-studied call types.
