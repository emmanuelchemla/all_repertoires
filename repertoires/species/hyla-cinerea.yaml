primary_inventory:
  id: reichert_hobel_2018
  rationale: >-
    Reichert and Hobel 2018 is used as the primary_inventory spine because it
    explicitly records and analyzes the two primary vocalization types in male
    Hyla cinerea, advertisement calls and aggressive calls. This is not a
    formal whole-life-stage repertoire monograph, but I found no stronger
    species-specific peer-reviewed inventory. General accounts mention release,
    warning, alarm, or rain calls, but I did not find peer-reviewed
    species-specific acoustic and semantic descriptions detailed enough to add
    them under the current inclusion rules.
calls:
  - name: advertisement call
    in_primary_inventory: true
    alternative_names:
      - mating call
      - mate-attraction call
      - breeding call
    scope: &adult_male_scope
      life_stages:
        - adult
      sexes:
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - low_frequency
      - high_frequency
      - tonal
      - harmonic
      - pulsed
      - short
      - repetitive
      - loud
    acoustic_description: >-
      A loud, short, repeated, single-note harmonic call. Natural and
      synthetic-call studies describe a call about 120-160 ms long, repeated
      roughly once or twice per second in choruses, with a bimodal spectrum: a
      low-frequency peak near 0.9-1.1 kHz and higher energy near about 2.7-3.3
      kHz. The call is not a pulse train, but its waveform has fine-temporal
      periodicity near 300 per second and a brief pulsatile onset.
    semantic_keywords:
      - courtship
      - mating
      - identity
      - attention
    semantic_description: Produced by adult males in breeding choruses at wetlands, ponds, and other calling sites. Female phonotaxis and mate-choice experiments show that females selectively approach species-typical advertisement calls, while field studies show that calling attendance is central to male mating opportunities and that the calls also attract eavesdropping satellite males.
    acoustic_references:
      - id: oldham_gerhardt_1975
        url: https://doi.org/10.2307/1442880
      - id: gerhardt_1974
