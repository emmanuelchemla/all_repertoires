    call_type_existence_agreement: strong
    call_type_existence_explanation: Reichert and Hobel 2018 list aggressive calls as the second primary Hyla cinerea vocalization type, Gerhardt 1978b reports that males produce two distinctive calls with rare acoustic intermediates, Perrill et al. 1982 uses synthetic encounter calls in field experiments, and Hobel and Rodriguez 2022 uses aggressive-call stimuli derived from population means. The encounter/aggressive naming differs, but the discrete call type is strongly supported.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Gerhardt 1978 and Gerhardt 1978b distinguish the pulsed aggressive/encounter signal from the advertisement call, Reichert and Hobel 2018 measure aggressive-call traits separately from advertisement-call traits, and Hobel and Rodriguez 2022 gives explicit stimulus parameters for Hyla cinerea aggressive calls. These sources agree that the signal is short and strongly amplitude-modulated/pulsed.
    semantic_description_agreement: medium
    semantic_description_explanation: Oldham and Gerhardt 1975, Fellers 1979, Perrill et al. 1982, Reichert and Hobel 2018, and Hobel and Rodriguez 2022 consistently place aggressive or encounter calls outside the female-attraction role of advertisement calls and in male-male or aversive contexts. The label is medium rather than strong because direct Hyla cinerea field studies of naturally produced aggressive calls are fewer than for advertisement calls, and some evidence comes from synthetic playback or comparative treefrog framing.

