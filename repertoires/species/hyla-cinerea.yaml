    call_type_existence_agreement: strong
    call_type_existence_explanation: Reichert and Hobel 2018 list advertisement calls as one of the two primary Hyla cinerea vocalization types, and Oldham and Gerhardt 1975, Gerhardt 1974, Gerhardt 1978, Gerhardt 1987, Gerhardt et al. 1987, Perrill et al. 1982, and Velez et al. 2012 all treat this male call as the core breeding signal. Terminology varies between advertisement, mating, and mate-attraction call, but the call type is stable.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Oldham and Gerhardt 1975, Gerhardt 1974, Gerhardt 1976, Gerhardt 1978, Gerhardt 1987, Velez et al. 2012, and Reichert and Hobel 2018 agree that the call is short, repeated, harmonic, and centered on low and high spectral regions near 1 and 3 kHz. Differences among studies mainly reflect which receiver-relevant feature was manipulated, not disagreement about call structure.
    semantic_description_agreement: strong
    semantic_description_explanation: Gerhardt 1974 and 1987 show female phonotaxis to species-typical advertisement-call structure, Gerhardt et al. 1987 links calling attendance with mating opportunity in a wild breeding aggregation, Perrill et al. 1982 shows mating calls attract satellite males, and Velez et al. 2012 tests female recognition of advertisement calls in chorus noise. The mating and species-recognition context is strongly supported.

  - name: aggressive call
    in_primary_inventory: true
    alternative_names:
      - encounter call
      - aggressive encounter call
      - pulsed call
    scope: *adult_male_scope
    acoustic_keywords:
      - low_frequency
      - high_frequency
      - tonal
      - harmonic
      - pulsed
      - short
      - repetitive
      - loud
      - multi_component
    acoustic_description: >-
      A short, strongly amplitude-modulated call that is pulsed throughout
      rather than mainly at the onset. Recent playback stimuli based on
      population means model the Hyla cinerea aggressive call as about 125 ms
      long with five pulses and spectral components near 900 and 2700 Hz;
      comparative repertoire work measures it separately from the advertisement
      call using modulation depth, relative amplitude, duty cycle, pulse rate,
      and related timing traits.
    semantic_keywords:
      - threat
      - aggression
      - territorial
      - spacing
    semantic_description: Produced by adult males during close-range male-male interactions in breeding aggregations and calling spaces. Field and playback studies distinguish responses to synthetic encounter/aggressive calls from responses to mating calls, consistent with a role in repelling or spacing rival males rather than attracting mates.
    acoustic_references:
