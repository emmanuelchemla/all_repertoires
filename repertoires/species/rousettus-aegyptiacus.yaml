scientific_name: Rousettus aegyptiacus
common_name: Egyptian fruit bat
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Mammalia
  order: Chiroptera
  family: Pteropodidae
  genus: Rousettus
  species: aegyptiacus
primary_inventory:
  id: prat_etal_2016
  rationale: Prat et al. 2016 is used as the spine because it explicitly enumerates the five distinct Egyptian fruit bat vocalization types shown in its repertoire figure--mating calls, isolation calls, seclusion/distress calls, echolocation clicks, and aggression calls--and states that continuous recording covered the complete repertoire used during the 2.5 month experiment. Prat et al. 2017 supports this inventory with the larger annotated vocalization dataset.
calls:
  - name: aggression call
    in_primary_inventory: true
    alternative_names:
      - aggressive call
      - agonistic call
      - squabble call
      - social call
    scope: &adult_unknown_scope
      life_stages:
        - adult
      sexes:
        - unknown
      population_specific: false
      note: ""
    acoustic_keywords:
      - broadband
      - noisy
      - harmonic
      - repetitive
      - multi_component
      - graded
    acoustic_description: A variable sequence of broad-band, multi-harmonic syllables, usually arranged as one to about twenty syllables per vocalization. Syllable-level feature distributions overlap among feeding, mating-protest, perch, and sleep contexts, but their spectral structure carries classifier-detectable information about caller, addressee, context, and likely interaction outcome.
    semantic_keywords:
      - aggression
      - threat
      - food
      - mating
      - spacing
      - identity
    semantic_description: Produced as directed pairwise protest or squabble calls in the roost, especially during conflicts over food, mating attempts, perch proximity, and positions in the sleeping cluster. It is the most common social call class in the primary inventory and is often addressed to a specific interaction partner.
    acoustic_references:
      - id: prat_etal_2016
        url: https://doi.org/10.1038/srep39419
      - id: prat_etal_2017
        url: https://doi.org/10.1038/sdata.2017.143
      - id: prat_azoulay_etal_2017
        url: https://doi.org/10.1371/journal.pbio.2002556
    semantic_references:
      - id: prat_etal_2016
        url: https://doi.org/10.1038/srep39419
      - id: prat_etal_2017
        url: https://doi.org/10.1038/sdata.2017.143
      - id: prat_azoulay_etal_2017
        url: https://doi.org/10.1371/journal.pbio.2002556
    playback_references:
      - id: prat_azoulay_etal_2017
        url: https://doi.org/10.1371/journal.pbio.2002556
    call_type_existence_agreement: medium
    call_type_existence_explanation: Prat et al. 2016 lists aggression calls as the most common Egyptian fruit bat call type, Prat et al. 2017 archives the annotated vocal corpus, and Prat, Azoulay et al. 2017 uses agonistic vocalizations as playback material. The label is medium rather than strong because the main evidence comes from the same research tradition and because aggression subcontexts are graded rather than sharply separate call types.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Prat et al. 2016 and Prat et al. 2017 agree on broad-band multi-harmonic syllable sequences and provide extensive annotated recordings, while Prat, Azoulay et al. 2017 confirms the adult multisyllabic acoustic range used for agonistic playbacks. Agreement is medium because detailed boundaries among feeding, mating, perch, and sleep aggression are statistical and overlapping.
    semantic_description_agreement: medium
    semantic_description_explanation: Prat et al. 2016 directly separates feeding, mating-protest, perch, and sleep aggression contexts and shows context, addressee, and outcome information in the calls; Prat et al. 2017 and Prat, Azoulay et al. 2017 support the same agonistic roost context. The label remains medium because receiver meaning is inferred from classification and behavior rather than from call-specific response playback.

  - name: mating call
    in_primary_inventory: true
    alternative_names:
      - male mating call
    scope:
      life_stages:
        - adult
      sexes:
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - low_frequency
      - tonal
      - harmonic
      - repetitive
      - multi_component
      - graded
    acoustic_description: A male social vocalization produced in bouts during mating interactions. The primary inventory illustrates it as a lower-frequency harmonic call sequence, mostly within the frequency range plotted below about 15 kHz, but call-specific acoustic measurements are limited.
    semantic_keywords:
      - courtship
      - mating
      - attention
    semantic_description: Produced by adult males during mating interactions. In the annotated repertoire it is separated from aggression calls, pup isolation calls, adult seclusion/distress calls, and echolocation clicks by caller class and mating context.
    acoustic_references:
      - id: prat_etal_2016
        url: https://doi.org/10.1038/srep39419
      - id: prat_etal_2017
        url: https://doi.org/10.1038/sdata.2017.143
    semantic_references:
      - id: prat_etal_2016
        url: https://doi.org/10.1038/srep39419
      - id: prat_etal_2017
        url: https://doi.org/10.1038/sdata.2017.143
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Prat et al. 2016 explicitly lists male mating calls in the primary inventory, and Prat et al. 2017 documents the broader annotated recordings across contexts. The label is medium because the call is clearly named in the repertoire spine but has little independent call-focused treatment.
    acoustic_description_agreement: weak
    acoustic_description_explanation: The acoustic description is based mainly on the Prat et al. 2016 example spectrogram and the Prat et al. 2017 dataset rather than a dedicated acoustic analysis of male mating calls. The label is weak for fine structure and boundaries.
    semantic_description_agreement: medium
    semantic_description_explanation: Prat et al. 2016 gives a direct context definition--male calls during mating--and Prat et al. 2017 supports the annotation framework. Agreement is medium because the production context is explicit, but courtship or receiver effects are not experimentally tested.

  - name: isolation call
    in_primary_inventory: true
    alternative_names:
      - pup isolation call
      - infant isolation call
      - i-call
    scope:
      life_stages:
        - infant
        - juvenile
      sexes:
        - unknown
      population_specific: false
      note: ""
    acoustic_keywords:
      - high_frequency
      - frequency_modulated
      - harmonic
      - repetitive
      - multi_component
      - graded
    acoustic_description: A high-fundamental-frequency pup call often emitted in trains. Herbert 1983 describes calls built from one to seven frequency-modulated units with up to three harmonics, usually upward-then-downward sweeps; call duration is mainly about 110-180 ms, and the first harmonic decreases with age from roughly 21-25 kHz at day 5 to 14-18 kHz by day 69. Later ontogeny studies show these calls developing toward adult-like social vocalizations.
    semantic_keywords:
      - distress
      - begging
      - caregiving
      - contact
    semantic_description: Produced by newborn and young pups when isolated from, left by, or detached from the mother in the roost. In separation trials the call attracted maternal searching and contact, and it declines as the young become independent.
    acoustic_references:
      - id: herbert_1983
        url: https://www.zobodat.at/pdf/Zeitschrift-Saeugetierkunde_48_0187-0189.pdf
      - id: prat_etal_2015
        url: https://doi.org/10.1126/sciadv.1500019
      - id: prat_etal_2016
        url: https://doi.org/10.1038/srep39419
      - id: prat_etal_2017
        url: https://doi.org/10.1038/sdata.2017.143
    semantic_references:
      - id: herbert_1983
        url: https://www.zobodat.at/pdf/Zeitschrift-Saeugetierkunde_48_0187-0189.pdf
      - id: prat_etal_2016
        url: https://doi.org/10.1038/srep39419
      - id: prat_etal_2017
        url: https://doi.org/10.1038/sdata.2017.143
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Isolation calls are independently documented by Herbert 1983 and by the Prat et al. 2015, 2016, and 2017 ontogeny and repertoire studies. The call is consistently treated as a pup call rather than an adult social-call variant.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Herbert 1983 provides detailed frequency-modulation, harmonic, duration, and ontogenetic measurements, while Prat et al. 2015, 2016, and 2017 show the high-F0 pup call and its developmental transition toward adult calls. Agreement is strong for the broad acoustic profile and developmental trend.
    semantic_description_agreement: strong
    semantic_description_explanation: Herbert 1983 experimentally elicited calls by separating a pup from its mother and reported maternal searching, while Prat et al. 2016 defines isolation calls as produced by pups left alone or detached from mothers. The separation/care-soliciting context is strongly supported.

  - name: seclusion distress call
    in_primary_inventory: true
    alternative_names:
      - distress call
      - seclusion call
      - adult distress call
    scope: *adult_unknown_scope
    acoustic_keywords:
      - broadband
      - noisy
      - harmonic
      - repetitive
      - multi_component
    acoustic_description: A repeated adult social vocalization illustrated as a distinct broad-band, multi-harmonic call class. It shares the general broad-band structure of other Egyptian fruit bat social calls, but the available literature provides little call-specific acoustic quantification beyond the repertoire example and annotated dataset.
    semantic_keywords:
      - distress
      - contact
      - attention
    semantic_description: Emitted mostly by distressed adults that are separated from others. The call is associated with social seclusion rather than with a specific resource conflict, mating interaction, pup separation, or sonar use.
    acoustic_references:
      - id: prat_etal_2016
        url: https://doi.org/10.1038/srep39419
      - id: prat_etal_2017
        url: https://doi.org/10.1038/sdata.2017.143
    semantic_references:
      - id: prat_etal_2016
        url: https://doi.org/10.1038/srep39419
      - id: prat_etal_2017
        url: https://doi.org/10.1038/sdata.2017.143
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Prat et al. 2016 lists seclusion/distress calls as a primary repertoire class, and Prat et al. 2017 provides the annotated database supporting the context labels. The label is medium because independent call-focused confirmation is limited.
    acoustic_description_agreement: weak
    acoustic_description_explanation: The broad acoustic description follows the Prat et al. 2016 spectrogram and the Prat et al. 2017 dataset, but few measurements are reported separately for seclusion/distress calls. Agreement is weak for acoustic boundaries against other broad-band social calls.
    semantic_description_agreement: medium
    semantic_description_explanation: Prat et al. 2016 explicitly associates the call with distressed adults separated from others, and Prat et al. 2017 supports the same annotation framework. Agreement is medium because the context is direct but receiver responses are not tested.

  - name: echolocation click
    in_primary_inventory: true
    alternative_names:
      - lingual click
      - tongue click
      - click
      - echolocation call
      - sonar click
    scope:
      life_stages:
        - infant
        - juvenile
        - adult
      sexes:
        - female
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - broadband
      - short
      - abrupt
      - quiet
      - repetitive
      - pulsed
    acoustic_description: A hyper-short, low-energy, broad-band impulse signal produced by rapid tongue movement and emitted in repeated, often paired click trains. Adult clicks are brief and low in energy but matched to the species' hearing sensitivity, and newborn pups already produce paired hyper-short clicks and can steer the sonar beam.
    semantic_keywords:
      - spacing
    semantic_description: Used for non-social acoustic orientation, obstacle avoidance, and movement through dark or cluttered spaces. It is included as a repertoire element because the primary inventory lists it, but its function is sonar rather than social signaling.
    acoustic_references:
      - id: holland_etal_2004
        url: https://doi.org/10.1242/jeb.01288
      - id: smarsh_etal_2021
        url: https://doi.org/10.1098/rspb.2021.1714
      - id: prat_etal_2016
        url: https://doi.org/10.1038/srep39419
    semantic_references:
      - id: holland_etal_2004
        url: https://doi.org/10.1242/jeb.01288
      - id: smarsh_etal_2021
        url: https://doi.org/10.1098/rspb.2021.1714
      - id: prat_etal_2016
        url: https://doi.org/10.1038/srep39419
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Holland et al. 2004 directly measures R. aegyptiacus echolocation clicks, Prat et al. 2016 lists echolocation clicks in the primary repertoire, and Smarsh et al. 2021 documents click production from birth. The existence of lingual echolocation clicks in this species is strongly established.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Holland et al. 2004 provides focused measurements of duration, energy, amplitude, and signal structure, while Smarsh et al. 2021 confirms hyper-short paired clicks in neonates and Prat et al. 2016 independently identifies click-based sonar in the repertoire. Agreement is strong.
    semantic_description_agreement: strong
    semantic_description_explanation: Holland et al. 2004 supports obstacle avoidance by impulse sonar, Smarsh et al. 2021 shows early-life hearing, click production, and beam steering, and Prat et al. 2016 treats echolocation clicks separately from social calls. The orientation context is strongly agreed, even though it is non-social.

