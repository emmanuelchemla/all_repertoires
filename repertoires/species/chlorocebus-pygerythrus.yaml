scientific_name: Chlorocebus pygerythrus
common_name: Vervet monkey
has_full_inventory: true
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Mammalia
  order: Primates
  family: Cercopithecidae
  genus: Chlorocebus
  species: pygerythrus
primary_inventory:
  id: struhsaker_1967
  rationale: "Struhsaker 1967 is used as the primary_inventory spine because it is the classic observational and spectrographic inventory of free-ranging Amboseli vervet auditory communication. It enumerates the predator alarms and the major intragroup, intergroup, submissive, affiliative, play, and infant vocal or audible signal classes later summarized by Isbell and Enstam-Jaffe 2013 and Radick 2006. This file includes those named communicative call/sound classes, while excluding noncommunicative physiological noises such as coughs, sneezes, and vomiting."
calls:
  - name: uh
    in_primary_inventory: true
    alternative_names:
      - uh alarm
      - low-intensity minor-predator alarm
    scope: &adult_juvenile_both_scope
      life_stages:
        - juvenile
        - adult
      sexes:
        - female
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - low_frequency
      - short
      - abrupt
      - quiet
      - graded
    acoustic_description: "A short, low-intensity alarm vocalization, named onomatopoetically by Struhsaker. Detailed spectrographic measurements are sparse, but inventory accounts distinguish it from louder, repeated, high-intensity alarm calls such as rraups, chirps, and threat-alarm barks."
    semantic_keywords:
      - alarm
      - predator
      - attention
    semantic_description: "Produced to nearby minor terrestrial threats, including small mammalian predators or other low-intensity disturbances. It appears to alert group members to inspect the source of danger rather than to trigger the more urgent escape responses associated with major predators."
    acoustic_references:
      - id: struhsaker_1967
        url: https://scholars.duke.edu/publication/1562008
      - id: isbell_enstamjaffe_2013
        url: https://www.researchgate.net/publication/248706941_Chlorocebus_pygerythrus_Vervet_monkey
    semantic_references:
      - id: struhsaker_1967
        url: https://scholars.duke.edu/publication/1562008
      - id: radick_2006
        url: https://doi.org/10.1016/j.shpsc.2006.03.009
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: "Struhsaker 1967 lists uh among the alarm-call repertoire and Radick 2006 discusses it as part of Struhsaker's broader predator-call table, but later experimental work focuses mostly on leopard, eagle, and snake alarm classes. The existence label is therefore medium."
    acoustic_description_agreement: weak
    acoustic_description_explanation: "Struhsaker 1967 and Isbell and Enstam-Jaffe 2013 support uh as a low-intensity alarm call, but published acoustic measurements are limited compared with the quantified chutter, rraup, chirp, and bark literature. Agreement is weak for fine structure."
    semantic_description_agreement: medium
    semantic_description_explanation: "Struhsaker 1967 and Radick 2006 agree that uh is tied to minor mammalian or human-like threats, but no dedicated playback or quantitative production study tests this call alone. Semantic agreement is moderate but not strong."

  - name: nyow
    in_primary_inventory: true
    alternative_names:
      - nyow alarm
      - moderate-intensity minor-predator alarm
    scope: &adult_both_scope
      life_stages:
        - adult
      sexes:
        - female
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - short
      - loud
      - abrupt
      - noisy
      - graded
    acoustic_description: "A moderate-intensity, abrupt alarm call represented by the onomatopoetic label nyow. It is described as distinct from both the quieter uh and the higher-intensity rraup, chirp, and bark calls, but it has not received the same quantitative acoustic treatment as the classic three predator alarms."
    semantic_keywords:
      - alarm
      - predator
      - attention
    semantic_description: "Given to sudden movements or appearances of minor predators such as baboons or small cats. It functions as an alerting call associated with moderate threat, often prompting orientation and sometimes flight."
    acoustic_references:
      - id: struhsaker_1967
        url: https://scholars.duke.edu/publication/1562008
      - id: isbell_enstamjaffe_2013
        url: https://www.researchgate.net/publication/248706941_Chlorocebus_pygerythrus_Vervet_monkey
    semantic_references:
      - id: struhsaker_1967
        url: https://scholars.duke.edu/publication/1562008
      - id: radick_2006
        url: https://doi.org/10.1016/j.shpsc.2006.03.009
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: "Nyow is part of the Struhsaker 1967 alarm inventory and is repeated in later repertoire summaries, but it is not a central unit in the later playback and quantitative alarm-call literature. Existence agreement is medium."
    acoustic_description_agreement: weak
    acoustic_description_explanation: "The available sources distinguish nyow qualitatively by intensity and context, but provide little modern spectrographic measurement. Acoustic agreement is therefore weak."
    semantic_description_agreement: medium
    semantic_description_explanation: "Struhsaker 1967 and Radick 2006 consistently place nyow in moderate minor-predator contexts. The lack of nyow-specific playback evidence keeps semantic agreement at medium."

  - name: chutter
    in_primary_inventory: true
    alternative_names:
      - snake alarm
      - snake chutter
      - aggressive chutter
    scope: *adult_juvenile_both_scope
    acoustic_keywords:
      - high_frequency
      - broadband
      - noisy
      - short
      - repetitive
      - multi_component
      - graded
    acoustic_description: "A staccato, multi-element broadband call. Quantitative analyses identify high-frequency clusters of short elements, but also show graded continuity from typical chutters toward rraup-like calls when aggressive contexts are included."
    semantic_keywords:
      - alarm
      - predator
      - aggression
      - threat
      - attention
    semantic_description: "Produced to snakes, especially pythons, and to some human or intergroup threats. Playback studies show snake-alarm responses such as looking down or inspecting the ground, while later analyses show that chutter-like calls also occur during between-group aggression."
    acoustic_references:
      - id: struhsaker_1967
        url: https://scholars.duke.edu/publication/1562008
      - id: owren_bernacki_1988
        url: https://doi.org/10.1121/1.396477
      - id: price_etal_2015
        url: https://doi.org/10.1038/srep13220
    semantic_references:
      - id: seyfarth_etal_1980_anbehav
        url: https://doi.org/10.1016/S0003-3472(80)80097-2
      - id: seyfarth_etal_1980_science
        url: https://doi.org/10.1126/science.7433999
      - id: price_etal_2015
        url: https://doi.org/10.1038/srep13220
    playback_references:
      - id: seyfarth_etal_1980_anbehav
        url: https://doi.org/10.1016/S0003-3472(80)80097-2
      - id: seyfarth_etal_1980_science
        url: https://doi.org/10.1126/science.7433999
    call_type_existence_agreement: strong
    call_type_existence_explanation: "Chutters are listed in Struhsaker 1967, experimentally tested as snake alarms by Seyfarth et al. 1980, acoustically analyzed by Owren and Bernacki 1988, and reanalyzed quantitatively by Price et al. 2015. Existence agreement is strong."
    acoustic_description_agreement: strong
    acoustic_description_explanation: "Owren and Bernacki 1988 and Price et al. 2015 independently support a short, repeated, broadband structure, while Price et al. also documents graded overlap with rraup-like aggressive calls. Agreement is strong for the broad acoustic form."
    semantic_description_agreement: medium
    semantic_description_explanation: "Seyfarth et al. 1980 provides strong playback evidence for snake-alarm responses, but Price et al. 2015 shows that chutters are also produced in between-group aggression. Semantic agreement is therefore medium rather than narrowly snake-specific."

  - name: rraup
    in_primary_inventory: true
    alternative_names:
      - eagle alarm
      - aerial predator alarm
      - cough
    scope: *adult_juvenile_both_scope
    acoustic_keywords:
      - low_frequency
      - broadband
      - noisy
      - short
      - repetitive
      - multi_component
      - graded
    acoustic_description: "A rough, low-frequency alarm call, often produced as short noisy elements. Price et al. 2015 places rraups in lower-frequency clusters than typical chutters, while noting continuous intermediates between rraup-like and chutter-like calls in aggressive contexts."
    semantic_keywords:
      - alarm
      - predator
      - attention
    semantic_description: "Produced mainly to aerial predators such as martial eagles. Playbacks elicit aerial-predator responses, including looking upward or moving toward cover, although rraup-like calls can also occur during escalated aggression."
    acoustic_references:
      - id: struhsaker_1967
        url: https://scholars.duke.edu/publication/1562008
      - id: price_etal_2015
        url: https://doi.org/10.1038/srep13220
      - id: owren_bernacki_1988
        url: https://doi.org/10.1121/1.396477
    semantic_references:
      - id: seyfarth_etal_1980_anbehav
        url: https://doi.org/10.1016/S0003-3472(80)80097-2
      - id: seyfarth_etal_1980_science
        url: https://doi.org/10.1126/science.7433999
      - id: price_etal_2015
        url: https://doi.org/10.1038/srep13220
    playback_references:
      - id: seyfarth_etal_1980_anbehav
        url: https://doi.org/10.1016/S0003-3472(80)80097-2
      - id: seyfarth_etal_1980_science
        url: https://doi.org/10.1126/science.7433999
    call_type_existence_agreement: strong
    call_type_existence_explanation: "Rraup is a named alarm in Struhsaker 1967, a central eagle-alarm class in Seyfarth et al. 1980, and a low-frequency cluster in Price et al. 2015. The call type is strongly recognized."
    acoustic_description_agreement: medium
    acoustic_description_explanation: "Price et al. 2015 and Owren and Bernacki 1988 support low-frequency raptor-alarm structure, but Price et al. also shows graded overlap with chutter-like aggressive calls. Acoustic agreement is medium."
    semantic_description_agreement: strong
    semantic_description_explanation: "Seyfarth et al. 1980 playback experiments support aerial-predator responses, and Price et al. 2015 confirms that rraups are mainly associated with raptor contexts while adding nuance about aggressive overlap. Semantic agreement is strong."

  - name: chirp
    in_primary_inventory: true
    alternative_names:
      - leopard alarm
      - terrestrial predator alarm
      - female terrestrial-predator alarm
    scope: *adult_juvenile_both_scope
    acoustic_keywords:
      - broadband
      - noisy
      - short
      - loud
      - abrupt
      - graded
    acoustic_description: "A short, sharp, loud alarm call, historically described as low in frequency and long-carrying. Quantitative work finds that female leopard-context chirps have fewer, longer elements and medium frequency values, and are more acoustically distinct from other alarm and aggressive calls than chutter/rraup variants."
    semantic_keywords:
      - alarm
      - predator
      - attention
    semantic_description: "Given to major terrestrial predators such as leopards, lions, cheetahs, and servals. Playbacks of leopard alarms lead receivers to climb or move into trees, consistent with terrestrial ambush-predator avoidance."
    acoustic_references:
      - id: struhsaker_1967
        url: https://scholars.duke.edu/publication/1562008
      - id: price_etal_2015
        url: https://doi.org/10.1038/srep13220
    semantic_references:
      - id: seyfarth_etal_1980_anbehav
        url: https://doi.org/10.1016/S0003-3472(80)80097-2
      - id: seyfarth_etal_1980_science
        url: https://doi.org/10.1126/science.7433999
      - id: radick_2006
        url: https://doi.org/10.1016/j.shpsc.2006.03.009
    playback_references:
      - id: seyfarth_etal_1980_anbehav
        url: https://doi.org/10.1016/S0003-3472(80)80097-2
      - id: seyfarth_etal_1980_science
        url: https://doi.org/10.1126/science.7433999
    call_type_existence_agreement: strong
    call_type_existence_explanation: "Chirp is listed by Struhsaker 1967, discussed as one of the historically central predator calls by Radick 2006, and emerges as a distinct female terrestrial-predator cluster in Price et al. 2015. Existence agreement is strong."
    acoustic_description_agreement: strong
    acoustic_description_explanation: "Struhsaker 1967 provides the qualitative inventory description and Price et al. 2015 gives quantitative evidence that chirps are acoustically distinct from chutters, rraups, and aggressive calls. Acoustic agreement is strong."
    semantic_description_agreement: strong
    semantic_description_explanation: "Seyfarth et al. 1980 playback experiments show terrestrial-predator avoidance responses to leopard alarms, and Struhsaker 1967 plus Radick 2006 link chirps to major mammalian predators. Semantic agreement is strong."

  - name: bark
    in_primary_inventory: true
    alternative_names:
      - threat-alarm bark
      - leopard alarm bark
      - male alarm bark
      - aggressive bark
    scope: &adult_juvenile_male_scope
      life_stages:
        - juvenile
        - adult
      sexes:
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - broadband
      - noisy
      - long
      - loud
      - repetitive
      - multi_component
      - graded
    acoustic_description: "A loud, gruff, bark-like call usually produced in repeated bouts by subadult or adult males. Price et al. 2015 finds bark-like calls with relatively high-frequency long elements and partial overlap between leopard and aggressive contexts, while Schad et al. 2025 treats barks as long-distance loud calls."
    semantic_keywords:
      - alarm
      - predator
      - aggression
      - threat
      - display
      - territorial
    semantic_description: "Produced by males to large terrestrial predators and also during within- and between-group aggressive interactions. Playback work shows that receivers use contextual information when interpreting male alarm barks, and recent field work links barking rates with male rank and season."
    acoustic_references:
      - id: struhsaker_1967
        url: https://scholars.duke.edu/publication/1562008
      - id: price_etal_2015
        url: https://doi.org/10.1038/srep13220
      - id: schad_etal_2025
        url: https://doi.org/10.1007/s10764-024-00475-x
    semantic_references:
      - id: price_etal_2015
        url: https://doi.org/10.1038/srep13220
      - id: deshpande_etal_2023
        url: https://doi.org/10.1007/s10071-023-01767-0
      - id: schad_etal_2025
        url: https://doi.org/10.1007/s10764-024-00475-x
    playback_references:
      - id: deshpande_etal_2023
        url: https://doi.org/10.1007/s10071-023-01767-0
    call_type_existence_agreement: strong
    call_type_existence_explanation: "Barks or threat-alarm barks are listed in Struhsaker 1967, quantitatively analyzed by Price et al. 2015, tested in playback by Deshpande et al. 2023, and studied as male loud calls by Schad et al. 2025. Agreement is strong."
    acoustic_description_agreement: strong
    acoustic_description_explanation: "Price et al. 2015 provides quantitative bark structure and context overlap, while Schad et al. 2025 independently treats male barks as long-distance high-amplitude calls. Acoustic agreement is strong, with graded contextual variants."
    semantic_description_agreement: strong
    semantic_description_explanation: "Price et al. 2015, Deshpande et al. 2023, and Schad et al. 2025 agree that barks occur in predator and aggression contexts. The exact inferred meaning is context-dependent, but the dual alarm/aggression use is strongly supported."

  - name: wrr
    in_primary_inventory: true
    alternative_names:
      - wrrr
      - threat grunt
      - aggressive grunt
    scope: *adult_both_scope
    acoustic_keywords:
      - low_frequency
      - noisy
      - short
      - repetitive
      - graded
    acoustic_description: "A harsh, low-frequency threat-grunt-like call. The published quantitative detail is limited, but Price et al. 2015 includes wrrs as threat grunts occurring in aggressive contexts alongside chutter- and rraup-like calls."
    semantic_keywords:
      - threat
      - aggression
      - display
    semantic_description: "Used in within- and between-group aggression, where it appears to signal threat or agonistic arousal rather than predator-specific danger. Its boundaries with other aggressive grunt-like calls are less firmly resolved."
    acoustic_references:
      - id: struhsaker_1967
        url: https://scholars.duke.edu/publication/1562008
      - id: price_etal_2015
        url: https://doi.org/10.1038/srep13220
      - id: isbell_enstamjaffe_2013
        url: https://www.researchgate.net/publication/248706941_Chlorocebus_pygerythrus_Vervet_monkey
    semantic_references:
      - id: struhsaker_1967
        url: https://scholars.duke.edu/publication/1562008
      - id: price_etal_2015
        url: https://doi.org/10.1038/srep13220
      - id: isbell_enstamjaffe_2013
        url: https://www.researchgate.net/publication/248706941_Chlorocebus_pygerythrus_Vervet_monkey
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: "Wrrs are in the Struhsaker 1967 inventory and are named as threat grunts in Price et al. 2015, but they are not deeply analyzed as a standalone call type. Agreement is medium."
    acoustic_description_agreement: weak
    acoustic_description_explanation: "Sources agree that wrrs are threat-grunt-like, but detailed acoustic measurements remain sparse. Acoustic agreement is weak."
    semantic_description_agreement: medium
    semantic_description_explanation: "Struhsaker 1967, Isbell and Enstam-Jaffe 2013, and Price et al. 2015 place wrrs in aggressive contexts. The threat interpretation is supported, but not playback-tested, so agreement is medium."

  - name: grunt
    in_primary_inventory: true
    alternative_names:
      - social grunt
      - contact grunt
      - progression grunt
      - intergroup grunt
      - greeting grunt
      - approach grunt
    scope: *adult_juvenile_both_scope
    acoustic_keywords:
      - low_frequency
      - noisy
      - short
      - abrupt
      - quiet
      - graded
    acoustic_description: "A short, harsh, usually close-range call. Classic acoustic measurements describe grunts as about 125 ms long, with an aperiodic low fundamental near 240 Hz and one or two spectral peaks whose placement and contour distinguish context-specific variants."
    semantic_keywords:
      - contact
      - group_coordination
      - affiliation
      - spacing
      - identity
      - attention
    semantic_description: "Used across social approach, movement, and intergroup contexts. Playback experiments show that vervets distinguish at least four grunt variants, including calls associated with approaching dominant or subordinate individuals, moving into a new area, and seeing another group; later work also links greeting grunts with benign intent and recruitment in risky situations."
    acoustic_references:
      - id: cheney_seyfarth_1982
        url: https://doi.org/10.1016/S0003-3472(82)80146-2
      - id: seyfarth_cheney_1984
        url: https://doi.org/10.1121/1.390872
      - id: struhsaker_1967
        url: https://scholars.duke.edu/publication/1562008
    semantic_references:
      - id: cheney_seyfarth_1982
        url: https://doi.org/10.1016/S0003-3472(82)80146-2
      - id: mercier_etal_2017
        url: https://doi.org/10.1016/j.anbehav.2017.07.021
      - id: seyfarth_cheney_1986
        url: https://doi.org/10.1016/S0003-3472(86)80252-4
    playback_references:
      - id: cheney_seyfarth_1982
        url: https://doi.org/10.1016/S0003-3472(82)80146-2
    call_type_existence_agreement: strong
    call_type_existence_explanation: "Grunts are part of Struhsaker 1967's repertoire and are central to Cheney and Seyfarth 1982, Seyfarth and Cheney 1984, and Mercier et al. 2017. Agreement is strong for grunts as a major call class, although studies split context-specific variants differently."
    acoustic_description_agreement: strong
    acoustic_description_explanation: "Seyfarth and Cheney 1984 gives detailed acoustic measurements, while Cheney and Seyfarth 1982 shows receivers treat small acoustic differences as meaningful. Acoustic agreement is strong."
    semantic_description_agreement: strong
    semantic_description_explanation: "Cheney and Seyfarth 1982 playback experiments and Mercier et al. 2017 field analyses independently support situation-specific social and greeting functions. Semantic agreement is strong for the broad grunt class."

  - name: scream
    in_primary_inventory: true
    alternative_names:
      - agonistic scream
      - victim scream
      - aggressor scream
      - juvenile scream
    scope: *adult_juvenile_both_scope
    acoustic_keywords:
      - high_frequency
      - broadband
      - noisy
      - long
      - loud
      - graded
    acoustic_description: "A high-pitched, high-amplitude noisy call produced singly or in bouts. In wild agonistic screams, victim screams tend to be longer and higher-pitched than aggressor screams, and severe conflicts produce screams with higher entropy."
    semantic_keywords:
      - distress
      - aggression
      - submission
      - recruitment
      - identity
    semantic_description: "Produced during agonistic encounters and distress situations by victims and aggressors, including juveniles. Acoustic variation is associated with caller role, identity, and conflict severity, and may reduce opponent aggression or attract helpers; juvenile scream playbacks also support individual recognition by mothers."
    acoustic_references:
      - id: struhsaker_1967
        url: https://scholars.duke.edu/publication/1562008
      - id: mercier_etal_2019
        url: https://doi.org/10.1371/journal.pone.0214640
    semantic_references:
      - id: cheney_seyfarth_1980
        url: https://doi.org/10.1016/S0003-3472(80)80044-3
      - id: mercier_etal_2019
        url: https://doi.org/10.1371/journal.pone.0214640
    playback_references:
      - id: cheney_seyfarth_1980
        url: https://doi.org/10.1016/S0003-3472(80)80044-3
    call_type_existence_agreement: strong
    call_type_existence_explanation: "Screams are in the Struhsaker 1967 inventory, juvenile screams were used in Cheney and Seyfarth 1980 playback work, and adult agonistic screams were quantified by Mercier et al. 2019. Agreement is strong."
    acoustic_description_agreement: strong
    acoustic_description_explanation: "Mercier et al. 2019 provides detailed acoustic evidence for high-pitched, high-amplitude agonistic screams and their variation with conflict role and severity. Acoustic agreement is strong."
    semantic_description_agreement: strong
    semantic_description_explanation: "Cheney and Seyfarth 1980 shows individual recognition of juvenile screams, and Mercier et al. 2019 links scream structure to role and conflict severity. Semantic agreement is strong for distress/agonistic recruitment functions."

  - name: squeal
    in_primary_inventory: true
    alternative_names:
      - agonistic squeal
      - defensive squeal
    scope: &adult_juvenile_female_scope
      life_stages:
        - juvenile
        - adult
      sexes:
        - female
      population_specific: false
      note: ""
    acoustic_keywords:
      - high_frequency
      - tonal
      - long
      - loud
      - graded
    acoustic_description: "A shrill, high-pitched call described with screams as a more continuous or graded defensive vocalization. Published acoustic measurements specific to squeals are limited, so the description relies mainly on the primary inventory and later repertoire summaries."
    semantic_keywords:
      - distress
      - aggression
      - submission
      - recruitment
    semantic_description: "Given by females and juveniles in defensive or subordinate agonistic situations, apparently to inhibit attack or solicit aid from other group members. It is less experimentally resolved than screams."
    acoustic_references:
      - id: struhsaker_1967
        url: https://scholars.duke.edu/publication/1562008
      - id: isbell_enstamjaffe_2013
        url: https://www.researchgate.net/publication/248706941_Chlorocebus_pygerythrus_Vervet_monkey
    semantic_references:
      - id: struhsaker_1967
        url: https://scholars.duke.edu/publication/1562008
      - id: isbell_enstamjaffe_2013
        url: https://www.researchgate.net/publication/248706941_Chlorocebus_pygerythrus_Vervet_monkey
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: "Squeals are included in Struhsaker 1967 and summarized by Isbell and Enstam-Jaffe 2013, but later acoustic and playback work usually focuses on screams rather than squeals. Existence agreement is medium."
    acoustic_description_agreement: weak
    acoustic_description_explanation: "The sources agree on a shrill, high-pitched form, but there are few squeal-specific measurements. Acoustic agreement is weak."
    semantic_description_agreement: medium
    semantic_description_explanation: "Struhsaker 1967 and Isbell and Enstam-Jaffe 2013 associate squeals with defensive agonistic contexts and solicitation of aid. The semantic account is plausible and repeated, but not experimentally isolated, so agreement is medium."

  - name: woof-woof
    in_primary_inventory: true
    alternative_names:
      - woof
      - submissive woof
    scope: &adult_male_scope
      life_stages:
        - adult
      sexes:
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - low_frequency
      - noisy
      - short
      - repetitive
      - multi_component
    acoustic_description: "A deep, non-tonal, guttural call produced as repeated woof-like elements, usually with the mouth closed or slightly opened. Detailed modern acoustic analyses are not available."
    semantic_keywords:
      - submission
      - threat
      - display
    semantic_description: "Produced by subordinate males in submissive or defensive display contexts, especially around dominance interactions. It may accompany visual displays and help signal de-escalation or submission."
    acoustic_references:
      - id: struhsaker_1967
        url: https://scholars.duke.edu/publication/1562008
      - id: isbell_enstamjaffe_2013
        url: https://www.researchgate.net/publication/248706941_Chlorocebus_pygerythrus_Vervet_monkey
    semantic_references:
      - id: struhsaker_1967
        url: https://scholars.duke.edu/publication/1562008
      - id: isbell_enstamjaffe_2013
        url: https://www.researchgate.net/publication/248706941_Chlorocebus_pygerythrus_Vervet_monkey
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: "Woof-woof is in the Struhsaker 1967 inventory and later summaries, but has little dedicated follow-up work. Existence agreement is medium."
    acoustic_description_agreement: weak
    acoustic_description_explanation: "The deep guttural description is consistent across inventory summaries, but lacks quantitative measurement. Acoustic agreement is weak."
    semantic_description_agreement: medium
    semantic_description_explanation: "Struhsaker 1967 and Isbell and Enstam-Jaffe 2013 associate woof-woof with subordinate male submission. The semantic description is repeated but not playback-tested, so agreement is medium."

  - name: wa
    in_primary_inventory: true
    alternative_names:
