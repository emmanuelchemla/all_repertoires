scientific_name: Colobus guereza
common_name: Mantled guereza
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Mammalia
  order: Primates
  family: Cercopithecidae
  genus: Colobus
  species: guereza
primary_inventory:
  id: marler_1972
  rationale: 'Marler 1972 (Behaviour 42:175-197) is used as the primary inventory
    because it is the foundational and most widely cited enumeration of the Colobus
    guereza vocal repertoire. Marler reports six sound categories based on field observation
    and spectrographic analysis of Budongo Forest groups in Uganda: roaring, snorting,
    purring, cawing, squeaking and screaming, and tongue clicking. Later wild work
    (Oates 1977; Harris and colleagues; Schel and colleagues) reuses and refines these
    categories. This file lists the six Marler categories and treats Marler''s grouped
    squeak and scream entry as a single graded distress class, as Marler himself did.'
calls:
- name: roar
  in_primary_inventory: true
  alternative_names:
  - roaring
  - roaring phrase
  - male roar
  - long-distance call
  - dawn chorus call
  scope:
    life_stages:
