    note: ''
  acoustic_keywords:
  - low_frequency
  - quiet
  - long
  - tonal
  acoustic_description: A soft, low-pitched purring sound described by Marler 1972
    as audible only at close range and rarely encountered in field recordings. Detailed
    modern spectrographic measurements specific to guereza purrs are not available
    beyond Marler's qualitative description.
  semantic_keywords:
  - group_coordination
  - contact
  - affiliation
  semantic_description: Produced before or during group movements, apparently coordinating
    departure or progression. Marler 1972 reports that purring accompanies group movement;
    Oates 1977 includes it in the close-range social repertoire associated with group
    cohesion.
  acoustic_references:
  - id: marler_1972
  - id: oates_1977
    url: https://doi.org/10.1111/j.1439-0310.1977.tb01007.x
  semantic_references:
  - id: marler_1972
  - id: oates_1977
    url: https://doi.org/10.1111/j.1439-0310.1977.tb01007.x
  playback_references: []
  call_type_existence_agreement: medium
  call_type_existence_explanation: Purring is included as one of Marler 1972's six
    categories and is mentioned in Oates 1977's detailed social-behavior account,
    but it is rarely targeted by later acoustic or experimental work. Agreement is
    medium.
  acoustic_description_agreement: weak
  acoustic_description_explanation: Only qualitative descriptions of guereza purrs
    are available, with no published quantitative spectrographic analysis specific
    to this call type. Acoustic agreement is weak.
  semantic_description_agreement: medium
  semantic_description_explanation: Marler 1972 and Oates 1977 consistently associate
    purrs with group-movement and close-range social contexts, but no playback or
    quantitative production study tests this function. Semantic agreement is medium.
