    - male
    population_specific: false
    note: ''
  acoustic_keywords:
  - loud
  - low_frequency
  - long
  - repetitive
  - multi_component
  - graded
  acoustic_description: A loud, low-pitched, long-distance vocalization produced by
    adult males as a sequence of discrete roaring phrases. Harris et al. 2006 quantify
    formant dispersion and report that roars are produced with the subhyoid air sac
    inflated rather than with marked laryngeal movement, and that formant dispersion
    is lower than expected for body size. Schel and Zuberbuhler 2009 describe roaring
    phrases as acoustically variable units that can be assembled into longer or shorter
    sequences depending on context, and Schel and Zuberbuhler 2012 reports that the
    duration of the first roaring phrase is longer in predawn roars than in eagle-context
    roars and that call repetition rate is faster in eagle-context roars.
  semantic_keywords:
  - territorial
  - spacing
  - display
  - alarm
  - predator
  - group_coordination
  semantic_description: Produced by the single resident adult male of a group, mainly
    at night and dawn during contagious choruses, but also during the day in response
    to leopards and crowned eagles or to neighboring groups. Marler 1969 and 1972
    interpret roaring as a long-distance intergroup spacing signal rather than as
    direct territorial defense. Harris et al. 2012 frames dawn chorusing as a competitive
    male display directed at rivals and possibly at within-group females, while Schel
    and Zuberbuhler 2009 and Schel et al. 2010 show that predator-context roars are
    structured into predator-specific sequences and that receivers respond in predator-specific
    ways.
  acoustic_references:
  - id: marler_1972
  - id: harris_etal_2006
    url: https://doi.org/10.1111/j.1439-0310.2006.01247.x
  - id: schel_tranquilli_zuberbuhler_2009
    url: https://doi.org/10.1037/a0014280
  - id: schel_zuberbuhler_2012
    url: https://doi.org/10.1016/j.beproc.2012.05.004
  semantic_references:
  - id: marler_1969
    url: https://doi.org/10.1126/science.163.3862.93
  - id: marler_1972
  - id: schel_tranquilli_zuberbuhler_2009
    url: https://doi.org/10.1037/a0014280
  - id: schel_candiotti_zuberbuhler_2010
    url: https://doi.org/10.1016/j.anbehav.2010.07.034
  - id: harris_etal_2012_dawn
    url: https://doi.org/10.1007/s00265-011-1282-3
  playback_references:
  - id: schel_candiotti_zuberbuhler_2010
    url: https://doi.org/10.1016/j.anbehav.2010.07.034
  - id: schel_zuberbuhler_2012
    url: https://doi.org/10.1016/j.beproc.2012.05.004
  call_type_existence_agreement: strong
  call_type_existence_explanation: 'Roaring is the most thoroughly documented Colobus
    guereza call type: Marler 1969 and 1972 introduce it as the central long-distance
    male call, Harris et al. 2006 and Harris et al. 2012 study its acoustic structure
    and chorusing, and Schel and Zuberbuhler 2009, Schel et al. 2010, and Schel and
    Zuberbuhler 2012 quantify predator-context roaring. Agreement is strong across
    independent sources.'
  acoustic_description_agreement: strong
  acoustic_description_explanation: Harris et al. 2006 provides quantitative acoustic
    and anatomical evidence (formant dispersion, subhyoid air sac), Schel and Zuberbuhler
    2009 and 2012 give measurements of phrase duration, repetition rate, and predator-context
    sequence assembly, and Harris et al. 2012 confirms acoustic individuality. Independent
    acoustic agreement is strong.
  semantic_description_agreement: strong
  semantic_description_explanation: Marler 1969 and 1972 link roaring to intergroup
    spacing, Harris et al. 2012 supports a competitive male display function in dawn
    chorusing, and Schel and Zuberbuhler 2009, Schel et al. 2010, and Schel and Zuberbuhler
    2012 demonstrate predator-specific production and receiver responses. Multiple
    independent semantic lines converge.
- name: snort
  in_primary_inventory: true
  alternative_names:
  - male snort
  - alarm snort
  scope:
    life_stages:
    - adult
    sexes:
    - male
    - female
    population_specific: false
    note: ''
  acoustic_keywords:
  - short
  - broadband
  - noisy
  - abrupt
  - low_frequency
  acoustic_description: A short, broadband noisy call with a sudden onset. Schel and
    Zuberbuhler 2009 measure snorts as having most energy below about 4 kHz with a
    main peak near 1 kHz, distinct from the more tonal and structured roaring phrases.
    Marler 1972 describes snorts as brief explosive sounds delivered singly or as
    the leading unit before a roaring sequence.
  semantic_keywords:
  - alarm
  - predator
  - threat
  - attention
  semantic_description: Produced by adult males, and occasionally by females in disturbed
    contexts, as a response to potential predators or as a low-level threat or pre-aggression
    warning. Schel and Zuberbuhler 2009 show that leopard encounters typically elicit
    a snort followed by a few roaring phrases, while eagle encounters elicit sequences
    with no snorts and many phrases, making snort presence a predator-context cue.
  acoustic_references:
  - id: marler_1972
  - id: schel_tranquilli_zuberbuhler_2009
    url: https://doi.org/10.1037/a0014280
  semantic_references:
  - id: marler_1972
  - id: schel_tranquilli_zuberbuhler_2009
    url: https://doi.org/10.1037/a0014280
  - id: schel_candiotti_zuberbuhler_2010
    url: https://doi.org/10.1016/j.anbehav.2010.07.034
  playback_references:
  - id: schel_candiotti_zuberbuhler_2010
    url: https://doi.org/10.1016/j.anbehav.2010.07.034
  call_type_existence_agreement: strong
  call_type_existence_explanation: Snorts are one of Marler 1972's six core call categories
    and are quantified as a distinct alarm call type by Schel and Zuberbuhler 2009
    and used in the Schel et al. 2010 playback experiments. Agreement across independent
    sources is strong.
  acoustic_description_agreement: medium
  acoustic_description_explanation: Schel and Zuberbuhler 2009 gives quantitative
    acoustic detail (broadband structure, frequency content), and Marler 1972 provides
    the qualitative spectrographic baseline. Few additional independent acoustic studies
    exist for guereza snorts, so agreement is medium rather than strong.
  semantic_description_agreement: strong
  semantic_description_explanation: Marler 1972 describes snorts in threat and alarm
    contexts, Schel and Zuberbuhler 2009 quantitatively links snort presence to leopard-context
    sequences, and Schel et al. 2010 demonstrates that receivers respond in predator-specific
    ways to snort-containing sequences. Multiple independent semantic sources converge.
- name: purr
  in_primary_inventory: true
  alternative_names:
  - purring
  - soft purr
  - group-movement purr
  scope:
    life_stages:
