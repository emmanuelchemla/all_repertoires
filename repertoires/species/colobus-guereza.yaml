  acoustic_description: A short, harsh, repeated cawing sound described by Marler
    1972 for adult females, juveniles, and infants. Spectrographic detail beyond Marler's
    account is limited, and the call shades acoustically toward squeaking under higher
    arousal.
  semantic_keywords:
  - distress
  - threat
  - attention
  - alarm
  semantic_description: Used in situations of mild distress or mild threat. Marler
    1972 reports it from adult females, juveniles, and infants in low-level disturbance
    contexts, distinct from the more intense squeak and scream class. Oates 1977 retains
    it in the close-range disturbance repertoire.
  acoustic_references:
  - id: marler_1972
  - id: oates_1977
    url: https://doi.org/10.1111/j.1439-0310.1977.tb01007.x
  semantic_references:
  - id: marler_1972
  - id: oates_1977
    url: https://doi.org/10.1111/j.1439-0310.1977.tb01007.x
  playback_references: []
  call_type_existence_agreement: medium
  call_type_existence_explanation: Cawing is one of Marler 1972's six categories and
    appears in Oates 1977's social-behavior account, but it has not been the subject
    of dedicated follow-up acoustic or playback work. Agreement is medium.
  acoustic_description_agreement: weak
  acoustic_description_explanation: The available acoustic information is qualitative,
    with no modern quantitative analysis specific to cawing. Acoustic agreement is
    weak.
  semantic_description_agreement: medium
  semantic_description_explanation: Marler 1972 and Oates 1977 agree that cawing is
    produced in mild-distress and mild-threat contexts by females, juveniles, and
    infants, but functional inferences are not experimentally tested. Semantic agreement
    is medium.
