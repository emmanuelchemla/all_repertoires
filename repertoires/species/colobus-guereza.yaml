  acoustic_description: A brief, broadband, non-phonated click produced by sharp movement
    of the tongue against the palate. Marler 1972 explicitly classes it as a non-vocal
    sound and reports it as a short, sharp transient audible only at close to moderate
    range. No detailed quantitative kinematic or acoustic analysis specific to guereza
    is published.
  semantic_keywords:
  - threat
  - territorial
  - display
  - aggression
  semantic_description: Used in close-range agonistic and territorial contexts. Marler
    1972 reports tongue clicks in territorial-defense interactions, and Oates 1977
    describes the click in inter- and intra-group threat displays. It is treated as
    a mild aggressive signal rather than a predator alarm.
  acoustic_references:
  - id: marler_1972
  - id: oates_1977
    url: https://doi.org/10.1111/j.1439-0310.1977.tb01007.x
  semantic_references:
  - id: marler_1972
  - id: oates_1977
    url: https://doi.org/10.1111/j.1439-0310.1977.tb01007.x
  playback_references: []
  call_type_existence_agreement: medium
  call_type_existence_explanation: Tongue clicking is included in Marler 1972 as the
    sole non-vocal sound in his six-category inventory and is reused by Oates 1977,
    but modern acoustic or playback work does not isolate it. Agreement is medium.
  acoustic_description_agreement: weak
  acoustic_description_explanation: The acoustic description rests on Marler 1972's
    qualitative spectrographic baseline. No quantitative measurements specific to
    guereza tongue clicks are available, so acoustic agreement is weak.
  semantic_description_agreement: medium
  semantic_description_explanation: Marler 1972 and Oates 1977 agree on a close-range
    agonistic and territorial threat context for tongue clicking. Without experimental
    tests, semantic agreement is medium rather than strong.
