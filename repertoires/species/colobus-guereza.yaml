    note: ''
  acoustic_keywords:
  - high_frequency
  - loud
  - noisy
  - long
  - graded
  acoustic_description: A graded high-pitched, high-amplitude class of calls ranging
    from shorter squeaks to longer, noisier screams. Marler 1972 treats squeaks and
    screams as a continuous graded category given in increasing arousal, and provides
    the qualitative spectrographic baseline. No modern quantitative acoustic analysis
    specifically targets this guereza call class.
  semantic_keywords:
  - distress
  - aggression
  - submission
  - caregiving
  - recruitment
  semantic_description: Produced by adult females, juveniles, and infants in acute
    distress, including situations in which an infant is threatened or handled, during
    severe agonistic interactions, and during disturbances by neighboring groups or
    humans. Marler 1972 and Oates 1977 agree that the call functions in soliciting
    maternal or group attention and in expressing strong agonistic arousal.
  acoustic_references:
  - id: marler_1972
  - id: oates_1977
    url: https://doi.org/10.1111/j.1439-0310.1977.tb01007.x
  semantic_references:
  - id: marler_1972
  - id: oates_1977
    url: https://doi.org/10.1111/j.1439-0310.1977.tb01007.x
  playback_references: []
  call_type_existence_agreement: medium
  call_type_existence_explanation: Marler 1972 explicitly groups squeaks and screams
    as a single graded category in his six-class repertoire and Oates 1977 reuses
    the same grouping. Later guereza work focuses on roars and snorts and does not
    test squeak-scream boundaries, so existence as a discrete class is medium.
  acoustic_description_agreement: weak
  acoustic_description_explanation: The acoustic description rests almost entirely
    on Marler 1972's qualitative spectrograms, with no follow-up quantitative analyses
    targeted on guereza squeaks and screams. Acoustic agreement is weak.
  semantic_description_agreement: medium
  semantic_description_explanation: Marler 1972 and Oates 1977 consistently place
    this class in acute-distress and severe-agonistic contexts. Lacking call-specific
    playback or quantitative production tests, semantic agreement is medium.
