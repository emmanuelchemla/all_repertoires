primary_inventory:
  id: rand_ryan_1981
  rationale: >-
    Rand and Ryan 1981 is used as the repertoire spine because it is a
    peer-reviewed, species-specific inventory paper that frames the male
    advertisement call as a variable complexity series: a long whine followed by
    0-6 chucks. I found a secondary/field-guide mention of a release call, but
    not peer-reviewed evidence with enough acoustic and semantic detail to add it
    under the current inclusion rules.
calls:
  - name: whine-only advertisement call
    in_primary_inventory: true
    alternative_names:
      - simple call
      - simple advertisement call
      - whine
    scope: &adult_male_scope
      life_stages:
        - adult
      sexes:
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - low_frequency
      - frequency_modulated
      - tonal
      - harmonic
      - long
    acoustic_description: A single extended harmonic whine with a descending frequency-modulated contour, described in later studies as lasting roughly 350-400 ms and sweeping from about 900-400 Hz, with no terminal chuck components. It is the less complex end of the species' advertisement-call series.
    semantic_keywords:
      - courtship
      - mating
      - identity
    semantic_description: Produced by adult males at breeding pools and in choruses to attract females. Isolated males commonly give whine-only calls, and females can use the whine as a conspecific mate-attraction signal and species-recognition cue even though they often prefer calls with added chucks.
    acoustic_references:
      - id: rand_ryan_1981
        url: https://doi.org/10.1111/j.1439-0310.1981.tb01923.x
      - id: ryan_1983
        url: https://doi.org/10.1111/j.1558-5646.1983.tb05536.x
      - id: farris_etal_2005
        url: https://doi.org/10.1007/s00359-005-0041-1
      - id: halfwerk_etal_2017
        url: https://doi.org/10.1038/s41467-017-02067-1
    semantic_references:
      - id: rand_ryan_1981
        url: https://doi.org/10.1111/j.1439-0310.1981.tb01923.x
      - id: ryan_1980
        url: https://doi.org/10.1126/science.209.4455.523
      - id: ryan_1983
        url: https://doi.org/10.1111/j.1558-5646.1983.tb05536.x
      - id: ryan_rand_1990
        url: https://doi.org/10.1111/j.1558-5646.1990.tb05200.x
    playback_references:
      - id: ryan_1980
        url: https://doi.org/10.1126/science.209.4455.523
      - id: ryan_rand_1990
        url: https://doi.org/10.1111/j.1558-5646.1990.tb05200.x
    call_type_existence_agreement: strong
    call_type_existence_explanation: Rand and Ryan 1981 describe the advertisement call as a whine with 0-6 chucks, explicitly including the whine-only form, and Ryan 1983 plus Ryan and Rand 1990 treat the whine as a core component of sexual communication in this species. Multiple primary studies therefore agree that whine-only calls occur as a recognizable signal form.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Rand and Ryan 1981 and Ryan 1983 agree that the simple call is the extended whine without chucks, while Farris et al. 2005 and Halfwerk et al. 2017 provide convergent timing and frequency descriptions. Later playback work by Ryan and Rand 1990 also uses whine-only stimuli as the baseline for comparing complex calls, so the acoustic boundary is well supported.
    semantic_description_agreement: strong
    semantic_description_explanation: Ryan 1980, Rand and Ryan 1981, Ryan 1983, and Ryan and Rand 1990 all treat the whine as a male mate-attraction signal used in breeding choruses. The main nuance is relative attractiveness because females often prefer complex calls, but whine-only calls still function in courtship and species recognition.

  - name: whine-chuck advertisement call
    in_primary_inventory: true
    alternative_names:
      - complex call
      - complex advertisement call
      - whine plus chucks
    scope: *adult_male_scope
    acoustic_keywords:
      - low_frequency
      - high_frequency
      - frequency_modulated
      - tonal
      - harmonic
      - long
      - short
      - pulsed
      - multi_component
      - repetitive
      - graded
    acoustic_description: A graded, multi-component advertisement call that begins with the same long descending harmonic whine and is followed by one or more short amplitude-modulated, multi-harmonic chuck bursts. Published descriptions report up to seven chucks of roughly 40 ms each, with chuck energy concentrated above 1.5 kHz and peaking near 2.3-2.4 kHz.
    semantic_keywords:
      - courtship
      - mating
      - display
      - aggression
    semantic_description: Produced by adult males in breeding choruses, especially when other males are calling nearby or a receptive female is present. Females preferentially approach complex calls in phonotaxis tests, and males also call more in response to chuck-bearing calls, while males appear to balance the increased attractiveness and competitive value of chucks against ecological costs such as eavesdropping predators.
    acoustic_references:
      - id: rand_ryan_1981
        url: https://doi.org/10.1111/j.1439-0310.1981.tb01923.x
      - id: wilczynski_etal_2001
        url: https://doi.org/10.1159/000047268
      - id: farris_etal_2005
        url: https://doi.org/10.1007/s00359-005-0041-1
      - id: ryan_rand_1990
        url: https://doi.org/10.1111/j.1558-5646.1990.tb05200.x
      - id: ryan_etal_1990
        url: https://doi.org/10.1038/343066a0
