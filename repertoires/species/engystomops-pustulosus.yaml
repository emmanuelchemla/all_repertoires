      - id: farris_etal_2005
        url: https://doi.org/10.1007/s00359-005-0041-1
    call_type_existence_agreement: strong
    call_type_existence_explanation: The whine-chuck call is the classic complex call in Rand and Ryan 1981, Ryan 1980, Ryan 1983, Ryan and Rand 1990, Ryan et al. 1990, and Bernal et al. 2009. These independent studies consistently identify the chuck-bearing form as a discrete complex variant of the advertisement call, even though the number of chucks grades from one to several.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Rand and Ryan 1981 describe the whine plus 0-6 chucks series, Farris et al. 2005 and Wilczynski et al. 2001 provide convergent duration and spectral descriptions, and Halfwerk et al. 2017 describes the whine and chuck frequency ranges in natural calling experiments. Agreement is strong even though the number of chucks is graded.
    semantic_description_agreement: strong
    semantic_description_explanation: Rand and Ryan 1981 and Ryan and Rand 1990 show female preference for chuck-bearing calls, Ryan 1980 establishes female mate choice on male calls, and Bernal et al. 2009 shows both female phonotaxis and male calling responses to graded complexity. These sources agree that complex calls function in sexual advertisement and male-male chorus competition, with ecological costs modulating chuck production.

