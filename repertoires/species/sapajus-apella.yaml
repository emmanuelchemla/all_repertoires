    url: https://doi.org/10.1016/j.anbehav.2004.07.017
  wheeler_2008:
    citation: "Wheeler, B. C. (2008). Selfish or altruistic? An analysis of alarm call function in wild capuchin monkeys, Cebus apella nigritus. Animal Behaviour, 76(5), 1465-1475."
    doi: 10.1016/j.anbehav.2008.09.007
    url: https://doi.org/10.1016/j.anbehav.2008.09.007
  wheeler_2010:
    citation: "Wheeler, B. C. (2010). Production and perception of situationally variable alarm calls in wild tufted capuchin monkeys (Cebus apella nigritus). Behavioral Ecology and Sociobiology, 64(6), 989-1000."
    doi: 10.1007/s00265-010-0914-3
