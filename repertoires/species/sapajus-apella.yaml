  resende_etal_2007:
    citation: "Resende, B. D. de, Oliveira, D. A. G., Ramos da Silva, E. D., & Ottoni, E. B. (2007). Capuchin monkey (Cebus apella) vocalizations in response to loud explosive noises. Neotropical Primates, 14(1), 27-30."
    doi: 10.1896/044.014.0105
    url: https://doi.org/10.1896/044.014.0105
  lisboa_etal_2021:
    citation: "Lisboa, C. A., Mendes, F. D. C., Silveira, M., & Aguiar, L. M. de S. (2021). The vocal repertoire of the bearded capuchin (Cebidae: Sapajus libidinosus): implications for understanding the complexity of Neotropical primate communication. Folia Primatologica, 92(3), 151-163."
    doi: 10.1159/000517917
    url: https://doi.org/10.1159/000517917
