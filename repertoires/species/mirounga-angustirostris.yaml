primary_inventory:
  id: sanvito_etal_2007
  rationale: No single recent paper enumerates the full northern elephant seal repertoire as a complete inventory. Sanvito et al. 2007 is used as the spine because it provides detailed acoustic and social analysis of the main adult male threat call system, supplemented by classic breeding-beach and pup-recognition studies for other major call classes.
