    playback_references:
      - id: demartsev_etal_2018
        url: https://doi.org/10.1016/j.cub.2018.09.065
    call_type_existence_agreement: strong
    call_type_existence_explanation: Manser et al. 2014 notes meerkat affiliative calls given while sunning, and Demartsev et al. 2018 provides a focused observational and playback study of specific sunning calls. Existence as a distinct call type is strong.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Demartsev et al. 2018 gives detailed note-count categories and timing, but the broader repertoire literature gives less parameter-level acoustic treatment than for alarms or sentinel calls. Agreement is adequate but based mainly on one focused study.
    semantic_description_agreement: medium
    semantic_description_explanation: Demartsev et al. 2018 strongly supports the low-conflict sunning context and turn-taking dynamics, while explicitly leaving precise informational content and bonding function open. The semantic label is therefore medium.

