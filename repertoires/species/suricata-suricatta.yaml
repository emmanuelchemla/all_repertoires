    semantic_description_agreement: strong
    semantic_description_explanation: Kunc et al. 2007 experimentally shows that adults prefer high-pitched call playbacks during feeding contexts, while Manser et al. 2008 confirms high-pitched bouts increase with hunger but are most tied to feeding events. The context is strongly supported.

  - name: sunning call
    in_primary_inventory: true
    alternative_names:
      - sunning calls
      - group-sunning call
      - group calling session call
    scope: *adult_juvenile_both_scope
    acoustic_keywords:
      - tonal
      - short
      - quiet
      - repetitive
      - multi_component
    acoustic_description: A soft call produced in bouts of one or more short notes during morning sunning sessions near the burrow. Demartsev et al. 2018 classified single-, double-, triple-, and multiple-note sunning calls, with rare modulated variants excluded from their main analysis.
    semantic_keywords:
      - affiliation
      - group_coordination
    semantic_description: Produced primarily during low-conflict sunning after emergence from the sleeping burrow. Calls are socially stimulated, coordinated by turn-taking that avoids overlap, and may support cooperative group interaction or bonding, though the precise function remains less certain than for alarm or close calls.
    acoustic_references:
      - id: demartsev_etal_2018
        url: https://doi.org/10.1016/j.cub.2018.09.065
