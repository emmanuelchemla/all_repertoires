scientific_name: Suricata suricatta
common_name: Meerkat
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Mammalia
  order: Carnivora
  family: Herpestidae
  genus: Suricata
  species: suricatta
primary_inventory:
  id: manser_etal_2014
  rationale: Manser et al. 2014 is used as the peer-reviewed repertoire spine because it summarizes the wild adult meerkat vocal system across spatial coordination, antipredator behaviour, sentinel behaviour, affiliative interactions, and agonistic interactions, while citing Manser 1998 for the full thesis inventory of more than 30 call types. Because the thesis is not a peer-reviewed paper and the chapter gives some repertoire classes by count rather than naming every call type, this file includes only named wild call types with peer-reviewed acoustic and semantic support. Calls marked in_primary_inventory are call types or call classes explicitly covered by the 2014 spine; pup begging calls are retained as outside-inventory calls because the spine's count table is adult-focused.
calls:
  - name: close call
    in_primary_inventory: true
    alternative_names:
      - contact call
      - close calls
    scope: &adult_juvenile_both_scope
      life_stages:
        - juvenile
        - adult
      sexes:
        - female
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - high_frequency
      - frequency_modulated
      - tonal
      - short
      - quiet
      - repetitive
      - graded
    acoustic_description: A quiet, short-range contact call produced repeatedly during foraging. Close calls are individually variable and their rate and structure vary with caller traits, spacing to neighbours, social context, season, and wind, while remaining much softer and shorter than alarm, recruitment, or movement calls.
    semantic_keywords:
      - contact
      - group_coordination
      - identity
    semantic_description: Used during foraging and group movement to maintain cohesion, advertise local presence, and monitor nearby group members. Playback and field observations show that close calls can attract group members, elicit call feedback, and support spatial coordination rather than immediate predator response.
    acoustic_references:
      - id: mausbach_etal_2017
        url: https://doi.org/10.1371/journal.pone.0175371
      - id: engesser_manser_2022
        url: https://doi.org/10.1016/j.anbehav.2021.12.014
    semantic_references:
      - id: engesser_manser_2022
        url: https://doi.org/10.1016/j.anbehav.2021.12.014
      - id: townsend_etal_2010
        url: https://doi.org/10.1016/j.anbehav.2010.04.010
      - id: reber_etal_2013
        url: https://doi.org/10.1098/rspb.2013.1013
    playback_references:
      - id: engesser_manser_2022
        url: https://doi.org/10.1016/j.anbehav.2021.12.014
      - id: townsend_etal_2010
        url: https://doi.org/10.1016/j.anbehav.2010.04.010
      - id: reber_etal_2013
        url: https://doi.org/10.1098/rspb.2013.1013
    call_type_existence_agreement: strong
    call_type_existence_explanation: Manser et al. 2014 treats close calls as a core spatial-coordination call, and Mausbach et al. 2017, Townsend et al. 2010, Reber et al. 2013, and Engesser and Manser 2022 independently study the same wild call type.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Mausbach et al. 2017 and Engesser and Manser 2022 both analyze wild close-call acoustics and calling rates, with Townsend et al. 2010 supporting group-specific acoustic structure. Agreement is strong even though fine parameters vary with caller and context.
    semantic_description_agreement: strong
    semantic_description_explanation: Engesser and Manser 2022 experimentally support a cohesion function, Reber et al. 2013 shows receivers use close calls in social monitoring, and Townsend et al. 2010 shows group-specific signatures. These studies agree that close calls are social-contact signals, not alarm calls.

  - name: moving call
    in_primary_inventory: true
    alternative_names:
      - move call
      - moving calls
      - moving call chorus
    scope: *adult_juvenile_both_scope
    acoustic_keywords:
      - loud
      - repetitive
      - multi_component
      - graded
    acoustic_description: A conspicuous movement-coordination call that can be produced singly or as a chorus by several foraging group members. Published behavioural studies treat it as acoustically distinguishable from close calls and lead calls, but provide less spectrographic detail than the alarm or sentinel literature.
    semantic_keywords:
      - group_coordination
      - recruitment
      - spacing
    semantic_description: Produced before or during changes of foraging patch and during returns to sleeping burrows. Groups increase travel speed and are more likely to shift patches once several group members join the chorus, indicating a quorum-like group movement signal.
    acoustic_references:
      - id: bousquet_etal_2011
        url: https://doi.org/10.1098/rspb.2010.1739
      - id: gall_etal_2017
        url: https://doi.org/10.1016/j.anbehav.2017.08.001
    semantic_references:
      - id: bousquet_etal_2011
        url: https://doi.org/10.1098/rspb.2010.1739
      - id: gall_etal_2017
        url: https://doi.org/10.1016/j.anbehav.2017.08.001
    playback_references:
      - id: bousquet_etal_2011
        url: https://doi.org/10.1098/rspb.2010.1739
    call_type_existence_agreement: strong
    call_type_existence_explanation: Manser et al. 2014 lists distinct spatial-coordination calls in meerkats, and Bousquet et al. 2011 plus Gall et al. 2017 independently treat moving calls as a named call type separate from close and lead calls.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Bousquet et al. 2011 and Gall et al. 2017 support the call-type distinction, but their main analyses are behavioural and decision-focused rather than parameter-rich acoustic descriptions. The acoustic label is therefore moderate.
    semantic_description_agreement: strong
    semantic_description_explanation: Bousquet et al. 2011 provides playback and GPS evidence that moving calls coordinate quorum-like patch changes, and Gall et al. 2017 shows move calls are also used during burrow returns. The movement-coordination context is strongly supported.

  - name: aerial alarm call
    in_primary_inventory: true
    alternative_names:
      - aerial predator alarm
      - aerial alarm
      - aerial bark
    scope: *adult_juvenile_both_scope
    acoustic_keywords:
      - high_frequency
      - broadband
      - noisy
      - short
      - loud
      - graded
    acoustic_description: A short, loud alarm-call category whose acoustic structure varies with predator class and urgency. High-urgency variants become noisier and more abrupt, while lower-urgency variants are more harmonic; barks in aerial contexts include broadband formant structure.
    semantic_keywords:
      - alarm
      - predator
    semantic_description: Produced when an aerial predator or flying predator-like threat is detected. Receivers use the call to select an escape response appropriate to aerial danger, with urgency level modulating the strength and immediacy of response.
    acoustic_references:
      - id: manser_2001
        url: https://doi.org/10.1098/rspb.2001.1773
      - id: townsend_charlton_manser_2014
        url: https://doi.org/10.1016/j.anbehav.2014.05.021
      - id: rauber_etal_2020
        url: https://doi.org/10.1186/s12915-020-00847-8
    semantic_references:
      - id: manser_etal_2001
        url: https://doi.org/10.1098/rspb.2001.1772
      - id: townsend_charlton_manser_2014
        url: https://doi.org/10.1016/j.anbehav.2014.05.021
      - id: rauber_etal_2020
        url: https://doi.org/10.1186/s12915-020-00847-8
    playback_references:
      - id: manser_etal_2001
        url: https://doi.org/10.1098/rspb.2001.1772
    call_type_existence_agreement: strong
    call_type_existence_explanation: Manser et al. 2014 summarizes meerkat predator-specific alarm calls, Manser 2001 separates aerial alarms acoustically, Manser et al. 2001 tests receiver responses, and later bark and sentinel-sequence studies retain aerial predator context.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Manser 2001 provides the main predator-type and urgency acoustic analysis, Townsend et al. 2014 adds formant detail for alarm barks in aerial versus terrestrial contexts, and Rauber et al. 2020 places alarms at the endpoint of sentinel sequences.
    semantic_description_agreement: strong
    semantic_description_explanation: Manser et al. 2001 playback experiments show predator-class and urgency information in receivers' responses, and the later bark and sentinel studies use the same aerial alarm context. Agreement is strong.

  - name: terrestrial alarm call
    in_primary_inventory: true
    alternative_names:
      - terrestrial predator alarm
      - ground predator alarm
      - terrestrial bark
    scope: *adult_juvenile_both_scope
    acoustic_keywords:
      - broadband
      - noisy
      - short
      - loud
      - graded
    acoustic_description: A loud, short alarm-call category with urgency-dependent variation in noisiness, duration, and temporal patterning. It is acoustically separable from aerial and recruitment alarms, while within-category structure changes with response urgency.
    semantic_keywords:
      - alarm
      - predator
    semantic_description: Produced to terrestrial predators or ground-level threats. Receivers respond with ground-predator-appropriate vigilance, shelter use, or refuge behaviour, and urgency changes the intensity and speed of response.
    acoustic_references:
      - id: manser_2001
        url: https://doi.org/10.1098/rspb.2001.1773
      - id: townsend_charlton_manser_2014
        url: https://doi.org/10.1016/j.anbehav.2014.05.021
      - id: rauber_etal_2020
        url: https://doi.org/10.1186/s12915-020-00847-8
    semantic_references:
      - id: manser_etal_2001
        url: https://doi.org/10.1098/rspb.2001.1772
      - id: townsend_charlton_manser_2014
        url: https://doi.org/10.1016/j.anbehav.2014.05.021
      - id: rauber_etal_2020
        url: https://doi.org/10.1186/s12915-020-00847-8
    playback_references:
      - id: manser_etal_2001
        url: https://doi.org/10.1098/rspb.2001.1772
    call_type_existence_agreement: strong
    call_type_existence_explanation: Manser et al. 2014 reviews predator-specific alarm calls, Manser 2001 identifies terrestrial alarms as a principal alarm category, and Manser et al. 2001 confirms that receivers treat predator classes differently.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Manser 2001 gives direct acoustic support for terrestrial alarms and urgency gradation, Townsend et al. 2014 supports terrestrial-context bark acoustics, and Rauber et al. 2020 includes terrestrial alarm examples in sentinel sequences.
    semantic_description_agreement: strong
    semantic_description_explanation: Manser et al. 2001 playback work provides strong evidence that receivers extract terrestrial-predator information, and later studies use terrestrial alarms as high-risk signals in predator and sentinel contexts.

  - name: recruitment call
    in_primary_inventory: true
    alternative_names:
      - recruitment alarm
      - mobbing call
    scope: *adult_juvenile_both_scope
    acoustic_keywords:
      - broadband
      - noisy
      - loud
      - repetitive
      - graded
    acoustic_description: A loud alarm-related call category with repeated noisy elements and urgency-dependent structural variation. It is acoustically separable from aerial and terrestrial alarm calls in Manser's predator-type analysis.
    semantic_keywords:
      - alarm
      - predator
      - recruitment
      - group_coordination
    semantic_description: Used when the caller recruits group members toward a localized threat or cue, such as snakes, predator deposits, or other objects requiring inspection or mobbing, rather than simply triggering immediate flight.
    acoustic_references:
      - id: manser_2001
        url: https://doi.org/10.1098/rspb.2001.1773
      - id: graw_manser_2007
        url: https://doi.org/10.1016/j.anbehav.2006.11.021
    semantic_references:
      - id: manser_etal_2001
        url: https://doi.org/10.1098/rspb.2001.1772
      - id: graw_manser_2007
        url: https://doi.org/10.1016/j.anbehav.2006.11.021
      - id: zottl_etal_2013
        url: https://doi.org/10.1093/beheco/ars154
    playback_references:
      - id: manser_etal_2001
        url: https://doi.org/10.1098/rspb.2001.1772
    call_type_existence_agreement: strong
    call_type_existence_explanation: Manser et al. 2014 covers the meerkat alarm and recruitment system, Manser 2001 includes recruitment calls as a distinct alarm-call category, and Graw and Manser 2007 plus Zottl et al. 2013 independently describe recruitment during mobbing and direct predator-cue responses.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Manser 2001 provides the direct acoustic basis, and Graw and Manser 2007 links recruitment with mobbing behaviour, but fewer later studies quantify recruitment-call acoustics than aerial or terrestrial alarms. The agreement is therefore moderate.
    semantic_description_agreement: strong
    semantic_description_explanation: Manser et al. 2001 shows receivers respond distinctly to recruitment calls, Graw and Manser 2007 documents recruitment during mobbing, and Zottl et al. 2013 shows recruitment to predator cues changes group vigilance and predator response.

  - name: bark
    in_primary_inventory: true
    alternative_names:
      - alarm bark
      - predator bark
      - barks
    scope: *adult_juvenile_both_scope
    acoustic_keywords:
      - broadband
      - noisy
      - loud
      - short
      - repetitive
    acoustic_description: A broadband noisy call lacking clear fundamental-frequency and harmonic structure, with multiple formant bands below 15 kHz. Formant pattern differs among callers and the first formant varies between aerial and terrestrial predator contexts.
    semantic_keywords:
      - alarm
      - predator
      - identity
    semantic_description: Produced mainly when meerkats detect aerial or terrestrial predators, with formant structure carrying potential information about caller identity and predator context. Barks may also occur rarely when individuals are isolated or lost, but the best-supported wild use is alarm.
    acoustic_references:
      - id: townsend_charlton_manser_2014
        url: https://doi.org/10.1016/j.anbehav.2014.05.021
      - id: manser_etal_2014
        url: https://doi.org/10.1016/B978-0-12-800286-5.00006-7
    semantic_references:
      - id: townsend_charlton_manser_2014
        url: https://doi.org/10.1016/j.anbehav.2014.05.021
      - id: manser_etal_2014
        url: https://doi.org/10.1016/B978-0-12-800286-5.00006-7
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Manser et al. 2014 includes barks among meerkat call sequences and Townsend et al. 2014 provides a focused acoustic analysis of wild meerkat barks. The call type is independently recognizable in repertoire and acoustic work.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Townsend et al. 2014 directly quantifies the broadband, nonharmonic formant structure of barks, and Manser et al. 2014 treats barks as a distinct call sequence type. Acoustic agreement is strong.
    semantic_description_agreement: medium
    semantic_description_explanation: Townsend et al. 2014 strongly supports aerial and terrestrial predator contexts, while noting rarer nonpredation isolation use from earlier work. The primary alarm context is clear, but broader bark semantics are less fully tested.

  - name: single-note sentinel call
    in_primary_inventory: true
    alternative_names:
      - single-note call
      - single note call
      - sentinel calming call
    scope: *adult_juvenile_both_scope
    acoustic_keywords:
      - tonal
      - short
      - quiet
      - repetitive
      - graded
    acoustic_description: A soft sentinel-call unit composed of one short tonal note, often repeated during sentinel bouts. It is the lowest-risk end of the sentinel sequence gradation from single-note through alarm calls.
    semantic_keywords:
      - group_coordination
      - attention
    semantic_description: Given by sentinels during low perceived predation risk and used by foragers as social information that a guard is present. Together with double-note calls it functions as an all-clear or calming signal that reduces receiver vigilance and supports continued foraging.
    acoustic_references:
      - id: rauber_manser_2017
        url: https://doi.org/10.1038/srep44436
      - id: rauber_etal_2020
        url: https://doi.org/10.1186/s12915-020-00847-8
      - id: rauber_manser_2021
        url: https://doi.org/10.1016/j.anbehav.2020.11.014
    semantic_references:
      - id: rauber_manser_2017
        url: https://doi.org/10.1038/srep44436
      - id: rauber_manser_2018
        url: https://doi.org/10.1038/s41598-018-29678-y
      - id: rauber_etal_2020
        url: https://doi.org/10.1186/s12915-020-00847-8
    playback_references:
      - id: rauber_manser_2017
        url: https://doi.org/10.1038/srep44436
      - id: rauber_manser_2018
        url: https://doi.org/10.1038/s41598-018-29678-y
    call_type_existence_agreement: strong
    call_type_existence_explanation: Manser et al. 2014 reports six sentinel calls; Rauber and Manser 2017, Rauber et al. 2020, and Rauber and Manser 2021 all identify the single-note call as one of the six discrete sentinel call types.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Rauber and Manser 2017 provides spectrogram-based classification, Rauber et al. 2020 analyzes the same call unit in sequences, and Rauber and Manser 2021 confirms it is present from sentinel-behaviour onset.
    semantic_description_agreement: strong
    semantic_description_explanation: Rauber and Manser 2017 experimentally links single- and double-note calls with all-clear effects, Rauber and Manser 2018 shows receivers adjust vigilance to calming-call caller identity, and Rauber et al. 2020 places single-note calls at the low-risk end of the sequence.

  - name: double-note sentinel call
    in_primary_inventory: true
    alternative_names:
      - double-note call
      - double note call
      - sentinel calming call
    scope: *adult_juvenile_both_scope
    acoustic_keywords:
      - tonal
      - short
      - quiet
      - repetitive
      - multi_component
      - graded
    acoustic_description: A soft sentinel-call unit composed of two short tonal notes. It is repeated in sentinel bouts, individually distinctive, and lies just above the single-note call in the graded sentinel sequence.
    semantic_keywords:
      - group_coordination
      - attention
      - identity
    semantic_description: Given by sentinels during low perceived predation risk and used by foragers as an all-clear signal. Playbacks of calming calls reduce vigilance, and receiver responses vary with caller experience and social relationship.
    acoustic_references:
      - id: rauber_manser_2017
        url: https://doi.org/10.1038/srep44436
      - id: rauber_etal_2020
        url: https://doi.org/10.1186/s12915-020-00847-8
      - id: rauber_manser_2021
        url: https://doi.org/10.1016/j.anbehav.2020.11.014
    semantic_references:
      - id: rauber_manser_2017
        url: https://doi.org/10.1038/srep44436
      - id: rauber_manser_2018
        url: https://doi.org/10.1038/s41598-018-29678-y
      - id: rauber_manser_2021
        url: https://doi.org/10.1016/j.anbehav.2020.11.014
    playback_references:
      - id: rauber_manser_2017
        url: https://doi.org/10.1038/srep44436
      - id: rauber_manser_2018
        url: https://doi.org/10.1038/s41598-018-29678-y
    call_type_existence_agreement: strong
    call_type_existence_explanation: The double-note call is one of the six sentinel calls reported in the repertoire spine and is repeatedly identified as a discrete type by Rauber and Manser 2017, Rauber et al. 2020, and Rauber and Manser 2021.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Rauber and Manser 2017 and Rauber et al. 2020 provide matching spectrogram categories, while Rauber and Manser 2021 measures individual differences in double-note acoustic parameters. Agreement is strong.
    semantic_description_agreement: strong
    semantic_description_explanation: Rauber and Manser 2017 and Rauber and Manser 2018 both use calming-call playbacks, and Rauber and Manser 2021 shows the call is present at sentinel onset. Its all-clear and social-information role is strongly supported.

  - name: triple-note sentinel call
    in_primary_inventory: true
    alternative_names:
      - triple-note call
      - triple note call
      - short-note sentinel call
    scope: *adult_juvenile_both_scope
    acoustic_keywords:
      - tonal
      - short
      - quiet
      - repetitive
      - multi_component
      - graded
    acoustic_description: A short-note sentinel call composed of three tonal note units. It sits between double-note and multiple-note calls in the graded sequence of increasing perceived risk.
    semantic_keywords:
      - group_coordination
      - attention
      - alarm
    semantic_description: Produced by sentinels as perceived predation risk rises above the all-clear single- and double-note range but before the long warning calls. Sequence analyses indicate that it contributes to the graded encoding of subtle risk changes during guarding.
    acoustic_references:
      - id: rauber_manser_2017
        url: https://doi.org/10.1038/srep44436
      - id: rauber_etal_2020
        url: https://doi.org/10.1186/s12915-020-00847-8
      - id: rauber_manser_2021
        url: https://doi.org/10.1016/j.anbehav.2020.11.014
    semantic_references:
      - id: rauber_etal_2020
        url: https://doi.org/10.1186/s12915-020-00847-8
      - id: rauber_manser_2017
        url: https://doi.org/10.1038/srep44436
      - id: rauber_manser_2021
        url: https://doi.org/10.1016/j.anbehav.2020.11.014
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Triple-note calls are named among the six discrete sentinel types in Rauber and Manser 2017, Rauber et al. 2020, and Rauber and Manser 2021, matching the six-sentinel-call inventory summarized by Manser et al. 2014.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Rauber and Manser 2017 provides spectrogram classification and Rauber et al. 2020 confirms triple-note placement in sequence analyses. Rauber and Manser 2021 shows all six types occur when sentinel behaviour first emerges.
    semantic_description_agreement: medium
    semantic_description_explanation: Rauber et al. 2020 strongly supports a graded risk position for triple-note calls, but direct playback tests mainly contrast calming single/double calls with long warning calls. The semantic label is therefore medium.

  - name: multiple-note sentinel call
    in_primary_inventory: true
    alternative_names:
      - multiple-note call
      - multiple note call
      - short-note sentinel call
    scope: *adult_juvenile_both_scope
    acoustic_keywords:
      - tonal
      - short
      - quiet
      - repetitive
      - multi_component
      - graded
    acoustic_description: A short-note sentinel call composed of more than three tonal note units in a repeated note cluster. It occupies the upper part of the short-note sentinel gradation, just before di-drrr and wheek warning calls.
    semantic_keywords:
      - group_coordination
      - attention
      - alarm
    semantic_description: Produced by sentinels when perceived risk is elevated relative to single-, double-, and triple-note states but has not yet reached the long warning-call or full alarm-call range. It contributes to graded risk information in sentinel sequences.
    acoustic_references:
      - id: rauber_manser_2017
        url: https://doi.org/10.1038/srep44436
      - id: rauber_etal_2020
        url: https://doi.org/10.1186/s12915-020-00847-8
      - id: rauber_manser_2021
        url: https://doi.org/10.1016/j.anbehav.2020.11.014
    semantic_references:
      - id: rauber_etal_2020
        url: https://doi.org/10.1186/s12915-020-00847-8
      - id: rauber_manser_2017
        url: https://doi.org/10.1038/srep44436
      - id: rauber_manser_2021
        url: https://doi.org/10.1016/j.anbehav.2020.11.014
    playback_references: []
    call_type_existence_agreement: strong
    call_type_existence_explanation: Multiple-note calls are consistently listed as one of the six sentinel calls by Rauber and Manser 2017, Rauber et al. 2020, and Rauber and Manser 2021, and fall within the six-call sentinel class in Manser et al. 2014.
    acoustic_description_agreement: strong
    acoustic_description_explanation: The spectrogram-based category in Rauber and Manser 2017 and the sequence classification in Rauber et al. 2020 agree on the multiple-note call's multi-note structure and position among short-note calls.
    semantic_description_agreement: medium
    semantic_description_explanation: Rauber et al. 2020 supports the multiple-note call's intermediate risk position, while Rauber and Manser 2017 provides broader support for risk-dependent production. Direct receiver tests are clearer for calming and long warning classes than for this specific call.

  - name: di-drrr sentinel call
    in_primary_inventory: true
    alternative_names:
      - di-drrr call
      - didrr call
      - sentinel warning call
    scope: *adult_juvenile_both_scope
    acoustic_keywords:
      - frequency_modulated
      - tonal
      - long
      - repetitive
      - graded
    acoustic_description: A longer, modulated sentinel warning call that follows the short-note calls in the graded sequence. It is structurally distinct from the note-counted single-, double-, triple-, and multiple-note calls.
    semantic_keywords:
      - alarm
      - predator
      - attention
      - group_coordination
    semantic_description: Produced when perceived predation risk is elevated but before an immediate predator-specific alarm is required. Together with wheek calls, it functions as a warning-side sentinel signal that increases receiver vigilance and reduces foraging.
    acoustic_references:
      - id: rauber_manser_2017
        url: https://doi.org/10.1038/srep44436
      - id: rauber_etal_2020
        url: https://doi.org/10.1186/s12915-020-00847-8
      - id: rauber_manser_2021
        url: https://doi.org/10.1016/j.anbehav.2020.11.014
    semantic_references:
      - id: rauber_manser_2017
        url: https://doi.org/10.1038/srep44436
      - id: rauber_etal_2020
        url: https://doi.org/10.1186/s12915-020-00847-8
      - id: rauber_manser_2021
        url: https://doi.org/10.1016/j.anbehav.2020.11.014
    playback_references:
      - id: rauber_manser_2017
        url: https://doi.org/10.1038/srep44436
    call_type_existence_agreement: strong
    call_type_existence_explanation: Di-drrr calls are named as one of the six sentinel calls in Rauber and Manser 2017, Rauber et al. 2020, and Rauber and Manser 2021, matching the sentinel-call class summarized by Manser et al. 2014.
    acoustic_description_agreement: strong
    acoustic_description_explanation: Rauber and Manser 2017 and Rauber et al. 2020 agree that di-drrr is a distinct long warning-side sentinel call, and Rauber and Manser 2021 confirms it occurs from the onset of sentinel behaviour.
    semantic_description_agreement: strong
    semantic_description_explanation: Rauber and Manser 2017 experimentally shows long warning calls increase vigilance, and Rauber et al. 2020 places di-drrr immediately below wheek and alarm calls in the risk gradation. The warning function is strongly supported.

