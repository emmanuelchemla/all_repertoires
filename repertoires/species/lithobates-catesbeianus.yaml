scientific_name: Lithobates catesbeianus
common_name: American bullfrog
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  class: Amphibia
  order: Anura
  family: Ranidae
  genus: Lithobates
  species: catesbeianus
primary_inventory:
  id: capranica_1968
  rationale: Capranica 1968 is the species-specific repertoire spine because it explicitly enumerates the bullfrog vocal repertoire as mating call, three territorial-call subtypes, release call, warning call, and distress call. Later field, playback, endocrine, auditory, and defensive-vocalization studies refine acoustic and semantic detail while retaining every call type listed in this inventory.
calls:
  - name: advertisement call
    alternative_names:
      - mating call
      - mate call
      - breeding call
      - multicroak call
    in_primary_inventory: true
    scope: &adult_male_scope
      life_stages:
        - adult
      sexes:
        - male
      population_specific: false
      note: ""
    acoustic_keywords:
      - low_frequency
      - tonal
      - harmonic
      - loud
      - long
      - repetitive
      - multi_component
    acoustic_description: A loud, low-frequency, quasiharmonic call composed of one to many repeated croaks. Published descriptions identify the adult male advertisement call as a multicroak signal, commonly 1-12 croaks per call, with fine-temporal periodicity near 100 Hz, strong low-frequency energy around a few hundred hertz, and an additional higher spectral band in the low kilohertz range.
    semantic_keywords:
      - courtship
      - mating
      - territorial
      - spacing
      - identity
    semantic_description: Produced by adult males in breeding choruses. It attracts females, elicits vocal responses from other males, and mediates territorial neighbor-stranger recognition and spacing among resident males at calling sites.
    acoustic_references:
      - id: capranica_1968
        url: https://doi.org/10.1163/156853968X00306
      - id: simmons_2004
        url: https://doi.org/10.1121/1.1643366
      - id: schwartz_simmons_1990
        url: https://doi.org/10.1007/BF00192019
      - id: bee_gerhardt_2001a
        url: https://doi.org/10.1006/anbe.2001.1851
    semantic_references:
      - id: capranica_1968
        url: https://doi.org/10.1163/156853968X00306
      - id: wiewandt_1969
        url: https://doi.org/10.2307/1442074
      - id: ryan_1980
        url: https://doi.org/10.2307/1444139
      - id: bee_gerhardt_2002
        url: https://doi.org/10.1098/rspb.2002.2041
      - id: boyd_1994
        url: https://doi.org/10.1006/hbeh.1994.1020
    playback_references:
      - id: wiewandt_1969
        url: https://doi.org/10.2307/1442074
      - id: bee_gerhardt_2001b
        url: https://doi.org/10.1006/anbe.2001.1852
      - id: bee_2002
        url: https://doi.org/10.1093/beheco/13.1.109
      - id: bee_gerhardt_2002
        url: https://doi.org/10.1098/rspb.2002.2041
