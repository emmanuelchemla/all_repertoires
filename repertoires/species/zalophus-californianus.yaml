      population_specific: false
      note: ""
    acoustic_keywords:
      - short
      - abrupt
      - graded
    acoustic_description: The earliest pup vocalization, described as a bleat rather than an adult-like bark. During early development pups begin to modify this bleat toward a bark-like form.
    semantic_keywords:
      - alarm
      - threat
      - distress
    semantic_description: Used by pups in alarm and threat contexts during early life, before the pup vocal repertoire shifts toward more bark-like calls.
    acoustic_references:
