        url: https://doi.org/10.1007/978-1-4615-3406-8_34
    playback_references:
      - id: hanggi_1992
        url: https://doi.org/10.1111/j.1748-7692.1992.tb00061.x
    call_type_existence_agreement: strong
    call_type_existence_explanation: Peterson and Bartholomew 1969 names mother-response calls, and later recognition studies by Gisiner and Schusterman 1991, Hanggi 1992, and Schusterman et al. 1992 reinforce the central role of pup calls in reunion. The call type is strongly supported.
    acoustic_description_agreement: medium
    acoustic_description_explanation: Peterson and Bartholomew 1969 describes the call as structurally similar to the pup-attraction call and individually variable, and Schusterman et al. 1992 treats pup calls within mother-pup acoustic signaling. Agreement is medium because detailed acoustic parameters are not widely replicated in accessible field sources.
    semantic_description_agreement: strong
    semantic_description_explanation: Peterson and Bartholomew 1969, Gisiner and Schusterman 1991, Hanggi 1992, and Schusterman et al. 1992 converge on the role of pup calls in mother-pup reunion and recognition. Semantic agreement is strong.

  - name: bleat
    in_primary_inventory: true
    alternative_names:
      - pup bleat
      - infant bleat
      - alarm bleat
    scope:
      life_stages:
        - infant
      sexes:
