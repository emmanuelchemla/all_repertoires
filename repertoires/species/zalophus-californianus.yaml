        url: https://doi.org/10.1016/0003-3472(69)90108-0
    playback_references: []
    call_type_existence_agreement: medium
    call_type_existence_explanation: Peterson and Bartholomew 1969 names the pup bleat and describes its early ontogenetic position. Agreement is medium because later California sea lion recognition studies focus more on reunion calls than on the bleat as a separate type.
    acoustic_description_agreement: weak
    acoustic_description_explanation: The acoustic description is based mainly on Peterson and Bartholomew 1969's qualitative account of the bleat and its transition toward bark. Quantitative replication is limited, so agreement is weak for fine acoustic structure.
    semantic_description_agreement: medium
    semantic_description_explanation: Peterson and Bartholomew 1969 explicitly assigns alarm and threat use to the pup bleat. The context is clear in the primary inventory but sparsely replicated.

