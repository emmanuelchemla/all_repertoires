    citation: "Bergman, T. J. (2013). Speech-like vocalized lip-smacking in geladas. Current Biology, 23(7), R268-R269."
    url: https://doi.org/10.1016/j.cub.2013.02.038
    doi: 10.1016/j.cub.2013.02.038
  gustison_bergman_2016:
    citation: "Gustison, M. L., & Bergman, T. J. (2016). Vocal complexity influences female responses to gelada male calls. Scientific Reports, 6, 19680."
    url: https://doi.org/10.1038/srep19680
    doi: 10.1038/srep19680
  gustison_etal_2016:
    citation: "Gustison, M. L., Semple, S., Ferrer-i-Cancho, R., & Bergman, T. J. (2016). Gelada vocal sequences follow Menzerath's linguistic law. Proceedings of the National Academy of Sciences of the United States of America, 113(19), E2750-E2758."
    url: https://doi.org/10.1073/pnas.1522072113
    doi: 10.1073/pnas.1522072113
  gustison_bergman_2017:
    citation: "Gustison, M. L., & Bergman, T. J. (2017). Divergent acoustic properties of gelada and baboon vocalizations and their implications for the evolution of human speech. Journal of Language Evolution, 2(1), 20-36."
