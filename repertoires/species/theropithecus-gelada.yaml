    url: https://doi.org/10.1093/cz/zoab093
    doi: 10.1093/cz/zoab093
  painter_etal_2024:
    citation: "Painter, M. C., Gustison, M. L., Snyder-Mackler, N., Tinsley Johnson, E., le Roux, A., & Bergman, T. J. (2024). Acoustic variation and group level convergence of gelada, Theropithecus gelada, contact calls. Animal Behaviour, 207, 235-246."
    url: https://doi.org/10.1016/j.anbehav.2023.10.002
    doi: 10.1016/j.anbehav.2023.10.002
  pedruzzi_etal_2024:
    citation: "Pedruzzi, L., Francesconi, M., Palagi, E., & Lemasson, A. (2024). The sound of yawns makes geladas yawn. Scientific Reports, 14, 361."
    url: https://doi.org/10.1038/s41598-023-49797-5
    doi: 10.1038/s41598-023-49797-5
